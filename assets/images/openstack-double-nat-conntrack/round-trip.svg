<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1260" viewBox="0 0 1160 1260" role="img" aria-labelledby="title desc"><title id="title">이중 NAT와 연결 추적의 왕복 경로</title><desc id="desc">왼쪽 요청은 아래로 진행하며 출발지를 변환한다. 오른쪽 응답은 위로 진행하며 각 NAT 단계의 연결 추적 기록으로 목적지를 복원한다. 모든 포트 번호는 설명용 예시다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#059669"/></marker></defs><rect width="1160" height="1260" fill="#f5f7fb"/>
<text x="34" y="48" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="30" font-weight="750" fill="#172b4d">호스트 IP로 돌아온 응답은 어떻게 VM을 찾을까?</text>
<text x="34" y="83" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#52657b">각 NAT 단계가 자신의 연결 추적 기록을 이용해 주소와 포트 변환을 되돌린다.</text>
<rect x="24" y="112" width="540" height="966" rx="14" fill="#fff" stroke="#d8e2ef"/>
<rect x="596" y="112" width="540" height="966" rx="14" fill="#fff" stroke="#d8e2ef"/>
<text x="46" y="153" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">요청 ↓  출발지 주소 변환</text>
<text x="618" y="153" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#047857">응답 ↑  목적지 주소 복원</text>
<text x="46" y="187" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#52657b">목적지: 인터넷 서버 TCP 443</text>
<text x="618" y="187" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#52657b">출발지: 인터넷 서버 TCP 443</text>
<rect x="46" y="220" width="496" height="135" rx="14" fill="#edf3ff" stroke="#d8e2ef"/>
<text x="64" y="255" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">VM: cp-02</text>
<text x="64" y="292" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">출발지 10.0.0.12:53000</text>
<text x="64" y="322" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">인터넷 서버로 요청 시작</text>
<rect x="618" y="220" width="496" height="135" rx="14" fill="#eaf8f2" stroke="#d8e2ef"/>
<text x="636" y="255" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">VM: cp-02</text>
<text x="636" y="292" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">목적지 10.0.0.12:53000</text>
<text x="636" y="322" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">원래 연결을 연 VM에 응답 도착</text>
<rect x="46" y="427" width="496" height="164" rx="14" fill="#edf3ff" stroke="#d8e2ef"/>
<text x="64" y="462" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">① OpenStack 라우터: SNAT</text>
<text x="64" y="499" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">10.0.0.12:53000</text>
<text x="64" y="529" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">→ 172.24.4.167:53000</text>
<text x="64" y="559" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">라우터의 conntrack에 연결 변환 기록</text>
<rect x="618" y="427" width="496" height="164" rx="14" fill="#eaf8f2" stroke="#d8e2ef"/>
<text x="636" y="462" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">① 라우터에서 역변환</text>
<text x="636" y="499" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">172.24.4.167:53000</text>
<text x="636" y="529" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">→ 10.0.0.12:53000</text>
<text x="636" y="559" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">라우터가 자신의 연결 기록을 조회</text>
<rect x="46" y="665" width="496" height="164" rx="14" fill="#edf3ff" stroke="#d8e2ef"/>
<text x="64" y="700" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">② 호스트: masquerade</text>
<text x="64" y="737" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">172.24.4.167:53000</text>
<text x="64" y="767" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">→ 192.168.50.217:61000</text>
<text x="64" y="797" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">호스트의 conntrack에 연결 변환 기록</text>
<rect x="618" y="665" width="496" height="164" rx="14" fill="#eaf8f2" stroke="#d8e2ef"/>
<text x="636" y="700" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">② 호스트에서 역변환</text>
<text x="636" y="737" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">192.168.50.217:61000</text>
<text x="636" y="767" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">→ 172.24.4.167:53000</text>
<text x="636" y="797" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">호스트가 자신의 연결 기록을 조회</text>
<rect x="46" y="903" width="496" height="135" rx="14" fill="#edf3ff" stroke="#d8e2ef"/>
<text x="64" y="938" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">Wi-Fi → 집 공유기 → 인터넷</text>
<text x="64" y="975" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">호스트 출발지: 192.168.50.217:61000</text>
<text x="64" y="1005" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">집 공유기의 추가 NAT는 상세 생략</text>
<rect x="618" y="903" width="496" height="135" rx="14" fill="#eaf8f2" stroke="#d8e2ef"/>
<text x="636" y="938" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d">인터넷 → 집 공유기 → Wi-Fi</text>
<text x="636" y="975" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">호스트 도착 목적지:</text>
<text x="636" y="1005" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#344b63">192.168.50.217:61000</text>
<path d="M294 362 L294 418" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<path d="M866 420 L866 364" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#green)"/>
<path d="M294 598 L294 656" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<path d="M866 658 L866 600" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#green)"/>
<path d="M294 836 L294 894" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<path d="M866 896 L866 838" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="34" y="1120" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#172b4d">포트 번호는 설명용 예시다. 필요할 때 NAT가 포트도 변경한다.</text>
<text x="34" y="1158" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#172b4d">연결 구분: 프로토콜 + 출발지 IP·포트 + 목적지 IP·포트</text>
<text x="34" y="1196" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#172b4d">호스트가 VM까지의 모든 변환을 기억하는 것이 아니라, 각 단계가 자기 변환을 복원한다.</text>
<text x="34" y="1231" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#52657b">기존 연결의 응답과 새로운 외부 접속은 다르다. 새 접속에는 별도의 경로·매핑·허용이 필요하다.</text>
</svg>