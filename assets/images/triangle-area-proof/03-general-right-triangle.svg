<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">직사각형의 대각선으로 보는 외접원 중심</title>
<desc id="desc">직사각형 ACBD의 두 대각선 AB와 CD는 길이가 같고 서로를 이등분한다. 교점M에서 A,B,C까지의 거리가 같다.</desc>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17212f;font-size:18px} .caption{font-size:17px;fill:#526172}.heading{font-size:21px;font-weight:600}.small{font-size:16px}</style>
<rect width="760" height="450" fill="#fff"/>
<text x="380.000" y="36.000" text-anchor="middle" class="heading">직각삼각형 ABC를 직사각형 ACBD로 확장</text>
<polygon points="180.000,330.000 180.000,110.000 580.000,110.000" fill="#edf4fd" stroke="#2463b5" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="180.000" y1="330.000" x2="580.000" y2="330.000" stroke="#526172" stroke-width="1.7"/>
<line x1="580.000" y1="330.000" x2="580.000" y2="110.000" stroke="#526172" stroke-width="1.7"/>
<line x1="180.000" y1="110.000" x2="580.000" y2="330.000" stroke="#b55213" stroke-width="2.5"/>
<line x1="180.000" y1="330.000" x2="580.000" y2="110.000" stroke="#2463b5" stroke-width="2.5"/>
<line x1="180.000" y1="125.000" x2="195.000" y2="125.000" stroke="#526172" stroke-width="1.6"/>
<line x1="195.000" y1="125.000" x2="195.000" y2="110.000" stroke="#526172" stroke-width="1.6"/>
<circle cx="380" cy="220" r="3.5" fill="#17212f"/>
<text x="162.000" y="352.000" text-anchor="middle" class="">A</text>
<text x="599.000" y="98.000" text-anchor="middle" class="">B</text>
<text x="168.000" y="93.000" text-anchor="middle" class="">C · 90°</text>
<text x="599.000" y="352.000" text-anchor="middle" class="">D</text>
<text x="380.000" y="203.000" text-anchor="middle" class="">M</text>
<text x="260.000" y="247.000" text-anchor="end" class="" style="fill:#2463b5">AM</text>
<text x="500.000" y="193.000" text-anchor="start" class="" style="fill:#2463b5">BM</text>
<text x="280.000" y="146.000" text-anchor="middle" class="" style="fill:#b55213">CM</text>
<text x="485.000" y="303.000" text-anchor="middle" class="" style="fill:#b55213">DM</text>
<text x="380.000" y="394.000" text-anchor="middle" class="caption">AB = CD,   AM = BM = AB/2,   CM = DM = CD/2</text>
<text x="380.000" y="425.000" text-anchor="middle" class="heading">따라서 MA = MB = MC</text>
</svg>
