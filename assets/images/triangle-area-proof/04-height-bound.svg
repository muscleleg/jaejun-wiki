<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">높이와 반지름을 구분</title>
<desc id="desc">빗변 AB가10인 직각삼각형에서 중심M과 수선의 발H가 다르면 높이CH는 반지름CM보다 짧다. 예시에서 CM=5, CH=4, MH=3이다.</desc>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17212f;font-size:18px} .caption{font-size:17px;fill:#526172}.heading{font-size:21px;font-weight:600}.small{font-size:16px}</style>
<rect width="760" height="420" fill="#fff"/>
<text x="380.000" y="35.000" text-anchor="middle" class="heading">일반 직각삼각형: 반지름 CM과 높이 CH는 다르다</text>
<path d="M 180 300 A 200 200 0 0 1 580 300" fill="none" stroke="#137b6e" stroke-width="1.8"/>
<polygon points="180.000,300.000 500.000,140.000 580.000,300.000" fill="#edf4fd" stroke="#2463b5" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="380.000" y1="300.000" x2="500.000" y2="140.000" stroke="#137b6e" stroke-width="2.7"/>
<line x1="500.000" y1="140.000" x2="500.000" y2="300.000" stroke="#b55213" stroke-width="2.8"/>
<line x1="380.000" y1="300.000" x2="380.000" y2="100.000" stroke="#a3adb9" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="487.478" y1="146.261" x2="493.739" y2="158.783" stroke="#526172" stroke-width="1.6"/>
<line x1="493.739" y1="158.783" x2="506.261" y2="152.522" stroke="#526172" stroke-width="1.6"/>
<line x1="500.000" y1="287.000" x2="513.000" y2="287.000" stroke="#526172" stroke-width="1.6"/>
<line x1="513.000" y1="287.000" x2="513.000" y2="300.000" stroke="#526172" stroke-width="1.6"/>
<circle cx="380" cy="300" r="3.5" fill="#17212f"/>
<circle cx="380" cy="100" r="3.5" fill="#137b6e"/>
<text x="160.000" y="306.000" text-anchor="middle" class="">A</text>
<text x="600.000" y="306.000" text-anchor="middle" class="">B</text>
<text x="380.000" y="326.000" text-anchor="middle" class="">M</text>
<text x="500.000" y="326.000" text-anchor="middle" class="">H</text>
<text x="518.000" y="120.000" text-anchor="middle" class="">C · 90°</text>
<text x="380.000" y="83.000" text-anchor="middle" class="small">T · 높이의 최댓값 5</text>
<text x="425.000" y="210.000" text-anchor="end" class="" style="fill:#137b6e">5</text>
<line x1="510.000" y1="220.000" x2="600.000" y2="220.000" stroke="#a3adb9" stroke-width="1.1"/>
<text x="610.000" y="226.000" text-anchor="start" class="" style="fill:#b55213">높이 4</text>
<text x="440.000" y="326.000" text-anchor="middle" class="small">3</text>
<line x1="180.000" y1="355.000" x2="580.000" y2="355.000" stroke="#526172" stroke-width="1.3"/>
<line x1="180.000" y1="350.000" x2="180.000" y2="360.000" stroke="#526172" stroke-width="1.3"/>
<line x1="580.000" y1="350.000" x2="580.000" y2="360.000" stroke="#526172" stroke-width="1.3"/>
<text x="380.000" y="380.000" text-anchor="middle" class="caption">AB = 10,   CM² = CH² + HM²</text>
</svg>
