<text x="513.000" y="317.000" text-anchor="middle" class="">A</text>
<text x="847.000" y="317.000" text-anchor="middle" class="">B</text>
<text x="680.000" y="334.000" text-anchor="middle" class="">M</text>
<text x="694.000" y="225.000" text-anchor="start" class="" style="fill:#b55213">h = 6</text>
<text x="605.000" y="334.000" text-anchor="middle" class="">5</text>
<text x="755.000" y="334.000" text-anchor="middle" class="">5</text>
<text x="680.000" y="373.000" text-anchor="middle" class="caption">AB = 10</text>
<text x="680.000" y="408.000" text-anchor="middle" class="heading">넓이 30</text>
