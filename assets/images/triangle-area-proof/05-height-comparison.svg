<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
<title id="title">높이 5와 높이 6의 조건 비교</title>
<desc id="desc">같은 밑변10에 높이5인 이등변삼각형은 직각이고 넓이25. 높이6인 이등변삼각형은 직각이 아니며 넓이30이다.</desc>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17212f;font-size:18px} .caption{font-size:17px;fill:#526172}.heading{font-size:21px;font-weight:600}.small{font-size:16px}</style>
<rect width="920" height="430" fill="#fff"/>
<text x="240.000" y="35.000" text-anchor="middle" class="heading">직각이등변삼각형</text>
<polygon points="90.000,310.000 240.000,160.000 390.000,310.000" fill="#edf4fd" stroke="#2463b5" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="240.000" y1="160.000" x2="240.000" y2="310.000" stroke="#b55213" stroke-width="2.6"/>
<line x1="240.000" y1="298.000" x2="252.000" y2="298.000" stroke="#526172" stroke-width="1.6"/>
<line x1="252.000" y1="298.000" x2="252.000" y2="310.000" stroke="#526172" stroke-width="1.6"/>
<line x1="160.757" y1="230.757" x2="169.243" y2="239.243" stroke="#2463b5" stroke-width="2"/>
<line x1="319.243" y1="230.757" x2="310.757" y2="239.243" stroke="#2463b5" stroke-width="2"/>
<line x1="230.101" y1="169.899" x2="240.000" y2="179.799" stroke="#526172" stroke-width="1.6"/>
<line x1="240.000" y1="179.799" x2="249.899" y2="169.899" stroke="#526172" stroke-width="1.6"/>
<text x="240.000" y="137.000" text-anchor="middle" class="">C · 90°</text>
<text x="73.000" y="317.000" text-anchor="middle" class="">A</text>
<text x="407.000" y="317.000" text-anchor="middle" class="">B</text>
<text x="240.000" y="334.000" text-anchor="middle" class="">M</text>
<text x="254.000" y="240.000" text-anchor="start" class="" style="fill:#b55213">h = 5</text>
<text x="165.000" y="334.000" text-anchor="middle" class="">5</text>
<text x="315.000" y="334.000" text-anchor="middle" class="">5</text>
<text x="240.000" y="373.000" text-anchor="middle" class="caption">AB = 10</text>
<text x="240.000" y="408.000" text-anchor="middle" class="heading">넓이 25</text>
<text x="680.000" y="35.000" text-anchor="middle" class="heading">이등변삼각형</text>
<polygon points="530.000,310.000 680.000,130.000 830.000,310.000" fill="#edf4fd" stroke="#2463b5" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="680.000" y1="130.000" x2="680.000" y2="310.000" stroke="#b55213" stroke-width="2.6"/>
<line x1="680.000" y1="298.000" x2="692.000" y2="298.000" stroke="#526172" stroke-width="1.6"/>
<line x1="692.000" y1="298.000" x2="692.000" y2="310.000" stroke="#526172" stroke-width="1.6"/>
<line x1="600.391" y1="216.159" x2="609.609" y2="223.841" stroke="#2463b5" stroke-width="2"/>
