<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img"><title>여러 디스크의 요청이 파일 하나로 연결되는 과정</title><desc>위에서 아래로: VM의 쓰기 요청 → 위치 변환 → 원본 파일 → 실제 저장 장치</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#51749c"/></marker></defs><rect width="1000" height="1020" rx="22" fill="#f5f8fc"/><g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif"><text x="45" y="55" font-size="27" fill="#102c48" font-weight="700" text-anchor="start">여러 디스크의 요청이 파일 하나로 연결되는 과정</text><text x="45" y="86" font-size="16" fill="#51657a" font-weight="400" text-anchor="start">위에서 아래로: VM의 쓰기 요청 → 위치 변환 → 원본 파일 → 실제 저장 장치</text><rect x="50" y="115" width="420" height="88" rx="14" fill="#eaf3ff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="147" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">VM A · 볼륨 A</text><text x="72" y="174" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">“내 디스크의 블록 0에 써 줘”</text><rect x="530" y="115" width="420" height="88" rx="14" fill="#edf7f1" stroke="#cedbea" stroke-width="1.5"/><text x="552" y="147" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">VM B · 볼륨 B</text><text x="552" y="174" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">“내 디스크의 블록 0에 써 줘”</text><path d="M260,203 L260,251" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M740,203 L740,251" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="255" width="900" height="143" rx="14" fill="#e9f6f0" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="287" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">device mapper · 볼륨별 주소를 풀의 위치로 변환</text><text x="72" y="314" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">볼륨 A의 블록 0  →  풀의 영역 X</text><text x="72" y="338" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">볼륨 B의 블록 0  →  풀의 영역 Y</text><text x="72" y="362" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">씬 풀은 쓰기 시 필요한 공간을 할당하고 매핑을 관리한다.</text><path d="M500,398 L500,439" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="443" width="900" height="86" rx="14" fill="#eaf3ff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="475" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">loop 드라이버 · /dev/loop14</text><text x="72" y="502" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">풀의 기반 장치에 대한 요청을 원본 파일의 대응되는 위치로 연결</text><path d="M500,529 L500,570" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="574" width="900" height="128" rx="14" fill="#ffffff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="606" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">원본 파일 하나 · storage.img</text><rect x="76" y="625" width="398" height="47" rx="8" fill="#dbeaff"/><text x="96" y="655" font-size="17" fill="#17324e" font-weight="400" text-anchor="start">파일 안의 영역 X · 볼륨 A 데이터</text><rect x="524" y="625" width="398" height="47" rx="8" fill="#dcefe4"/><text x="544" y="655" font-size="17" fill="#17324e" font-weight="400" text-anchor="start">파일 안의 영역 Y · 볼륨 B 데이터</text><path d="M500,702 L500,743" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="747" width="900" height="86" rx="14" fill="#ffffff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="779" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">호스트 파일시스템</text><text x="72" y="806" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">원본 파일의 위치를 실제 저장 장치의 논리 블록 위치로 연결</text><path d="M500,833 L500,874" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="878" width="900" height="70" rx="14" fill="#eaf0f8" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="910" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">실제 SSD · 데이터를 기록하는 물리 저장 장치</text><text x="50" y="986" font-size="15" fill="#61758a" font-weight="400" text-anchor="start">X·Y는 설명용 영역이다. 중간의 VM 연결 계층과 LVM 메타데이터 위치는 생략했다.</text></g></svg>