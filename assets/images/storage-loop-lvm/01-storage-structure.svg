<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="925" viewBox="0 0 1000 925" role="img"><title>파일 하나에서 여러 가상 디스크를 제공하는 구조</title><desc>위에서 아래로: 저장 공간을 준비하고 논리 볼륨을 VM에 제공하는 순서</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#51749c"/></marker></defs><rect width="1000" height="925" rx="22" fill="#f5f8fc"/><g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif"><text x="45" y="55" font-size="27" fill="#102c48" font-weight="700" text-anchor="start">파일 하나에서 여러 가상 디스크를 제공하는 구조</text><text x="45" y="86" font-size="16" fill="#51657a" font-weight="400" text-anchor="start">위에서 아래로: 저장 공간을 준비하고 논리 볼륨을 VM에 제공하는 순서</text><rect x="50" y="115" width="590" height="100" rx="14" fill="#ffffff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="147" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">① 호스트 파일시스템 안의 원본 파일</text><text x="72" y="174" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">storage.img · 예시 논리 용량 100GB</text><text x="72" y="198" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">파일의 데이터는 실제 SSD에 저장됨</text><path d="M345,215 L345,246" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="250" width="590" height="85" rx="14" fill="#eaf3ff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="282" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">② loop 장치 · /dev/loop14</text><text x="72" y="309" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">일반 파일을 블록 장치로 사용할 수 있게 연결</text><path d="M345,335 L345,366" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="370" width="590" height="110" rx="14" fill="#e9f6f0" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="402" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">③ LVM · 볼륨 그룹과 씬 풀</text><text x="72" y="429" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">제공받은 공간을 관리하고 논리 볼륨에 할당</text><text x="72" y="453" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">device mapper가 볼륨별 위치 매핑을 처리</text><rect x="705" y="368" width="245" height="110" rx="14" fill="#fff4df" stroke="#cedbea" stroke-width="1.5"/><text x="727" y="400" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">Cinder</text><text x="727" y="427" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">볼륨 생성·삭제 요청</text><text x="727" y="451" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">연결에 필요한 관리</text><path d="M705,420 L643,420" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="705" y="510" font-size="16" fill="#715c37" font-weight="400" text-anchor="start">점선: 관리 요청</text><path d="M220,480 L220,531" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M470,480 L470,531" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="535" width="280" height="90" rx="14" fill="#ffffff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="567" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">논리 볼륨 A</text><text x="72" y="594" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">독립적인 블록 장치</text><rect x="360" y="535" width="280" height="90" rx="14" fill="#ffffff" stroke="#cedbea" stroke-width="1.5"/><text x="382" y="567" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">논리 볼륨 B</text><text x="382" y="594" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">독립적인 블록 장치</text><path d="M190,625 L190,671" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,625 L500,671" fill="none" stroke="#51749c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="675" width="280" height="110" rx="14" fill="#eaf3ff" stroke="#cedbea" stroke-width="1.5"/><text x="72" y="707" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">VM A</text><text x="72" y="734" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">VM의 파일시스템</text><text x="72" y="758" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">파일·폴더로 사용</text><rect x="360" y="675" width="280" height="110" rx="14" fill="#eaf3ff" stroke="#cedbea" stroke-width="1.5"/><text x="382" y="707" font-size="21" fill="#163b61" font-weight="700" text-anchor="start">VM B</text><text x="382" y="734" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">VM의 파일시스템</text><text x="382" y="758" font-size="17" fill="#4b6076" font-weight="400" text-anchor="start">파일·폴더로 사용</text><text x="690" y="588" font-size="18" fill="#17324e" font-weight="400" text-anchor="start">더 많은 논리 볼륨도</text><text x="690" y="616" font-size="18" fill="#17324e" font-weight="400" text-anchor="start">같은 풀에서 제공 가능</text><text x="50" y="835" font-size="19" fill="#163b61" font-weight="700" text-anchor="start">loop는 파일을 연결하고, LVM은 그 공간을 여러 논리 볼륨으로 제공한다.</text><text x="50" y="870" font-size="15" fill="#61758a" font-weight="400" text-anchor="start">예시 구성이다. 현재 서버의 원본 파일 경로와 물리 SSD 위치는 추가 확인이 필요하다.</text></g></svg>