<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">OVS 브리지와 VM·호스트의 세 연결</title>
<desc id="desc">가상 스위치 br-int 안에 tap0, tap1, 내부 인터페이스 br-int가 포트로 연결된다. tap0는 QEMU A와 VM A, tap1은 QEMU B와 VM B, 내부 인터페이스 br-int는 호스트의 TCP/IP 처리와 연결된다. 모든 연결은 양방향이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#75878c" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="998" height="618" rx="20" fill="#f8fafb" stroke="#dce4e8"/>
<g font-family="Pretendard Variable, Pretendard, -apple-system, sans-serif" fill="#233747">
<text x="30" y="45" font-size="24" font-weight="700">OVS 브리지와 호스트가 연결되는 위치</text>
<text x="30" y="78" font-size="19" fill="#587078">각 연결 대상은 포트 하나를 통해 스위치와 데이터를 주고받습니다.</text>
<rect x="380" y="112" width="590" height="440" rx="18" fill="#eef3f9" stroke="#c5d3e0" stroke-width="2"/>
<text x="405" y="150" font-size="22" font-weight="700">OVS 브리지 br-int · 가상 스위치 전체</text>
<g stroke="#75878c" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
<path d="M 325 223 H 409"/>
<path d="M 325 343 H 409"/>
<path d="M 325 463 H 409"/>
<path d="M 651 223 H 698 V 299 H 750"/>
<path d="M 651 343 H 750"/>
<path d="M 651 463 H 698 V 387 H 750"/>
</g>
<g fill="#ffffff" stroke="#cbd7e0" stroke-width="1.5">
<rect x="30" y="183" width="295" height="80" rx="12"/>
<rect x="30" y="303" width="295" height="80" rx="12"/>
<rect x="410" y="183" width="240" height="80" rx="12"/>
<rect x="410" y="303" width="240" height="80" rx="12"/>
<rect x="752" y="273" width="190" height="140" rx="14"/>
</g>
<g fill="#e7f4ed" stroke="#65a389" stroke-width="1.5">
<rect x="30" y="415" width="295" height="96" rx="12"/>
<rect x="410" y="415" width="240" height="96" rx="12"/>
</g>
<g text-anchor="middle" font-size="21" font-weight="600">
<text x="177" y="217">QEMU A</text><text x="177" y="246" font-size="19" font-weight="400">VM A와 연결</text>
<text x="177" y="337">QEMU B</text><text x="177" y="366" font-size="19" font-weight="400">VM B와 연결</text>
<text x="530" y="217">tap0</text><text x="530" y="246" font-size="18" font-weight="400">VM A 쪽 포트</text>
<text x="530" y="337">tap1</text><text x="530" y="366" font-size="18" font-weight="400">VM B 쪽 포트</text>
<text x="177" y="455" fill="#265c47">호스트의 TCP/IP 처리</text><text x="177" y="485" font-size="18" font-weight="400" fill="#426b59">호스트에서 실행한 프로그램</text>
<text x="530" y="455" fill="#265c47">내부 인터페이스 br-int</text><text x="530" y="485" font-size="18" font-weight="400" fill="#426b59">호스트 쪽 로컬 포트</text>
<text x="847" y="338">스위칭 처리</text><text x="847" y="370" font-size="18" font-weight="400">출력 포트 선택</text>
</g>
<text x="30" y="590" font-size="18" fill="#587078">같은 이름의 ‘브리지 전체’와 ‘호스트용 내부 인터페이스’는 서로 다른 대상을 가리킵니다.</text>
</g></svg>
