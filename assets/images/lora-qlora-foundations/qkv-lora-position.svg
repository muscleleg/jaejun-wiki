<path d="M 380 377 L 380 416 L 340 416 L 340 441" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140" y="443" width="320" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
