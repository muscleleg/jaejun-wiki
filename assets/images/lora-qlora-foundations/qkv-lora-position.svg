<path d="M 380 88 L 380 115 L 135 115 L 135 151" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="153" width="218" height="130" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="135.0" y="194.0" text-anchor="middle" class="">Q 생성</text>
<text x="135.0" y="226.0" text-anchor="middle" class="">기존 계산</text>
<text x="135.0" y="258.0" text-anchor="middle" class="">+ Q용 LoRA</text>
<path d="M 135 283 L 135 313" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="315" width="150" height="62" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="135.0" y="354.0" text-anchor="middle" class="">보정된 Q</text>
<path d="M 380 88 L 380 115 L 380 115 L 380 151" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="271" y="153" width="218" height="130" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="380.0" y="194.0" text-anchor="middle" class="">K 생성</text>
<text x="380.0" y="226.0" text-anchor="middle" class="">기존 계산</text>
<text x="380.0" y="258.0" text-anchor="middle" class="">+ K용 LoRA</text>
<path d="M 380 283 L 380 313" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="315" width="150" height="62" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="354.0" text-anchor="middle" class="">보정된 K</text>
<path d="M 380 88 L 380 115 L 625 115 L 625 151" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="516" y="153" width="218" height="130" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="625.0" y="194.0" text-anchor="middle" class="">V 생성</text>
<text x="625.0" y="226.0" text-anchor="middle" class="">기존 계산</text>
<text x="625.0" y="258.0" text-anchor="middle" class="">+ V용 LoRA</text>
<path d="M 625 283 L 625 313" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="550" y="315" width="150" height="62" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
