<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc">
<title id="title">QLoRA의 저장과 계산</title><desc id="desc">NF4로 저장한 고정된 기존 가중치는 계산할 때 필요한 부분을 계산용 정밀도로 해석한다. 같은 입력을 받는 별도 A와 B는 BF16 또는 FP32 등으로 유지하며 학습한다. 양쪽 결과를 더한 출력이 이후 모델 계산과 최종 손실로 이어진다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#172b43;font-size:22px}.small{font-size:18px;fill:#475569}.title{font-size:24px;font-weight:600}.blue{fill:#12618b}.orange{fill:#9a4909}</style>
<rect width="760" height="780" fill="#ffffff"/>

<rect x="150" y="18" width="460" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="61.0" text-anchor="middle" class="">같은 입력 x</text>
<path d="M 380 88 L 380 119 L 190 119 L 190 156" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 380 119 L 570 119 L 570 156" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="158" width="324" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="190.0" y="205.0" text-anchor="middle" class="">기존 W · 고정</text>
<text x="190.0" y="237.0" text-anchor="middle" class="">NF4 코드 + 배율로 저장</text>
<rect x="408" y="158" width="324" height="110" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="570.0" y="205.0" text-anchor="middle" class="">추가 A·B · 학습 대상</text>
<text x="570.0" y="237.0" text-anchor="middle" class="">BF16·FP32 등으로 유지</text>
<path d="M 190 268 L 190 302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 570 268 L 570 302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="304" width="324" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="190.0" y="351.0" text-anchor="middle" class="">필요한 값을 계산용으로 해석</text>
<text x="190.0" y="383.0" text-anchor="middle" class="">기존 계산 W̃ × x</text>
<rect x="408" y="304" width="324" height="110" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="570.0" y="351.0" text-anchor="middle" class="">A → B 순서로 계산</text>
<text x="570.0" y="383.0" text-anchor="middle" class="">보정값 B(Ax)</text>
<path d="M 190 414 L 190 450 L 290 450 L 290 478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 570 414 L 570 450 L 470 450 L 470 478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="480" width="360" height="66" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="521.0" text-anchor="middle" class="">두 결과를 더함</text>
<path d="M 380 546 L 380 578" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140" y="580" width="480" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="626.0" text-anchor="middle" class="">이후 모델 계산 → 최종 예측 → 손실</text>
<path d="M 380 656 L 380 686" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#back)"/>
<rect x="140" y="688" width="480" height="66" rx="10" fill="#fff5e9" stroke="#e2bc8c"/>
<text x="380.0" y="729.0" text-anchor="middle" class="">역전파 → A·B 업데이트 · W는 유지</text>
</svg>
