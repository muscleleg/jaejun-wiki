<svg xmlns="http://www.w3.org/2000/svg" width="760" height="875" viewBox="0 0 760 875" role="img" aria-labelledby="title desc">
<title id="title">언어 모델의 계산</title><desc id="desc">문장은 토큰 번호와 임베딩을 거쳐 여러 Transformer 블록으로 들어간다. 블록의 출력은 다음 블록의 입력이 되며 마지막 출력으로 다음 토큰의 확률을 구한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#172b43;font-size:22px}.small{font-size:18px;fill:#475569}.title{font-size:24px;font-weight:600}.blue{fill:#12618b}.orange{fill:#9a4909}</style>
<rect width="760" height="875" fill="#ffffff"/>

<rect x="180" y="20" width="400" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="62.0" text-anchor="middle" class="">문장 → 토큰 번호</text>
<path d="M 380 88 L 380 118" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="120" width="400" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="155.0" text-anchor="middle" class="">임베딩</text>
<text x="380.0" y="187.0" text-anchor="middle" class="">토큰 번호 → 숫자 벡터</text>
<path d="M 380 206 L 380 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="252" width="580" height="330" rx="12" fill="none" stroke="#cbd5e1"/>
<text x="380.0" y="286" text-anchor="middle" class="title">Transformer 블록 · 여러 번 반복</text>
<rect x="170" y="316" width="420" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="351.0" text-anchor="middle" class="">Attention</text>
<text x="380.0" y="383.0" text-anchor="middle" class="">Q·K·V 생성 → 토큰 정보 혼합</text>
<path d="M 380 402 L 380 432" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="434" width="420" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="476.0" text-anchor="middle" class="">FFN · 각 토큰의 벡터 변환</text>
<text x="380" y="548" text-anchor="middle" class="small">정규화·잔차 연결 등은 그림에서 생략</text>
<path d="M 380 582 L 380 624" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="626" width="420" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="661.0" text-anchor="middle" class="">마지막 벡터 → 출력 가중치 계산</text>
<text x="380.0" y="693.0" text-anchor="middle" class="">다음 토큰 후보의 점수 · 로짓</text>
<path d="M 380 712 L 380 742" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="744" width="420" height="86" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="779.0" text-anchor="middle" class="">소프트맥스</text>
<text x="380.0" y="811.0" text-anchor="middle" class="">후보 점수 → 확률</text>
</svg>
