<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc">
<title id="title">Q 생성 내부의 LoRA</title><desc id="desc">현재 블록에서 Q를 만들기 전의 입력 x가 기존 W_Q 계산과 LoRA A_Q, B_Q 계산 양쪽으로 들어간다. 두 결과를 합친 뒤 Q가 된다. A와 B는 이미 만들어진 Q가 아니라 입력 x를 받는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#172b43;font-size:22px}.small{font-size:18px;fill:#475569}.title{font-size:24px;font-weight:600}.blue{fill:#12618b}.orange{fill:#9a4909}</style>
<rect width="760" height="800" fill="#ffffff"/>

<rect x="150" y="18" width="460" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="50.0" text-anchor="middle" class="">Q를 만들기 전의 입력 x</text>
<text x="380.0" y="82.0" text-anchor="middle" class="">양쪽에 동일한 x를 전달</text>
<rect x="32" y="140" width="696" height="435" rx="12" fill="none" stroke="#cbd5e1"/>
<text x="380.0" y="174" text-anchor="middle" class="title">Q 생성 상자 내부</text>
<path d="M 380 98 L 380 120 L 195 120 L 195 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 380 120 L 565 120 L 565 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="62" y="228" width="266" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="195.0" y="275.0" text-anchor="middle" class="">기존 W_Q · 고정</text>
<text x="195.0" y="307.0" text-anchor="middle" class="">기존 결과 W_Q × x</text>
<rect x="432" y="228" width="266" height="82" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="565.0" y="261.0" text-anchor="middle" class="">A_Q · 학습 대상</text>
<text x="565.0" y="293.0" text-anchor="middle" class="">A_Q × x</text>
<path d="M 565 310 L 565 338" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="432" y="340" width="266" height="82" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="565.0" y="373.0" text-anchor="middle" class="">B_Q · 학습 대상</text>
<text x="565.0" y="405.0" text-anchor="middle" class="">B_Q × (A_Q × x)</text>
<path d="M 195 338 L 195 455 L 290 455 L 290 483" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 565 422 L 565 455 L 470 455 L 470 483" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="212" y="485" width="336" height="66" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="526.0" text-anchor="middle" class="">기존 결과 + 보정값</text>
<path d="M 380 551 L 380 608" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="610" width="300" height="66" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="651.0" text-anchor="middle" class="">이제 Q가 완성됨</text>
<path d="M 380 676 L 380 706" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="160" y="708" width="440" height="66" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="749.0" text-anchor="middle" class="">이 Q와 K로 Attention 점수 계산</text>
</svg>
