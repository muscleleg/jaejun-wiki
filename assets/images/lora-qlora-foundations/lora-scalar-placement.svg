<svg xmlns="http://www.w3.org/2000/svg" width="760" height="810" viewBox="0 0 760 810" role="img" aria-labelledby="title desc">
<title id="title">LoRA 보정이 들어가는 위치</title><desc id="desc">입력 2가 기존 첫 번째 가중치 1과 LoRA a=1 b=0.5 경로에 각각 들어간다. 기존 출력 2와 보정 1을 합해 3이 되고, 그 뒤 고정된 두 번째 가중치 2를 곱해 6이 된다. a와 b는 설명용으로 선택한 값이다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#172b43;font-size:22px}.small{font-size:18px;fill:#475569}.title{font-size:24px;font-weight:600}.blue{fill:#12618b}.orange{fill:#9a4909}</style>
<rect width="760" height="810" fill="#ffffff"/>

<rect x="230" y="16" width="300" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="59.0" text-anchor="middle" class="">같은 입력 2</text>
<rect x="32" y="130" width="696" height="440" rx="12" fill="none" stroke="#cbd5e1"/>
<text x="380.0" y="164" text-anchor="middle" class="title">첫 번째 계산 · LoRA 포함</text>
<path d="M 380 86 L 380 110 L 195 110 L 195 215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 380 110 L 565 110 L 565 215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="62" y="217" width="266" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="195.0" y="264.0" text-anchor="middle" class="">기존 가중치 1 · 고정</text>
<text x="195.0" y="296.0" text-anchor="middle" class="">2 × 1 = 2</text>
<rect x="432" y="217" width="266" height="84" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="565.0" y="251.0" text-anchor="middle" class="">a = 1 · 학습 대상</text>
<text x="565.0" y="283.0" text-anchor="middle" class="">2 × 1 = 2</text>
<path d="M 565 301 L 565 333" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="432" y="335" width="266" height="84" rx="10" fill="#eaf6fc" stroke="#8bbbd0"/>
<text x="565.0" y="369.0" text-anchor="middle" class="">b = 0.5 · 학습 대상</text>
<text x="565.0" y="401.0" text-anchor="middle" class="">2 × 0.5 = 1</text>
<path d="M 195 327 L 195 453 L 290 453 L 290 478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 565 419 L 565 453 L 470 453 L 470 478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="228" y="480" width="304" height="66" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="521.0" text-anchor="middle" class="">기존 출력 2 + 보정값 1</text>
<path d="M 380 546 L 380 603" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140" y="605" width="480" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380.0" y="640.0" text-anchor="middle" class="">첫 번째 출력 3 → 두 번째 입력</text>
<text x="380.0" y="672.0" text-anchor="middle" class="">고정된 가중치 2: 3 × 2 = 6</text>
<path d="M 380 691 L 380 721" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="723" width="300" height="66" rx="10" fill="#f0f8f1" stroke="#a9c7ae"/>
<text x="380.0" y="764.0" text-anchor="middle" class="">최종 예측 6</text>
</svg>
