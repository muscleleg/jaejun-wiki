<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">순전파와 역전파</title><desc id="desc">입력 2에 w1=1, w2=2를 차례로 곱해 예측 4, 손실 4를 얻는다. 최종 손실의 예측값에 대한 기울기는 -4이며, 각 계산의 변화율을 곱해 w1 기울기 -16과 w2 기울기 -8을 얻는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#172b43;font-size:22px}.small{font-size:18px;fill:#475569}.title{font-size:24px;font-weight:600}.blue{fill:#12618b}.orange{fill:#9a4909}</style>
<rect width="760" height="470" fill="#ffffff"/>

<text x="28" y="34" text-anchor="start" class="title">순전파 · 가중치로 예측과 손실을 계산</text>
<rect x="24" y="65" width="125" height="94" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="86.5" y="104.0" text-anchor="middle" class="">입력</text>
<text x="86.5" y="136.0" text-anchor="middle" class="">x = 2</text>
<rect x="185" y="65" width="155" height="94" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="262.5" y="104.0" text-anchor="middle" class="">× w₁ = 1</text>
<text x="262.5" y="136.0" text-anchor="middle" class="">u = 2</text>
<rect x="376" y="65" width="155" height="94" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="453.5" y="104.0" text-anchor="middle" class="">× w₂ = 2</text>
<text x="453.5" y="136.0" text-anchor="middle" class="">y = 4</text>
<rect x="567" y="65" width="169" height="94" rx="10" fill="#fff5e9" stroke="#e2bc8c"/>
<text x="651.5" y="104.0" text-anchor="middle" class="">(y − 6)²</text>
<text x="651.5" y="136.0" text-anchor="middle" class="">L = 4</text>
<path d="M 149 112 L 182 112" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 340 112 L 373 112" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 531 112 L 564 112" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="218" text-anchor="start" class="title">역전파 · 최종 손실에 대한 변화율을 계산</text>
<path d="M 648 246 L 453 246" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#back)"/>
<text x="554" y="279" text-anchor="middle" class="orange">손실 → y: −4</text>
<path d="M 451 246 L 263 246" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#back)"/>
<text x="355" y="279" text-anchor="middle" class="orange">y → u: ×2</text>
<rect x="34" y="315" width="332" height="104" rx="10" fill="#fff5e9" stroke="#e2bc8c"/>
<text x="200.0" y="359.0" text-anchor="middle" class="">w₁에 대한 손실 기울기</text>
<text x="200.0" y="391.0" text-anchor="middle" class="">−4 × 2 × 2 = −16</text>
<rect x="394" y="315" width="332" height="104" rx="10" fill="#fff5e9" stroke="#e2bc8c"/>
<text x="560.0" y="359.0" text-anchor="middle" class="">w₂에 대한 손실 기울기</text>
<text x="560.0" y="391.0" text-anchor="middle" class="">−4 × 2 = −8</text>
<text x="380" y="451" text-anchor="middle" class="small">기울기 계산 뒤, 학습률을 적용해 가중치를 업데이트한다.</text>
</svg>
