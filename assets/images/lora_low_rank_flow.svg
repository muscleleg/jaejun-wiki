<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 저랭크 변화량 흐름과 Rank 비교</title>
  <desc id="desc">4096차원 입력이 동결된 W 경로와 A, 8개 계수, B를 거치는 LoRA 경로로 나뉜 뒤 합쳐진다. 아래에서는 Rank 1 공선 방향과 Rank 2 독립 방향을 비교한다.</desc>
  <defs>
    <style>
      text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#18211d} .h{font-size:30px;font-weight:800}.t{font-size:22px;font-weight:700}.s{font-size:18px;fill:#4e5b54}.box{stroke-width:3}.arrow{stroke:#3157c8;stroke-width:4;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#3157c8"/></marker>
  </defs>
  <rect width="1200" height="700" rx="30" fill="#f6f8fb"/>
  <text x="50" y="55" class="h">LoRA: 원본 경로 + 저랭크 변화 경로</text>
  <rect x="55" y="120" width="190" height="90" rx="18" fill="#fff" stroke="#95a29b" class="box"/><text x="150" y="158" text-anchor="middle" class="t">입력 x</text><text x="150" y="188" text-anchor="middle" class="s">4096차원</text>
  <path d="M245 165H335" class="arrow"/><path d="M285 165V300H335" class="arrow"/>
  <rect x="340" y="110" width="210" height="110" rx="18" fill="#edf2ff" stroke="#3157c8" class="box"/><text x="445" y="152" text-anchor="middle" class="t">동결된 W</text><text x="445" y="184" text-anchor="middle" class="s">4096 × 4096</text>
  <path d="M550 165H960" class="arrow"/>
  <rect x="340" y="260" width="165" height="100" rx="18" fill="#e5f3eb" stroke="#176b4d" class="box"/><text x="422" y="300" text-anchor="middle" class="t">A</text><text x="422" y="332" text-anchor="middle" class="s">8 × 4096</text>
  <path d="M505 310H565" class="arrow"/>
  <rect x="570" y="260" width="180" height="100" rx="18" fill="#fff8e8" stroke="#d0922e" class="box"/><text x="660" y="300" text-anchor="middle" class="t">8개 계수</text><text x="660" y="332" text-anchor="middle" class="s">변화 방향의 조합</text>
  <path d="M750 310H810" class="arrow"/>
  <rect x="815" y="260" width="165" height="100" rx="18" fill="#e5f3eb" stroke="#176b4d" class="box"/><text x="897" y="300" text-anchor="middle" class="t">B</text><text x="897" y="332" text-anchor="middle" class="s">4096 × 8</text>
  <path d="M980 310H1035V220" class="arrow"/>
  <circle cx="1025" cy="165" r="43" fill="#fff" stroke="#3157c8" stroke-width="3"/><text x="1025" y="174" text-anchor="middle" class="h">+</text>
  <path d="M1068 165H1140" class="arrow"/><text x="1100" y="132" text-anchor="middle" class="t">출력</text>
  <text x="660" y="410" text-anchor="middle" class="t">ΔW = BA, rank(ΔW) ≤ 8</text>
  <line x1="50" y1="455" x2="1150" y2="455" stroke="#d9e0dc" stroke-width="3"/>
  <text x="50" y="505" class="h">같은 2 × 2, 다른 Rank</text>
  <rect x="55" y="535" width="510" height="120" rx="18" fill="#fff" stroke="#8d6cab" class="box"/>
  <text x="90" y="575" class="t">Rank 1 · 공선</text><path d="M330 625l95-45" stroke="#8d6cab" stroke-width="6" marker-end="url(#m)"/><path d="M330 625l180-85" stroke="#8d6cab" stroke-width="6" marker-end="url(#m)"/><text x="90" y="613" class="s">두 번째 열 = 첫 번째 열 × 2</text><text x="90" y="640" class="s">독립 방향 1개</text>
  <rect x="635" y="535" width="510" height="120" rx="18" fill="#fff" stroke="#176b4d" class="box"/>
  <text x="670" y="575" class="t">Rank 2 · 독립</text><path d="M930 630V550" stroke="#176b4d" stroke-width="6" marker-end="url(#m)"/><path d="M930 630H1030" stroke="#3157c8" stroke-width="6" marker-end="url(#m)"/><text x="670" y="613" class="s">어느 열도 다른 열의 배수가 아님</text><text x="670" y="640" class="s">독립 방향 2개</text>
</svg>
