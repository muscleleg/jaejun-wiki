<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title desc"><title id="title">KV는 모든 Attention 레이어에 대응해 전달된다</title><desc id="desc">Prefill의 각 레이어 입력 KV가 Decode의 같은 레이어로 전달된다. Decode는 그 KV를 재사용하고 새 토큰의 KV를 추가한다. 중간 레이어는 생략했다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315fc4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137a65"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607086"/></marker><pattern id="unused" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff5df"/><path d="M0 8 L8 0" stroke="#dac18b"/></pattern></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="960" height="584" rx="16" fill="#fff" stroke="none"/><text x="36" y="44" font-size="25" text-anchor="start" fill="#182b42" font-weight="700">KV는 모든 Attention 레이어에 대응해 전달된다</text><text x="36" y="74" font-size="17" text-anchor="start" fill="#526176" font-weight="400">입력의 K·V를 레이어별로 전달하고, 새 토큰의 K·V는 Decode에서 추가한다</text><rect x="36" y="104" width="332" height="50" rx="10" fill="#edf2fc" stroke="none"/><text x="202" y="136" font-size="22" text-anchor="middle" fill="#182b42" font-weight="700">Prefill GPU</text><rect x="560" y="104" width="364" height="50" rx="10" fill="#edf7f4" stroke="none"/><text x="742" y="136" font-size="22" text-anchor="middle" fill="#182b42" font-weight="700">Decode GPU</text><text x="48" y="178" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 0</text><text x="572" y="178" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 0</text><rect x="48" y="188" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="120" y="217" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 K</text><rect x="201" y="188" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="274" y="217" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 V</text><path d="M368 210 H549" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><text x="458" y="195" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">같은 레이어로</text><rect x="572" y="188" width="205" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="674" y="217" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">전달받은 입력 K·V</text><rect x="787" y="188" width="125" height="45" rx="10" fill="#ddf2e9" stroke="none"/><text x="850" y="217" font-size="16" text-anchor="middle" fill="#182b42" font-weight="400">새 토큰 K·V</text><text x="48" y="268" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 1</text><text x="572" y="268" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 1</text><rect x="48" y="278" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="120" y="307" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 K</text><rect x="201" y="278" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="274" y="307" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 V</text><path d="M368 300 H549" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><text x="458" y="285" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">같은 레이어로</text><rect x="572" y="278" width="205" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="674" y="307" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">전달받은 입력 K·V</text><rect x="787" y="278" width="125" height="45" rx="10" fill="#ddf2e9" stroke="none"/><text x="850" y="307" font-size="16" text-anchor="middle" fill="#182b42" font-weight="400">새 토큰 K·V</text><text x="48" y="400" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 35</text><text x="572" y="400" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">레이어 35</text><rect x="48" y="410" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="120" y="439" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 K</text><rect x="201" y="410" width="145" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="274" y="439" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">입력 토큰 V</text><path d="M368 432 H549" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><text x="458" y="417" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">같은 레이어로</text><rect x="572" y="410" width="205" height="45" rx="10" fill="#eaf0fc" stroke="none"/><text x="674" y="439" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">전달받은 입력 K·V</text><rect x="787" y="410" width="125" height="45" rx="10" fill="#ddf2e9" stroke="none"/><text x="850" y="439" font-size="16" text-anchor="middle" fill="#182b42" font-weight="400">새 토큰 K·V</text><text x="200" y="374" font-size="30" text-anchor="middle" fill="#182b42" font-weight="400">⋮</text><text x="740" y="374" font-size="30" text-anchor="middle" fill="#182b42" font-weight="400">⋮</text><path d="M36 494 H924" stroke="#e2e8f0"/><text x="36" y="528" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">전달 대상: 이 입력의 KV 상태 · 모델 가중치와 과거 Q를 옮기는 그림이 아니다</text><text x="36" y="557" font-size="16" text-anchor="start" fill="#526176" font-weight="400">예시: 36개 Attention 레이어 · TP=1 · 각 서버는 같은 모델 전체를 이미 가지고 있음</text></g></svg>
