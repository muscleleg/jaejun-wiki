<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1038" viewBox="0 0 960 1038" role="img" aria-labelledby="title desc"><title id="title">같은 GPU 3장도 역할 배분에 따라 요청 경로가 달라진다</title><desc id="desc">독립 서버 세 개는 한 서버만 선택한다. 2P1D는 A 또는 C에서 Prefill 후 B에서 Decode한다. 1P2D는 A에서 Prefill 후 B 또는 C를 Decode로 선택한다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315fc4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137a65"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607086"/></marker><pattern id="unused" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff5df"/><path d="M0 8 L8 0" stroke="#dac18b"/></pattern></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="960" height="1038" rx="16" fill="#fff" stroke="none"/><text x="36" y="44" font-size="25" text-anchor="start" fill="#182b42" font-weight="700">같은 GPU 3장도 역할 배분에 따라 요청 경로가 달라진다</text><text x="36" y="76" font-size="17" text-anchor="start" fill="#526176" font-weight="400">모두 GPU 3장 · 각 서버 TP=1 · 한 요청이 이용하는 경로를 비교</text><text x="36" y="123" font-size="22" text-anchor="start" fill="#182b42" font-weight="700">독립 서버 3개</text><rect x="40" y="192" width="160" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="120" y="219" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">요청 배정</text><text x="120" y="243" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">서버 하나 선택</text><rect x="410" y="150" width="245" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="532.5" y="177" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">A · GPU 0</text><text x="532.5" y="201" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill + Decode</text><path d="M200 225 H305 V183 H400" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M655 183 H758 V225 H805" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><rect x="410" y="238" width="245" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="532.5" y="265" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">B · GPU 1</text><text x="532.5" y="289" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill + Decode</text><path d="M200 225 H305 V271 H400" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M655 271 H758 V225 H805" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><rect x="410" y="326" width="245" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="532.5" y="353" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">C · GPU 2</text><text x="532.5" y="377" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill + Decode</text><path d="M200 225 H305 V359 H400" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M655 359 H758 V225 H805" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><rect x="815" y="192" width="105" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="867.5" y="219" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">응답</text><text x="867.5" y="243" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">선택 서버</text><text x="40" y="415" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">한 요청은 A·B·C 중 하나에서 끝난다. 서버 사이 KV 전달은 없다.</text><path d="M36 441 H924" stroke="#e2e8f0"/><text x="36" y="478" font-size="22" text-anchor="start" fill="#182b42" font-weight="700">2P·1D</text><rect x="40" y="533" width="160" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="120" y="560" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">P 선택</text><text x="120" y="584" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">A 또는 C</text><rect x="365" y="503" width="215" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="472.5" y="530" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">A · GPU 0</text><text x="472.5" y="554" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill</text><rect x="365" y="591" width="215" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="472.5" y="618" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">C · GPU 2</text><text x="472.5" y="642" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill</text><path d="M200 566 H277 V536 H355" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M277 566 V624 H355" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M580 536 H668 V578 H739" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><path d="M580 624 H668 V578" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><rect x="750" y="545" width="170" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="835" y="572" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">B · GPU 1</text><text x="835" y="596" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Decode</text><text x="40" y="691" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">한 요청: A 또는 C → B. 두 P가 같은 요청을 함께 계산하지 않는다.</text><path d="M36 718 H924" stroke="#e2e8f0"/><text x="36" y="755" font-size="22" text-anchor="start" fill="#182b42" font-weight="700">1P·2D</text><rect x="40" y="818" width="180" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="130" y="845" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">A · GPU 0</text><text x="130" y="869" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Prefill</text><rect x="380" y="818" width="185" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="472.5" y="845" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">D 선택</text><text x="472.5" y="869" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">B 또는 C</text><path d="M220 851 H370" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><rect x="715" y="787" width="205" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="817.5" y="814" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">B · GPU 1</text><text x="817.5" y="838" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Decode</text><rect x="715" y="875" width="205" height="66" rx="10" fill="#edf7f4" stroke="none"/><text x="817.5" y="902" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">C · GPU 2</text><text x="817.5" y="926" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">Decode</text><path d="M565 851 H638 V820 H705" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><path d="M638 851 V908 H705" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><text x="40" y="975" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">한 요청: A → B 또는 C. 두 D의 출력을 합치는 구조가 아니다.</text><text x="36" y="1014" font-size="16" text-anchor="start" fill="#526176" font-weight="400">화살표는 요청 처리·KV 인계의 논리 경로이며 물리 배선도가 아니다.</text></g></svg>
