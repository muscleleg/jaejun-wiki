<svg xmlns="http://www.w3.org/2000/svg" width="960" height="598" viewBox="0 0 960 598" role="img" aria-labelledby="title desc"><title id="title">673토큰의 KV를 옮겼는데 왜 688토큰 분량일까?</title><desc id="desc">16토큰 블록 43개는 688슬롯이다. 앞 42블록은 672토큰으로 채워지고 마지막 블록은 한 토큰과 빈 슬롯 15개다. 논리량94.64MiB와 남는 공간2.11MiB를 더해96.75MiB다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315fc4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137a65"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607086"/></marker><pattern id="unused" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff5df"/><path d="M0 8 L8 0" stroke="#dac18b"/></pattern></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="960" height="598" rx="16" fill="#fff" stroke="none"/><text x="36" y="44" font-size="25" text-anchor="start" fill="#182b42" font-weight="700">673토큰의 KV를 옮겼는데 왜 688토큰 분량일까?</text><text x="36" y="77" font-size="17" text-anchor="start" fill="#526176" font-weight="400">입력 673토큰 · 블록당 16토큰 · 전체 레이어 KV 144 KiB / 토큰</text><text x="36" y="124" font-size="22" text-anchor="start" fill="#182b42" font-weight="700">43개 블록 = 688개 슬롯</text><rect x="36" y="146" width="548" height="70" rx="10" fill="#eaf0fc" stroke="none"/><text x="310" y="176" font-size="21" text-anchor="middle" fill="#182b42" font-weight="700">앞의 42개 블록</text><text x="310" y="201" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">42 × 16 = 672토큰 — 모두 사용</text><rect x="614" y="146" width="310" height="70" rx="10" fill="#fff5df" stroke="none"/><text x="769" y="176" font-size="21" text-anchor="middle" fill="#182b42" font-weight="700">마지막 1개 블록</text><text x="769" y="201" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">1토큰 사용 + 15슬롯 남음</text><text x="36" y="263" font-size="19" text-anchor="start" fill="#182b42" font-weight="700">마지막 블록 확대</text><rect x="36" y="282" width="52" height="55" rx="4" fill="#c9d8fa" stroke="#d2dbe7"/><text x="62" y="316" font-size="16" text-anchor="middle" fill="#182b42" font-weight="400">673</text><rect x="91.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="147" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="202.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="258" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="313.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="369" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="424.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="480" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="535.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="591" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="646.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="702" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="757.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="813" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><rect x="868.5" y="282" width="52" height="55" rx="4" fill="url(#unused)" stroke="#d2dbe7"/><text x="36" y="371" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">파란 칸: 실제 입력 토큰</text><text x="366" y="371" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">빗금 15칸: 추가 생성 토큰이 아닌 빈 슬롯</text><path d="M36 395 H924" stroke="#e2e8f0"/><rect x="36" y="419" width="280" height="112" rx="10" fill="#f4f7fc" stroke="none"/><text x="176" y="450" font-size="19" text-anchor="middle" fill="#182b42" font-weight="400">입력의 논리량</text><text x="176" y="480" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">673 × 144 KiB</text><text x="176" y="514" font-size="25" text-anchor="middle" fill="#182b42" font-weight="700">94.64 MiB</text><rect x="366" y="419" width="230" height="112" rx="10" fill="#fff5df" stroke="none"/><text x="481" y="450" font-size="19" text-anchor="middle" fill="#182b42" font-weight="400">남는 15슬롯</text><text x="481" y="480" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">15 × 144 KiB</text><text x="481" y="514" font-size="25" text-anchor="middle" fill="#182b42" font-weight="700">2.11 MiB</text><rect x="660" y="419" width="264" height="112" rx="10" fill="#edf7f4" stroke="none"/><text x="792" y="450" font-size="19" text-anchor="middle" fill="#182b42" font-weight="400">블록 단위 전달량</text><text x="792" y="480" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">688 × 144 KiB</text><text x="792" y="514" font-size="25" text-anchor="middle" fill="#182b42" font-weight="700">96.75 MiB</text><text x="340" y="480" font-size="28" text-anchor="middle" fill="#182b42" font-weight="400">+</text><text x="628" y="480" font-size="28" text-anchor="middle" fill="#182b42" font-weight="400">=</text><text x="36" y="571" font-size="17" text-anchor="start" fill="#526176" font-weight="400">이 환경의 관측값과 대응하는 계산이며, 모든 모델·Connector의 고정 전송 규칙은 아니다.</text></g></svg>
