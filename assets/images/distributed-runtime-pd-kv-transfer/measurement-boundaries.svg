<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title desc"><title id="title">HTTP 전체 시간과 KV 수신 시간은 겹친다</title><desc id="desc">P HTTP 뒤 D HTTP 구간이 이어지며 KV 수신은 D 구간 안에서 일어난다. TTFT는 P 요청 시작부터 D 첫 내용까지, E2E는 전체 완료까지다. 시간 비율이나 실제 trace가 아닌 개념도다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315fc4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137a65"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607086"/></marker><pattern id="unused" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff5df"/><path d="M0 8 L8 0" stroke="#dac18b"/></pattern></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="960" height="584" rx="16" fill="#fff" stroke="none"/><text x="36" y="44" font-size="25" text-anchor="start" fill="#182b42" font-weight="700">HTTP 전체 시간과 KV 수신 시간은 겹친다</text><text x="36" y="77" font-size="17" text-anchor="start" fill="#526176" font-weight="400">시간의 포함 관계를 보여주는 개념도 · 길이는 측정값의 비율이 아니다</text><text x="180" y="126" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">P 요청 시작</text><text x="376" y="126" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">P 응답 / D 요청</text><text x="728" y="126" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">D 첫 내용</text><text x="900" y="126" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">D 완료</text><path d="M180 138 V437" stroke="#ccd5e1" stroke-dasharray="4 6"/><path d="M376 138 V437" stroke="#ccd5e1" stroke-dasharray="4 6"/><path d="M728 138 V437" stroke="#ccd5e1" stroke-dasharray="4 6"/><path d="M900 138 V437" stroke="#ccd5e1" stroke-dasharray="4 6"/><text x="36" y="179" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">HTTP 구간</text><rect x="180" y="151" width="196" height="50" rx="4" fill="#eaf0fc" stroke="none"/><text x="278" y="182" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">Prefill HTTP</text><rect x="378" y="151" width="522" height="50" rx="4" fill="#e8f4f0" stroke="none"/><text x="639" y="182" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">Decode HTTP 구간</text><text x="36" y="252" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">KV 수신</text><rect x="425" y="224" width="232" height="48" rx="4" fill="#bce3d5" stroke="none"/><text x="541" y="254" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">NIXL 관측 구간</text><text x="425" y="301" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">D 구간 안에서 KV 수신·대기·생성이 진행됨</text><text x="36" y="363" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">TTFT</text><path d="M180 357 H728" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><text x="449" y="346" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">P 요청 전부터 D 첫 내용까지</text><text x="36" y="419" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">E2E</text><path d="M180 413 H900" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><text x="540" y="402" font-size="17" text-anchor="middle" fill="#182b42" font-weight="400">전체 요청 시작부터 완료까지</text><path d="M36 458 H924" stroke="#e2e8f0"/><text x="36" y="493" font-size="21" text-anchor="start" fill="#182b42" font-weight="700">NIXL 시간을 E2E에 다시 더하면 중복 계산할 수 있다.</text><text x="36" y="525" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">Decode 평균 − NIXL 평균을 순수 생성 시간으로 단정하지 않는다.</text><text x="36" y="558" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">동시 요청의 개별 전송 시간 합계는 실제 벽시계 경과 시간보다 클 수 있다.</text></g></svg>
