<svg xmlns="http://www.w3.org/2000/svg" width="960" height="674" viewBox="0 0 960 674" role="img" aria-labelledby="title desc"><title id="title">요청 조정 · 연결 준비 · KV 데이터 전달</title><desc id="desc">HTTP는 요청과 메타데이터, side channel은 엔진 연결 정보를 교환한다. KV 본체는 Prefill 버퍼에서 Decode 버퍼로 NIXL과 backend를 통해 전달된다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315fc4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137a65"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607086"/></marker><pattern id="unused" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff5df"/><path d="M0 8 L8 0" stroke="#dac18b"/></pattern></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="960" height="674" rx="16" fill="#fff" stroke="none"/><text x="36" y="44" font-size="25" text-anchor="start" fill="#182b42" font-weight="700">요청 조정 · 연결 준비 · KV 데이터 전달</text><text x="36" y="76" font-size="17" text-anchor="start" fill="#526176" font-weight="400">요청을 연결하는 정보와 실제 KV 바이트는 다른 층에서 이동한다</text><rect x="36" y="103" width="888" height="150" rx="10" fill="#f4f7fc" stroke="none"/><text x="56" y="135" font-size="21" text-anchor="start" fill="#182b42" font-weight="700">① HTTP · 요청과 응답</text><rect x="65" y="166" width="200" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="165" y="193" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">요청 조정 코드</text><text x="165" y="217" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">목적지·순서 결정</text><rect x="550" y="166" width="310" height="66" rx="10" fill="#edf2fc" stroke="none"/><text x="705" y="193" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">P / D API 서버</text><text x="705" y="217" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">입력·생성 조건·KV 메타데이터</text><path d="M265 186 H538" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><path d="M550 214 H277" fill="none" stroke="#315fc4" stroke-width="2" marker-end="url(#blue)"/><text x="400" y="171" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">JSON · 응답 / 스트림</text><rect x="36" y="273" width="888" height="143" rx="10" fill="#f4f7fc" stroke="none"/><text x="56" y="305" font-size="21" text-anchor="start" fill="#182b42" font-weight="700">② KV 연결 준비 · side channel</text><rect x="65" y="329" width="245" height="66" rx="10" fill="#f0f4f8" stroke="none"/><text x="187.5" y="356" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">Decode 엔진</text><text x="187.5" y="380" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">KV 제공 측 식별</text><rect x="614" y="329" width="245" height="66" rx="10" fill="#f0f4f8" stroke="none"/><text x="736.5" y="356" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">Prefill 엔진</text><text x="736.5" y="380" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">위치·엔진·블록 정보</text><path d="M310 349 H602" fill="none" stroke="#607086" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/><path d="M614 377 H322" fill="none" stroke="#607086" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/><text x="462" y="334" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">연결 정보 교환</text><rect x="36" y="437" width="888" height="169" rx="10" fill="#f0f8f5" stroke="none"/><text x="56" y="469" font-size="21" text-anchor="start" fill="#182b42" font-weight="700">③ KV 데이터 전달 · NIXL + backend</text><rect x="65" y="495" width="245" height="66" rx="10" fill="#ddf2e9" stroke="none"/><text x="187.5" y="522" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">Prefill의 KV 버퍼</text><text x="187.5" y="546" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">전달할 K·V</text><rect x="614" y="495" width="245" height="66" rx="10" fill="#ddf2e9" stroke="none"/><text x="736.5" y="522" font-size="20" text-anchor="middle" fill="#182b42" font-weight="700">Decode의 KV 버퍼</text><text x="736.5" y="546" font-size="16" text-anchor="middle" fill="#526176" font-weight="400">받아서 재사용</text><path d="M310 527 H602" fill="none" stroke="#137a65" stroke-width="3" marker-end="url(#green)"/><text x="462" y="514" font-size="18" text-anchor="middle" fill="#182b42" font-weight="400">실제 KV 바이트</text><text x="56" y="586" font-size="17" text-anchor="start" fill="#182b42" font-weight="400">예시에서는 UCX backend · CUDA buffer 확인 / 구체 물리 경로는 미확인</text><text x="36" y="646" font-size="18" text-anchor="start" fill="#182b42" font-weight="400">side channel의 포트 번호만으로 KV 본체가 이동한 하드웨어 경로를 알 수 없다.</text></g></svg>
