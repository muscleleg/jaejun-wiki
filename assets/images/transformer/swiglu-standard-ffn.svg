<svg xmlns="http://www.w3.org/2000/svg" width="640" height="612" viewBox="0 0 640 612" role="img" aria-labelledby="title desc">
  <title id="title">기존 FFN의 구조</title>
  <desc id="desc">한 토큰의 입력 feature 2개를 Linear up으로 3개로 확장하고 GELU 또는 SiLU를 적용한 다음 Linear down으로 2개로 줄인다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758b"/></marker></defs>
  <rect width="640" height="612" rx="18" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle" fill="#172b43">
    <rect x="150" y="24" width="340" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="60" font-size="21" font-weight="650">한 토큰의 입력</text>
    <text x="320" y="86" font-size="18">feature 2개</text>
    <path d="M 320 108 V 144" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="144" width="340" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="180" font-size="21" font-weight="650">Linear up</text>
    <text x="320" y="206" font-size="18">2 → 3</text>
    <path d="M 320 228 V 264" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="264" width="340" height="84" rx="14" fill="#e8f4ef" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="300" font-size="21" font-weight="650">GELU 또는 SiLU</text>
    <text x="320" y="326" font-size="18">비선형 변환</text>
    <path d="M 320 348 V 384" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="384" width="340" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="420" font-size="21" font-weight="650">Linear down</text>
    <text x="320" y="446" font-size="18">3 → 2</text>
    <path d="M 320 468 V 504" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="504" width="340" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="540" font-size="21" font-weight="650">한 토큰의 출력</text>
    <text x="320" y="566" font-size="18">feature 2개</text>
  </g>
</svg>
