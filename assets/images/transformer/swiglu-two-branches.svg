<svg xmlns="http://www.w3.org/2000/svg" width="720" height="862" viewBox="0 0 720 862" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU의 두 갈래 구조</title>
  <desc id="desc">같은 입력을 Linear up과 Linear gate에 각각 넣는다. gate에 SiLU를 적용한 뒤 up과 같은 위치끼리 곱한다. Linear down으로 출력 feature 크기를 복원한다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758b"/></marker></defs>
  <rect width="720" height="862" rx="18" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle" fill="#172b43">
    <path d="M 360 108 V 136 H 184 V 162" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 360 136 H 536 V 162" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 536 266 V 316" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 184 266 V 450 H 285 V 490" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 536 400 V 450 H 435 V 490" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 360 582 V 622" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 360 714 V 754" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="220" y="24" width="280" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="360" y="60" font-size="21" font-weight="650">한 토큰의 동일한 입력</text>
    <text x="360" y="86" font-size="18">feature 2개</text>
    <rect x="44" y="162" width="280" height="104" rx="14" fill="#e9f1fc" stroke="#a9c3e7" stroke-width="1.5"/>
    <text x="184" y="195" font-size="21" font-weight="650">Linear up</text>
    <text x="184" y="221" font-size="18">2 → 3</text>
    <text x="184" y="247" font-size="18">전달할 중간 특징 생성</text>
    <rect x="396" y="162" width="280" height="104" rx="14" fill="#e8f4ef" stroke="#a9d0bf" stroke-width="1.5"/>
    <text x="536" y="195" font-size="21" font-weight="650">Linear gate</text>
    <text x="536" y="221" font-size="18">2 → 3</text>
    <text x="536" y="247" font-size="18">조절값 생성</text>
    <rect x="396" y="316" width="280" height="84" rx="14" fill="#e8f4ef" stroke="#a9d0bf" stroke-width="1.5"/>
    <text x="536" y="352" font-size="21" font-weight="650">SiLU</text>
    <text x="536" y="378" font-size="18">gate × sigmoid(gate)</text>
    <rect x="220" y="490" width="280" height="92" rx="14" fill="#fff5df" stroke="#dfc684" stroke-width="1.5"/>
    <text x="360" y="530" font-size="21" font-weight="650">같은 위치끼리 곱하기</text>
    <text x="360" y="556" font-size="18">up × SiLU(gate)</text>
    <rect x="220" y="622" width="280" height="92" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="360" y="649" font-size="21" font-weight="650">Linear down</text>
    <text x="360" y="675" font-size="18">3 → 2</text>
    <text x="360" y="701" font-size="18">조절된 특징을 다시 조합</text>
    <rect x="220" y="754" width="280" height="84" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="360" y="790" font-size="21" font-weight="650">한 토큰의 출력</text>
    <text x="360" y="816" font-size="18">feature 2개</text>
  </g>
</svg>
