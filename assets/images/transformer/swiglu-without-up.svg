<svg xmlns="http://www.w3.org/2000/svg" width="640" height="516" viewBox="0 0 640 516" role="img" aria-labelledby="title desc">
  <title id="title">up 갈래를 뺀 SiLU FFN</title>
  <desc id="desc">입력에서 Linear, SiLU, Linear down을 순서대로 거쳐 출력한다. 별도의 up 갈래와 gate 결합 곱셈이 없는 일반적인 SiLU FFN이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758b"/></marker></defs>
  <rect width="640" height="516" rx="18" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle" fill="#172b43">
    <rect x="150" y="24" width="340" height="68" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="65" font-size="21" font-weight="650">입력</text>
    <path d="M 320 92 V 124" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="124" width="340" height="68" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="165" font-size="21" font-weight="650">Linear</text>
    <path d="M 320 192 V 224" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="224" width="340" height="68" rx="14" fill="#e8f4ef" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="265" font-size="21" font-weight="650">SiLU</text>
    <path d="M 320 292 V 324" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="324" width="340" height="68" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="365" font-size="21" font-weight="650">Linear down</text>
    <path d="M 320 392 V 424" fill="none" stroke="#60758b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="150" y="424" width="340" height="68" rx="14" fill="#edf3fa" stroke="#b8cbe0" stroke-width="1.5"/>
    <text x="320" y="465" font-size="21" font-weight="650">출력</text>
  </g>
</svg>
