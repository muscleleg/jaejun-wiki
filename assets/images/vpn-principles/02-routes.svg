<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="라우팅 테이블: 목적지 대역에 맞는 경로 선택"><title>라우팅 테이블: 목적지 대역에 맞는 경로 선택</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#58718e" stroke-width="1.5"/></marker></defs><rect width="1000" height="320" rx="20" fill="#f7f9fc"/><text x="36" y="44" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="26" font-weight="700" fill="#172d46">라우팅 테이블: 목적지 대역에 맞는 경로 선택</text><rect x="36" y="80" width="400" height="86" rx="14" fill="#ffffff" stroke="#cbd7e5" stroke-width="2"/><text x="54" y="112" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#172d46">목적지 192.168.80.0/24</text><text x="54" y="140" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#172d46">집 내부망으로 가는 패킷</text><path d="M436 123 L540 123" fill="none" stroke="#58718e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="550" y="80" width="414" height="86" rx="14" fill="#e8f1ff" stroke="#77a6e8" stroke-width="2"/><text x="568" y="112" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#172d46">VPN 경로</text><text x="568" y="140" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#172d46">대역 전체를 VPN 서버로 전달</text><rect x="36" y="195" width="400" height="86" rx="14" fill="#ffffff" stroke="#cbd7e5" stroke-width="2"/><text x="54" y="227" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#172d46">그 밖의 목적지</text><text x="54" y="255" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#172d46">더 구체적인 경로가 없는 경우</text><path d="M436 238 L540 238" fill="none" stroke="#58718e" stroke-width="2.5