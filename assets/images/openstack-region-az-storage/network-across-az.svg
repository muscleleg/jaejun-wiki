<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="network-across-az-title network-across-az-desc">
<title id="network-across-az-title">리전·AZ와 하나의 가상 네트워크</title>
<desc id="network-across-az-desc">RegionOne 안의 compute-a와 compute-b에 호스트 A와 B가 있다. 두 호스트의 VM은 포트 1과 2를 통해 같은 net-app 네트워크와 10.0.0.0/24 서브넷에 연결된다. 두 호스트에 해당 네트워크를 구성하고 통신을 허용한 예시다.</desc>
<defs><marker id="network-across-az-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="network-across-az-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="network-across-az-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="network-across-az-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="670" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">리전·AZ와 하나의 가상 네트워크</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">AZ는 호스트의 배치를, 네트워크는 VM의 연결을 정한다.</text><rect x="24" y="108" width="712" height="502" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="147" font-size="22" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="660">선택한 리전 · RegionOne</text><rect x="48" y="174" width="316" height="236" rx="14" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="68" y="208" font-size="21" font-weight="650" fill="#6D4AFF" text-anchor="start" data-max-width="276">컴퓨트 AZ · compute-a</text><rect x="68" y="228" width="276" height="148" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="88" y="261" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="236">물리 호스트 A</text><path d="M 206,354 L 206,446" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#network-across-az-teal)" marker-end="url(#network-across-az-teal)"/><rect x="88" y="278" width="236" height="76" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="106" y="309" font-size="23" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="200">vm-01</text><text x="106" y="337" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="200">10.0.0.10</text><text x="225" y="432" font-size="18" font-weight="500" fill="#087F6F" text-anchor="start" data-max-width="110">포트 1</text><rect x="396" y="174" width="316" height="236" rx="14" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="416" y="208" font-size="21" font-weight="650" fill="#6D4AFF" text-anchor="start" data-max-width="276">컴퓨트 AZ · compute-b</text><rect x="416" y="228" width="276" height="148" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="436" y="261" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="236">물리 호스트 B</text><path d="M 554,354 L 554,446" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#network-across-az-teal)" marker-end="url(#network-across-az-teal)"/><rect x="436" y="278" width="236" height="76" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="454" y="309" font-size="23" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="200">vm-02</text><text x="454" y="337" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="200">10.0.0.20</text><text x="573" y="432" font-size="18" font-weight="500" fill="#087F6F" text-anchor="start" data-max-width="110">포트 2</text><rect x="48" y="446" width="664" height="118" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="487" font-size="25" font-weight="700" fill="#087F6F" text-anchor="middle" data-max-width="620">가상 네트워크 net-app</text><text x="380" y="528" font-size="23" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="620">서브넷 10.0.0.0/24</text><text x="32" y="647" font-size="18" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">전제: 두 호스트의 네트워크 구성과 보안 규칙이 연결을 허용한다.</text>
</svg>
