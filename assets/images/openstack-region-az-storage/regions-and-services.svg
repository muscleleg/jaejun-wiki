<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="regions-and-services-title regions-and-services-desc">
<title id="regions-and-services-title">리전에 따라 요청할 서비스가 달라진다</title>
<desc id="regions-and-services-desc">일반적인 다중 리전 구성에서 RegionOne과 RegionTwo 각각에 Nova, Neutron, Cinder 서비스가 있다. 선택한 리전의 서비스 엔드포인트로 요청하며 리전마다 별도의 자원을 관리한다. 인증과 웹 콘솔은 공유할 수 있다.</desc>
<defs><marker id="regions-and-services-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="regions-and-services-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="regions-and-services-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="regions-and-services-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="446" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">리전에 따라 요청할 서비스가 달라진다</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">일반적인 다중 리전 구성: 리전마다 자원 관리 서비스를 운영한다.</text><rect x="32" y="124" width="336" height="266" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="52" y="165" font-size="25" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="296">RegionOne</text><rect x="52" y="192" width="296" height="50" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="68" y="225" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Nova · VM 관리</text><rect x="52" y="254" width="296" height="50" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="68" y="287" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Neutron · 네트워크 관리</text><rect x="52" y="316" width="296" height="50" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="68" y="349" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Cinder · 볼륨 관리</text><rect x="392" y="124" width="336" height="266" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="412" y="165" font-size="25" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="296">RegionTwo</text><rect x="412" y="192" width="296" height="50" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="428" y="225" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Nova · VM 관리</text><rect x="412" y="254" width="296" height="50" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="428" y="287" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Neutron · 네트워크 관리</text><rect x="412" y="316" width="296" height="50" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="428" y="349" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="264">Cinder · 볼륨 관리</text><text x="32" y="425" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">각 리전에 등록된 서비스 주소로 요청하고, 그 리전의 자원을 관리한다.</text>
</svg>
