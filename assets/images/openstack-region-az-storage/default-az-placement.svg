<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="default-az-placement-title default-az-placement-desc">
<title id="default-az-placement-title">AZ를 생략한 VM과 볼륨의 배치</title>
<desc id="default-az-placement-desc">Nova의 기본 배치 AZ는 미설정, Cinder의 기본 AZ는 storage-b인 예시다. 사용자가 VM과 볼륨의 AZ를 모두 생략해도 Nova는 여러 컴퓨트 AZ의 후보에서 compute-a의 호스트 A를 선택할 수 있고 Cinder는 storage-b의 백엔드에 볼륨을 만든다. 연결에는 교차 AZ 허용 정책과 저장소 접근 조건이 필요하다.</desc>
<defs><marker id="default-az-placement-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="default-az-placement-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="default-az-placement-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="default-az-placement-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="690" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">AZ를 생략한 VM과 볼륨의 배치</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">예시 설정: Nova 기본 배치 AZ 없음 · Cinder 기본 AZ storage-b</text><rect x="32" y="122" width="696" height="74" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380" y="168" font-size="25" font-weight="700" fill="#6D4AFF" text-anchor="middle" data-max-width="648">사용자 요청: VM·볼륨 모두 AZ 생략</text><path d="M 200,196 L 200,240" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#default-az-placement-purple)"/><rect x="32" y="240" width="336" height="94" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="56" y="277" font-size="25" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="288">Nova</text><text x="56" y="312" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="288">여러 컴퓨트 AZ의 후보 확인</text><path d="M 200,334 L 200,382" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#default-az-placement-purple)"/><path d="M 560,196 L 560,240" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#default-az-placement-purple)"/><rect x="392" y="240" width="336" height="94" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="416" y="277" font-size="25" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="288">Cinder</text><text x="416" y="312" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="288">기본 AZ storage-b에서 선택</text><path d="M 560,334 L 560,382" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#default-az-placement-purple)"/><rect x="32" y="382" width="336" height="140" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="56" y="422" font-size="21" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="288">compute-a · 호스트 A</text><rect x="56" y="450" width="288" height="48" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="200" y="482" font-size="23" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="256">vm-01</text><rect x="392" y="382" width="336" height="140" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="416" y="422" font-size="21" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="288">storage-b · 선택된 백엔드</text><rect x="416" y="450" width="288" height="48" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="560" y="482" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="256">data-01</text><path d="M 344,474 L 416,474" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#default-az-placement-teal)" marker-end="url(#default-az-placement-teal)"/><text x="380" y="448" font-size="18" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="56">연결</text><rect x="32" y="562" width="696" height="86" rx="14" fill="#EAF7F3" stroke="none" stroke-width="1.5"/><text x="52" y="596" font-size="21" font-weight="650" fill="#087F6F" text-anchor="start" data-max-width="656">연결 조건: 교차 AZ 허용 + 저장소 접근 경로·인증</text><text x="52" y="628" font-size="19" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">AZ를 모두 생략해도 두 자원의 AZ가 같아지는 것은 아니다.</text>
</svg>
