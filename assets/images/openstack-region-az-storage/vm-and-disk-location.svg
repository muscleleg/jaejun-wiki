<svg xmlns="http://www.w3.org/2000/svg" width="760" height="402" viewBox="0 0 760 402" role="img" aria-labelledby="vm-and-disk-location-title vm-and-disk-location-desc">
<title id="vm-and-disk-location-title">VM 실행 위치와 디스크 저장 위치</title>
<desc id="vm-and-disk-location-desc">물리 호스트 A에서 vm-01이 A의 CPU와 RAM을 사용해 실행한다. 별도의 스토리지 서버 S에는 data-01이라는 100 GiB 디스크 공간이 있다. 호스트 A가 그 공간을 VM에 디스크로 연결하는 예시다.</desc>
<defs><marker id="vm-and-disk-location-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="vm-and-disk-location-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="vm-and-disk-location-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="vm-and-disk-location-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="402" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">VM 실행 위치와 디스크 저장 위치</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">CPU·RAM을 쓰는 서버와 데이터를 보관하는 서버는 달라도 된다.</text><rect x="32" y="124" width="310" height="200" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="418" y="124" width="310" height="200" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="52" y="165" font-size="23" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="270">물리 호스트 A</text><text x="438" y="165" font-size="23" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="270">스토리지 서버 S</text><rect x="52" y="185" width="270" height="98" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="187" y="225" font-size="26" font-weight="700" fill="#2563EB" text-anchor="middle" data-max-width="238">vm-01</text><text x="187" y="258" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="238">A의 CPU·RAM 사용</text><rect x="438" y="185" width="270" height="98" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="573" y="225" font-size="26" font-weight="700" fill="#087F6F" text-anchor="middle" data-max-width="238">data-01</text><text x="573" y="258" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="238">100 GiB 저장 공간</text><path d="M 322,240 L 438,240" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#vm-and-disk-location-teal)" marker-end="url(#vm-and-disk-location-teal)"/><text x="380" y="222" font-size="20" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="86">연결</text><text x="32" y="374" font-size="20" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">VM에는 디스크가 보이고, 실제 데이터는 S에 저장된다.</text>
</svg>
