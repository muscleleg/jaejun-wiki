<svg xmlns="http://www.w3.org/2000/svg" width="760" height="678" viewBox="0 0 760 678" role="img" aria-labelledby="separated-layout-title separated-layout-desc">
<title id="separated-layout-title">컴퓨트·스토리지 분리형 배치</title>
<desc id="separated-layout-desc">관리 서버 M에는 Nova와 Cinder의 관리 기능과 Ceph 연동 cinder-volume이 있다. 물리 서버 A, B, C는 nova-compute로 VM을 실행한다. 별도의 물리 스토리지 서버 S1, S2, S3에는 Ceph OSD와 데이터 SSD가 있다. 컴퓨트와 스토리지는 스토리지 네트워크로 연결된다.</desc>
<defs><marker id="separated-layout-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="separated-layout-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="separated-layout-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="separated-layout-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="678" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">컴퓨트·스토리지 분리형 배치</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">VM 실행 장비와 데이터를 저장하는 장비를 따로 둔다.</text><rect x="32" y="112" width="696" height="86" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="52" y="146" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="656">관리 서버 M</text><text x="52" y="178" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">Nova·Cinder 관리 기능 / Ceph 연동 cinder-volume</text><rect x="32" y="240" width="216" height="124" rx="14" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="140" y="276" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 A</text><text x="140" y="311" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">nova-compute</text><text x="140" y="342" font-size="21" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="184">VM 실행</text><path d="M 140,364 L 140,388" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><path d="M 140,444 L 140,480" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><rect x="32" y="480" width="216" height="124" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="140" y="516" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 S1</text><text x="140" y="551" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">Ceph OSD</text><text x="140" y="582" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="184">데이터용 SSD</text><rect x="272" y="240" width="216" height="124" rx="14" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="380" y="276" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 B</text><text x="380" y="311" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">nova-compute</text><text x="380" y="342" font-size="21" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="184">VM 실행</text><path d="M 380,364 L 380,388" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><path d="M 380,444 L 380,480" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><rect x="272" y="480" width="216" height="124" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="516" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 S2</text><text x="380" y="551" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">Ceph OSD</text><text x="380" y="582" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="184">데이터용 SSD</text><rect x="512" y="240" width="216" height="124" rx="14" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="620" y="276" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 C</text><text x="620" y="311" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">nova-compute</text><text x="620" y="342" font-size="21" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="184">VM 실행</text><path d="M 620,364 L 620,388" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><path d="M 620,444 L 620,480" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#separated-layout-teal)" marker-end="url(#separated-layout-teal)"/><rect x="512" y="480" width="216" height="124" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="620" y="516" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 S3</text><text x="620" y="551" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="184">Ceph OSD</text><text x="620" y="582" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="184">데이터용 SSD</text><rect x="32" y="388" width="696" height="56" rx="10" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="424" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="656">공유 스토리지 네트워크</text><text x="32" y="651" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">Ceph MON·MGR은 별도 계획으로 분산 배치하는 예시다.</text>
