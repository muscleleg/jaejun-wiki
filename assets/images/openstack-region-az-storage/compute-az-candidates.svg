<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" viewBox="0 0 760 584" role="img" aria-labelledby="compute-az-candidates-title compute-az-candidates-desc">
<title id="compute-az-candidates-title">컴퓨트 AZ는 호스트 후보를 제한한다</title>
<desc id="compute-az-candidates-desc">RegionOne 안의 compute-a에 호스트 A, compute-b에 호스트 B가 있다. 사용자가 compute-a를 선택하면 A가 VM 생성 후보이고 B는 이 요청의 AZ 조건에서 제외된다. A도 CPU RAM 등 나머지 조건을 만족해야 한다.</desc>
<defs><marker id="compute-az-candidates-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="compute-az-candidates-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="compute-az-candidates-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="compute-az-candidates-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="584" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">컴퓨트 AZ는 호스트 후보를 제한한다</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">예시: 사용자가 compute-a를 선택한 경우</text><rect x="32" y="124" width="696" height="390" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="164" font-size="24" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="648">RegionOne</text><rect x="56" y="192" width="312" height="260" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="76" y="231" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="272">compute-a · 선택</text><rect x="76" y="252" width="272" height="100" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="212" y="292" font-size="25" font-weight="700" fill="#2563EB" text-anchor="middle" data-max-width="240">호스트 A</text><text x="212" y="327" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="240">VM 생성 후보</text><rect x="76" y="382" width="272" height="44" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="212.0" y="411.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="252">요청 사양을 추가 확인</text><rect x="392" y="192" width="312" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/><text x="412" y="231" font-size="23" font-weight="700" fill="#53647C" text-anchor="start" data-max-width="272">compute-b</text><rect x="412" y="252" width="272" height="100" rx="10" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="548" y="292" font-size="25" font-weight="700" fill="#53647C" text-anchor="middle" data-max-width="240">호스트 B</text><text x="548" y="327" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="240">이 요청에서는 제외</text><rect x="412" y="382" width="272" height="44" rx="9" fill="#F6F8FC" stroke="none" stroke-width="1.5"/><text x="548" y="411" font-size="20" font-weight="650" fill="#53647C" text-anchor="middle" data-max-width="240">AZ 조건이 다름</text><text x="32" y="555" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">AZ 선택 이후에도 CPU·RAM 등 나머지 생성 조건을 만족해야 한다.</text>
</svg>
