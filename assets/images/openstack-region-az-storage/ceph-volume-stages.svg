<svg xmlns="http://www.w3.org/2000/svg" width="760" height="910" viewBox="0 0 760 910" role="img" aria-labelledby="ceph-volume-stages-title ceph-volume-stages-desc">
<title id="ceph-volume-stages-title">Ceph 디스크 준비와 볼륨 생성의 구분</title>
<desc id="ceph-volume-stages-desc">첫 단계는 설치 증설 시 S1 S2 S3의 SSD를 각각 OSD가 사용할 공간으로 준비하는 것이다. 이후 사용자 요청으로 cinder-volume이 Ceph에 data-01 100 GiB RBD 가상 디스크를 만든다. 데이터가 기록될 때 조각을 배치 복제 규칙에 따라 OSD들이 저장한다. 사용자 볼륨마다 VM 호스트에 같은 크기의 LVM 논리 볼륨을 만드는 구조는 아니다.</desc>
<defs><marker id="ceph-volume-stages-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="ceph-volume-stages-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="ceph-volume-stages-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="ceph-volume-stages-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="910" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">Ceph 디스크 준비와 볼륨 생성의 구분</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">설치·증설, 사용자 볼륨 생성, 데이터 저장은 서로 다른 작업이다.</text><rect x="32" y="122" width="696" height="212" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="162" font-size="24" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="648">1. 설치·증설 시 디스크 준비</text><rect x="56" y="184" width="200" height="126" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="156" y="221" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">서버 S1</text><text x="156" y="267" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="168">SSD → OSD 공간</text><rect x="280" y="184" width="200" height="126" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="221" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">서버 S2</text><text x="380" y="267" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="168">SSD → OSD 공간</text><rect x="504" y="184" width="200" height="126" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="604" y="221" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">서버 S3</text><text x="604" y="267" font-size="20" font-weight="500" fill="#087F6F" text-anchor="middle" data-max-width="168">SSD → OSD 공간</text><path d="M 380,334 L 380,386" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-volume-stages-purple)"/><rect x="32" y="386" width="696" height="164" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="56" y="426" font-size="24" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="648">2. 사용자 볼륨 생성</text><rect x="56" y="450" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="176" y="494" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="208">cinder-volume</text><rect x="416" y="450" width="288" height="70" rx="10" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="560" y="480" font-size="22" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">data-01 · 100 GiB</text><text x="560" y="508" font-size="19" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">RBD 가상 디스크</text><path d="M 296,486 L 416,486" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-volume-stages-purple)"/><text x="356" y="469" font-size="18" font-weight="500" fill="#6D4AFF" text-anchor="middle" data-max-width="100">RBD 생성</text><path d="M 380,550 L 380,602" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-volume-stages-teal)"/><rect x="32" y="602" width="696" height="244" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="56" y="643" font-size="24" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="648">3. 데이터를 기록할 때 저장·복제</text><rect x="56" y="670" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="156" y="708" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="168">S1의 OSD</text><text x="156" y="748" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">담당 데이터 조각</text><text x="156" y="779" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">배치·복제 규칙 적용</text><rect x="280" y="670" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="708" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="168">S2의 OSD</text><text x="380" y="748" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">담당 데이터 조각</text><text x="380" y="779" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">배치·복제 규칙 적용</text><rect x="504" y="670" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="604" y="708" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="168">S3의 OSD</text><text x="604" y="748" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">담당 데이터 조각</text><text x="604" y="779" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="168">배치·복제 규칙 적용</text><text x="32" y="883" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">볼륨 생성과 그 용량 전체에 실제 데이터를 쓰는 것은 구분한다.</text>
</svg>
