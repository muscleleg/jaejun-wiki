<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="nova-cinder-placement-title nova-cinder-placement-desc">
<title id="nova-cinder-placement-title">VM 생성과 볼륨 생성의 담당</title>
<desc id="nova-cinder-placement-desc">관리 서버 M의 Nova API와 스케줄러는 컴퓨트 호스트 A 또는 B 중 하나를 선택하고 해당 nova-compute에 VM 생성 작업을 전달한다. Cinder API와 스케줄러는 선택된 백엔드를 담당하는 서버 S의 cinder-volume에 볼륨 생성 작업을 전달한다. 두 화살표는 관리 작업 경로다.</desc>
<defs><marker id="nova-cinder-placement-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="nova-cinder-placement-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="nova-cinder-placement-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="nova-cinder-placement-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="690" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">VM 생성과 볼륨 생성의 담당</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">각 스케줄러가 서로 다른 자원을 선택한다.</text><rect x="32" y="108" width="696" height="190" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="145" font-size="22" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="650">물리 관리 서버 M</text><rect x="56" y="164" width="312" height="108" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="76" y="195" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="272">Nova</text><text x="76" y="225" font-size="21" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="272">nova-api</text><text x="76" y="254" font-size="21" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="272">nova-scheduler</text><rect x="392" y="164" width="312" height="108" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="412" y="195" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="272">Cinder</text><text x="412" y="225" font-size="21" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="272">cinder-api</text><text x="412" y="254" font-size="21" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="272">cinder-scheduler</text><path d="M 212,272 L 212,358" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nova-cinder-placement-purple)"/><rect x="125" y="310" width="174" height="32" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="212" y="333" font-size="19" font-weight="500" fill="#6D4AFF" text-anchor="middle" data-max-width="164">VM 생성 지시</text><path d="M 548,272 L 548,358" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nova-cinder-placement-purple)"/><rect x="461" y="310" width="174" height="32" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="548" y="333" font-size="19" font-weight="500" fill="#6D4AFF" text-anchor="middle" data-max-width="164">볼륨 생성 지시</text><rect x="32" y="358" width="336" height="230" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="56" y="396" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="288">컴퓨트 호스트 A·B</text><rect x="56" y="418" width="288" height="70" rx="10" fill="#EDF4FF" stroke="none" stroke-width="1.5"/><text x="72" y="447" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="256">A · nova-compute</text><text x="72" y="474" font-size="20" font-weight="500" fill="#2563EB" text-anchor="start" data-max-width="256">VM 실행</text><rect x="56" y="500" width="288" height="70" rx="10" fill="#EDF4FF" stroke="none" stroke-width="1.5"/><text x="72" y="529" font-size="21" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="256">B · nova-compute</text><text x="72" y="556" font-size="20" font-weight="500" fill="#2563EB" text-anchor="start" data-max-width="256">VM 실행</text><rect x="392" y="358" width="336" height="230" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="416" y="396" font-size="22" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="288">스토리지 서버 S</text><rect x="416" y="418" width="288" height="62" rx="10" fill="#EAF7F3" stroke="none" stroke-width="1.5"/><text x="560" y="458" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">cinder-volume</text><path d="M 560,480 L 560,510" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nova-cinder-placement-teal)"/><rect x="416" y="510" width="288" height="58" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="560" y="547" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">저장소 백엔드</text><text x="32" y="633" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">보라색 화살표: 생성 작업을 전달하는 관리 경로</text><text x="32" y="664" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">Nova는 후보 A·B 중 한 호스트를 선택한다.</text>
</svg>
