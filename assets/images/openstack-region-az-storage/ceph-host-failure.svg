<svg xmlns="http://www.w3.org/2000/svg" width="760" height="766" viewBox="0 0 760 766" role="img" aria-labelledby="ceph-host-failure-title ceph-host-failure-desc">
<title id="ceph-host-failure-title">호스트 A 장애 이후의 VM과 디스크</title>
<desc id="ceph-host-failure-desc">HCI 호스트 A가 중단되어 A의 VM과 OSD를 사용할 수 없다. 각 데이터 조각의 사본이 B와 C에 하나씩 남아 조각당 총 두 사본을 보관한다. 조각당 size 3, min_size 2라는 가정에서 MON 정족수와 나머지 서비스 조건이 유지되면 남은 호스트의 디스크 입출력을 계속할 수 있다. A의 VM 실행은 별도로 복구해야 한다.</desc>
<defs><marker id="ceph-host-failure-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF" /></marker><marker id="ceph-host-failure-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB" /></marker><marker id="ceph-host-failure-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F" /></marker><marker id="ceph-host-failure-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53" /></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="766" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">호스트 A 장애 이후의 VM과 디스크</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">가정: 조각당 size=3 · min_size=2 · 관리·접속 조건 유지</text><rect x="32" y="132" width="216" height="316" rx="14" fill="#FFFFFF" stroke="#C53B53" stroke-width="1.5" stroke-dasharray="7 5" /><text x="140" y="172" font-size="22" font-weight="700" fill="#C53B53" text-anchor="middle" data-max-width="184">호스트 A · 중단</text><rect x="48" y="196" width="184" height="80" rx="10" fill="#FFF0F2" stroke="none" stroke-width="1.5" /><text x="140" y="230" font-size="23" font-weight="650" fill="#C53B53" text-anchor="middle" data-max-width="160">VM 중단</text><text x="140" y="258" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">실행 복구 필요</text><rect x="48" y="300" width="184" height="80" rx="10" fill="#FFF0F2" stroke="none" stroke-width="1.5" /><text x="140" y="334" font-size="23" font-weight="650" fill="#C53B53" text-anchor="middle" data-max-width="160">OSD 중단</text><text x="140" y="362" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">복제본 접근 불가</text><text x="140" y="419" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON 중단</text><rect x="272" y="132" width="216" height="316" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5" /><text x="380" y="172" font-size="22" font-weight="700" fill="#087F6F" text-anchor="middle" data-max-width="184">호스트 B · 동작</text><rect x="288" y="196" width="184" height="80" rx="10" fill="#EAF7F3" stroke="none" stroke-width="1.5" /><text x="380" y="230" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">VM 동작</text><text x="380" y="258" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">조건 충족 시 계속</text><rect x="288" y="300" width="184" height="80" rx="10" fill="#EAF7F3" stroke="none" stroke-width="1.5" /><text x="380" y="334" font-size="21" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">조각당 사본 1개</text><text x="380" y="362" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">접근 가능</text><text x="380" y="419" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON 동작</text><rect x="512" y="132" width="216" height="316" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5" /><text x="620" y="172" font-size="22" font-weight="700" fill="#087F6F" text-anchor="middle" data-max-width="184">호스트 C · 동작</text><rect x="528" y="196" width="184" height="80" rx="10" fill="#EAF7F3" stroke="none" stroke-width="1.5" /><text x="620" y="230" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">VM 동작</text><text x="620" y="258" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">조건 충족 시 계속</text><rect x="528" y="300" width="184" height="80" rx="10" fill="#EAF7F3" stroke="none" stroke-width="1.5" /><text x="620" y="334" font-size="21" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">조각당 사본 1개</text><text x="620" y="362" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">접근 가능</text><text x="620" y="419" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON 동작</text><rect x="32" y="484" width="696" height="100" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5" /><text x="52" y="525" font-size="25" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="656">조각당 남은 사본 2개 ≥ 최소 조건 2개</text><text x="52" y="560" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">나머지 클러스터·접속 조건도 정상이면 입출력 가능</text><rect x="32" y="612" width="696" height="80" rx="14" fill="#FFF0F2" stroke="none" stroke-width="1.5" /><text x="52" y="645" font-size="23" font-weight="700" fill="#C53B53" text-anchor="start" data-max-width="656">A의 VM 실행은 별도 복구가 필요</text><text x="52" y="675" font-size="18" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">Ceph는 디스크 데이터를 보존하며 VM 메모리 상태를 옮기지 않는다.</text><text x="32" y="735" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">조각당 세 사본 복원에는 A 복구 또는 다른 적격 호스트가 필요하다.</text>
</svg>