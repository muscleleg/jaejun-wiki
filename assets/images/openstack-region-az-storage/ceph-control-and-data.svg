<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1008" viewBox="0 0 760 1008" role="img" aria-labelledby="ceph-control-and-data-title ceph-control-and-data-desc">
<title id="ceph-control-and-data-title">Ceph 볼륨 생성과 한 조각의 쓰기</title>
<desc id="ceph-control-and-data-desc">관리 서버 M의 cinder-volume이 Ceph 풀에 data-01 RBD 볼륨을 만든다. 연결 후 호스트 A의 QEMU와 librbd는 데이터 조각 X 쓰기를 S1의 주 담당 OSD에 요청한다. S1의 OSD가 S2와 S3의 OSD에 복제해 조각 X의 사본을 총 세 개 보관한다. 실선은 클라이언트 쓰기, 점선은 OSD 사이 복제다. 다른 조각의 주 담당 OSD는 다를 수 있으며 읽기와 완료 응답은 생략했다.</desc>
<defs><marker id="ceph-control-and-data-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="ceph-control-and-data-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="ceph-control-and-data-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="ceph-control-and-data-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="1008" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">Ceph 볼륨 생성과 한 조각의 쓰기</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">생성 관리 작업과 데이터 조각 X 하나의 쓰기를 구분한다.</text><text x="32" y="119" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="696">볼륨 생성 작업</text><rect x="32" y="140" width="280" height="90" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="172" y="176" font-size="22" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="248">관리 서버 M</text><text x="172" y="208" font-size="23" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="248">cinder-volume</text><rect x="408" y="140" width="320" height="90" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="568" y="176" font-size="22" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="288">Ceph 풀의 data-01</text><text x="568" y="208" font-size="22" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="288">RBD 가상 디스크</text><path d="M 312,190 L 408,190" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-purple)"/><text x="360" y="171" font-size="18" font-weight="500" fill="#6D4AFF" text-anchor="middle" data-max-width="76">생성</text><path d="M 32,264 L 728,264" fill="none" stroke="#6D4AFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="32" y="303" font-size="23" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="696">연결 후: 데이터 조각 X 하나를 쓰는 예</text><rect x="32" y="330" width="696" height="92" rx="14" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="380" y="368" font-size="24" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="648">호스트 A · vm-01 → QEMU·librbd</text><text x="380" y="400" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="648">Ceph 클라이언트</text><path d="M 380,422 L 380,494" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-teal)"/><text x="400" y="466" font-size="21" font-weight="650" fill="#087F6F" text-anchor="start" data-max-width="300">1. 쓰기 요청</text><rect x="192" y="494" width="376" height="120" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="532" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="344">서버 S1 · 주 담당 OSD</text><text x="380" y="568" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="344">X 사본 저장</text><text x="380" y="598" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="344">S1의 SSD</text><path d="M 380,614 L 380,650" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M 380,650 L 192,650 L 192,714" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-teal)" stroke-dasharray="7 5"/><path d="M 380,650 L 568,650 L 568,714" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-teal)" stroke-dasharray="7 5"/><text x="380" y="690" font-size="21" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="300">2. OSD 사이 복제</text><rect x="32" y="714" width="320" height="124" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="192" y="752" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="288">서버 S2 · OSD</text><text x="192" y="788" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="288">X 사본 저장</text><text x="192" y="820" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="288">S2의 SSD</text><rect x="408" y="714" width="320" height="124" rx="14" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="568" y="752" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="288">서버 S3 · OSD</text><text x="568" y="788" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="288">X 사본 저장</text><text x="568" y="820" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="288">S3의 SSD</text><rect x="32" y="860" width="696" height="58" rx="9" fill="#F6F8FC" stroke="none" stroke-width="1.5"/><path d="M 48,889 L 98,889" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-teal)"/><text x="112" y="896" font-size="19" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="220">클라이언트 쓰기</text><path d="M 388,889 L 438,889" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ceph-control-and-data-teal)" stroke-dasharray="7 5"/><text x="452" y="896" font-size="19" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="260">OSD 사이 복제</text><text x="32" y="951" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">다른 조각은 다른 OSD가 주 담당일 수 있다.</text><text x="32" y="982" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">읽기 경로와 쓰기 완료 응답은 생략했다.</text>
</svg>
