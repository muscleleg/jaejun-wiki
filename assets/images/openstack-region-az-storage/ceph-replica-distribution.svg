<svg xmlns="http://www.w3.org/2000/svg" width="760" height="868" viewBox="0 0 760 868" role="img" aria-labelledby="ceph-replica-distribution-title ceph-replica-distribution-desc">
<title id="ceph-replica-distribution-title">호스트 수와 복제본 수는 별개다</title>
<desc id="ceph-replica-distribution-desc">상단은 호스트 A B C 세 대에 조각 X와 Y를 각각 하나씩 저장해 각 조각의 사본이 총 세 개다. 하단은 여섯 호스트 중 A B C에 X, D E F에 Y를 저장한다. 두 구성 모두 조각당 복제본 수는 세 개다. 예시 배치이며 실제 Ceph 배치 결과를 뜻하지 않는다.</desc>
<defs><marker id="ceph-replica-distribution-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="ceph-replica-distribution-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="ceph-replica-distribution-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="ceph-replica-distribution-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="868" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">호스트 수와 복제본 수는 별개다</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">호스트 수를 늘려도 조각당 복제본을 몇 개 둘지는 별도로 정한다.</text><rect x="32" y="112" width="696" height="260" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="150" font-size="24" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="648">호스트 3대 · 조각당 복제본 3개</text><rect x="56" y="178" width="200" height="156" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="156" y="212" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 A</text><rect x="72" y="234" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="156.0" y="261.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="72" y="282" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="156.0" y="309.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><rect x="280" y="178" width="200" height="156" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="212" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 B</text><rect x="296" y="234" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="380.0" y="261.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="296" y="282" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380.0" y="309.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><rect x="504" y="178" width="200" height="156" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="604" y="212" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 C</text><rect x="520" y="234" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="604.0" y="261.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="520" y="282" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="604.0" y="309.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><rect x="32" y="402" width="696" height="372" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="442" font-size="24" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="648">호스트 6대 · 조각당 복제본 3개</text><rect x="56" y="466" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="156" y="501" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 A</text><rect x="72" y="520" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="156.0" y="547.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="280" y="466" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="501" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 B</text><rect x="296" y="520" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="380.0" y="547.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="504" y="466" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="604" y="501" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 C</text><rect x="520" y="520" width="168" height="40" rx="9" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="604.0" y="547.0" font-size="20" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="148">X 한 개</text><rect x="56" y="604" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="156" y="639" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 D</text><rect x="72" y="658" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="156.0" y="685.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><rect x="280" y="604" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="639" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 E</text><rect x="296" y="658" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380.0" y="685.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><rect x="504" y="604" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="604" y="639" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="168">호스트 F</text><rect x="520" y="658" width="168" height="40" rx="9" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="604.0" y="685.0" font-size="20" font-weight="650" fill="#6D4AFF" text-anchor="middle" data-max-width="148">Y 한 개</text><text x="32" y="813" font-size="20" font-weight="650" fill="#19283D" text-anchor="start" data-max-width="696">두 구성 모두 X의 사본 3개, Y의 사본 3개를 보관한다.</text><text x="32" y="846" font-size="18" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">배치 원리를 보여주는 예시이며 실제 배치 결과는 아니다.</text>
</svg>
