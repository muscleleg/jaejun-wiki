<svg xmlns="http://www.w3.org/2000/svg" width="760" height="738" viewBox="0 0 760 738" role="img" aria-labelledby="hci-layout-title hci-layout-desc">
<title id="hci-layout-title">HCI: 같은 물리 서버에서 연산과 저장</title>
<desc id="hci-layout-desc">관리 서버 M에는 Nova와 Cinder의 API, 스케줄러와 Ceph 연동 cinder-volume이 있다. 각 물리 서버 A, B, C에는 nova-compute와 VM, Ceph OSD와 자체 SSD가 함께 있다. A와 B에는 MON과 MGR, C에는 MON이 있다. OSD들은 네트워크로 연결돼 하나의 Ceph 저장소를 운영한다. 각 호스트의 SSD가 그 호스트 VM 전용인 것은 아니다.</desc>
<defs><marker id="hci-layout-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="hci-layout-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="hci-layout-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="hci-layout-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="738" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">HCI: 같은 물리 서버에서 연산과 저장</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">각 서버가 VM을 실행하면서 공동 저장소에도 디스크를 제공한다.</text><rect x="32" y="112" width="696" height="86" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="52" y="146" font-size="23" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="656">관리 서버 M</text><text x="52" y="178" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">Nova·Cinder API·스케줄러 / cinder-volume</text><rect x="32" y="240" width="216" height="322" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="140" y="278" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 A</text><rect x="48" y="300" width="184" height="90" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="140" y="334" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">nova-compute</text><text x="140" y="367" font-size="22" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="160">VM 실행</text><rect x="48" y="414" width="184" height="90" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="140" y="448" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">Ceph OSD</text><text x="140" y="481" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">A의 SSD</text><text x="140" y="540" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON · MGR</text><path d="M 140,562 L 140,606" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#hci-layout-teal)" marker-end="url(#hci-layout-teal)"/><rect x="272" y="240" width="216" height="322" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="278" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 B</text><rect x="288" y="300" width="184" height="90" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="380" y="334" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">nova-compute</text><text x="380" y="367" font-size="22" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="160">VM 실행</text><rect x="288" y="414" width="184" height="90" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="448" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">Ceph OSD</text><text x="380" y="481" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">B의 SSD</text><text x="380" y="540" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON · MGR</text><path d="M 380,562 L 380,606" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#hci-layout-teal)" marker-end="url(#hci-layout-teal)"/><rect x="512" y="240" width="216" height="322" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="620" y="278" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="184">물리 서버 C</text><rect x="528" y="300" width="184" height="90" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="620" y="334" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">nova-compute</text><text x="620" y="367" font-size="22" font-weight="650" fill="#2563EB" text-anchor="middle" data-max-width="160">VM 실행</text><rect x="528" y="414" width="184" height="90" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="620" y="448" font-size="23" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="160">Ceph OSD</text><text x="620" y="481" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="160">C의 SSD</text><text x="620" y="540" font-size="19" font-weight="500" fill="#53647C" text-anchor="middle" data-max-width="184">MON</text><path d="M 620,562 L 620,606" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#hci-layout-teal)" marker-end="url(#hci-layout-teal)"/><rect x="32" y="606" width="696" height="54" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="641" font-size="21" font-weight="650" fill="#087F6F" text-anchor="middle" data-max-width="656">서버 간 네트워크로 Ceph 데이터·복제본 교환</text><text x="32" y="708" font-size="20" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">A의 SSD에도 B·C의 VM이 사용하는 데이터가 있을 수 있다.</text>
</svg>
