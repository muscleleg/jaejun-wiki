<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="cinder-lvm-creation-title cinder-lvm-creation-desc">
<title id="cinder-lvm-creation-title">볼륨 생성 요청이 LVM 작업이 되기까지</title>
<desc id="cinder-lvm-creation-desc">사용자의 data-01 100 GiB 생성 요청을 관리 서버 M의 cinder-api가 접수하고 cinder-scheduler가 서버 S의 LVM 백엔드를 선택한다. 선택된 서버 S의 cinder-volume이 LVM 드라이버를 호출해 S의 볼륨 그룹에 논리 볼륨을 만든다. VM에 연결하는 작업은 별도로 수행한다.</desc>
<defs><marker id="cinder-lvm-creation-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="cinder-lvm-creation-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="cinder-lvm-creation-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="cinder-lvm-creation-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="850" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">볼륨 생성 요청이 LVM 작업이 되기까지</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">예시: data-01 · 100 GiB · 서버 S의 LVM 백엔드 선택</text><rect x="120" y="122" width="520" height="72" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="380" y="153" font-size="23" font-weight="700" fill="#19283D" text-anchor="middle" data-max-width="480">사용자 · 볼륨 생성 요청</text><text x="380" y="180" font-size="21" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="480">data-01 / 100 GiB</text><rect x="32" y="226" width="696" height="240" rx="14" fill="#F6F8FC" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="263" font-size="23" font-weight="700" fill="#19283D" text-anchor="start" data-max-width="280">관리 서버 M</text><rect x="100" y="284" width="560" height="62" rx="10" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380" y="324" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="520">cinder-api · 요청 접수</text><path d="M 380,194 L 380,284" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cinder-lvm-creation-purple)"/><path d="M 380,346 L 380,376" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cinder-lvm-creation-purple)"/><rect x="100" y="376" width="560" height="62" rx="10" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380" y="416" font-size="22" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="520">cinder-scheduler · S의 백엔드 선택</text><rect x="32" y="520" width="696" height="260" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="56" y="560" font-size="23" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="280">스토리지 서버 S</text><path d="M 380,438 L 380,580" fill="none" stroke="#6D4AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cinder-lvm-creation-purple)"/><rect x="280" y="480" width="200" height="32" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="380" y="503" font-size="19" font-weight="500" fill="#6D4AFF" text-anchor="middle" data-max-width="180">생성 작업 전달</text><rect x="100" y="580" width="560" height="62" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="620" font-size="22" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="520">cinder-volume · LVM 드라이버 호출</text><path d="M 380,642 L 380,680" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cinder-lvm-creation-teal)"/><rect x="100" y="680" width="560" height="70" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="380" y="723" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="520">S의 볼륨 그룹에 논리 볼륨 생성</text><text x="32" y="822" font-size="20" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">공간을 만든 뒤 VM에 연결하는 작업은 별도로 수행한다.</text>
</svg>
