<svg xmlns="http://www.w3.org/2000/svg" width="760" height="786" viewBox="0 0 760 786" role="img" aria-labelledby="iscsi-data-path-title iscsi-data-path-desc">
<title id="iscsi-data-path-title">볼륨 연결 후의 데이터 경로</title>
<desc id="iscsi-data-path-desc">호스트 A의 VM, QEMU와 호스트 디스크 처리 기능, iSCSI 클라이언트가 연결된다. iSCSI 클라이언트는 IP 네트워크로 서버 S의 iSCSI 서비스에 접속한다. S의 서비스는 data-01 LVM 논리 볼륨과 실제 SSD에 접근한다. 읽기 쓰기 데이터는 Cinder API나 cinder-volume을 매번 경유하지 않는다.</desc>
<defs><marker id="iscsi-data-path-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="iscsi-data-path-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="iscsi-data-path-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="iscsi-data-path-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="786" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">볼륨 연결 후의 데이터 경로</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">VM에는 가상 디스크가 보이고, 호스트가 저장소에 접속한다.</text><rect x="32" y="116" width="336" height="524" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="392" y="116" width="336" height="524" rx="14" fill="#FFFFFF" stroke="#087F6F" stroke-width="1.5"/><text x="56" y="155" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="288">물리 호스트 A</text><text x="416" y="155" font-size="22" font-weight="700" fill="#087F6F" text-anchor="start" data-max-width="288">스토리지 서버 S</text><rect x="56" y="182" width="288" height="78" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="200" y="215" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">vm-01</text><text x="200" y="243" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">게스트의 가상 디스크</text><rect x="56" y="300" width="288" height="78" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="200" y="333" font-size="20" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">QEMU·호스트 디스크 기능</text><text x="200" y="361" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">VM에 디스크 제공</text><rect x="56" y="420" width="288" height="88" rx="10" fill="#EDF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="200" y="453" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">iSCSI 클라이언트</text><text x="200" y="481" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">디스크 명령 전달</text><path d="M 200,260 L 200,300" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#iscsi-data-path-teal)" marker-end="url(#iscsi-data-path-teal)"/><path d="M 200,378 L 200,420" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#iscsi-data-path-teal)" marker-end="url(#iscsi-data-path-teal)"/><rect x="416" y="182" width="288" height="78" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="560" y="215" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">실제 SSD</text><text x="560" y="243" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">S의 데이터 저장 장치</text><rect x="416" y="300" width="288" height="78" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="560" y="333" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">LVM 논리 볼륨</text><text x="560" y="361" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">data-01 · 100 GiB</text><rect x="416" y="420" width="288" height="88" rx="10" fill="#EAF7F3" stroke="#087F6F" stroke-width="1.5"/><text x="560" y="453" font-size="23" font-weight="650" fill="#19283D" text-anchor="middle" data-max-width="256">iSCSI 서비스</text><text x="560" y="481" font-size="20" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="256">요청 수신</text><path d="M 560,260 L 560,300" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#iscsi-data-path-teal)" marker-end="url(#iscsi-data-path-teal)"/><path d="M 560,378 L 560,420" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#iscsi-data-path-teal)" marker-end="url(#iscsi-data-path-teal)"/><path d="M 344,464 L 416,464" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#iscsi-data-path-teal)" marker-end="url(#iscsi-data-path-teal)"/><text x="380" y="441" font-size="18" font-weight="700" fill="#087F6F" text-anchor="middle" data-max-width="52">IP</text><text x="56" y="552" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="288">저장소 접속 주체는 A</text><text x="56" y="585" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="288">VM 사설망과 분리 가능</text><text x="416" y="552" font-size="20" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="288">디스크 데이터는 S에 저장</text><rect x="32" y="668" width="696" height="84" rx="14" fill="#F2EEFF" stroke="none" stroke-width="1.5"/><text x="52" y="700" font-size="21" font-weight="700" fill="#6D4AFF" text-anchor="start" data-max-width="656">관리 작업 경로와 구분</text><text x="52" y="731" font-size="19" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="656">데이터는 cinder-api·cinder-volume을 매번 경유하지 않는다.</text>
</svg>
