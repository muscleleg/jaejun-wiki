<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-labelledby="routing-between-subnets-title routing-between-subnets-desc">
<title id="routing-between-subnets-title">라우팅은 서로 다른 서브넷을 연결한다</title>
<desc id="routing-between-subnets-desc">10.10.0.0/24 서브넷의 VM과 10.20.0.0/24 서브넷의 VM이 라우터를 통해 통신한다. 통신 경로가 있더라도 두 서브넷이 하나가 되거나 같은 서브넷에 소속되는 것은 아니다.</desc>
<defs><marker id="routing-between-subnets-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#6D4AFF"/></marker><marker id="routing-between-subnets-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2563EB"/></marker><marker id="routing-between-subnets-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#087F6F"/></marker><marker id="routing-between-subnets-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#C53B53"/></marker></defs>
<style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; } rect, path { vector-effect: non-scaling-stroke; }</style>
<rect x="0" y="0" width="760" height="426" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="32" y="46" font-size="30" font-weight="750" fill="#19283D" text-anchor="start" data-max-width="696">라우팅은 서로 다른 서브넷을 연결한다</text><text x="32" y="80" font-size="19" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">통신할 수 있어도 하나의 서브넷이 되는 것은 아니다.</text><rect x="32" y="158" width="236" height="180" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="52" y="194" font-size="23" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="196">서브넷 A</text><text x="52" y="226" font-size="22" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="196">10.10.0.0/24</text><rect x="52" y="250" width="196" height="62" rx="10" fill="#EDF4FF" stroke="none" stroke-width="1.5"/><text x="150" y="290" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle" data-max-width="164">VM</text><rect x="492" y="158" width="236" height="180" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="512" y="194" font-size="23" font-weight="700" fill="#2563EB" text-anchor="start" data-max-width="196">서브넷 B</text><text x="512" y="226" font-size="22" font-weight="500" fill="#19283D" text-anchor="start" data-max-width="196">10.20.0.0/24</text><rect x="512" y="250" width="196" height="62" rx="10" fill="#EDF4FF" stroke="none" stroke-width="1.5"/><text x="610" y="290" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle" data-max-width="164">VM</text><rect x="310" y="210" width="140" height="90" rx="14" fill="#F2EEFF" stroke="#6D4AFF" stroke-width="1.5"/><text x="380" y="250" font-size="25" font-weight="700" fill="#6D4AFF" text-anchor="middle" data-max-width="116">라우터</text><text x="380" y="280" font-size="18" font-weight="500" fill="#19283D" text-anchor="middle" data-max-width="116">패킷 전달</text><path d="M 248,281 L 310,281" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#routing-between-subnets-teal)" marker-end="url(#routing-between-subnets-teal)"/><path d="M 450,281 L 512,281" fill="none" stroke="#087F6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#routing-between-subnets-teal)" marker-end="url(#routing-between-subnets-teal)"/><text x="32" y="393" font-size="20" font-weight="500" fill="#53647C" text-anchor="start" data-max-width="696">같은 서브넷 연결과 서브넷 사이의 통신 경로를 구분한다.</text>
</svg>
