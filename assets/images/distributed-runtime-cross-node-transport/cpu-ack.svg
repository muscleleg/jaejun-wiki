<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">CPU TCP 전송과 application ACK</title><desc id="desc">A가 S바이트를 보내고 B가 전체 바이트를 수신하면 1바이트 완료 응답을 보낸다. 이 응답은 TCP 자체 ACK가 아닌 애플리케이션 응답이다. 속도는 S를 측정 시간으로 나눈다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="900" height="300" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">CPU 측정: payload 전송 + 작은 완료 응답</text><rect x="28" y="68" width="210" height="64" rx="12" fill="#eaf2fc" stroke="none"/><text x="133" y="107" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">A · CPU RAM</text><rect x="662" y="68" width="210" height="64" rx="12" fill="#eaf2fc" stroke="none"/><text x="767" y="107" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">B · CPU RAM</text><text x="450" y="109" font-size="21" fill="#087e83" text-anchor="middle" font-weight="400">S 바이트</text><path d="M248 129 L652 129" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="450" y="177" font-size="21" fill="#2563a6" text-anchor="middle" font-weight="400">완료 응답 1바이트</text><path d="M652 198 L248 198" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><text x="28" y="245" font-size="19" fill="#172b3a" text-anchor="start" font-weight="400">A가 완료 응답을 받을 때까지 측정 · 유효 속도 = S / 측정 시간</text><text x="28" y="277" font-size="18" fill="#526779" text-anchor="start" font-weight="400">application ACK이며 TCP 프로토콜 자체의 ACK 패킷과 다름</text></g></svg>
