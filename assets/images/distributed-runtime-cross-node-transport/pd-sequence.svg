<svg xmlns="http://www.w3.org/2000/svg" width="960" height="768" viewBox="0 0 960 768" role="img" aria-labelledby="title desc">
<title id="title">P/D pull 전체 흐름: HTTP 위치 정보와 NIXL 접근 정보의 구분</title><desc id="desc">조정 코드는 Prefill에 입력과 KV 제공 요청을 보낸다. Prefill은 KV 위치와 엔진 및 블록 정보를 반환한다. 조정 코드는 Decode에 원래 입력 및 생성 조건과 이 정보를 보낸다. Decode는 필요한 경우 Prefill에 메타데이터를 요청하고 접근 정보를 받는다. Decode가 NIXL READ를 시작하여 KV를 가져오고 수신 완료 후 생성 결과를 반환한다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker></defs>
<rect width="960" height="768" rx="16" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">위치 정보를 전달하는 HTTP와 실제 KV pull은 별개</text><rect x="25" y="66" width="235" height="70" rx="12" fill="#eaf2fc"/><text x="142.5" y="96" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">요청 조정 코드</text><text x="142.5" y="125" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">HTTP 요청 두 번</text><rect x="365" y="66" width="230" height="70" rx="12" fill="#eaf2fc"/><text x="480" y="96" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">A · Prefill</text><text x="480" y="125" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">KV 제공 측</text><rect x="705" y="66" width="230" height="70" rx="12" fill="#eaf2fc"/><text x="820" y="96" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">B · Decode</text><text x="820" y="125" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">KV 수신 측</text><path d="M142 143 V656 M480 143 V656 M820 143 V656" stroke="#cbd5df" stroke-width="2" stroke-dasharray="5 5"/><text x="311" y="170" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">① 입력 + KV 제공 요청</text><path d="M148 185 H474" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="311" y="229" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">② 위치·엔진·블록 정보</text><path d="M474 244 H148" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="481" y="291" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">③ 원래 입력·생성 조건 + ②의 정보</text><path d="M148 306 H814" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="650" y="351" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">④ 접근 메타데이터 요청</text><path d="M814 366 H486" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="650" y="410" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">⑤ 등록 메모리 접근 정보</text><path d="M486 425 H814" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="650" y="470" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">⑥ 필요한 KV READ 시작</text><path d="M814 485 H486" stroke="#2563a6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="650" y="529" font-size="19" fill="#087e83" text-anchor="middle" font-weight="400">⑦ 실제 KV 데이터</text><path d="M486 544 H814" stroke="#087e83" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="703" y="560" width="234" height="30" fill="#fff"/><text x="820" y="582" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="400">수신 완료 확인 → 생성</text><text x="481" y="616" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">⑧ 생성 결과 반환</text><path d="M814 631 H148" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><text x="28" y="693" font-size="18" fill="#526779" text-anchor="start" font-weight="400">④·⑤는 필요할 때 수행 · 연결 정보가 유효하면 재사용</text><text x="28" y="723" font-size="18" fill="#526779" text-anchor="start" font-weight="400">⑥은 논리적 읽기 · HTTP 요청이 아님 · ②의 응답 JSON은 raw rkey가 아님</text><text x="28" y="752" font-size="18" fill="#526779" text-anchor="start" font-weight="400">파랑: 요청·응답·제어 정보     초록: KV payload · 완료 통지 등 세부 제어는 생략</text></g></svg>
