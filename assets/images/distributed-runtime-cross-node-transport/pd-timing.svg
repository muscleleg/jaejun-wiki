<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="title desc">
<title id="title">P/D 전체 시간과 NIXL 전송 시간의 포함 관계</title><desc id="desc">전체 요청은 Prefill HTTP와 Decode HTTP를 포함한다. Decode 구간 안에 대기 연결, KV 수신, 생성 응답이 있다. NIXL 전송 시간은 KV 전송 작업의 범위로 Decode 시간에 다시 더하지 않는다. 너비는 실측 비율이 아니다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="960" height="356" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">NIXL 전송 시간은 Decode 구간 안에 포함된다</text><text x="28" y="104" font-size="20" fill="#172b3a" text-anchor="start" font-weight="400">전체 요청</text><rect x="210" y="68" width="235" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="327.5" y="105" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">Prefill HTTP</text><rect x="455" y="68" width="470" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="690" y="105" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">Decode HTTP</text><text x="28" y="190" font-size="20" fill="#172b3a" text-anchor="start" font-weight="400">Decode 내부</text><rect x="455" y="154" width="145" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="527.5" y="191" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">대기·연결</text><rect x="610" y="154" width="140" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="680" y="191" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">KV 수신</text><rect x="760" y="154" width="165" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="842.5" y="191" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">생성·응답</text><text x="28" y="278" font-size="20" fill="#172b3a" text-anchor="start" font-weight="400">NIXL 측정</text><rect x="610" y="243" width="140" height="54" rx="12" fill="#e4f4f1" stroke="none"/><text x="680" y="278" font-size="19" fill="#087e83" text-anchor="middle" font-weight="400">전송 작업</text><path d="M610 215 V240 M750 215 V240" stroke="#087e83" stroke-dasharray="4 4"/><text x="28" y="331" font-size="18" fill="#526779" text-anchor="start" font-weight="400">범위 관계를 설명하는 개념도 · 구간 폭은 실측 시간 비율이 아님</text></g></svg>
