<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">TCP 경로의 호스트 메모리 staging</title><desc id="desc">서버 A의 GPU에서 RAM과 NIC를 지나 네트워크로 보내고, 서버 B의 NIC와 RAM을 거쳐 GPU에 도착한다. 일반적인 staging 개념도다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="960" height="250" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">일반적인 TCP staging</text><rect x="24" y="65" width="415" height="133" rx="12" fill="#f3f6fa" stroke="none"/><rect x="521" y="65" width="415" height="133" rx="12" fill="#f3f6fa" stroke="none"/><text x="42" y="92" font-size="18" fill="#526779" text-anchor="start" font-weight="400">서버 A</text><text x="539" y="92" font-size="18" fill="#526779" text-anchor="start" font-weight="400">서버 B</text><rect x="40" y="111" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="92.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><rect x="180" y="111" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="232.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">RAM</text><rect x="320" y="111" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="372.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="535" y="111" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="587.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="675" y="111" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="727.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">RAM</text><rect x="815" y="111" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="867.5" y="148" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><path d="M145 141 L180 141" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M285 141 L320 141" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M640 141 L675 141" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M780 141 L815 141" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M425 141 L535 141" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="480" y="121" font-size="16" fill="#526779" text-anchor="middle" font-weight="400">네트워크</text><text x="28" y="228" font-size="18" fill="#526779" text-anchor="start" font-weight="400">RAM = 호스트 시스템 메모리 · 화살표는 payload의 이동 방향</text></g></svg>
