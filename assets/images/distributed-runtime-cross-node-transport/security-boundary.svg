<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">서비스 인증과 내부 전송 포트 보호</title><desc id="desc">외부 클라이언트는 인증된 서비스 API를 사용한다. 모델 요청, KV 메타데이터 교환, KV 전송은 별도의 내부 신뢰 경계에서 승인된 엔진끼리만 접근해야 한다. 외부 API 인증이 내부 포트 보호를 자동 제공하지 않는다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="960" height="390" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">외부 API 인증과 내부 통신 보호는 별개의 책임</text><rect x="28" y="85" width="215" height="70" rx="12" fill="#eaf2fc" stroke="none"/><text x="135.5" y="127" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">외부 클라이언트</text><rect x="330" y="85" width="290" height="70" rx="12" fill="#eaf2fc" stroke="none"/><text x="475" y="127" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">서비스 API·프록시</text><path d="M253 121 L320 121" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><text x="475" y="185" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">사용자 인증·요청 권한·TLS</text><rect x="28" y="222" width="904" height="120" rx="12" fill="#f3f6fa" stroke="#cbd5df"/><text x="48" y="256" font-size="21" fill="#172b3a" text-anchor="start" font-weight="600">내부 신뢰 경계 · 승인된 엔진끼리만 접근</text><rect x="48" y="277" width="240" height="46" rx="12" fill="#eaf2fc" stroke="none"/><text x="168" y="307" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">모델 요청 포트</text><rect x="310" y="277" width="290" height="46" rx="12" fill="#eaf2fc" stroke="none"/><text x="455" y="307" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">KV 메타데이터 포트</text><rect x="622" y="277" width="285" height="46" rx="12" fill="#e4f4f1" stroke="none"/><text x="764.5" y="307" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">KV 전송 채널</text><path d="M630 121 H720 V216" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><text x="28" y="374" font-size="19" fill="#526779" text-anchor="start" font-weight="400">rkey·엔진 ID·블록 ID는 사용자 인증을 대신하지 않음</text></g></svg>
