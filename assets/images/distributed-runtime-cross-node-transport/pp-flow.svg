<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">PP의 중간 텐서 전달과 API 결과 반환</title><desc id="desc">입력은 A의 레이어 0~17을 거쳐 hidden_states와 residual로 B에 전달된다. B는 레이어 18~35를 수행한다. 최종 결과는 실행기와 엔진을 거쳐 A의 API 응답으로 돌아오며 중간 텐서 전체를 echo하는 것은 아니다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="960" height="410" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">PP=2 · 하나의 모델을 두 레이어 묶음으로 분담</text><rect x="30" y="75" width="270" height="80" rx="12" fill="#eaf2fc" stroke="none"/><text x="165" y="106" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">A · 레이어 0~17</text><text x="165" y="134" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">입력 토큰 → 앞 레이어</text><rect x="660" y="75" width="270" height="80" rx="12" fill="#eaf2fc" stroke="none"/><text x="795" y="106" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">B · 레이어 18~35</text><text x="795" y="134" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">뒤 레이어 → 모델 결과</text><text x="480" y="99" font-size="18" fill="#087e83" text-anchor="middle" font-weight="400">hidden_states + residual</text><path d="M310 125 L650 125" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="165" y="191" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">앞 레이어 KV는 A에 유지</text><text x="795" y="191" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">뒤 레이어 KV는 B에 유지</text><rect x="315" y="241" width="330" height="66" rx="12" fill="#eaf2fc" stroke="none"/><text x="480" y="281" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">실행기·엔진</text><path d="M795 206 V274 H655" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="241" width="220" height="66" rx="12" fill="#eaf2fc" stroke="none"/><text x="140" y="281" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">A의 API 응답</text><path d="M305 274 L260 274" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><text x="28" y="352" font-size="20" fill="#172b3a" text-anchor="start" font-weight="400">생성 단계마다 앞 레이어 → 뒤 레이어 경계를 다시 통과</text><text x="28" y="386" font-size="18" fill="#526779" text-anchor="start" font-weight="400">반환되는 것은 모델 결과·제어 정보이며 중간 텐서 전체의 echo가 아님</text></g></svg>
