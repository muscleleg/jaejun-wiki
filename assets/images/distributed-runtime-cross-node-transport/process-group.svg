<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">동일한 통신 그룹과 각 서버의 로컬 GPU</title><desc id="desc">두 서버는 같은 MASTER_ADDR와 MASTER_PORT로 만나고 WORLD_SIZE는 2다. 서버 A는 Rank 0, 서버 B는 Rank 1이며 각각 로컬 GPU 0을 사용한다. 만남 지점이 데이터의 중앙 중계를 뜻하지 않는다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="920" height="350" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="24" fill="#172b3a" text-anchor="start" font-weight="600">같은 작업에 참여하지만 로컬 GPU 번호는 각각 0</text><rect x="290" y="62" width="340" height="82" rx="12" fill="#eaf2fc" stroke="none"/><text x="460" y="93" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">공통 만남 지점</text><text x="460" y="121" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">MASTER_ADDR · MASTER_PORT</text><rect x="30" y="207" width="350" height="86" rx="12" fill="#eaf2fc" stroke="none"/><text x="205" y="238" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">서버 A · Rank 0</text><text x="205" y="266" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">WORLD_SIZE=2 · cuda:0</text><rect x="540" y="207" width="350" height="86" rx="12" fill="#eaf2fc" stroke="none"/><text x="715" y="238" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">서버 B · Rank 1</text><text x="715" y="266" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">WORLD_SIZE=2 · cuda:0</text><path d="M205 202 V104 H280" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><path d="M715 202 V104 H640" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue)"/><text x="460" y="329" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">초기 만남과 실제 데이터 채널은 별개 · 마스터가 모든 데이터를 중계하지 않음</text></g></svg>
