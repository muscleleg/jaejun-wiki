<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc">
<title id="title">P/D와 PP: 전달하는 데이터와 시작 주체</title><desc id="desc">P/D pull은 Decode가 KV 읽기를 시작하고 Prefill의 전체 레이어 입력 KV가 Decode로 이동한다. PP는 앞 레이어에서 계산한 중간값을 뒤 레이어로 전달하고 각 단계에 자기 레이어 KV를 유지한다. P/D 그림은 메타데이터 교환과 완료 통지를 생략한 비교도다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker></defs>
<rect width="960" height="488" rx="16" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">나누는 경계가 다르면 옮기는 데이터도 달라진다</text><text x="28" y="83" font-size="22" fill="#2563a6" text-anchor="start" font-weight="600">P/D · 처리 단계 분리 / pull 방식</text><rect x="30" y="107" width="280" height="95" rx="12" fill="#eaf2fc"/><text x="170" y="137" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">Prefill 엔진</text><text x="170" y="166" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">전체 모델</text><rect x="650" y="107" width="280" height="95" rx="12" fill="#eaf2fc"/><text x="790" y="137" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">Decode 엔진</text><text x="790" y="166" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">전체 모델</text><text x="480" y="115" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">KV 읽기 시작</text><path d="M640 130 H320" stroke="#2563a6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="480" y="177" font-size="19" fill="#087e83" text-anchor="middle" font-weight="400">입력의 전체 레이어 KV</text><path d="M320 192 H640" stroke="#087e83" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><text x="30" y="237" font-size="18" fill="#526779" text-anchor="start" font-weight="400">Decode가 시작 · 메타데이터 교환·완료 통지는 상세 설명으로 분리</text><text x="28" y="287" font-size="22" fill="#2563a6" text-anchor="start" font-weight="600">PP · 모델 레이어 분할</text><rect x="30" y="314" width="280" height="82" rx="12" fill="#eaf2fc"/><text x="170" y="344" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">앞 레이어 · 서버 A</text><text x="170" y="373" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">담당 레이어 KV 유지</text><rect x="650" y="314" width="280" height="82" rx="12" fill="#eaf2fc"/><text x="790" y="344" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">뒤 레이어 · 서버 B</text><text x="790" y="373" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">담당 레이어 KV 유지</text><text x="480" y="343" font-size="19" fill="#087e83" text-anchor="middle" font-weight="400">중간 계산값</text><path d="M320 358 H640" stroke="#087e83" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><text x="30" y="438" font-size="19" fill="#526779" text-anchor="start" font-weight="400">각 forward에서 경계 통과 · 생성 단계를 반복할 때도 전달</text><text x="30" y="471" font-size="18" fill="#526779" text-anchor="start" font-weight="400">초록은 payload 방향 · PP의 수신 준비·결과 반환·제어 메시지는 생략</text></g></svg>
