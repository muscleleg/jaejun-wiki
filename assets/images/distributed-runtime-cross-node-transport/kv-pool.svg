<svg xmlns="http://www.w3.org/2000/svg" width="920" height="425" viewBox="0 0 920 425" role="img" aria-labelledby="title desc">
<title id="title">엔진의 KV 저장 공간과 요청별 블록</title><desc id="desc">GPU 메모리 안에 모델 가중치와 작업 공간, 엔진이 할당한 KV Cache 공간이 있다. KV 공간의 블록은 요청 A와 B 또는 미배정 상태다. 논리 구조이며 단일 연속 영역이나 단일 rkey를 뜻하지 않는다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="920" height="425" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="24" fill="#172b3a" text-anchor="start" font-weight="600">전체 GPU 메모리 ≠ 엔진 KV 공간 ≠ 요청 하나의 KV</text><rect x="28" y="62" width="864" height="313" rx="12" fill="#f3f6fa" stroke="#cbd5df"/><text x="48" y="96" font-size="22" fill="#172b3a" text-anchor="start" font-weight="600">GPU 메모리</text><rect x="50" y="116" width="260" height="232" rx="12" fill="#fff" stroke="none"/><text x="180" y="190" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="400">모델 가중치</text><text x="180" y="225" font-size="20" fill="#526779" text-anchor="middle" font-weight="400">작업 공간 등</text><rect x="332" y="116" width="538" height="232" rx="12" fill="#e4f4f1" stroke="none"/><text x="354" y="151" font-size="22" fill="#172b3a" text-anchor="start" font-weight="600">엔진이 할당한 KV Cache 공간</text><rect x="350" y="187" width="155" height="112" rx="12" fill="#eaf2fc" stroke="none"/><text x="427.5" y="218" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">요청 A</text><text x="427.5" y="246" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">배정 블록</text><rect x="516" y="187" width="155" height="112" rx="12" fill="#eaf2fc" stroke="none"/><text x="593.5" y="218" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">요청 B</text><text x="593.5" y="246" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">배정 블록</text><rect x="682" y="187" width="168" height="112" rx="12" fill="#eaf2fc" stroke="none"/><text x="766" y="218" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">미배정</text><text x="766" y="246" font-size="17" fill="#526779" text-anchor="middle" font-weight="400">남은 블록</text><text x="28" y="406" font-size="19" fill="#526779" text-anchor="start" font-weight="400">논리적 소유 관계 · 실제 등록 영역과 rkey는 여러 개일 수 있음</text></g></svg>
