<svg xmlns="http://www.w3.org/2000/svg" width="960" height="618" viewBox="0 0 960 618" role="img" aria-labelledby="title desc">
<title id="title">Pull 방식: 받는 엔진의 요청과 제공 측 데이터의 이동</title><desc id="desc">양쪽 버퍼가 준비된 후 Decode가 Prefill에 메타데이터를 요청하고 응답을 받아 원격 agent를 등록한다. Decode는 필요한 원격 및 로컬 블록을 대응시키고 NIXL READ를 시작한다. KV 데이터는 Prefill에서 Decode로 이동하고 수신 완료 후 사용한다. 1,2는 연결 정보가 없을 때 필요하며 3은 논리적 읽기이지 추가 HTTP 요청을 의미하지 않는다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker></defs>
<rect width="960" height="618" rx="16" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">Pull: 받는 엔진이 시작하고, 데이터는 반대 방향으로 온다</text><rect x="35" y="70" width="300" height="82" rx="12" fill="#eaf2fc"/><text x="185" y="100" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">제공 엔진 · Prefill</text><text x="185" y="129" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">KV 버퍼 할당·등록</text><rect x="625" y="70" width="300" height="82" rx="12" fill="#eaf2fc"/><text x="775" y="100" font-size="22" fill="#172b3a" text-anchor="middle" font-weight="600">받는 엔진 · Decode</text><text x="775" y="129" font-size="18" fill="#526779" text-anchor="middle" font-weight="400">수신 버퍼 할당·등록</text><path d="M185 161 V506 M775 161 V506" stroke="#cbd5df" stroke-dasharray="5 5" stroke-width="2"/><text x="480" y="193" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">① 메타데이터 요청</text><path d="M765 208 H195" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/> <text x="480" y="261" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">② 등록된 영역의 접근 정보 응답</text><path d="M195 276 H765" stroke="#2563a6" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="635" y="290" width="280" height="31" fill="#fff"/><text x="775" y="312" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="400">원격 agent 등록·블록 대응</text><text x="480" y="348" font-size="19" fill="#2563a6" text-anchor="middle" font-weight="400">③ 필요한 KV 범위 READ 시작</text><path d="M765 363 H195" stroke="#2563a6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="480" y="422" font-size="19" fill="#087e83" text-anchor="middle" font-weight="400">④ 실제 KV 데이터 이동</text><path d="M195 437 H765" stroke="#087e83" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="665" y="466" width="220" height="31" fill="#fff"/><text x="775" y="488" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="400">수신 완료 확인 → 사용</text><text x="28" y="545" font-size="18" fill="#526779" text-anchor="start" font-weight="400">①·②: 원격 엔진 정보가 없거나 무효할 때 · 유효한 정보는 재사용</text><text x="28" y="574" font-size="18" fill="#526779" text-anchor="start" font-weight="400">③ 점선: 논리적 원격 읽기 · 추가 HTTP 요청이나 고정된 패킷 형식을 뜻하지 않음</text><text x="28" y="602" font-size="18" fill="#526779" text-anchor="start" font-weight="400">파랑: 요청·접근 정보     초록: KV payload · 상세 완료 통지는 본문 참고</text></g></svg>
