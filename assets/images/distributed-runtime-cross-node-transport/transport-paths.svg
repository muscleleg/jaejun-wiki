<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img" aria-labelledby="title desc">
<title id="title">TCP·호스트 RDMA·GPUDirect RDMA의 경로</title><desc id="desc">TCP staging과 호스트 RAM 대상 RDMA는 RAM을 중간 버퍼로 사용한다. GPUDirect RDMA는 NIC가 GPU 메모리에 직접 접근한다. 개념 비교이며 RDMA를 실측한 결과가 아니다.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
<rect width="960" height="625" rx="16" fill="#ffffff"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="38" font-size="25" fill="#172b3a" text-anchor="start" font-weight="600">RDMA 사용과 GPU 메모리 직접 접근은 다른 조건</text><text x="28" y="84" font-size="22" fill="#172b3a" text-anchor="start" font-weight="600">① TCP staging</text><rect x="40" y="109" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="92.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><rect x="180" y="109" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="232.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">RAM</text><rect x="320" y="109" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="372.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="535" y="109" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="587.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="675" y="109" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="727.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">RAM</text><rect x="815" y="109" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="867.5" y="146" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><path d="M145 139 L180 139" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M285 139 L320 139" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M640 139 L675 139" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M780 139 L815 139" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M425 139 L535 139" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="480" y="119" font-size="16" fill="#526779" text-anchor="middle" font-weight="400">네트워크</text><text x="28" y="215" font-size="22" fill="#172b3a" text-anchor="start" font-weight="600">② 호스트 RAM 대상 RDMA</text><rect x="40" y="239" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="92.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><rect x="180" y="239" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="232.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">등록 RAM</text><rect x="320" y="239" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="372.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="535" y="239" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="587.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="675" y="239" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="727.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">등록 RAM</text><rect x="815" y="239" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="867.5" y="276" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><path d="M145 269 L180 269" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M285 269 L320 269" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M640 269 L675 269" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M780 269 L815 269" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M425 269 L535 269" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="480" y="249" font-size="16" fill="#526779" text-anchor="middle" font-weight="400">네트워크</text><text x="28" y="345" font-size="22" fill="#172b3a" text-anchor="start" font-weight="600">③ GPUDirect RDMA</text><rect x="40" y="369" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="92.5" y="406" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><rect x="320" y="369" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="372.5" y="406" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="535" y="369" width="105" height="60" rx="12" fill="#eaf2fc" stroke="none"/><text x="587.5" y="406" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">NIC</text><rect x="815" y="369" width="105" height="60" rx="12" fill="#e4f4f1" stroke="none"/><text x="867.5" y="406" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="600">GPU</text><path d="M145 399 L320 399" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M640 399 L815 399" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><path d="M425 399 L535 399" fill="none" stroke="#087e83" stroke-width="2.5" marker-end="url(#teal)"/><text x="480" y="379" font-size="16" fill="#526779" text-anchor="middle" font-weight="400">네트워크</text><text x="28" y="475" font-size="20" fill="#526779" text-anchor="start" font-weight="400">①·②: 호스트 RAM을 payload 중간 저장소로 사용</text><text x="28" y="511" font-size="20" fill="#526779" text-anchor="start" font-weight="400">③: 호스트 RAM을 우회 · CPU의 연결 설정·등록·작업 제출은 별개</text><text x="28" y="558" font-size="18" fill="#99580d" text-anchor="start" font-weight="400">개념도 — 실제 검증한 서버 간 전송은 TCP이며 RDMA 실측은 하지 않음</text><text x="28" y="599" font-size="18" fill="#526779">화살표는 payload 방향 · 연결·읽기 요청·응답·완료 통지는 생략</text></g></svg>
