<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1790" viewBox="0 0 1480 1790" role="img" aria-labelledby="title desc"><title id="title">호스트에서 VM까지: 실제 OpenStack 네트워크 연결</title><desc id="desc">확인한 veth, OVS 브리지와 patch 포트, 라우터 네임스페이스의 internal 포트, Linux 브리지를 구분한다. 현재 TAP 장치가 관찰되지 않아 VM 마지막 구간은 점선으로 표시한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#15243b} .title{font-size:32px;font-weight:750}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.mono{font-family:Menlo,monospace;font-size:19px}.muted{fill:#52627a}.blue{fill:#1d4ed8}.green{fill:#087965}</style><rect width="1480" height="1790" fill="#f5f7fb"/>
<text x="40" y="55" class="title">호스트에서 VM까지: 실제 네트워크 연결</text>
<text x="40" y="93" class="body muted">예시 목적지: 기존 Floating IP 172.24.4.130 · 새 cp-01의 생성 경로와 혼동하지 않기</text>
<rect x="40" y="120" width="220" height="42" rx="16" fill="#eaf2ff" stroke="#87abef" stroke-width="2"/>
<text x="56" y="148" class="small blue">파랑: OVS 스위칭</text>
<rect x="280" y="120" width="340" height="42" rx="16" fill="#e7f7f0" stroke="#79bca6" stroke-width="2"/>
<text x="296" y="148" class="small green">초록: Linux 일반 네트워크 기능</text>
<text x="650" y="148" class="small muted">실선: 확인한 연결    점선: 현재 미확인인 VM 마지막 구간</text>
<rect x="40" y="230" width="380" height="230" rx="16" fill="#e7f7f0" stroke="#79bca6" stroke-width="2"/>
<text x="62" y="268" class="head">① 호스트에서 연결 시작</text>
<text x="62" y="304" class="body">Linux의 호스트 네트워크 스택</text>
<text x="62" y="348" class="mono">veth-host</text>
<text x="62" y="383" class="body">출발지 IP: 172.24.4.1</text>
<text x="62" y="423" class="small muted">SSH 경유 시 서버가 여는 연결</text>
<rect x="480" y="190" width="500" height="1060" rx="16" fill="#eaf2ff" stroke="#6095ed" stroke-width="2"/>
<text x="504" y="230" class="head blue">OVS가 관리하는 스위칭 구간</text>
<rect x="505" y="260" width="450" height="190" rx="16" fill="#fff" stroke="#87abef" stroke-width="2"/>
<text x="528" y="299" class="head blue">② br-ex — 외부망 브리지</text>
<text x="528" y="351" class="mono">포트: veth-ex</text>
<text x="528" y="391" class="body">veth-host의 반대쪽 끝</text>
<text x="528" y="425" class="small muted">외부망: 172.24.4.0/24</text>
<path d="M420 350 H505" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="52" y="505" class="mono">veth-host ⇄ veth-ex</text>
<text x="52" y="535" class="body green">Linux veth 쌍 = 가상 랜선</text>
<path d="M730 450 V480" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="505" y="480" width="450" height="85" rx="16" fill="#fff" stroke="#87abef" stroke-width="2"/>
<text x="528" y="515" class="mono">③ phy-br-ex ⇄ int-br-ex</text>
<text x="528" y="546" class="small blue">OVS patch 포트 쌍 · 브리지 간 연결</text>
<path d="M730 565 V635" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="505" y="595" width="450" height="625" rx="16" fill="#f9fcff" stroke="#87abef" stroke-width="2"/>
<text x="528" y="627" class="head blue">br-int — 같은 브리지 안의 두 망</text>
<rect x="525" y="650" width="410" height="130" rx="16" fill="#fff" stroke="#87abef" stroke-width="2"/>
<text x="548" y="688" class="head">④ 외부망 측 포트 · tag 2</text>
<text x="548" y="725" class="body">라우터 qg 인터페이스로 전달</text>
<text x="548" y="758" class="mono">type: internal</text>
<rect x="1020" y="585" width="420" height="455" rx="16" fill="#e7f7f0" stroke="#79bca6" stroke-width="2"/>
<text x="1040" y="623" class="head green">⑤ Linux 라우터 네임스페이스</text>
<rect x="1040" y="650" width="380" height="110" rx="16" fill="#fff" stroke="#79bca6" stroke-width="2"/>
<text x="1058" y="684" class="mono">qg-cfc59153-b0</text>
<text x="1058" y="717" class="small">외부 IP: 172.24.4.167/24</text>
<text x="1058" y="745" class="small">Floating IP: 172.24.4.130/32</text>
<path d="M935 705 H1040" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1230 760 V790" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1050" y="817" class="head green">Linux 커널의 라우팅·NAT</text>
<text x="1050" y="847" class="small muted">NAT 규칙과 패킷 캡처는 미조회</text>
<path d="M1230 860 V885" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1040" y="885" width="380" height="100" rx="16" fill="#fff" stroke="#79bca6" stroke-width="2"/>
<text x="1058" y="920" class="mono">qr-fbe8a297-90</text>
<text x="1058" y="957" class="small">내부 게이트웨이: 10.0.0.1/24</text>
<text x="1040" y="1015" class="mono">qrouter-372fc3cd-…</text>
<rect x="525" y="885" width="410" height="110" rx="16" fill="#fff" stroke="#87abef" stroke-width="2"/>
<text x="548" y="924" class="head">⑥ 내부망 측 포트 · tag 1</text>
<text x="548" y="960" class="small">qr 인터페이스 · type: internal</text>
<path d="M1040 938 H935" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1040" y="1080" class="body">qg·qr는 OVS 포트이면서</text>
<text x="1040" y="1113" class="body">라우터 안의 Linux 인터페이스다.</text>
<text x="1040" y="1155" class="body green">이 경계에는 veth 쌍이 없다.</text>
<path d="M730 995 V1080" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="525" y="1080" width="410" height="110" rx="16" fill="#fff" stroke="#87abef" stroke-width="2"/>
<text x="548" y="1118" class="head">⑦ VM 방향 포트 · tag 1</text>
<text x="548" y="1157" class="mono">qvo4de9863f-d9</text>
<rect x="40" y="1040" width="380" height="235" rx="16" fill="#e7f7f0" stroke="#79bca6" stroke-width="2"/>
<text x="60" y="1080" class="head green">⑧ Linux 브리지</text>
<text x="60" y="1120" class="mono">qbr4de9863f-d9</text>
<text x="60" y="1158" class="small">연결 포트: qvb4de9863f-d9</text>
<text x="60" y="1200" class="small">qvo ⇄ qvb는 Linux veth 쌍</text>
<text x="60" y="1241" class="small muted">보안 그룹 관련 필터 규칙은 미조회</text>
<path d="M525 1140 H420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="42" y="1320" class="small green">여기까지: 포트 연결과 타입을 실제 조회로 확인</text>
<path d="M230 1275 V1370" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<rect x="40" y="1370" width="380" height="130" rx="16" fill="#fff7e8" stroke="#d4a34b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="60" y="1410" class="head">⑨ TAP 인터페이스</text>
<text x="60" y="1450" class="body">현재 목록에서 관찰되지 않음</text>
<text x="60" y="1480" class="small muted">qbr에는 qvb만 연결된 상태</text>
<path d="M420 1430 H505" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<rect x="505" y="1370" width="450" height="130" rx="16" fill="#fff7e8" stroke="#d4a34b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="528" y="1410" class="head">⑩ QEMU / vhost-net → VM NIC</text>
<text x="528" y="1450" class="body">일반적인 VM 연결 경로</text>
<text x="528" y="1480" class="small muted">게스트 연결·실행 상태는 추가 확인 필요</text>
<text x="1020" y="1398" class="head">중요: 현재 출력만으로</text>
<text x="1020" y="1435" class="body">VM까지 연결이 살아 있다고</text>
<text x="1020" y="1470" class="body">확인한 것은 아니다.</text>
<rect x="40" y="1540" width="1400" height="205" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="1580" class="head">색은 기능의 구분이다. OVS도 이 서버에서는 Linux 커널을 사용한다.</text>
<text x="62" y="1618" class="small">OVS datapath_type=system 확인: OVS 스위칭과 Linux 라우팅은 같은 호스트 커널 안의 다른 처리 기능이다.</text>
<text x="62" y="1652" class="small">Neutron API·에이전트는 구성을 설정하는 제어 요소다. 위 실선은 Neutron 프로세스를 통과하는 경로가 아니다.</text>
<text x="62" y="1686" class="small">br-tun도 존재하지만 조회된 포트는 patch-int와 자체 internal 포트뿐이다. 이 로컬 경로에서는 별도로 그리지 않았다.</text>
<text x="62" y="1720" class="small muted">근거: ovs-vsctl show / 라우터 ip address·route / 호스트 ip -d link / bridge link / ip tuntap show. 패킷 추적 결과는 아님.</text>
</svg>