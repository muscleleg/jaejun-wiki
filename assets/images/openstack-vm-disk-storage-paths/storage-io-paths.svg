<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">이미지 파일과 Cinder LVM 볼륨의 디스크 I/O 경로</title>
<desc id="desc">게스트 파일시스템이 만든 블록 요청을 QEMU가 처리하는 두 구성. 왼쪽은 호스트 이미지 파일, 오른쪽은 호스트 iSCSI 블록 장치에서 저장소 LV로 연결된다. Cinder API는 연결을 관리하며 매 I/O를 전달하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1130" rx="20" fill="#f8fafc"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="40" y="48" font-size="29" fill="#0f172a" font-weight="700">VM에는 같은 디스크, 호스트에서는 다른 저장 경로</text>
<text x="40" y="80" font-size="18" fill="#475569" font-weight="400">QEMU가 장치 I/O를 처리하는 구성의 요청 흐름 · 캐시·완료 통지·세부 드라이버 경로는 생략</text>
<rect x="180" y="110" width="840" height="72" rx="10" fill="white" stroke="#94a3b8"/>
<text x="198" y="139" font-size="21" fill="#0f172a" font-weight="700">VM 내부: 프로그램 → 게스트 커널·파일시스템 → 디스크 드라이버</text>
<text x="198" y="165" font-size="17" fill="#475569" font-weight="400">파일 경로를 가상 디스크의 위치·크기에 대한 블록 요청으로 변환</text>
<path d="M600 182V207H305V235M600 207H895V235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="235" width="540" height="715" rx="15" fill="#eff6ff" stroke="#3b82f6"/>
<text x="57" y="272" font-size="23" fill="#3b82f6" font-weight="700">A. Nova의 파일 기반 디스크</text>
<rect x="625" y="235" width="540" height="715" rx="15" fill="#f0fdfa" stroke="#0d9488"/>
<text x="647" y="272" font-size="23" fill="#0d9488" font-weight="700">B. Cinder LVM + iSCSI 볼륨</text>
<rect x="60" y="300" width="490" height="72" rx="10" fill="white" stroke="#3b82f6"/>
<text x="78" y="329" font-size="21" fill="#0f172a" font-weight="700">QEMU: 가상 디스크·이미지 처리</text>
<text x="78" y="355" font-size="17" fill="#475569" font-weight="400">가상 디스크 위치 → 이미지 파일 내부 위치</text>
<path d="M305 372V408" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="415" width="490" height="72" rx="10" fill="white" stroke="#3b82f6"/>
<text x="78" y="444" font-size="21" fill="#0f172a" font-weight="700">호스트의 이미지 파일</text>
<text x="78" y="470" font-size="17" fill="#475569" font-weight="400">예: vm-a.qcow2 · 호스트 파일시스템에 저장</text>
<path d="M305 487V523" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="530" width="490" height="72" rx="10" fill="white" stroke="#3b82f6"/>
<text x="78" y="559" font-size="21" fill="#0f172a" font-weight="700">호스트 커널의 파일 I/O·파일시스템</text>
<text x="78" y="585" font-size="17" fill="#475569" font-weight="400">이미지 파일의 위치 → 저장장치의 블록 위치</text>
<path d="M305 602V638" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="645" width="490" height="72" rx="10" fill="white" stroke="#3b82f6"/>
<text x="78" y="674" font-size="21" fill="#0f172a" font-weight="700">호스트 블록 계층·장치 드라이버</text>
<text x="78" y="700" font-size="17" fill="#475569" font-weight="400">필요한 읽기·쓰기 요청을 실제 장치로 전달</text>
<path d="M305 717V753" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="760" width="490" height="72" rx="10" fill="white" stroke="#3b82f6"/>
<text x="78" y="789" font-size="21" fill="#0f172a" font-weight="700">컴퓨트 호스트의 실제 SSD</text>
<text x="78" y="815" font-size="17" fill="#475569" font-weight="400">VM별 디스크 파일의 데이터를 보관</text>
<text x="60" y="880" font-size="20" fill="#1d4ed8" font-weight="700">loop 장치를 만들 필요 없음</text>
<text x="60" y="912" font-size="17" fill="#475569" font-weight="400">파일을 VM 디스크로 연결하는 기능은 QEMU가 제공</text>
<rect x="650" y="300" width="490" height="72" rx="10" fill="white" stroke="#0d9488"/>
<text x="668" y="329" font-size="21" fill="#0f172a" font-weight="700">QEMU: 가상 디스크 처리</text>
<text x="668" y="355" font-size="17" fill="#475569" font-weight="400">연결된 호스트 블록 장치에 읽기·쓰기</text>
<path d="M895 372V408" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="415" width="490" height="72" rx="10" fill="white" stroke="#0d9488"/>
<text x="668" y="444" font-size="21" fill="#0f172a" font-weight="700">컴퓨트 호스트의 iSCSI 블록 장치</text>
<text x="668" y="470" font-size="17" fill="#475569" font-weight="400">호스트의 iSCSI initiator가 요청을 전송</text>
<path d="M895 487V523" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="530" width="490" height="72" rx="10" fill="white" stroke="#0d9488"/>
<text x="668" y="559" font-size="21" fill="#0f172a" font-weight="700">TCP/IP → 저장소의 iSCSI target</text>
<text x="668" y="585" font-size="17" fill="#475569" font-weight="400">블록 읽기·쓰기 명령과 데이터를 전달</text>
<path d="M895 602V638" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="645" width="490" height="72" rx="10" fill="white" stroke="#0d9488"/>
<text x="668" y="674" font-size="21" fill="#0f172a" font-weight="700">저장소의 LV · LVM 매핑</text>
<text x="668" y="700" font-size="17" fill="#475569" font-weight="400">이 예시에서는 LV를 직접 블록 저장 공간으로 제공</text>
<path d="M895 717V753" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="760" width="490" height="72" rx="10" fill="white" stroke="#0d9488"/>
<text x="668" y="789" font-size="21" fill="#0f172a" font-weight="700">저장소 호스트의 실제 SSD</text>
<text x="668" y="815" font-size="17" fill="#475569" font-weight="400">블록 계층·장치 드라이버를 통해 접근</text>
<text x="650" y="880" font-size="20" fill="#0f766e" font-weight="700">Cinder는 볼륨 생성·연결·해제를 관리</text>
<text x="650" y="912" font-size="17" fill="#475569" font-weight="400">Cinder API가 매번 디스크 데이터를 중계하지 않음</text>
<text x="40" y="991" font-size="20" fill="#0f172a" font-weight="700">공통점: VM 내부에서는 게스트 파일시스템을 사용할 수 있다.</text>
<text x="40" y="1024" font-size="19" fill="#0f172a" font-weight="400">차이: 왼쪽은 호스트 파일시스템의 파일, 오른쪽은 저장소 LV가 실제 저장 대상이다.</text>
<text x="40" y="1061" font-size="18" fill="#475569" font-weight="400">컴퓨트와 저장소가 같은 PC여도 iSCSI 연결 방식은 유지될 수 있다.</text>
<text x="40" y="1093" font-size="18" fill="#475569" font-weight="400">KVM은 CPU·메모리 가상화를 담당한다. 모든 디스크 데이터가 KVM을 통과하는 것은 아니다.</text>
</g>
</svg>
