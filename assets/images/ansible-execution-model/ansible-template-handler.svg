<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="750" viewBox="0 0 1040 750" role="img" aria-labelledby="title desc"><title id="title">템플릿 생성과 Handler 알림 흐름</title><desc id="desc">변수와 템플릿을 template Task가 처리해 대상 파일을 갱신한다. 변경됐고 notify가 연결된 경우 Handler를 알리며 변경이 없으면 해당 Task는 알리지 않는다. Handler는 정해진 실행 시점에 실행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="49" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="29" fill="#24344b" font-weight="700" text-anchor="start">설정 반영 — 변경된 경우에만 후속 작업 요청</text><rect x="120" y="105" width="350" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="295.0" y="139" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">변수</text><text x="295.0" y="169" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">api_address: 10.0.0.30</text><rect x="570" y="105" width="350" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="745.0" y="139" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">템플릿</text><text x="745.0" y="169" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">server = {{ api_address }}</text><polyline points="295,193 295,224 450,224 450,255" fill="none" stroke="#52647a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="745,193 745,224 590,224 590,255" fill="none" stroke="#52647a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="285" y="255" width="470" height="88" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="520.0" y="289" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">template 모듈을 사용하는 Task</text><text x="520.0" y="319" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">값을 넣어 대상 서버의 파일 생성·갱신</text><polyline points="520,343 520,392" fill="none" stroke="#52647a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="335" y="392" width="370" height="88" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="520.0" y="426" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">Task가 변경을 보고했는가?</text><text x="520.0" y="456" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">changed 결과에 따라 알림 여부 결정</text><polyline points="420,480 420,515 255,515 255,558" fill="none" stroke="#52647a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="270" y="504" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="start">변경 없음</text><polyline points="620,480 620,515 785,515 785,558" fill="none" stroke="#52647a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="680" y="504" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="start">변경 + notify 연결</text><rect x="70" y="558" width="370" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="255.0" y="592" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">이 Task에서 알림 없음</text><text x="255.0" y="622" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">설정이 같으면 재시작 요청 없음</text><rect x="590" y="558" width="390" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="785.0" y="592" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="700" text-anchor="middle">Handler 실행 예약</text><text x="785.0" y="622" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#24344b" font-weight="400" text-anchor="middle">예: 서비스 재시작</text><text x="785" y="680" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400" text-anchor="middle">정해진 실행 시점에 수행</text><text x="520" y="727" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400" text-anchor="middle">Handler는 자동 감시자가 아니다. 작성한 Task의 변경 알림으로 동작한다.</text></svg>
