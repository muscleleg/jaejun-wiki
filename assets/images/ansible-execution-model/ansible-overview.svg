<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc"><title id="title">Ansible 구성 요소의 포함 관계와 참조 관계</title><desc id="desc">Playbook 안에 Play A와 Play B가 있다. Play A는 hosts로 별도 인벤토리를 참조하고 tasks에 Task를 직접 작성하며 roles에서 별도로 정의된 Role을 참조한다. Role에는 Task, 변수, 템플릿과 Handler가 있다. Task에는 모듈 호출을 적는다. 중첩 박스는 포함 관계이고 점선은 참조이며 실행 순서가 아니다.</desc><defs><marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="46" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="30" fill="#24344b" font-weight="700">Ansible 구성 요소의 계층 관계</text><text x="32" y="80" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400">박스 안쪽 = 포함 관계</text><polyline points="322,74 380,74" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ref)"/><text x="397" y="80" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400">점선 = 별도 정의 참조</text><text x="840" y="80" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">실행 순서를 나타내는 그림이 아님</text><rect x="32" y="118" width="680" height="730" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="56" y="158" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="27" fill="#1d4ed8" font-weight="700">Playbook</text><text x="228" y="158" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#475569" font-weight="400">예: check.yml</text><rect x="56" y="190" width="632" height="500" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="80" y="230" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" fill="#24344b" font-weight="700">Play A</text><text x="187" y="230" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">대상과 작업을 묶음</text><rect x="80" y="256" width="584" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="295" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#24344b" font-weight="600">hosts: kube_control_plane</text><rect x="80" y="345" width="584" height="175" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="381" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" fill="#24344b" font-weight="600">tasks · 직접 적은 작업 목록</text><rect x="104" y="400" width="536" height="95" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="124" y="434" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" fill="#24344b" font-weight="600">Task · 서버 이름 확인</text><text x="124" y="470" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400">모듈 호출: command   /   인자: hostname</text><rect x="80" y="549" width="584" height="112" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><text x="100" y="586" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" fill="#24344b" font-weight="600">roles · 사용할 Role 참조</text><text x="100" y="627" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="600">- containerd_setup</text><rect x="56" y="710" width="632" height="111" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="80" y="752" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" fill="#24344b" font-weight="700">Play B</text><text x="187" y="752" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">다른 대상과 작업을 지정할 수 있음</text><text x="80" y="792" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#475569" font-weight="400">hosts: kube_node   /   tasks: …</text><rect x="800" y="118" width="368" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="824" y="157" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="23" fill="#24344b" font-weight="700">인벤토리 · 별도 정의</text><text x="824" y="191" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">kube_control_plane 그룹</text><text x="846" y="225" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#475569" font-weight="400">cp-01   cp-02   cp-03</text><text x="824" y="267" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="600">접속 정보와 변수</text><text x="824" y="301" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#475569" font-weight="400">예: ansible_user: ubuntu</text><polyline points="664,287 800,287" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ref)"/><text x="723" y="272" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#24344b" font-weight="400">대상 참조</text><rect x="800" y="370" width="368" height="478" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><text x="824" y="410" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700">Role · 별도 정의</text><text x="824" y="444" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="600">containerd_setup</text><rect x="824" y="466" width="320" height="104" rx="12" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="844" y="501" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" fill="#24344b" font-weight="600">Task들</text><text x="844" y="537" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="19" fill="#24344b" font-weight="400">각 Task에서 모듈 호출</text><rect x="824" y="591" width="320" height="60" rx="12" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="844" y="629" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">변수 · defaults / vars</text><rect x="824" y="667" width="320" height="60" rx="12" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="844" y="705" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">Template · 설정 파일의 틀</text><rect x="824" y="743" width="320" height="60" rx="12" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="844" y="781" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" fill="#24344b" font-weight="400">Handler · 알림받는 작업</text><polyline points="664,619 800,619" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ref)"/><text x="727" y="603" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#24344b" font-weight="400">Role 참조</text><text x="32" y="886" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" fill="#24344b" font-weight="500">Role은 선택 사항이다. Play에 Task를 직접 적거나, 재사용할 Role을 참조할 수 있다.</text></svg>
