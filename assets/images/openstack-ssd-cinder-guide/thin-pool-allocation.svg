<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title">
<title id="title">Thin pool과 Thin LV의 공간 할당 관계</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#526580"/></marker></defs>
<rect width="1100" height="580" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#162b44">
<text x="40" y="48" font-size="25" font-weight="700">Thin pool과 Thin LV의 공간 할당 관계</text>
<rect x="310" y="90" width="480" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="550.0" y="122" text-anchor="middle" font-size="18">VG: cinder-ssd</text>
<text x="550.0" y="147" text-anchor="middle" font-size="18">전체 관리 용량 약 715.41 GiB</text>
<rect x="40" y="240" width="620" height="76" rx="12" fill="#eaf2fd" stroke="#b7c8db"/>
<text x="350.0" y="272" text-anchor="middle" font-size="18">Thin pool: 공간을 제공하는 특수한 LV</text>
<text x="350.0" y="297" text-anchor="middle" font-size="18">cinder-ssd-pool · 약 679.64 GiB</text>
<rect x="750" y="240" width="310" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="905.0" y="272" text-anchor="middle" font-size="18">VG의 나머지</text>
<text x="905.0" y="297" text-anchor="middle" font-size="18">미할당 영역 등</text>
<path d="M470,166 V202 H350 V230" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M630,166 V202 H905 V230" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="420" width="350" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="215.0" y="452" text-anchor="middle" font-size="18">Thin LV: ssd-test</text>
<text x="215.0" y="477" text-anchor="middle" font-size="18">논리 크기 1 GiB</text>
<rect x="460" y="420" width="350" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="635.0" y="466" text-anchor="middle" font-size="18">추가 Thin LV</text>
<path d="M260,316 V370 H215 V410" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M440,316 V370 H635 V410" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="215" y="354" text-anchor="middle" font-size="17">실제 공간 할당</text><text x="635" y="354" text-anchor="middle" font-size="17">실제 공간 할당</text>
<text x="40" y="549" font-size="18">같은 LVM이 논리 블록을 풀의 실제 데이터 블록에 매핑한다. 별도의 LVM을 중첩한 구조는 아니다.</text></g></svg>
