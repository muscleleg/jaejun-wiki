<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" role="img" aria-labelledby="title">
<title id="title">SSD에서 Cinder 볼륨과 VM 디스크까지</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#526580"/></marker></defs>
<rect width="1100" height="980" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#162b44">
<text x="40" y="48" font-size="25" font-weight="700">SSD에서 Cinder 볼륨과 VM 디스크까지</text>
<rect x="40" y="100" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="146" text-anchor="middle" font-size="18">물리 SSD 두 개</text>
<rect x="40" y="220" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="266" text-anchor="middle" font-size="18">LVM PV 등록</text>
<rect x="40" y="340" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="386" text-anchor="middle" font-size="18">VG: cinder-ssd</text>
<rect x="40" y="460" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="492" text-anchor="middle" font-size="18">Thin pool: cinder-ssd-pool</text>
<text x="265.0" y="517" text-anchor="middle" font-size="18">공간을 제공하는 특수한 LV</text>
<rect x="40" y="580" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="612" text-anchor="middle" font-size="18">Thin LV: 개별 볼륨</text>
<text x="265.0" y="637" text-anchor="middle" font-size="18">Thin pool에서 실제 공간 할당</text>
<rect x="40" y="700" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="732" text-anchor="middle" font-size="18">iSCSI 연결</text>
<text x="265.0" y="757" text-anchor="middle" font-size="18">컴퓨트 호스트에서 사용</text>
<rect x="40" y="820" width="450" height="76" rx="12" fill="#ffffff" stroke="#b7c8db"/>
<text x="265.0" y="866" text-anchor="middle" font-size="18">VM에 가상 디스크로 연결</text>
<path d="M265,176 V211" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M265,296 V331" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M265,416 V451" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M265,536 V571" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M265,656 V691" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M265,776 V811" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="100" width="450" height="76" rx="12" fill="#eaf2fd" stroke="#b7c8db"/>
<text x="835.0" y="146" text-anchor="middle" font-size="18">사용자가 볼륨 타입 ssd 선택</text>
<rect x="610" y="220" width="450" height="76" rx="12" fill="#eaf2fd" stroke="#b7c8db"/>
<text x="835.0" y="266" text-anchor="middle" font-size="18">Cinder 볼륨 생성 요청</text>
<rect x="610" y="340" width="450" height="76" rx="12" fill="#eaf2fd" stroke="#b7c8db"/>
<text x="835.0" y="372" text-anchor="middle" font-size="18">백엔드 선택 조건</text>
<text x="835.0" y="397" text-anchor="middle" font-size="18">volume_backend_name = ssd-storage</text>
<rect x="610" y="460" width="450" height="76" rx="12" fill="#eaf2fd" stroke="#b7c8db"/>
<text x="835.0" y="506" text-anchor="middle" font-size="18">Cinder LVM 드라이버</text>
<path d="M835,176 V211" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M835,296 V331" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M835,416 V451" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M610,485 H500" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="575" y="420" text-anchor="middle" font-size="15">thin 설정으로</text><text x="575" y="443" text-anchor="middle" font-size="15">초기화 시 풀 생성</text>
<path d="M835,536 V618 H500" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="770" y="590" text-anchor="middle" font-size="17">볼륨 생성 시 Thin LV 생성 관리</text>
<text x="40" y="942" font-size="18">관리자가 PV·VG를 준비하고, Cinder가 LVM을 통해 Thin pool과 볼륨을 관리한다.</text></g></svg>
