<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">Notion 문서 수집 및 임베딩 파이프라인</title><desc id="desc">Notion URL 요청이 FastAPI와 HTML 파싱을 거쳐 이미지 저장과 Markdown 변환으로 분기되고 PostgreSQL 및 Qdrant에 저장되는 흐름</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".08"/></filter><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.t{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.l{font-size:16px;font-weight:800}.d{font-size:12px;fill:#667085}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}.e{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#a)}.n{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#s)}.api{fill:#dcecdf;stroke:#74ae95}.process{fill:#edf2ff;stroke:#8fa9eb}.store{fill:#fff7e9;stroke:#d8aa59}.vector{fill:#e8f6ef;stroke:#67a88b}</style></defs>
  <rect width="1300" height="650" rx="28" fill="#f4f7f9"/><text x="44" y="54" class="t">Notion 문서 수집 및 임베딩 파이프라인</text><text x="44" y="82" class="sub">원문 구조와 이미지를 보존하면서 검색 가능한 Markdown·벡터 데이터로 변환한다.</text>
  <path d="M185 255H235" class="e"/><path d="M425 255H475" class="e"/><path d="M685 255H730" class="e"/>
  <path d="M835 305V390H960" class="e"/><path d="M835 305V500H960" class="e"/><path d="M1070 390H1140" class="e"/><path d="M1070 500H1140" class="e"/>
  <rect x="40" y="215" width="145" height="80" rx="16" class="n"/><text x="112" y="250" text-anchor="middle" class="l">Notion URL</text><text x="112" y="275" text-anchor="middle" class="d">User 입력</text>
  <rect x="235" y="205" width="190" height="100" rx="17" class="n api"/><text x="330" y="240" text-anchor="middle" class="tag">REQUEST</text><text x="330" y="270" text-anchor="middle" class="l">FastAPI /notion/fetch</text>
  <rect x="475" y="195" width="210" height="120" rx="18" class="n process"/><text x="580" y="230" text-anchor="middle" class="tag">COLLECT</text><text x="580" y="260" text-anchor="middle" class="l">Notion 문서 수집</text><text x="580" y="286" text-anchor="middle" class="d">HTML 파싱</text>
  <rect x="730" y="195" width="210" height="120" rx="18" class="n process"/><text x="835" y="230" text-anchor="middle" class="tag">NORMALIZE</text><text x="835" y="260" text-anchor="middle" class="l">본문·미디어 분리</text><text x="835" y="286" text-anchor="middle" class="d">원문 구조 보존</text>
  <rect x="960" y="350" width="190" height="80" rx="16" class="n"/><text x="1055" y="383" text-anchor="middle" class="l">이미지 저장</text><text x="1055" y="407" text-anchor="middle" class="d">본문에 저장 경로 반영</text>
  <rect x="960" y="460" width="190" height="80" rx="16" class="n process"/><text x="1055" y="493" text-anchor="middle" class="l">Markdown 변환</text><text x="1055" y="517" text-anchor="middle" class="d">검색·상세 조회 공통 본문</text>
  <rect x="1140" y="340" width="130" height="90" rx="16" class="n store"/><text x="1205" y="377" text-anchor="middle" class="l">PostgreSQL</text><text x="1205" y="401" text-anchor="middle" class="d">메타·본문</text>
  <rect x="1140" y="455" width="130" height="100" rx="16" class="n vector"/><text x="1205" y="487" text-anchor="middle" class="l">Embedding</text><text x="1205" y="510" text-anchor="middle" class="d">→ Qdrant</text><text x="1205" y="532" text-anchor="middle" class="d">문서 벡터</text>
  <text x="44" y="605" class="sub">이미지 저장과 Markdown 변환은 같은 원문 수집 결과에서 분기되며, 메타데이터·본문과 검색용 벡터는 서로 다른 저장소에 적재된다.</text>
</svg>
