<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Notion RAG — 문서와 근거를 연결하는 대화</title><desc id="desc">Notion 문서를 수집하고 임베딩과 Qdrant 검색으로 관련 문서를 찾는다. 검색한 근거 문서를 바탕으로 대화하고 출처를 확인하며 퀴즈와 기록으로 이어간다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#26354f"/><stop offset="1" stop-color="#1d343e"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#a9bce9" opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#a9bce9" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><g transform="translate(62 67)" fill="none" stroke="#d9e3f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" width="42" height="57" rx="7"/><path d="M19 17h20M19 29h20M19 41h13"/></g><text x="145" y="134" font-size="88" font-weight="750" fill="#fff">Notion RAG</text><text x="62" y="204" font-size="41" font-weight="600" fill="#d9e3f7">문서를 찾고, 근거를 확인하며 대화</text><rect x="60" y="252" width="450" height="380" rx="20" fill="#eef1fb"/><text x="88" y="300" font-size="29" font-weight="700" fill="#445a88">내 Notion 문서</text><rect x="88" y="328" width="337" height="99" rx="13" fill="#fff" stroke="#cad3e9"/><rect x="88" y="345" width="358" height="99" rx="13" fill="#fff" stroke="#cad3e9"/><rect x="88" y="362" width="374" height="99" rx="13" fill="#fff" stroke="#cad3e9"/><text x="112" y="400" font-size="27" font-weight="650" fill="#354b75">학습 기록 · 프로젝트 문서</text><path d="M113 424h244M113 440h163" fill="none" stroke="#b0bfdc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 477v23" fill="none" stroke="#a9bce9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="88" y="518" width="394" height="86" rx="15" fill="#d9e3f7"/><text x="285" y="554" font-size="29" font-weight="750" fill="#385686" text-anchor="middle">임베딩 · Qdrant 검색</text><text x="285" y="585" font-size="22" font-weight="600" fill="#5a7199" text-anchor="middle">질문과 관련된 문서 찾기</text><path d="M529 445h55" fill="none" stroke="#a9bce9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="612" y="252" width="528" height="380" rx="20" fill="#e7f3f2"/><text x="640" y="300" font-size="29" font-weight="700" fill="#386d68">근거 기반 대화</text><rect x="640" y="327" width="472" height="126" rx="15" fill="#fff" stroke="#bed8d3"/><text x="665" y="370" font-size="32" font-weight="750" fill="#28534d">검색한 문서로 답변</text><path d="M666 396h349M666 420h264" fill="none" stroke="#b3cbc5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="640" y="476" width="472" height="66" rx="12" fill="#cfe5de"/><path d="M663 495h18v27h-18Zm5 8h8m-8 7h8" fill="none" stroke="#4e7969" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="519" font-size="28" font-weight="700" fill="#365e51">출처 문서 확인</text><text x="640" y="590" font-size="28" font-weight="650" fill="#436f65">퀴즈로 확인</text><text x="905" y="590" font-size="28" font-weight="650" fill="#436f65">기록으로 저장</text><path d="M60 682H1140" fill="none" stroke="#52607c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="735" font-size="30" font-weight="650" fill="#dce5f7">문서 수집</text><text x="422" y="735" font-size="30" font-weight="650" fill="#dce5f7">의미 기반 검색</text><text x="860" y="735" font-size="30" font-weight="650" fill="#b9e4d6">답변과 출처</text></g></svg>