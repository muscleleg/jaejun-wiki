<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Notion RAG 개인 지식 비서 시스템 아키텍처</title>
  <desc id="desc">User, Next.js Frontend, FastAPI Backend와 Google Login, PostgreSQL, Qdrant, OpenAI API, Notion 수집 서비스의 연결</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".08"/></filter>
    <style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.t{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.l{font-size:17px;font-weight:800}.d{font-size:13px;fill:#667085}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}.e{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#a)}.dash{stroke-dasharray:8 7}.n{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#s)}.front{fill:#edf2ff;stroke:#8fa9eb}.back{fill:#dcecdf;stroke:#74ae95}.store{fill:#fff7e9;stroke:#d8aa59}.service{fill:#f4f7fb;stroke:#9aacc4}.bound{fill:#f8fafc;stroke:#b9c5d4;stroke-width:2;stroke-dasharray:8 7}</style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f4f7f9"/>
  <text x="44" y="54" class="t">Notion RAG 개인 지식 비서</text><text x="44" y="82" class="sub">Frontend와 Backend를 중심으로 인증, 영속 데이터, 벡터 검색, 생성 API와 문서 수집을 분리한다.</text>
  <rect x="755" y="105" width="395" height="455" rx="24" class="bound"/><text x="783" y="139" class="tag">BACKEND DEPENDENCIES</text>
  <path d="M170 320H230" class="e"/><path d="M470 320H530" class="e"/>
  <path d="M350 255V170H825" class="e dash"/><path d="M730 280C770 280 770 215 825 215" class="e"/><path d="M730 310H825" class="e"/><path d="M730 340C770 340 770 405 825 405" class="e"/><path d="M730 370C770 370 770 500 825 500" class="e"/>
  <rect x="40" y="280" width="130" height="80" rx="16" class="n"/><text x="105" y="327" text-anchor="middle" class="l">User</text>
  <rect x="230" y="255" width="240" height="130" rx="18" class="n front"/><text x="350" y="291" text-anchor="middle" class="tag">FRONTEND</text><text x="350" y="322" text-anchor="middle" class="l">Next.js / React</text><text x="350" y="348" text-anchor="middle" class="d">문서 · 채팅 · 퀴즈 · 통계 UI</text>
  <rect x="530" y="255" width="200" height="130" rx="18" class="n back"/><text x="630" y="291" text-anchor="middle" class="tag">APPLICATION</text><text x="630" y="322" text-anchor="middle" class="l">FastAPI</text><text x="630" y="348" text-anchor="middle" class="d">수집 · 검색 · 생성 · 채점</text>
  <rect x="825" y="165" width="270" height="72" rx="16" class="n service"/><text x="960" y="195" text-anchor="middle" class="l">Google Login</text><text x="960" y="217" text-anchor="middle" class="d">Google OAuth</text>
  <rect x="825" y="260" width="270" height="82" rx="16" class="n store"/><text x="960" y="293" text-anchor="middle" class="l">PostgreSQL</text><text x="960" y="317" text-anchor="middle" class="d">사용자 · 문서 · 퀴즈 · 채팅 기록</text>
  <rect x="825" y="365" width="270" height="82" rx="16" class="n service"/><text x="960" y="398" text-anchor="middle" class="l">Qdrant</text><text x="960" y="422" text-anchor="middle" class="d">문서 임베딩 · 유사도 검색</text>
  <rect x="825" y="465" width="125" height="72" rx="16" class="n service"/><text x="887" y="495" text-anchor="middle" class="l">OpenAI</text><text x="887" y="517" text-anchor="middle" class="d">답변 · 퀴즈</text>
  <rect x="970" y="465" width="125" height="72" rx="16" class="n service"/><text x="1032" y="495" text-anchor="middle" class="l">Notion</text><text x="1032" y="517" text-anchor="middle" class="d">수집 · 파싱</text>
  <text x="487" y="153" class="d">Google OAuth</text><text x="44" y="582" class="sub">PostgreSQL은 이력과 메타데이터를, Qdrant는 검색용 벡터를 담당하며 생성과 수집은 외부 서비스 경계로 분리된다.</text>
</svg>
