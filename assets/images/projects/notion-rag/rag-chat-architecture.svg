<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc">
  <title id="title">RAG 기반 실시간 채팅 아키텍처</title><desc id="desc">WebSocket 질문을 FastAPI가 받아 Qdrant 검색, Context 구성, OpenAI 답변 생성을 거쳐 스트리밍하고 PostgreSQL에 대화를 저장하는 구조</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3157c8"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".08"/></filter><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.t{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.l{font-size:16px;font-weight:800}.d{font-size:12px;fill:#667085}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}.e{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#a)}.ret{fill:none;stroke:#3157c8;stroke-width:3;marker-end:url(#b)}.n{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#s)}.front{fill:#edf2ff;stroke:#8fa9eb}.api{fill:#dcecdf;stroke:#74ae95}.store{fill:#fff7e9;stroke:#d8aa59}.gen{fill:#e8f6ef;stroke:#67a88b}</style></defs>
  <rect width="1300" height="680" rx="28" fill="#f4f7f9"/><text x="44" y="54" class="t">RAG 기반 실시간 채팅</text><text x="44" y="82" class="sub">질문 경로, 검색·생성 경로, 스트리밍 반환과 대화 이력 저장을 분리해 보여준다.</text>
  <path d="M170 260H230" class="e"/><path d="M450 260H510" class="e"/><path d="M710 260C760 260 760 175 815 175" class="e"/><path d="M965 175H1015" class="e"/><path d="M1165 175V330H1015" class="e"/><path d="M1015 330H865" class="ret"/><path d="M865 330C760 330 760 330 710 330" class="ret"/><path d="M510 330H450" class="ret"/><path d="M340 320V515H815" class="e"/><path d="M610 320V515H815" class="e"/>
  <rect x="40" y="220" width="130" height="80" rx="16" class="n"/><text x="105" y="267" text-anchor="middle" class="l">User</text>
  <rect x="230" y="200" width="220" height="120" rx="18" class="n front"/><text x="340" y="235" text-anchor="middle" class="tag">FRONTEND</text><text x="340" y="265" text-anchor="middle" class="l">채팅 UI</text><text x="340" y="291" text-anchor="middle" class="d">WebSocket 질문·스트림 수신</text>
  <rect x="510" y="200" width="200" height="120" rx="18" class="n api"/><text x="610" y="235" text-anchor="middle" class="tag">BACKEND</text><text x="610" y="265" text-anchor="middle" class="l">Chat Handler</text><text x="610" y="291" text-anchor="middle" class="d">질문·세션·출처 조립</text>
  <rect x="815" y="135" width="150" height="80" rx="16" class="n"/><text x="890" y="168" text-anchor="middle" class="l">Qdrant</text><text x="890" y="192" text-anchor="middle" class="d">유사 문서 검색</text>
  <rect x="1015" y="135" width="150" height="80" rx="16" class="n"/><text x="1090" y="168" text-anchor="middle" class="l">Context</text><text x="1090" y="192" text-anchor="middle" class="d">관련 문서 구성</text>
  <rect x="1015" y="290" width="150" height="80" rx="16" class="n gen"/><text x="1090" y="323" text-anchor="middle" class="l">OpenAI</text><text x="1090" y="347" text-anchor="middle" class="d">근거 기반 답변</text>
  <rect x="815" y="290" width="150" height="80" rx="16" class="n front"/><text x="890" y="323" text-anchor="middle" class="l">Streaming</text><text x="890" y="347" text-anchor="middle" class="d">WebSocket 반환</text>
  <rect x="815" y="475" width="260" height="80" rx="16" class="n store"/><text x="945" y="508" text-anchor="middle" class="l">PostgreSQL</text><text x="945" y="532" text-anchor="middle" class="d">채팅방 · 메시지 · 대화 이력</text>
  <text x="728" y="157" class="d">질문 기반 검색</text><text x="744" y="314" class="d" fill="#3157c8">토큰 스트림 + 출처 링크</text><text x="44" y="632" class="sub">Qdrant는 검색을, OpenAI는 생성을 담당하고, FastAPI는 두 결과를 연결해 WebSocket으로 반환하며 PostgreSQL에는 대화 상태를 저장한다.</text>
</svg>
