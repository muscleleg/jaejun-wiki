<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">RAG 기반 실시간 채팅 아키텍처</title>
  <desc id="desc">사용자 질문이 채팅 화면과 FastAPI를 거쳐 Qdrant 검색, Context 구성, OpenAI 답변 생성으로 이어지고, WebSocket으로 반환되며 PostgreSQL에 대화가 저장되는 구조</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3157c8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.title{font-size:30px;font-weight:800}.subtitle{font-size:15px;fill:#667085}.lane{font-size:13px;font-weight:800;fill:#176b4d;letter-spacing:.8px}.node-title{font-size:18px;font-weight:800}.node-copy{font-size:13px;fill:#667085}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}.flow-label{font-size:12px;font-weight:700;fill:#667085}.note{font-size:14px;fill:#667085}.node{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#shadow)}.front{fill:#edf2ff;stroke:#8fa9eb}.api{fill:#dcecdf;stroke:#74ae95}.store{fill:#fff7e9;stroke:#d8aa59}.gen{fill:#e8f6ef;stroke:#67a88b}.forward{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#forward)}.return{fill:none;stroke:#3157c8;stroke-width:3;marker-end:url(#return)}.guide{fill:none;stroke:#7f9f91;stroke-width:2;stroke-dasharray:5 7;marker-end:url(#forward)}
    </style>
  </defs>

  <rect width="760" height="900" rx="28" fill="#f4f7f9"/>
  <text x="38" y="52" class="title">RAG 기반 실시간 채팅</text>
  <text x="38" y="80" class="subtitle">질문, 검색·생성, 실시간 반환, 대화 저장의 경로를 분리했습니다.</text>

  <text x="38" y="126" class="lane">01 · 질문 전달</text>
  <rect x="38" y="150" width="140" height="96" rx="17" class="node"/>
  <text x="108" y="190" text-anchor="middle" class="node-title">User</text>
  <text x="108" y="216" text-anchor="middle" class="node-copy">질문 입력</text>
  <rect x="224" y="138" width="204" height="120" rx="19" class="node front"/>
  <text x="326" y="174" text-anchor="middle" class="tag">FRONTEND</text>
  <text x="326" y="207" text-anchor="middle" class="node-title">채팅 UI</text>
  <text x="326" y="233" text-anchor="middle" class="node-copy">WebSocket 질문 전송</text>
  <rect x="474" y="138" width="248" height="120" rx="19" class="node api"/>
  <text x="598" y="174" text-anchor="middle" class="tag">FASTAPI</text>
  <text x="598" y="207" text-anchor="middle" class="node-title">Chat Handler</text>
  <text x="598" y="233" text-anchor="middle" class="node-copy">질문·세션·출처 조립</text>
  <path d="M178 198H224" class="forward"/>
  <path d="M428 198H474" class="forward"/>

  <text x="38" y="316" class="lane">02 · 문서 검색과 답변 생성</text>
  <rect x="510" y="344" width="212" height="108" rx="18" class="node"/>
  <text x="616" y="386" text-anchor="middle" class="node-title">Qdrant</text>
  <text x="616" y="416" text-anchor="middle" class="node-copy">질문과 유사한 문서 검색</text>
  <rect x="274" y="344" width="200" height="108" rx="18" class="node"/>
  <text x="374" y="386" text-anchor="middle" class="node-title">Context</text>
  <text x="374" y="416" text-anchor="middle" class="node-copy">검색 문서를 답변 문맥으로 구성</text>
  <rect x="38" y="344" width="200" height="108" rx="18" class="node gen"/>
  <text x="138" y="386" text-anchor="middle" class="node-title">OpenAI</text>
  <text x="138" y="416" text-anchor="middle" class="node-copy">근거를 사용해 답변 생성</text>
  <path d="M598 258V344" class="forward"/>
  <path d="M510 398H474" class="forward"/>
  <path d="M274 398H238" class="forward"/>
  <text x="492" y="382" text-anchor="middle" class="flow-label">검색</text>
  <text x="256" y="382" text-anchor="middle" class="flow-label">문맥</text>

  <text x="38" y="516" class="lane">03 · 실시간 반환</text>
  <rect x="38" y="544" width="210" height="108" rx="18" class="node front"/>
  <text x="143" y="586" text-anchor="middle" class="node-title">Streaming</text>
  <text x="143" y="616" text-anchor="middle" class="node-copy">토큰과 출처 링크 전송</text>
  <rect x="276" y="544" width="210" height="108" rx="18" class="node front"/>
  <text x="381" y="586" text-anchor="middle" class="node-title">채팅 UI</text>
  <text x="381" y="616" text-anchor="middle" class="node-copy">응답을 순서대로 표시</text>
  <rect x="514" y="544" width="208" height="108" rx="18" class="node"/>
  <text x="618" y="586" text-anchor="middle" class="node-title">User</text>
  <text x="618" y="616" text-anchor="middle" class="node-copy">답변과 원문 출처 확인</text>
  <path d="M138 452V544" class="return"/>
  <path d="M248 598H276" class="return"/>
  <path d="M486 598H514" class="return"/>

  <text x="38" y="718" class="lane">04 · 대화 저장</text>
  <path d="M598 258H738V802H560" class="guide"/>
  <text x="704" y="734" text-anchor="end" class="flow-label">채팅방·메시지 저장</text>
  <rect x="196" y="748" width="364" height="108" rx="18" class="node store"/>
  <text x="378" y="790" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="378" y="820" text-anchor="middle" class="node-copy">채팅방 · 메시지 · 대화 이력</text>

  <text x="38" y="878" class="note">Qdrant는 검색을, OpenAI는 생성을 담당합니다. FastAPI는 두 결과와 대화 상태를 연결합니다.</text>
</svg>
