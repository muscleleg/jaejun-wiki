<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">문서 기반 퀴즈 생성·채점 파이프라인</title><desc id="desc">문서 선택부터 FastAPI, PostgreSQL 조회, OpenAI 문제 생성, Frontend 제출, 채점과 결과 저장, Statistics API까지의 흐름</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".08"/></filter><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.t{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.l{font-size:15px;font-weight:800}.d{font-size:11px;fill:#667085}.tag{font-size:10px;font-weight:800;fill:#3157c8;letter-spacing:1px}.e{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#a)}.n{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#s)}.front{fill:#edf2ff;stroke:#8fa9eb}.api{fill:#dcecdf;stroke:#74ae95}.store{fill:#fff7e9;stroke:#d8aa59}.gen{fill:#e8f6ef;stroke:#67a88b}</style></defs>
  <rect width="1600" height="560" rx="28" fill="#f4f7f9"/><text x="44" y="54" class="t">문서 기반 퀴즈 생성·채점 파이프라인</text><text x="44" y="82" class="sub">선택 문서를 문제로 변환하고, 제출 답안을 채점해 결과와 통계로 축적한다.</text>
  <path d="M160 270H195M335 270H370M510 270H545M685 270H720M860 270H895M1035 270H1070M1210 270H1245M1385 270H1430" class="e"/>
  <rect x="30" y="220" width="130" height="100" rx="16" class="n"/><text x="95" y="257" text-anchor="middle" class="tag">USER</text><text x="95" y="285" text-anchor="middle" class="l">문서 선택</text><text x="95" y="306" text-anchor="middle" class="d">특정 또는 최근 문서</text>
  <rect x="195" y="220" width="140" height="100" rx="16" class="n front"/><text x="265" y="257" text-anchor="middle" class="tag">FRONTEND</text><text x="265" y="285" text-anchor="middle" class="l">퀴즈 시작</text>
  <rect x="370" y="220" width="140" height="100" rx="16" class="n api"/><text x="440" y="257" text-anchor="middle" class="tag">FASTAPI</text><text x="440" y="285" text-anchor="middle" class="l">/quiz/generate</text>
  <rect x="545" y="220" width="140" height="100" rx="16" class="n store"/><text x="615" y="257" text-anchor="middle" class="tag">POSTGRESQL</text><text x="615" y="285" text-anchor="middle" class="l">대상 문서 조회</text>
  <rect x="720" y="220" width="140" height="100" rx="16" class="n gen"/><text x="790" y="257" text-anchor="middle" class="tag">OPENAI</text><text x="790" y="282" text-anchor="middle" class="l">문제 · 정답</text><text x="790" y="304" text-anchor="middle" class="d">객관식 · 해설</text>
  <rect x="895" y="220" width="140" height="100" rx="16" class="n front"/><text x="965" y="257" text-anchor="middle" class="tag">FRONTEND</text><text x="965" y="285" text-anchor="middle" class="l">문제 표시</text><text x="965" y="306" text-anchor="middle" class="d">답안 제출</text>
  <rect x="1070" y="220" width="140" height="100" rx="16" class="n api"/><text x="1140" y="257" text-anchor="middle" class="tag">BACKEND</text><text x="1140" y="285" text-anchor="middle" class="l">채점 · 점수 계산</text>
  <rect x="1245" y="220" width="140" height="100" rx="16" class="n store"/><text x="1315" y="257" text-anchor="middle" class="tag">POSTGRESQL</text><text x="1315" y="285" text-anchor="middle" class="l">결과 저장</text><text x="1315" y="306" text-anchor="middle" class="d">오답 · 풀이 이력</text>
  <rect x="1430" y="220" width="130" height="100" rx="16" class="n gen"/><text x="1495" y="257" text-anchor="middle" class="tag">STATISTICS</text><text x="1495" y="285" text-anchor="middle" class="l">Statistics API</text>
  <rect x="1360" y="385" width="220" height="80" rx="16" class="n gen"/><text x="1470" y="418" text-anchor="middle" class="l">학습 통계</text><text x="1470" y="442" text-anchor="middle" class="d">정답률 · 풀이 수 · History</text>
  <path d="M1495 320V385" class="e"/><text x="44" y="518" class="sub">문제 생성과 답안 채점은 별도 단계이며, 저장된 결과는 오답 노트·이전 퀴즈 상세·문서별 통계의 공통 데이터가 된다.</text>
</svg>
