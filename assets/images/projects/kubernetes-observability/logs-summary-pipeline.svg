<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 470" role="img" aria-labelledby="title desc">
  <title id="title">Logs AI Summary 생성 파이프라인</title><desc id="desc">Logs 탭 요청이 Log Analysis Summary API와 Pod Log Analysis Graph에서 최근 Pod 로그를 수집하고 컨테이너별로 정리한 뒤 structured JSON을 UI에 렌더링하는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#eef4f8"/></linearGradient><filter id="s" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#253441" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#17785c"/></marker><style>.t{font:800 31px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#1f2c3d}.st{font:500 15px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#68798a}.n{fill:#fff;stroke:#aec4bc;stroke-width:2}.b{fill:#f0f5ff;stroke:#9eb9f7;stroke-width:2}.g{fill:#e7f5ec;stroke:#7fbea4;stroke-width:2}.w{fill:#fff6e7;stroke:#e6b969;stroke-width:2}.x{font:800 17px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#253446}.sm{font:500 12px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#718192}.k{font:800 10px 'Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:1px;fill:#39715e}.l{fill:none;stroke:#17785c;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1720" height="470" fill="url(#bg)"/><rect x="28" y="24" width="1664" height="422" rx="24" fill="#fff" opacity=".78"/><text class="t" x="64" y="78">Logs AI Summary 생성 파이프라인</text><text class="st" x="64" y="106">최근 Pod 로그를 컨테이너별로 정리하고, 분석 Context를 거쳐 structured output을 생성한다.</text>
  <g filter="url(#s)"><rect class="n" x="58" y="210" width="150" height="82" rx="13"/><text class="k" x="83" y="237">REQUEST</text><text class="x" x="83" y="265">Logs 탭</text><text class="sm" x="83" y="282">AI Summary 요청</text><rect class="g" x="262" y="199" width="190" height="104" rx="13"/><text class="k" x="287" y="226">FASTAPI</text><text class="x" x="287" y="255">Log Analysis</text><text class="x" x="287" y="276">Summary API</text><rect class="b" x="506" y="199" width="205" height="104" rx="13"/><text class="k" x="532" y="226">LANGGRAPH</text><text class="x" x="532" y="255">Pod Log</text><text class="x" x="532" y="276">Analysis Graph</text></g><path class="l" d="M208 251H262M452 251H506"/>
  <rect class="n" x="765" y="210" width="175" height="82" rx="12"/><text class="x" x="790" y="240">Pod 로그 수집</text><text class="sm" x="790" y="262">최근 로그 원문</text><rect class="b" x="993" y="210" width="190" height="82" rx="12"/><text class="x" x="1018" y="240">컨테이너별 정리</text><text class="sm" x="1018" y="262">상태 · 패턴 · Evidence</text><rect class="b" x="1236" y="210" width="190" height="82" rx="12"/><text class="x" x="1261" y="240">분석 Context 생성</text><text class="sm" x="1261" y="262">Summary · Findings 입력</text><path class="l" d="M711 251H765M940 251H993M1183 251H1236"/>
  <rect class="w" filter="url(#s)" x="1478" y="210" width="110" height="82" rx="12"/><text class="k" x="1502" y="237">LLM</text><text class="x" x="1502" y="265">OpenAI</text><rect class="g" filter="url(#s)" x="1478" y="337" width="190" height="62" rx="12"/><text class="x" x="1503" y="364">Structured JSON</text><text class="sm" x="1503" y="383">Logs UI 렌더링</text><path class="l" d="M1426 251H1478M1533 292V337"/><text class="sm" x="64" y="398">컨테이너별 요약, Analysis / Findings, Evidence를 같은 응답 계약으로 분리해 화면에서 검증 가능하게 제공한다.</text>
