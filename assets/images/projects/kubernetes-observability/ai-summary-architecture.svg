<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes AI Summary 생성 아키텍처</title>
  <desc id="desc">Pod Detail UI 요청이 FastAPI에서 Metrics, Logs, Events LangGraph로 분기되고 데이터 수집과 OpenAI structured output을 거쳐 UI로 돌아가는 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b4d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity="0.08"/></filter>
    <style>
      text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.title{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.label{font-size:16px;font-weight:800}.detail{font-size:12px;fill:#667085}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}.edge{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#3157c8;stroke-width:3;marker-end:url(#arrow)}.data-edge{fill:none;stroke:#7a8ba5;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}.node{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#shadow)}.api{fill:#dcecdf;stroke:#74ae95}.graph{fill:#edf2ff;stroke:#8fa9eb}.llm{fill:#fff2de;stroke:#d8aa59}.output{fill:#e8f6ef;stroke:#67a88b}.boundary{fill:#f8fafc;stroke:#b9c5d4;stroke-width:2;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="#f4f7f9"/>
  <text x="44" y="54" class="title">AI Summary 생성 아키텍처</text>
  <text x="44" y="82" class="sub">하나의 API가 요청 탭에 맞는 LangGraph를 실행하고, 관측 데이터를 structured JSON으로 바꿔 UI에 반환한다.</text>

  <rect x="500" y="120" width="500" height="520" rx="24" class="boundary"/>
  <text x="528" y="153" class="tag">LANGGRAPH SUBGRAPHS</text>

  <path d="M210 340 H290" class="edge"/>
  <path d="M470 340 C500 340 500 230 540 230" class="edge"/>
  <path d="M470 340 H540" class="edge"/>
  <path d="M470 340 C500 340 500 510 540 510" class="edge"/>
  <path d="M940 230 C1000 230 1000 330 1050 330" class="edge"/>
  <path d="M940 370 H1050" class="edge"/>
  <path d="M940 510 C1000 510 1000 410 1050 410" class="edge"/>
  <path d="M1190 370 H1240" class="edge"/>
  <path d="M1320 430 V720 H120 V400" class="return"/>

  <path d="M620 705 C620 650 650 650 650 590" class="data-edge"/>
  <path d="M820 705 C820 650 790 650 790 590" class="data-edge"/>

  <rect x="40" y="285" width="170" height="115" rx="18" class="node"/>
  <text x="125" y="320" text-anchor="middle" class="tag">INTERFACE</text>
  <text x="125" y="350" text-anchor="middle" class="label">Pod Detail UI</text>
  <text x="125" y="375" text-anchor="middle" class="detail">Metrics · Logs · Events 탭</text>

  <rect x="290" y="285" width="180" height="115" rx="18" class="node api"/>
  <text x="380" y="320" text-anchor="middle" class="tag">ROUTER</text>
  <text x="380" y="350" text-anchor="middle" class="label">AI Summary API</text>
  <text x="380" y="375" text-anchor="middle" class="detail">FastAPI</text>

  <rect x="540" y="175" width="400" height="110" rx="18" class="node graph"/>
  <text x="570" y="207" class="tag">METRIC SUMMARY GRAPH</text>
  <text x="570" y="238" class="label">CPU / Memory + Spike + Logs + Events</text>
  <text x="570" y="263" class="detail">Prompt Context 생성 → Metric Summary</text>

  <rect x="540" y="315" width="400" height="110" rx="18" class="node graph"/>
  <text x="570" y="347" class="tag">LOG SUMMARY GRAPH</text>
  <text x="570" y="378" class="label">컨테이너별 최근 Pod Logs</text>
  <text x="570" y="403" class="detail">로그 정리 → Analysis · Findings · Evidence</text>

  <rect x="540" y="455" width="400" height="110" rx="18" class="node graph"/>
  <text x="570" y="487" class="tag">EVENT SUMMARY GRAPH</text>
  <text x="570" y="518" class="label">Pod Events · Warning 흐름</text>
  <text x="570" y="543" class="detail">집계 → Overview · Findings · Evidence</text>

  <rect x="1050" y="310" width="140" height="120" rx="18" class="node llm"/>
  <text x="1120" y="345" text-anchor="middle" class="tag">GENERATION</text>
  <text x="1120" y="375" text-anchor="middle" class="label">OpenAI LLM</text>
  <text x="1120" y="400" text-anchor="middle" class="detail">JSON Schema</text>

  <rect x="1240" y="310" width="120" height="120" rx="18" class="node output"/>
  <text x="1300" y="345" text-anchor="middle" class="tag">OUTPUT</text>
  <text x="1300" y="373" text-anchor="middle" class="label">Structured</text>
  <text x="1300" y="395" text-anchor="middle" class="label">JSON</text>

  <rect x="525" y="705" width="190" height="70" rx="16" class="node"/>
  <text x="620" y="735" text-anchor="middle" class="label">Kubernetes Cluster</text>
  <text x="620" y="758" text-anchor="middle" class="detail">Pod · Logs · Events</text>
  <rect x="725" y="705" width="190" height="70" rx="16" class="node"/>
  <text x="820" y="735" text-anchor="middle" class="label">Metrics source</text>
  <text x="820" y="758" text-anchor="middle" class="detail">metrics.k8s.io · Prometheus</text>

  <text x="1380" y="700" text-anchor="end" class="detail" fill="#3157c8">카드 UI 렌더링</text>
</svg>
