<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 운영 관측 시스템 아키텍처</title>
  <desc id="desc">사용자가 React 프론트엔드와 FastAPI 백엔드를 거쳐 SQLite 설정, Kubernetes API, 메트릭 소스에 접근하는 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b4d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.08"/></filter>
    <style>
      text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172033}.title{font-size:28px;font-weight:800}.sub{font-size:15px;fill:#667085}.label{font-size:17px;font-weight:800}.detail{font-size:13px;fill:#667085}.edge{fill:none;stroke:#176b4d;stroke-width:3;marker-end:url(#arrow)}.edge.dashed{stroke-dasharray:8 7}.boundary{fill:#f8fafc;stroke:#b9c5d4;stroke-width:2;stroke-dasharray:8 7}.node{fill:#fff;stroke:#b8c8c0;stroke-width:2;filter:url(#shadow)}.frontend{fill:#edf2ff;stroke:#8fa9eb}.backend{fill:#dcecdf;stroke:#74ae95}.store{fill:#fff7e9;stroke:#d8aa59}.source{fill:#f4f7fb;stroke:#9aacc4}.tag{font-size:11px;font-weight:800;fill:#3157c8;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="600" rx="28" fill="#f4f7f9"/>
  <text x="44" y="54" class="title">Kubernetes 운영 관측 시스템</text>
  <text x="44" y="82" class="sub">Frontend 요청을 FastAPI가 받아 저장된 연결 설정으로 클러스터와 메트릭 소스를 통합 조회한다.</text>

  <rect x="790" y="105" width="360" height="400" rx="24" class="boundary"/>
  <text x="818" y="139" class="tag">DATA &amp; CLUSTER SOURCES</text>

  <path d="M180 300 H240" class="edge"/>
  <path d="M460 300 H520" class="edge"/>
  <path d="M740 270 C780 270 780 195 830 195" class="edge dashed"/>
  <path d="M740 300 H830" class="edge"/>
  <path d="M740 330 C780 330 780 425 830 425" class="edge"/>

  <rect x="40" y="260" width="140" height="80" rx="16" class="node"/>
  <text x="110" y="306" text-anchor="middle" class="label">User</text>

  <rect x="240" y="240" width="220" height="120" rx="18" class="node frontend"/>
  <text x="350" y="278" text-anchor="middle" class="tag">FRONTEND</text>
  <text x="350" y="307" text-anchor="middle" class="label">React</text>
  <text x="350" y="332" text-anchor="middle" class="detail">Pod 목록 · 상세 · AI Summary</text>

  <rect x="520" y="240" width="220" height="120" rx="18" class="node backend"/>
  <text x="630" y="278" text-anchor="middle" class="tag" fill="#176b4d">BACKEND</text>
  <text x="630" y="307" text-anchor="middle" class="label">FastAPI</text>
  <text x="630" y="332" text-anchor="middle" class="detail">Kubernetes · Metrics 통합 API</text>

  <rect x="830" y="155" width="280" height="80" rx="16" class="node store"/>
  <text x="970" y="187" text-anchor="middle" class="label">SQLite</text>
  <text x="970" y="211" text-anchor="middle" class="detail">클러스터 연결 정보 · 애플리케이션 설정</text>

  <rect x="830" y="270" width="280" height="90" rx="16" class="node source"/>
  <text x="970" y="304" text-anchor="middle" class="label">Kubernetes Cluster</text>
  <text x="970" y="331" text-anchor="middle" class="detail">Pod · Logs · Events 조회</text>

  <rect x="830" y="390" width="280" height="90" rx="16" class="node source"/>
  <text x="970" y="424" text-anchor="middle" class="label">Metrics source</text>
  <text x="970" y="451" text-anchor="middle" class="detail">metrics.k8s.io / Prometheus · CPU / Memory</text>

  <text x="765" y="181" text-anchor="end" class="detail">연결 설정 조회</text>
  <text x="782" y="290" text-anchor="end" class="detail">Kubernetes API</text>
  <text x="778" y="408" text-anchor="end" class="detail">시계열 조회</text>
  <text x="44" y="552" class="sub">요청 경로와 저장소·외부 데이터 소스를 분리해, Backend가 어떤 정보를 읽고 어디에서 운영 데이터를 수집하는지 보여준다.</text>
</svg>
