<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 470" role="img" aria-labelledby="title desc">
  <title id="title">Events AI Summary 생성 파이프라인</title><desc id="desc">Events 탭 요청이 Event Analysis Summary API와 Pod Event Analysis Graph에서 Pod 이벤트를 수집하고 분석 Context를 만든 뒤 structured JSON을 UI에 렌더링하는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#eef4f8"/></linearGradient><filter id="s" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#253441" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#17785c"/></marker><style>.t{font:800 31px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#1f2c3d}.st{font:500 15px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#68798a}.n{fill:#fff;stroke:#aec4bc;stroke-width:2}.b{fill:#f0f5ff;stroke:#9eb9f7;stroke-width:2}.g{fill:#e7f5ec;stroke:#7fbea4;stroke-width:2}.w{fill:#fff6e7;stroke:#e6b969;stroke-width:2}.x{font:800 17px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#253446}.sm{font:500 12px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#718192}.k{font:800 10px 'Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:1px;fill:#39715e}.l{fill:none;stroke:#17785c;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1720" height="470" fill="url(#bg)"/><rect x="28" y="24" width="1664" height="422" rx="24" fill="#fff" opacity=".78"/><text class="t" x="64" y="78">Events AI Summary 생성 파이프라인</text><text class="st" x="64" y="106">Pod 이벤트의 Warning·Normal·Reason·Latest 신호를 분석해 Summary와 Evidence를 생성한다.</text>
  <g filter="url(#s)"><rect class="n" x="58" y="210" width="150" height="82" rx="13"/><text class="k" x="83" y="237">REQUEST</text><text class="x" x="83" y="265">Events 탭</text><text class="sm" x="83" y="282">AI Summary 요청</text><rect class="g" x="262" y="199" width="200" height="104" rx="13"/><text class="k" x="287" y="226">FASTAPI</text><text class="x" x="287" y="255">Event Analysis</text><text class="x" x="287" y="276">Summary API</text><rect class="b" x="516" y="199" width="210" height="104" rx="13"/><text class="k" x="542" y="226">LANGGRAPH</text><text class="x" x="542" y="255">Pod Event</text><text class="x" x="542" y="276">Analysis Graph</text></g><path class="l" d="M208 251H262M462 251H516"/>
  <rect class="n" x="780" y="210" width="188" height="82" rx="12"/><text class="x" x="805" y="240">Pod 이벤트 수집</text><text class="sm" x="805" y="262">메시지 · Source · Timestamp</text><rect class="b" x="1020" y="210" width="205" height="82" rx="12"/><text class="x" x="1045" y="240">이벤트 분석 Context</text><text class="sm" x="1045" y="262">Warning · Normal · Latest</text><rect class="w" x="1277" y="210" width="110" height="82" rx="12"/><text class="k" x="1302" y="237">LLM</text><text class="x" x="1302" y="265">OpenAI</text><rect class="g" x="1440" y="210" width="210" height="82" rx="12"/><text class="k" x="1466" y="237">OUTPUT</text><text class="x" x="1466" y="265">Structured JSON</text><text class="sm" x="1466" y="282">Events AI Summary UI</text><path class="l" d="M726 251H780M968 251H1020M1225 251H1277M1387 251H1440"/><text class="sm" x="64" y="398">이벤트 원문·Reason·시각을 Evidence로 남겨, Summary의 해석을 운영자가 다시 확인할 수 있게 한다.</text>
</svg>
