<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 운영 관측 AI</title>
  <desc id="desc">Pod의 Metrics, Logs, Events를 분석하고 관측 사실과 AI 해석, 원문 근거를 구분하는 운영 관측 도구.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112b49"/><stop offset="1" stop-color="#173e49"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#b3daf6" opacity=".12"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 4 3.5L2 8" fill="none" stroke="#89c5e6" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <g transform="translate(62 60)" fill="none" stroke="#97d8ff" stroke-width="4" stroke-linejoin="round">
      <path d="m28 0 25 14v28L28 56 3 42V14Z"/><path d="m3 14 25 15 25-15M28 29v27"/>
    </g>
    <text x="139" y="114" font-size="65" font-weight="750" fill="#fff" letter-spacing="-2">Kubernetes</text>
    <text x="60" y="205" font-size="76" font-weight="750" fill="#fff" letter-spacing="-2">운영 관측 AI</text>
    <text x="62" y="259" font-size="32" fill="#b9dced">흩어진 운영 신호를, 근거 있는 요약으로</text>

    <g transform="translate(60 308)">
      <rect width="452" height="336" rx="22" fill="#eff6fc"/>
      <text x="28" y="45" font-size="26" font-weight="700" fill="#38566e">Pod의 운영 데이터</text>
      <g fill="#fff" stroke="#cbddea"><rect x="24" y="67" width="404" height="71" rx="12"/><rect x="24" y="151" width="404" height="71" rx="12"/><rect x="24" y="235" width="404" height="71" rx="12"/></g>
      <g font-size="31" font-weight="700" fill="#23486a"><text x="45" y="113">Metrics</text><text x="45" y="197">Logs</text><text x="45" y="281">Events</text></g>
      <path d="m229 115 28-10 24 7 24-30 24 19 24-9 29 8" fill="none" stroke="#3b88c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#7ba6be" stroke-width="5" stroke-linecap="round"><path d="M230 173h152M230 188h103M230 203h130"/></g>
      <g fill="#69acb2"><circle cx="237" cy="272" r="7"/><circle cx="309" cy="272" r="7"/><circle cx="382" cy="272" r="7"/></g>
      <path d="M247 272h52m20 0h53" stroke="#9cc8cc" stroke-width="3"/>
    </g>
    <path d="M530 477h88" stroke="#89c5e6" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(650 308)">
      <rect width="490" height="336" rx="22" fill="#e9f6f2"/>
      <text x="28" y="51" font-size="37" font-weight="750" fill="#20564e">AI Summary</text>
      <line x1="28" y1="74" x2="462" y2="74" stroke="#c1ddd4"/>
      <g font-size="32" font-weight="650" fill="#264c46"><text x="76" y="127">관측된 사실</text><text x="76" y="207">가능한 해석</text><text x="76" y="287">원문 근거</text></g>
      <g fill="none" stroke="#328d79" stroke-width="3" stroke-linecap="round"><path d="m32 115 8 8 16-19"/><path d="M34 187h20v18H34Zm4 24h12"/><path d="M36 260h17v24H36Zm5 8h7m-7 7h7"/></g>
    </g>
    <line x1="60" y1="687" x2="1140" y2="687" stroke="#426475"/>
    <text x="60" y="751" font-size="30" font-weight="600" fill="#c3e3ee">Pod 중심 탐색</text><text x="367" y="751" font-size="30" fill="#82bcce">·</text>
    <text x="421" y="751" font-size="30" font-weight="600" fill="#c3e3ee">운영 신호 분석</text><text x="753" y="751" font-size="30" fill="#82bcce">·</text>
    <text x="806" y="751" font-size="30" font-weight="600" fill="#9ee6d2">근거 확인</text>
  </g>
</svg>
