<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes AI Summary 상세 워크플로</title>
  <desc id="desc">Pod Detail UI 요청이 FastAPI AI Summary API에서 Metrics, Logs, Events 서브그래프로 분기되고, 관측 데이터와 OpenAI를 거쳐 structured JSON으로 다시 UI에 반환되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#253441" flood-opacity=".12"/></filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#17785c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#376fd7"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#78909b"/></marker>
    <style>
      .title{font:800 31px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#1f2c3d}.subtitle{font:500 15px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#68798a}.group{fill:#fff;stroke:#b9cbd4;stroke-width:2;stroke-dasharray:8 7}.groupTitle{font:800 13px 'Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:1.4px;fill:#39715e}.node{fill:#fff;stroke:#aec4bc;stroke-width:2}.nodeBlue{fill:#f0f5ff;stroke:#9eb9f7;stroke-width:2}.nodeGreen{fill:#e7f5ec;stroke:#7fbea4;stroke-width:2}.nodeWarm{fill:#fff6e7;stroke:#e6b969;stroke-width:2}.nodeText{font:800 17px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#253446}.small{font:500 12px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#718192}.micro{font:800 10px 'Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:1px;fill:#39715e}.line{fill:none;stroke:#17785c;stroke-width:3;marker-end:url(#arrowGreen)}.data{fill:none;stroke:#78909b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrowGray)}.return{fill:none;stroke:#376fd7;stroke-width:3;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1600" height="930" fill="url(#bg)"/>
  <rect x="28" y="24" width="1544" height="882" rx="24" fill="#fff" opacity=".78"/>
  <text class="title" x="64" y="78">AI Summary 상세 워크플로</text>
  <text class="subtitle" x="64" y="106">요청 탭에 맞는 LangGraph가 관측 데이터를 수집·가공하고, structured JSON을 UI로 되돌려 준다.</text>

  <rect class="nodeBlue" filter="url(#shadow)" x="1190" y="154" width="260" height="92" rx="14"/>
  <text class="micro" x="1217" y="181">INTERFACE</text><text class="nodeText" x="1217" y="209">Pod Detail UI</text><text class="small" x="1217" y="231">Metrics · Logs · Events 탭</text>
  <rect class="nodeGreen" filter="url(#shadow)" x="670" y="154" width="270" height="92" rx="14"/>
  <text class="micro" x="698" y="181">ROUTER</text><text class="nodeText" x="698" y="209">AI Summary API</text><text class="small" x="698" y="231">FastAPI · 요청별 Graph 선택</text>
  <path class="line" d="M1190 200H940"/>

  <rect class="group" x="67" y="334" width="414" height="330" rx="18"/>
  <text class="groupTitle" x="94" y="365">EVENT SUMMARY GRAPH</text>
  <rect class="node" x="98" y="402" width="350" height="66" rx="11"/><text class="nodeText" x="123" y="431">Pod 이벤트 수집</text><text class="small" x="123" y="452">Warning · Normal · Reason · Latest</text>
  <rect class="nodeBlue" x="98" y="524" width="350" height="66" rx="11"/><text class="nodeText" x="123" y="553">Event Summary 생성</text><text class="small" x="123" y="574">분석 Context → structured output</text>
  <path class="line" d="M273 468V524"/>

  <rect class="group" x="516" y="334" width="414" height="330" rx="18"/>
  <text class="groupTitle" x="543" y="365">LOG SUMMARY GRAPH</text>
  <rect class="node" x="547" y="402" width="350" height="66" rx="11"/><text class="nodeText" x="572" y="431">Pod 로그 수집</text><text class="small" x="572" y="452">최근 로그 · 컨테이너별 원문</text>
  <rect class="nodeBlue" x="547" y="524" width="350" height="66" rx="11"/><text class="nodeText" x="572" y="553">Log Summary 생성</text><text class="small" x="572" y="574">컨테이너 정리 → 분석 Context</text>
  <path class="line" d="M722 468V524"/>

  <rect class="group" x="965" y="334" width="568" height="330" rx="18"/>
  <text class="groupTitle" x="992" y="365">METRICS SUMMARY GRAPH</text>
  <rect class="node" x="993" y="400" width="230" height="64" rx="11"/><text class="nodeText" x="1018" y="429">CPU / Memory 수집</text><text class="small" x="1018" y="450">시계열 메트릭</text>
  <rect class="node" x="1270" y="400" width="230" height="64" rx="11"/><text class="nodeText" x="1295" y="429">Spike 추출</text><text class="small" x="1295" y="450">급격한 변화 구간</text>
  <rect class="nodeBlue" x="1055" y="525" width="385" height="62" rx="11"/><text class="nodeText" x="1081" y="552">Prompt Context 생성</text><text class="small" x="1081" y="573">메트릭 · 로그 · 이벤트를 함께 연결</text>
  <rect class="nodeGreen" x="1055" y="607" width="385" height="38" rx="10"/><text class="nodeText" x="1081" y="633">Metric Summary 생성</text>
  <path class="line" d="M1108 464V525M1385 464V525M1247 587V607"/>

  <path class="line" d="M750 246V288H273V334"/><path class="line" d="M805 246V288H722V334"/><path class="line" d="M860 246V288H1247V334"/>
  <text class="small" x="276" y="313">Events 요청</text><text class="small" x="692" y="313">Logs 요청</text><text class="small" x="1190" y="313">Metrics 요청</text>

  <rect class="nodeWarm" filter="url(#shadow)" x="655" y="744" width="210" height="83" rx="13"/><text class="micro" x="682" y="771">GENERATION</text><text class="nodeText" x="682" y="799">OpenAI LLM</text><text class="small" x="682" y="819">JSON Schema 응답</text>
  <rect class="nodeBlue" filter="url(#shadow)" x="965" y="744" width="210" height="83" rx="13"/><text class="micro" x="992" y="771">OUTPUT</text><text class="nodeText" x="992" y="799">Structured JSON</text><text class="small" x="992" y="819">Summary · Analysis · Evidence</text>
  <path class="line" d="M273 590V698H760V744M722 590V698H760M1247 645V698H760"/>
  <path class="line" d="M865 786H965"/>
  <path class="return" d="M1175 786H1484V200H1450"/>
  <text class="small" x="1254" y="765">탭 UI 렌더링</text>

  <rect class="node" x="182" y="752" width="190" height="75" rx="12"/><text class="nodeText" x="209" y="782">Kubernetes Cluster</text><text class="small" x="209" y="804">Pod · Logs · Events</text>
  <rect class="node" x="398" y="752" width="210" height="75" rx="12"/><text class="nodeText" x="425" y="782">Metrics source</text><text class="small" x="425" y="804">metrics.k8s.io · Prometheus</text>
  <path class="data" d="M277 752V468"/><path class="data" d="M277 752V468H722"/><path class="data" d="M503 752V464H1108"/>
  <text class="small" x="86" y="880">점선: 관측 데이터 입력 · 초록: 요청·분석 · 파랑: structured JSON 반환</text>
</svg>
