<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 610" role="img" aria-labelledby="title desc">
  <title id="title">Metrics AI Summary 생성 파이프라인</title><desc id="desc">Metrics 탭 요청이 FastAPI API와 Pod Metric Analysis Graph를 거쳐 메트릭, 로그, 이벤트, Spike 데이터를 분석하고 structured JSON으로 UI에 렌더링되는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#eef4f8"/></linearGradient><filter id="s" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#253441" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#17785c"/></marker><style>.t{font:800 31px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#1f2c3d}.st{font:500 15px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#68798a}.n{fill:#fff;stroke:#aec4bc;stroke-width:2}.b{fill:#f0f5ff;stroke:#9eb9f7;stroke-width:2}.g{fill:#e7f5ec;stroke:#7fbea4;stroke-width:2}.w{fill:#fff6e7;stroke:#e6b969;stroke-width:2}.x{font:800 17px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#253446}.sm{font:500 12px 'Pretendard','Apple SD Gothic Neo',sans-serif;fill:#718192}.k{font:800 10px 'Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:1px;fill:#39715e}.l{fill:none;stroke:#17785c;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1720" height="610" fill="url(#bg)"/><rect x="28" y="24" width="1664" height="562" rx="24" fill="#fff" opacity=".78"/><text class="t" x="64" y="78">Metrics AI Summary 생성 파이프라인</text><text class="st" x="64" y="106">CPU·Memory, Pod 로그, 이벤트, Spike를 분석 Context로 합쳐 Summary·Analysis·Evidence를 생성한다.</text>
  <g filter="url(#s)"><rect class="n" x="67" y="262" width="150" height="80" rx="13"/><text class="k" x="91" y="288">REQUEST</text><text class="x" x="91" y="316">Metrics 탭</text><text class="sm" x="91" y="333">AI Summary 요청</text><rect class="g" x="272" y="250" width="194" height="104" rx="13"/><text class="k" x="298" y="278">FASTAPI</text><text class="x" x="298" y="307">Metric Analysis</text><text class="x" x="298" y="328">Summary API</text><rect class="b" x="521" y="250" width="220" height="104" rx="13"/><text class="k" x="547" y="278">LANGGRAPH</text><text class="x" x="547" y="307">Pod Metric</text><text class="x" x="547" y="328">Analysis Graph</text></g>
  <path class="l" d="M217 302H272M466 302H521"/>
  <rect class="n" x="810" y="174" width="190" height="66" rx="11"/><text class="x" x="835" y="202">CPU / Memory 수집</text><text class="sm" x="835" y="222">시계열 메트릭</text><rect class="n" x="810" y="272" width="190" height="66" rx="11"/><text class="x" x="835" y="300">Pod 로그 수집</text><text class="sm" x="835" y="320">최근 컨테이너 로그</text><rect class="n" x="810" y="370" width="190" height="66" rx="11"/><text class="x" x="835" y="398">Pod 이벤트 수집</text><text class="sm" x="835" y="418">Warning · Reason</text><rect class="b" x="1048" y="174" width="175" height="66" rx="11"/><text class="x" x="1073" y="202">Spike 추출</text><text class="sm" x="1073" y="222">변화 구간</text><rect class="b" x="1048" y="294" width="270" height="88" rx="12"/><text class="k" x="1075" y="321">CONTEXT</text><text class="x" x="1075" y="348">분석 Context 생성</text><text class="sm" x="1075" y="368">메트릭 · 로그 · 이벤트 결합</text><path class="l" d="M741 302H775V207H810M741 302H810M741 302H775V403H810M1000 207H1048M1000 305H1048M1000 403H1024V338H1048M1135 240V294"/>
  <rect class="w" filter="url(#s)" x="1370" y="284" width="142" height="82" rx="13"/><text class="k" x="1395" y="311">LLM</text><text class="x" x="1395" y="340">OpenAI</text><rect class="b" filter="url(#s)" x="1555" y="284" width="130" height="82" rx="13"/><text class="k" x="1578" y="311">OUTPUT</text><text class="x" x="1578" y="340">JSON</text><path class="l" d="M1318 338H1370M1512 325H1555"/>
  <rect class="g" x="1320" y="460" width="365" height="72" rx="13"/><text class="x" x="1350" y="489">Metrics AI Summary UI 렌더링</text><text class="sm" x="1350" y="511">Summary · Analysis · Evidence 카드</text><path class="l" d="M1620 366V460"/><text class="sm" x="64" y="554">Metrics Graph는 병렬로 수집한 관측 데이터를 하나의 Prompt Context에 모은 뒤, 구조화된 응답으로 UI 계약을 유지한다.</text>
