<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Readloop — 직접 고른 영문으로 연습</title><desc id="desc">사용자가 고른 영문 전체를 어휘, 실전 회화, 문법, 표현, 리스닝의 다섯 독립 모드에서 학습한다. 의미 덩어리, 단어 입력, 힌트, 음성 연습을 사용한다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#143c35"/><stop offset="1" stop-color="#1a293b"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#8dd7c8" opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#8dd7c8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><g transform="translate(62 67)" fill="none" stroke="#c8eee3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M30 11C20 3 10 3 1 6v47c9-3 19-3 29 5 10-8 20-8 29-5V6c-9-3-19-3-29 5Zm0 0v47"/></g><text x="145" y="134" font-size="88" font-weight="750" fill="#fff">Readloop</text><text x="62" y="204" font-size="41" font-weight="600" fill="#c8eee3">직접 고른 영문으로, 다섯 가지 연습</text><rect x="60" y="252" width="1080" height="190" rx="20" fill="#edf7f2"/><text x="88" y="296" font-size="26" font-weight="700" fill="#487762">내가 고른 영문</text><text x="88" y="357" font-size="44" font-weight="750" fill="#234a3b">Small steps make a difference.</text><rect x="88" y="380" width="214" height="39" rx="10" fill="#d0e8db"/><text x="195" y="407" font-size="23" font-weight="650" fill="#3c7058" text-anchor="middle">Small steps</text><rect x="314" y="380" width="300" height="39" rx="10" fill="#d5e9ee"/><text x="464" y="407" font-size="23" font-weight="650" fill="#416c78" text-anchor="middle">make a difference.</text><text x="1109" y="408" font-size="23" font-weight="600" fill="#668673" text-anchor="end">의미 덩어리</text><rect x="60" y="483" width="200" height="161" rx="19" fill="#e5f3ed"/><text x="82" y="520" font-size="23" font-weight="700" fill="#3b7960">01</text><path d="M205 509h27M205 520h19" fill="none" stroke="#3b7960" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="568" font-size="35" font-weight="750" fill="#3b7960">어휘</text><text x="82" y="613" font-size="24" font-weight="550" fill="#3b7960">단어 입력</text><rect x="280" y="483" width="200" height="161" rx="19" fill="#e6effb"/><text x="302" y="520" font-size="23" font-weight="700" fill="#4a70a2">02</text><path d="M425 509h27M425 520h19" fill="none" stroke="#4a70a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="568" font-size="35" font-weight="750" fill="#4a70a2">회화</text><text x="302" y="613" font-size="24" font-weight="550" fill="#4a70a2">실전 대화</text><rect x="500" y="483" width="200" height="161" rx="19" fill="#eee9fa"/><text x="522" y="520" font-size="23" font-weight="700" fill="#7961a0">03</text><path d="M645 509h27M645 520h19" fill="none" stroke="#7961a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="522" y="568" font-size="35" font-weight="750" fill="#7961a0">문법</text><text x="522" y="613" font-size="24" font-weight="550" fill="#7961a0">문장 구조</text><rect x="720" y="483" width="200" height="161" rx="19" fill="#faf0df"/><text x="742" y="520" font-size="23" font-weight="700" fill="#9a7736">04</text><path d="M865 509h27M865 520h19" fill="none" stroke="#9a7736" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="742" y="568" font-size="35" font-weight="750" fill="#9a7736">표현</text><text x="742" y="613" font-size="24" font-weight="550" fill="#9a7736">쓰임 익히기</text><rect x="940" y="483" width="200" height="161" rx="19" fill="#e1f1f1"/><text x="962" y="520" font-size="23" font-weight="700" fill="#3f7c7d">05</text><path d="M1086 511v12m9-19v26m9-33v40m9-31v22" fill="none" stroke="#3f7c7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="962" y="568" font-size="35" font-weight="750" fill="#3f7c7d">리스닝</text><text x="962" y="613" font-size="24" font-weight="550" fill="#3f7c7d">듣고 연습</text><path d="M60 682H1140" fill="none" stroke="#3f665e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="735" font-size="30" font-weight="650" fill="#e0f2e9">5개 독립 모드</text><text x="463" y="735" font-size="30" font-weight="600" fill="#c1e5d7">힌트로 이어가고</text><text x="856" y="735" font-size="30" font-weight="600" fill="#a9dfdc">음성으로 연습</text></g></svg>