<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1040" viewBox="0 0 780 1040" role="img" aria-labelledby="title desc">
  <title id="title">JWiki CLI 전체 구조</title>
  <desc id="desc">사용자가 코딩 에이전트에 자연어로 요청합니다. 스킬은 에이전트에 작업별 절차를 안내합니다. 에이전트는 CLI를 호출하고 결과를 받습니다. CLI는 원본 파일을 읽어 조회 결과를 반환하며, 승인된 변경은 입력과 참조 및 원본 상태를 검증한 뒤 저장합니다. 렌더러는 Markdown과 학습 JSON을 읽어 정적 위키, 로드맵, 기록, 포트폴리오를 생성합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#176b4d"/></marker>
    <marker id="read-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3157c8"/></marker>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #172033; }
      .box { fill: #fff; stroke: #c9d6e2; stroke-width: 1.5; }
      .label { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 20px; fill: #536477; text-anchor: middle; }
      .edge { font-size: 19px; fill: #176b4d; }
      .flow { fill: none; stroke: #176b4d; stroke-width: 2.5; marker-end: url(#arrow); }
      .read { fill: none; stroke: #3157c8; stroke-width: 2.5; marker-end: url(#read-arrow); }
    </style>
  </defs>
  <rect width="780" height="1040" rx="20" fill="#f7fafc"/>
  <text x="34" y="42" font-size="18" font-weight="700" fill="#176b4d">JWiki CLI · 요청에서 기록과 화면까지</text>

  <rect class="box" x="260" y="70" width="480" height="78" rx="14"/>
  <text class="label" x="500" y="103">사용자</text><text class="sub" x="500" y="131">목표 설정 · 직접 학습 · 결과 확인</text>
  <path class="flow" d="M500 148V197"/><text class="edge" x="516" y="181">자연어 요청</text>

  <rect class="box" x="260" y="205" width="480" height="88" rx="14"/>
  <text class="label" x="500" y="241">코딩 에이전트 · LLM</text><text class="sub" x="500" y="271">요청 해석 · 설명과 변경안 판단</text>
  <rect x="24" y="195" width="182" height="110" rx="14" fill="#f0ebfb" stroke="#c8bce5"/>
  <text x="115" y="228" class="label" style="font-size:23px">요청별 스킬</text>
  <text x="115" y="259" class="sub">필요한 문맥과</text><text x="115" y="286" class="sub">실행 절차 안내</text>
  <path d="M206 250H252" class="flow" stroke-dasharray="5 5"/>
  <path class="flow" d="M418 293V339"/><text class="edge" x="349" y="323">호출</text>
  <path class="read" d="M574 347V301"/><text x="592" y="324" font-size="19" fill="#3157c8">결과 반환</text>

  <rect x="260" y="347" width="480" height="88" rx="14" fill="#e7f3ec" stroke="#82b59d" stroke-width="1.5"/>
  <text class="label" x="500" y="383">JWiki CLI · Node.js</text><text class="sub" x="500" y="413">도구 발견 · 입력 계약 · 조회와 변경</text>
  <path class="flow" d="M500 435V481"/><text class="edge" x="516" y="466">변경 경로</text>

  <rect class="box" x="260" y="489" width="480" height="88" rx="14"/>
  <text class="label" x="500" y="525">검증과 변경 적용</text><text class="sub" x="500" y="555">Schema · 참조 관계 · 원본 변경 확인</text>
  <path class="flow" d="M500 577V623"/><text class="edge" x="516" y="608">승인·검증된 변경 저장</text>

  <rect class="box" x="260" y="631" width="480" height="88" rx="14"/>
  <text class="label" x="500" y="667">작성 원본 · 파일 저장소</text><text class="sub" x="500" y="697">Markdown · 학습 JSON · 문서 메타데이터</text>
  <path class="read" d="M260 675H225V391H252"/>
  <text x="35" y="478" font-size="22" font-weight="700" fill="#3157c8">읽기 전용 조회</text>
  <text x="35" y="512" font-size="20" fill="#536477">원본을 읽어</text><text x="35" y="541" font-size="20" fill="#536477">필요한 문맥 반환</text>
  <text x="35" y="586" font-size="18" fill="#536477">조회만으로는</text><text x="35" y="613" font-size="18" fill="#536477">상태를 바꾸지 않음</text>
  <path class="flow" d="M500 719V765"/><text class="edge" x="516" y="750">저장된 원본으로 빌드</text>

  <rect class="box" x="260" y="773" width="480" height="88" rx="14"/>
  <text class="label" x="500" y="809">사이트 생성기 · Renderer</text><text class="sub" x="500" y="839">같은 원본에서 각 화면 생성</text>
  <path class="flow" d="M500 861V907"/><text class="edge" x="516" y="892">정적 HTML · CSS · JavaScript</text>

  <rect x="260" y="915" width="480" height="88" rx="14" fill="#e7f3ec" stroke="#82b59d" stroke-width="1.5"/>
  <text class="label" x="500" y="951">위키 · 로드맵 · 기록 · 포트폴리오</text><text class="sub" x="500" y="981">미리보기 후 별도 Git 게시</text>
</svg>
