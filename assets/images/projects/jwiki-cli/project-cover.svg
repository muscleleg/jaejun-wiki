<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">JWiki CLI — 대화를 학습과 기록으로</title>
  <desc id="desc">자연어 요청을 CLI로 실행해 학습 계획과 실습 기록을 관리하고 위키, 로드맵, 포트폴리오를 만드는 개인 학습 도구.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#292549"/><stop offset="1" stop-color="#172b41"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#dbd0f8" opacity=".12"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 4 3.5L2 8" fill="none" stroke="#b4a4dc" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <g transform="translate(60 65)" fill="none" stroke="#cab6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect width="62" height="55" rx="9"/><path d="m13 16 12 11-12 11m22 0h14"/></g>
    <text x="145" y="129" font-size="88" font-weight="750" fill="#fff" letter-spacing="-3">JWiki CLI</text>
    <text x="62" y="201" font-size="44" font-weight="600" fill="#e2d8fa" letter-spacing="-1">대화를 학습과 기록으로</text>

    <g transform="translate(60 246)">
      <rect width="1080" height="166" rx="22" fill="#171c32" stroke="#645b83"/>
      <circle cx="28" cy="29" r="5" fill="#a68bc7"/><circle cx="47" cy="29" r="5" fill="#7276a4"/><circle cx="66" cy="29" r="5" fill="#599e99"/>
      <text x="101" y="38" font-size="24" fill="#aaa9c7">자연어 요청</text>
      <text x="30" y="109" font-family="Menlo, monospace" font-size="39" font-weight="700" fill="#bea5f6">&gt;</text>
      <text x="78" y="109" font-size="40" font-weight="600" fill="#f4f0ff">“오늘 배운 내용, 위키에 정리해줘”</text>
    </g>
    <path d="M600 428v32" stroke="#b4a4dc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(60 480)">
      <rect width="505" height="164" rx="20" fill="#efeafb"/>
      <text x="27" y="48" font-size="27" font-weight="700" fill="#655185">LLM + CLI</text>
      <text x="27" y="109" font-size="37" font-weight="750" fill="#33254b">학습 계획 · 실습 기록</text>
      <path d="M520 82h39" stroke="#b4a4dc" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="585" width="495" height="164" rx="20" fill="#edf6f4"/>
      <text x="612" y="48" font-size="27" font-weight="700" fill="#49796b">나만의 지식으로 저장</text>
      <text x="612" y="109" font-size="37" font-weight="750" fill="#204f42">위키 · 포트폴리오</text>
    </g>
    <line x1="60" y1="687" x2="1140" y2="687" stroke="#585775"/>
    <text x="60" y="751" font-size="30" font-weight="600" fill="#dfd6f3">목표와 로드맵</text><text x="368" y="751" font-size="30" fill="#a399c5">·</text>
    <text x="423" y="751" font-size="30" font-weight="600" fill="#dfd6f3">학습 근거 관리</text><text x="754" y="751" font-size="30" fill="#a399c5">·</text>
    <text x="807" y="751" font-size="30" font-weight="600" fill="#b4e5d7">사이트 생성</text>
  </g>
</svg>
