<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
  <title id="title">개인화 헬스 기록 코치의 기록 기반 행동 순환</title>
  <desc id="desc">대화로 입력한 운동, 식사, 체성분 기록을 구조화하고 파생 계산과 코칭 판단을 거쳐 다음 행동으로 되돌리는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbf6"/><stop offset="1" stop-color="#e9f2f5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#17815e"/></marker>
  </defs>
  <rect width="1120" height="369" rx="26" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">기록을 쌓고, 근거를 읽고, 다음 행동을 결정한다</text>
  <text x="560" y="84" text-anchor="middle" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">개인화 헬스 기록 코치 · 누적 데이터 기반 운동·영양 코칭</text>
  <g fill="none" stroke="#17815e" stroke-width="4" marker-end="url(#arrow)"><path d="M234 208H282"/><path d="M448 208H496"/><path d="M662 208H710"/><path d="M876 208H924"/></g>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <g><rect x="60" y="130" width="174" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="93" cy="163" r="18" fill="#dff3ea"/><text x="93" y="170" text-anchor="middle" fill="#17815e" font-size="18" font-weight="800">1</text><text x="119" y="169" fill="#153247" font-size="18" font-weight="800">대화 기록</text><text x="84" y="209" fill="#607486" font-size="14">운동 · 식사 · 체성분</text><text x="84" y="235" fill="#607486" font-size="14">누락 · 통증 · 수행 품질</text><text x="84" y="261" fill="#607486" font-size="14">사용자가 말한 사실</text></g>
    <g><rect x="282" y="130" width="166" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="315" cy="163" r="18" fill="#dff3ea"/><text x="315" y="170" text-anchor="middle" fill="#17815e" font-size="18" font-weight="800">2</text><text x="341" y="169" fill="#153247" font-size="18" font-weight="800">구조화</text><text x="306" y="209" fill="#607486" font-size="14">날짜별 단일 원본</text><text x="306" y="235" fill="#607486" font-size="14">프로필 · 운동 사전</text><text x="306" y="261" fill="#607486" font-size="14">코칭 정책 분리</text></g>
    <g><rect x="496" y="130" width="166" height="154" rx="22" fill="#153247"/><circle cx="529" cy="163" r="18" fill="#d9eee7"/><text x="529" y="170" text-anchor="middle" fill="#17815e" font-size="18" font-weight="800">3</text><text x="555" y="169" fill="#fff" font-size="18" font-weight="800">파생 판단</text><text x="520" y="209" fill="#d9e9e3" font-size="14">최근 추세 · 충족도</text><text x="520" y="235" fill="#d9e9e3" font-size="14">증량 · 자극 분포</text><text x="520" y="261" fill="#d9e9e3" font-size="14">범위와 불확실성</text></g>
    <g><rect x="710" y="130" width="166" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="743" cy="163" r="18" fill="#dff3ea"/><text x="743" y="170" text-anchor="middle" fill="#17815e" font-size="18" font-weight="800">4</text><text x="769" y="169" fill="#153247" font-size="18" font-weight="800">코칭</text><text x="734" y="209" fill="#607486" font-size="14">판단 근거 설명</text><text x="734" y="235" fill="#607486" font-size="14">누락 입력 확인</text><text x="734" y="261" fill="#607486" font-size="14">가장 작은 다음 행동</text></g>
    <g><rect x="924" y="130" width="136" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="957" cy="163" r="18" fill="#dff3ea"/><text x="957" y="170" text-anchor="middle" fill="#17815e" font-size="18" font-weight="800">5</text><text x="983" y="169" fill="#153247" font-size="18" font-weight="800">실행</text><text x="948" y="209" fill="#607486" font-size="14">다음 운동</text><text x="948" y="235" fill="#607486" font-size="14">다음 식사</text><text x="948" y="261" fill="#607486" font-size="14">새 기록 생성</text></g>
  </g>
  <path d="M992 303C928 326 218 326 128 303" fill="none" stroke="#6d91a6" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="560" y="355" text-anchor="middle" fill="#345a50" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">활동량을 보여 주는 데서 끝나지 않고, 무엇을 유지하고 무엇을 바꿀지 판단하는 기록 시스템</text>
</svg>
