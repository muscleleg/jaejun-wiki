<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="594" viewBox="0 0 1200 594" role="img" aria-labelledby="title description">
  <title id="title">crash-demo의 반복 재시작을 진단하는 사용 예시</title>
  <desc id="description">사용자가 crash-demo가 계속 죽는 이유를 질문합니다. CloudLens는 앱의 Pod 상태와 실행 설정, 이벤트와 로그를 수집합니다. AI는 반복 재시작과 실행 명령의 exit 7을 연결해 원인을 제시하고, 테스트 목적인지 확인한 뒤 서비스용 실행 명령으로 수정하도록 제안합니다. 사용자는 판단 근거를 펼쳐 확인할 수 있습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#759a89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1b342d; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; fill: #506b61; }
      .label { font-size: 15px; font-weight: 600; fill: #60796f; }
      .number { font-size: 15px; font-weight: 700; fill: #277b5f; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="592" rx="24" fill="#f5f8f6" stroke="#dce7e1"/>
  <text x="40" y="45" font-size="13" font-weight="700" letter-spacing="2" fill="#26765d">AI DIAGNOSIS</text>
  <text x="40" y="92" font-size="32" font-weight="700">앱이 계속 재시작될 때</text>
  <text x="40" y="127" class="body">crash-demo의 상태와 실행 설정을 대조해 원인과 다음 행동을 확인한 예시입니다.</text>

  <rect x="40" y="157" width="1120" height="78" rx="14" fill="#e8f3ec" stroke="#cfe3d7"/>
  <text x="64" y="189" class="label">채팅으로 질문</text>
  <text x="64" y="217" font-size="21" font-weight="600">“crash-demo가 계속 죽는데 원인 찾아줘”</text>
  <path d="M212 236v32" fill="none" stroke="#759a89" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="40" y="280" width="344" height="246" rx="16" fill="#fff" stroke="#dce7e1"/>
  <circle cx="74" cy="316" r="15" fill="#edf6f1"/>
  <text x="74" y="321" text-anchor="middle" class="number">1</text>
  <text x="101" y="323" class="heading">앱의 진단 자료 수집</text>
  <path d="M64 345h296" stroke="#e7eeea"/>
  <text x="64" y="381" class="body">Pod 상태와 재시작 기록</text>
  <text x="64" y="418" class="body">컨테이너의 실행 설정</text>
  <text x="64" y="455" class="body">관련 이벤트와 컨테이너 로그</text>
  <text x="64" y="497" class="label">질문한 앱에 속한 자원을 조회</text>

  <path d="M387 403h34" fill="none" stroke="#759a89" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="428" y="280" width="344" height="246" rx="16" fill="#f7f4fc" stroke="#e0d6ef"/>
  <circle cx="462" cy="316" r="15" fill="#eae2f8"/>
  <text x="462" y="321" text-anchor="middle" font-size="15" font-weight="700" fill="#7657a4">2</text>
  <text x="489" y="323" class="heading">AI가 증상과 원인을 연결</text>
  <text x="452" y="372" class="label">관측된 증상</text>
  <text x="452" y="401" font-size="19" font-weight="600">컨테이너가 반복 재시작됨</text>
  <path d="M452 419h296" stroke="#e4ddef"/>
  <text x="452" y="448" class="label">제시한 원인</text>
  <text x="452" y="478" font-size="19" font-weight="600">실행 명령에 포함된 exit 7이</text>
  <text x="452" y="504" font-size="19" font-weight="600">컨테이너를 종료시킴</text>

  <path d="M775 403h34" fill="none" stroke="#759a89" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="816" y="280" width="344" height="246" rx="16" fill="#fff" stroke="#bcd5c9"/>
  <circle cx="850" cy="316" r="15" fill="#edf6f1"/>
  <text x="850" y="321" text-anchor="middle" class="number">3</text>
  <text x="877" y="323" class="heading">다음 행동 확인</text>
  <path d="M840 345h296" stroke="#e7eeea"/>
  <text x="840" y="379" class="label">먼저 확인</text>
  <text x="840" y="409" font-size="19" font-weight="600">의도한 테스트용 명령인가?</text>
  <text x="840" y="455" class="label">실제 서비스를 실행하려면</text>
  <text x="840" y="485" font-size="19" font-weight="600">서비스용 실행 명령으로 수정</text>

  <text x="40" y="561" class="body">진단 결과에서 판단 근거를 펼치면, 사용된 자원 설정·이벤트·로그를 함께 확인할 수 있습니다.</text>
</svg>
