<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-labelledby="title description">
  <title id="title">CloudLens: 앱부터 실행 인프라까지 연결하는 웹 포털</title>
  <desc id="description">애플리케이션의 구성 자원을 Kubernetes에서 확인하고, 실행 노드에 대응하는 OpenStack 가상머신까지 따라갑니다. CloudLens에서는 구성과 연결 자원 추적, 사용량과 남은 용량 확인, AI 자원 검색과 장애 진단, 자원 관리와 원격 접속을 제공합니다.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d9e5e0"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L5 3.5 L1 6" fill="none" stroke="#6d9585" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1b342d; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; fill: #506b61; }
      .small { font-size: 14px; fill: #60796f; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="692" rx="24" fill="#f5f8f6" stroke="#dce7e1"/>
  <rect x="1" y="1" width="1198" height="692" rx="24" fill="url(#dots)" opacity=".38"/>

  <text x="44" y="47" font-size="13" font-weight="700" letter-spacing="2" fill="#26765d">CLOUDLENS</text>
  <text x="44" y="96" font-size="34" font-weight="700">앱부터 실행 인프라까지, 한곳에서</text>
  <text x="44" y="132" font-size="18" fill="#506b61">Kubernetes와 OpenStack에 나뉜 정보를 애플리케이션 기준으로 연결합니다.</text>

  <!-- 관계를 탐색하는 대상. 트래픽 경로나 고정된 배포 구성을 뜻하지 않습니다. -->
  <rect x="40" y="174" width="510" height="484" rx="18" fill="#fff" stroke="#dce7e1"/>
  <text x="64" y="209" class="heading">연결해서 보는 대상</text>

  <rect x="64" y="232" width="462" height="106" rx="12" fill="#f5f2fc" stroke="#e4dcf4"/>
  <rect x="82" y="253" width="44" height="44" rx="12" fill="#eae2f8"/>
  <g class="icon" color="#8462ba" transform="translate(92 263)">
    <path d="M12 1 22 6.5v11L12 23 2 17.5v-11L12 1Z M2 6.5 12 12l10-5.5 M12 12v11"/>
  </g>
  <text x="142" y="271" class="heading">애플리케이션</text>
  <text x="142" y="303" class="body">웹 서비스 · 모델 서빙 · 백그라운드 작업</text>
  <path d="M295 340v27" stroke="#8aa699" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="313" y="359" class="small">어떤 자원으로 구성됐는지</text>

  <rect x="64" y="376" width="462" height="106" rx="12" fill="#f0f6fc" stroke="#d9e6f3"/>
  <rect x="82" y="397" width="44" height="44" rx="12" fill="#dfebf8"/>
  <g class="icon" color="#4d7fae" transform="translate(92 407)">
    <rect x="7" y="7" width="10" height="10" rx="2"/>
    <path d="M12 1v6 M12 17v6 M1 12h6 M17 12h6 M4 4l4 4 M16 16l4 4 M4 20l4-4 M16 8l4-4"/>
  </g>
  <text x="142" y="415" class="heading">Kubernetes</text>
  <text x="142" y="447" class="body">Pod · Service · 저장소 · GPU · 실행 노드</text>
  <path d="M295 484v27" stroke="#8aa699" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="313" y="503" class="small">노드가 어느 VM에서 실행되는지</text>

  <rect x="64" y="520" width="462" height="106" rx="12" fill="#eff7f3" stroke="#d6e9df"/>
  <rect x="82" y="541" width="44" height="44" rx="12" fill="#dceee4"/>
  <g class="icon" color="#337d62" transform="translate(92 551)">
    <path d="M5 19h14a4.5 4.5 0 0 0 .5-9A7 7 0 0 0 6 8a5.5 5.5 0 0 0-1 11Z"/>
  </g>
  <text x="142" y="559" class="heading">OpenStack</text>
  <text x="142" y="591" class="body">가상머신 · 네트워크 · 볼륨 · 호스트</text>

  <path d="M550 421h60" stroke="#7d9d8f" stroke-width="1.6" stroke-dasharray="4 5"/>
  <circle cx="610" cy="421" r="3" fill="#7d9d8f"/>
  <text x="584" y="404" class="small" text-anchor="middle">조회·관리</text>

  <!-- 포털에서 제공하는 대표 사용자 기능 -->
  <rect x="618" y="174" width="542" height="484" rx="18" fill="#fff" stroke="#bcd5c9"/>
  <rect x="618" y="174" width="542" height="106" rx="18" fill="#eaf4ef"/>
  <path d="M618 260h542v20H618Z" fill="#eaf4ef"/>
  <rect x="642" y="195" width="44" height="44" rx="12" fill="#227b60"/>
  <g class="icon" color="#fff" transform="translate(652 205)">
    <path d="m12 1 11 6-11 6L1 7 12 1Z M1 12l11 6 11-6 M1 17l11 6 11-6"/>
  </g>
  <text x="701" y="226" font-size="27" font-weight="700">CloudLens</text>
  <text x="642" y="261" class="body">앱과 인프라를 함께 관리하는 웹 포털</text>

  <g transform="translate(642 304)">
    <rect width="38" height="38" rx="10" fill="#edf6f1"/>
    <g class="icon" color="#277b5f" transform="translate(7 7)">
      <rect x="1" y="1" width="7" height="7" rx="1.5"/>
      <rect x="16" y="16" width="7" height="7" rx="1.5"/>
      <rect x="1" y="16" width="7" height="7" rx="1.5"/>
      <path d="M4.5 8v8 M8 4.5h11.5V16"/>
    </g>
    <text x="54" y="18" class="heading">구성과 연결 자원 추적</text>
    <text x="54" y="47" class="body">앱 구성도에서 자원 상세와 실행 VM까지</text>
  </g>
  <path d="M642 370h494" stroke="#edf1ee"/>

  <g transform="translate(642 389)">
    <rect width="38" height="38" rx="10" fill="#edf6f1"/>
    <g class="icon" color="#277b5f" transform="translate(7 7)">
      <path d="M2 2v20h20 M6 16l5-6 5 3 6-9"/>
    </g>
    <text x="54" y="18" class="heading">사용량과 남은 용량 확인</text>
    <text x="54" y="47" class="body">앱의 CPU·메모리·GPU, 인프라의 여유 용량</text>
  </g>
  <path d="M642 455h494" stroke="#edf1ee"/>

  <g transform="translate(642 474)">
    <rect width="38" height="38" rx="10" fill="#edf6f1"/>
    <g class="icon" color="#277b5f" transform="translate(7 7)">
      <path d="M4 3h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8l-6 4V5a2 2 0 0 1 2-2Z M7 8h10 M7 13h7"/>
    </g>
    <text x="54" y="18" class="heading">AI 자원 검색과 장애 진단</text>
    <text x="54" y="47" class="body">자연어 조회 · 로그 분석 · 원인과 다음 행동</text>
  </g>
  <path d="M642 540h494" stroke="#edf1ee"/>

  <g transform="translate(642 559)">
    <rect width="38" height="38" rx="10" fill="#edf6f1"/>
    <g class="icon" color="#277b5f" transform="translate(7 7)">
      <rect x="1" y="3" width="22" height="18" rx="2"/>
      <path d="m5 8 4 4-4 4 M13 16h5"/>
    </g>
    <text x="54" y="18" class="heading">자원 관리와 원격 접속</text>
    <text x="54" y="47" class="body">생성·수정·삭제 · AI YAML 작성 · 터미널</text>
  </g>

</svg>
