<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
<title id="title">하나의 앱 범위를 여러 기능에서 사용</title><desc id="desc">통합 현황에서 선택한 식별자와 채팅에서 모델이 선택한 대상은 같은 관계 서비스로 들어간다. 계산한 앱 범위는 구성도, 사용량, 진단에 사용된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="688" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">하나의 앱 범위를 여러 기능에서 사용</text>
<text x="32" y="78" font-size="17" fill="#536c60">앱을 고르는 방법이 달라도, 자원 관계를 계산하는 규칙은 같습니다.</text>
<rect x="56" y="126" width="420" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="74" y="157" class="heading" style="fill:#19674e">통합 현황에서 앱 클릭</text>
<text x="74" y="184" class="body" text-anchor="start">선택한 프로필·종류·이름·UID</text>
<rect x="564" y="126" width="420" height="112" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="582" y="157" class="heading" style="fill:#6b4b9e">채팅으로 앱 구성 요청</text>
<text x="582" y="184" class="body" text-anchor="start">모델이 대상 앱과 조회 도구 선택</text>
<rect x="210" y="325" width="620" height="132" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="228" y="356" class="heading" style="fill:#19674e">공통 관계 서비스</text>
<text x="228" y="383" class="body" text-anchor="start">소유 관계로 워크로드·Pod를 묶음</text>
<text x="228" y="407" class="body" text-anchor="start">Service·PVC·Node·VM·GPU를 참조로 연결</text>
<rect x="32" y="552" width="312" height="104" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="583" class="heading" style="fill:#19674e">구성도</text>
<text x="50" y="610" class="body" text-anchor="start">자원·관계를 컴포넌트로 표시</text>
<rect x="364" y="552" width="312" height="104" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="382" y="583" class="heading" style="fill:#365f94">사용량 대시보드</text>
<text x="382" y="610" class="body" text-anchor="start">같은 Pod·PVC로 지표 조회</text>
<rect x="696" y="552" width="312" height="104" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="714" y="583" class="heading" style="fill:#6b4b9e">원인 진단</text>
<text x="714" y="610" class="body" text-anchor="start">상태·이벤트·로그 추가 수집</text>
<path d="M 266 238 L 266 280 L 520 280 L 520 325" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 774 238 L 774 280 L 520 280 L 520 325" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 520 457 L 520 503 L 188 503 L 188 552" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 520 457 L 520 503 L 520 503 L 520 552" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 520 457 L 520 503 L 852 503 L 852 552" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
