<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">로그인한 사용자를 이후 요청에 연결</title><desc id="desc">계정과 비밀번호를 받은 인증 API가 Argon2 해시를 검증한다. 세션 토큰 해시를 H2에 저장하고 원문 토큰은 HttpOnly 쿠키로 브라우저에 전달한다. 이후 쿠키를 확인해 사용자 소유 데이터에 접근한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="478" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">로그인한 사용자를 이후 요청에 연결</text>
<text x="32" y="78" font-size="17" fill="#536c60">브라우저의 세션 쿠키와 서버의 세션 기록으로 요청자를 확인합니다.</text>
<rect x="32" y="130" width="280" height="124" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="161" class="heading" style="fill:#29473b">로그인 화면</text>
<text x="50" y="188" class="body" text-anchor="start">계정·비밀번호 제출</text>
<text x="50" y="212" class="body" text-anchor="start">HttpOnly 세션 쿠키 수신</text>
<rect x="380" y="130" width="280" height="124" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="161" class="heading" style="fill:#19674e">인증 API</text>
<text x="398" y="188" class="body" text-anchor="start">Argon2 비밀번호 검증</text>
<text x="398" y="212" class="body" text-anchor="start">세션 토큰 발급</text>
<rect x="728" y="130" width="280" height="124" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="746" y="161" class="heading" style="fill:#29473b">H2</text>
<text x="746" y="188" class="body" text-anchor="start">사용자·비밀번호 해시</text>
<text x="746" y="212" class="body" text-anchor="start">세션 토큰 해시 저장</text>
<rect x="380" y="344" width="628" height="100" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="375" class="heading" style="fill:#19674e">이후 요청: 세션 → 사용자 ID·역할 → 소유한 데이터</text>
<text x="398" y="402" class="body" text-anchor="start">내 연결·채팅·설정 조회 / 관리자 역할 확인</text>
<path d="M 312 174 L 380 174" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 380 222 L 312 222" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 191 L 728 191" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 172 254 L 172 394 L 380 394" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="105.5" y="306" width="169" height="24" rx="5" fill="#f7faf8"/>
<text x="190" y="323" class="caption" text-anchor="middle">쿠키와 함께 API 요청</text>
</svg>
