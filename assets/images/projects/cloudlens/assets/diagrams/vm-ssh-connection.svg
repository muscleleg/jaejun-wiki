<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="822" viewBox="0 0 1040 822" role="img" aria-labelledby="title desc">
<title id="title">VM SSH · 앱 서버가 SSH 클라이언트가 됩니다</title><desc id="desc">접속 준비에서는 브라우저가 VM과 키를 선택하고 앱 서버가 OpenStack SDK로 Nova에서 대상을 확인한다. 실제 터미널은 브라우저 xterm.js와 앱 서버 사이 WebSocket, 앱 서버 Paramiko와 VM sshd 사이 SSH로 연결한다. 앱 서버는 H2의 암호화된 개인키와 서버 신뢰 기록을 사용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="820" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">VM SSH · 앱 서버가 SSH 클라이언트가 됩니다</text>
<text x="32" y="78" font-size="17" fill="#536c60">OpenStack API로 대상을 확인하고, Paramiko로 VM의 SSH 서버에 연결합니다.</text>
<text x="32" y="126" class="heading" text-anchor="start">1. 접속 대상과 로그인 정보 확인</text>
<rect x="32" y="154" width="280" height="142" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="185" class="heading" style="fill:#29473b">브라우저 · 접속 설정</text>
<text x="50" y="212" class="body" text-anchor="start">VM 주소·OS 사용자 선택</text>
<text x="50" y="236" class="body" text-anchor="start">저장된 개인키 선택</text>
<text x="50" y="260" class="body" text-anchor="start">필요하면 개인키 암호 입력</text>
<rect x="380" y="154" width="280" height="142" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="185" class="heading" style="fill:#19674e">CloudLens 앱 서버</text>
<text x="398" y="212" class="body" text-anchor="start">openstacksdk로 VM 조회</text>
<text x="398" y="236" class="body" text-anchor="start">프로젝트·상태·주소 검증</text>
<text x="398" y="260" class="body" text-anchor="start">확인된 대상으로 티켓 발급</text>
<rect x="728" y="154" width="280" height="142" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="746" y="185" class="heading" style="fill:#365f94">OpenStack Nova API</text>
<text x="746" y="212" class="body" text-anchor="start">VM ID·소속 프로젝트</text>
<text x="746" y="236" class="body" text-anchor="start">현재 상태·접속 주소</text>
<text x="32" y="329" class="body" text-anchor="start">브라우저는 발급받은 일회성 티켓으로 아래의 터미널 WebSocket을 엽니다.</text>
<text x="32" y="384" class="heading" text-anchor="start">2. SSH 연결과 양방향 입출력</text>
<rect x="32" y="414" width="280" height="148" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="445" class="heading" style="fill:#29473b">브라우저 · xterm.js</text>
<text x="50" y="472" class="body" text-anchor="start">키보드 입력·화면 출력</text>
<text x="50" y="496" class="body" text-anchor="start">터미널 열·행 수 전달</text>
<rect x="380" y="414" width="280" height="148" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="445" class="heading" style="fill:#19674e">앱 서버 · Paramiko</text>
<text x="398" y="472" class="body" text-anchor="start">서버 공개키 대조</text>
<text x="398" y="496" class="body" text-anchor="start">개인키로 사용자 인증</text>
<text x="398" y="520" class="body" text-anchor="start">SSH 채널의 입력·출력 중계</text>
<rect x="728" y="414" width="280" height="148" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="746" y="445" class="heading" style="fill:#365f94">VM · sshd</text>
<text x="746" y="472" class="body" text-anchor="start">선택한 IP·SSH 포트</text>
<text x="746" y="496" class="body" text-anchor="start">공개키 인증 → PTY 할당</text>
<text x="746" y="520" class="body" text-anchor="start">게스트 OS 셸 실행</text>
<text x="346" y="588" class="caption" text-anchor="middle">WebSocket</text>
<text x="694" y="588" class="caption" text-anchor="middle">SSH / TCP</text>
<rect x="380" y="638" width="280" height="116" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="398" y="669" class="heading" style="fill:#6b4b9e">H2 · 사용자별 저장</text>
<text x="398" y="696" class="body" text-anchor="start">암호화된 개인키</text>
<text x="398" y="720" class="body" text-anchor="start">VM 서버 공개키 신뢰 기록</text>
<text x="32" y="682" class="heading" text-anchor="start">브라우저 ↔ 앱 서버</text>
<text x="32" y="712" class="body" text-anchor="start">터미널 입력·출력 전달</text>
<text x="728" y="682" class="heading" text-anchor="start">앱 서버 ↔ VM</text>
<text x="728" y="712" class="body" text-anchor="start">실제 SSH 세션 유지</text>
<text x="32" y="794" class="body" text-anchor="start">VM의 사설 IP 또는 Floating IP까지 접속하는 주체는 앱 서버입니다.</text>
<path d="M 312 222 L 380 222" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 222 L 728 222" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 312 484 L 380 484" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 660 484 L 728 484" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 520 638 L 520 562" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
