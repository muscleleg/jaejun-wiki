<text x="762" y="202" class="heading" style="fill:#29473b">H2 · 파일 저장</text>
<text x="762" y="229" class="body" text-anchor="start">임베디드 JVM</text>
<text x="762" y="253" class="body" text-anchor="start">계정·설정·실행 기록</text>
<text x="32" y="379" class="caption" text-anchor="start">사설망 연결</text>
<rect x="32" y="414" width="976" height="568" rx="14" fill="#eef5fd" fill-opacity="0.5" stroke="#c1d6ef"/>
<text x="52" y="444" class="heading" text-anchor="start">OpenStack · 관리 인프라</text>
