<text x="442" y="806" class="body" text-anchor="start">시계열 → Cinder PVC</text>
<rect x="760" y="700" width="200" height="147" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="778" y="731" class="heading" style="fill:#6b4b9e">Qwen3.5-9B</text>
<text x="778" y="758" class="body" text-anchor="start">llama.cpp · Q4_K_M</text>
