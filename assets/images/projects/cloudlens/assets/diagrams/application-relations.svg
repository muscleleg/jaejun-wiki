<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc">
<title id="title">앱의 주변 자원을 연결하는 필드</title><desc id="desc">Service selector와 EndpointSlice 대상 참조로 Pod를 연결하고 외부 경로의 backend와 parent 참조를 읽는다. Pod는 claimName으로 PVC, nodeName으로 Node에 연결된다. PVC는 volumeName으로 PV, Node는 providerID UUID로 VM에 연결된다. GPU는 자원 요청과 DRA 참조를 사용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="788" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">앱의 주변 자원을 연결하는 필드</text>
<text x="32" y="78" font-size="17" fill="#536c60">소유 관계로 정한 앱 범위에서 네트워크·저장소·실행 위치를 확장합니다.</text>
<rect x="32" y="130" width="280" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
