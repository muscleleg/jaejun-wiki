<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc">
<title id="title">화면 요청에서 인프라 API까지</title><desc id="desc">React가 선택한 프로필과 자원으로 FastAPI를 호출한다. FastAPI는 H2의 설정을 사용하고 자원 처리, 지표 조회, 모델 호출을 각 외부 시스템으로 연결한다.</desc>
