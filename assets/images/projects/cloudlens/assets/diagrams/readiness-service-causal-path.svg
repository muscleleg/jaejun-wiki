<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="943" viewBox="0 0 1120 943" role="img" aria-labelledby="title desc">
<title id="title">Running인 Pod도 Service의 준비된 대상이 아닐 수 있음</title><desc id="desc">ember 검증 사례: 설정 → 관측한 증상 → 서비스 영향 → 확인 순서</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="941" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">Running인 Pod도 Service의 준비된 대상이 아닐 수 있음</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">ember 검증 사례: 설정 → 관측한 증상 → 서비스 영향 → 확인 순서</text>
<polyline points="288,261 288,341" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,261 832,341" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,478 832,552" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,664 832,739" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="125" width="504" height="136" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">앱의 실행 설정</text><text x="56" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">/www/index.html 생성</text><text x="56" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">8080 포트로 HTTP 서버 실행</text><rect x="580" y="125" width="504" height="136" rx="12" fill="#fff7ec" stroke="#edd9bb" stroke-width="1.5"/><text x="600" y="158" font-size="21" font-weight="700" fill="#926025" text-anchor="start">readiness probe 설정</text><text x="600" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">같은 포트의 /ready 요청</text><text x="600" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">앱에서 제공하지 않는 경로</text><rect x="36" y="341" width="504" height="137" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="374" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Pod phase: Running</text><text x="56" y="405" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">컨테이너 프로세스는 실행 중</text><text x="56" y="432" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">앱이 시작되지 않았다는 뜻이 아님</text><rect x="580" y="341" width="504" height="137" rx="12" fill="#fff7ec" stroke="#edd9bb" stroke-width="1.5"/><text x="600" y="374" font-size="21" font-weight="700" fill="#926025" text-anchor="start">probe 실패 · HTTP 404</text><text x="600" y="405" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Pod Ready = False</text><text x="600" y="432" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">이벤트에 응답 코드 기록</text><rect x="580" y="552" width="504" height="112" rx="12" fill="#fff7ec" stroke="#edd9bb" stroke-width="1.5"/><text x="600" y="585" font-size="21" font-weight="700" fill="#926025" text-anchor="start">EndpointSlice</text><text x="600" y="616" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">ready = false · serving = false</text><rect x="36" y="739" width="1048" height="165" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="772" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">같은 원인을 따라 확인하고 수정</text><text x="56" y="803" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">1. Pod의 /ready와 /index.html을 직접 요청해 상태 코드 비교</text><text x="56" y="830" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">2. 경로 불일치 확인 후 probe 경로 또는 앱 endpoint 수정</text><text x="56" y="857" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">3. Pod Ready · EndpointSlice 준비 상태 · Service 경유 응답 확인</text><text x="60" y="583" font-size="22" font-weight="700" fill="#4c6b5e" text-anchor="start">프로세스 실행 여부와</text><text x="60" y="618" font-size="22" font-weight="700" fill="#4c6b5e" text-anchor="start">요청을 받을 준비 상태를 구분</text></svg>
