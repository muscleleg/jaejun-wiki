<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="932" viewBox="0 0 1120 932" role="img" aria-labelledby="title desc">
<title id="title">일괄 작업의 접수 결과와 자원의 실제 상태</title><desc id="desc">한 번의 사용자 요청을 대상별로 제출하고, 이후 진행 상태는 목록 갱신으로 확인합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="930" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">일괄 작업의 접수 결과와 자원의 실제 상태</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">한 번의 사용자 요청을 대상별로 제출하고, 이후 진행 상태는 목록 갱신으로 확인합니다.</text>
<rect x="36" y="289" width="504" height="563" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="321" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">대상별 API 제출 · 서버 기록</text><rect x="580" y="289" width="504" height="563" rx="16" fill="#f4f0fc" fill-opacity=".55" stroke="#d8c9ef"/><text x="600" y="321" font-size="20" font-weight="700" fill="#7350a6" text-anchor="start">인프라 상태 갱신 · 화면 목록</text><polyline points="288,475 288,514" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,636 288,675" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,475 832,514" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,636 832,675" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,229 288,289" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="516,575 558,575 558,414 604,414" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="124" width="1048" height="105" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="157" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">선택한 자원 + 작업 + 공통 입력 + 요청 ID</text><text x="56" y="188" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서버가 배치와 각 대상의 작업 기록을 먼저 생성</text><rect x="60" y="353" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="386" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">대상 A · queued → applying</text><text x="80" y="417" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">권한 · 입력 · 현재 상태 검사</text><rect x="60" y="514" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="547" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">원격 API 호출 → 접수 응답</text><text x="80" y="578" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">accepted / skipped / failed /</text><text x="80" y="605" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">unknown / not_submitted 기록</text><rect x="60" y="675" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="708" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">다음 대상 B → C</text><text x="80" y="739" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">이전 대상의 접수 응답 후 제출</text><text x="80" y="766" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">실제 삭제·정지 완료까지 기다리지 않음</text><rect x="604" y="353" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="624" y="386" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Kubernetes / OpenStack</text><text x="624" y="417" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">접수한 작업을 실행</text><rect x="604" y="514" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="624" y="547" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">목록 구독</text><text x="624" y="578" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Kubernetes list · watch</text><text x="624" y="605" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">OpenStack 주기 조회의 차이 계산</text><rect x="604" y="675" width="456" height="122" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="624" y="708" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">브라우저 목록 갱신</text><text x="624" y="739" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">BUILD · ACTIVE · ERROR · 삭제</text><text x="624" y="766" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">SSE snapshot / patch로 반영</text><text x="36" y="901" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">API가 요청을 접수한 상태와 자원의 작업이 완료된 상태는 각각의 경로에서 기록·표시됩니다.</text></svg>
