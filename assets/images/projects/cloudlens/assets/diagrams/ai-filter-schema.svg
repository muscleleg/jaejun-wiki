<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">자원에 맞는 필터만 모델에 제공</title><desc id="desc">OpenAPI 또는 CRD에서 읽은 필드 정의와 서버에 등록된 필터를 대조한다. 필드 존재 여부, 타입과 enum을 검사해 지원하는 필터 정의만 모델에 제공한다. Pod의 status.phase는 문자열 단계 필터로 연결되며 모델은 Running 값을 선택한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="528" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">자원에 맞는 필터만 모델에 제공</text>
<text x="32" y="78" font-size="17" fill="#536c60">필터의 실행 코드는 서버에 등록하고, Kubernetes 스키마로 사용할 수 있는 조건을 확인합니다.</text>
<rect x="32" y="128" width="290" height="112" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="159" class="heading" style="fill:#365f94">자원 스키마</text>
<text x="50" y="186" class="body" text-anchor="start">기본 자원 → OpenAPI</text>
<text x="50" y="210" class="body" text-anchor="start">사용자 정의 자원 → CRD</text>
<rect x="32" y="280" width="290" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="311" class="heading" style="fill:#19674e">등록된 필터</text>
<text x="50" y="338" class="body" text-anchor="start">이름 · 상태 · 라벨 등 조건</text>
<text x="50" y="362" class="body" text-anchor="start">조건별 검사 함수와 대상 필드</text>
<rect x="396" y="194" width="270" height="132" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="414" y="225" class="heading" style="fill:#19674e">서버 · 스키마 대조</text>
<text x="414" y="252" class="body" text-anchor="start">필드 존재 여부 · 타입 · enum</text>
<text x="414" y="276" class="body" text-anchor="start">지원하는 조건만 남김</text>
<rect x="740" y="194" width="268" height="132" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="758" y="225" class="heading" style="fill:#6b4b9e">모델 · 필터 값 선택</text>
<text x="758" y="252" class="body" text-anchor="start">현재 요청 + 사용할 필터 정의</text>
<text x="758" y="276" class="body" text-anchor="start">조회된 목록은 전달하지 않음</text>
<rect x="32" y="426" width="976" height="76" rx="14" fill="#ffffff" fill-opacity="0.5" stroke="#d7e1dc"/>
<text x="52" y="456" class="heading" text-anchor="start">Pod 예시</text>
<text x="176" y="472" class="body" text-anchor="start">status.phase: string  →  phase 필터  →  모델이 {&quot;phase&quot;:&quot;Running&quot;} 선택</text>
<path d="M 322 184 L 359 184 L 359 233 L 396 233" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 322 336 L 359 336 L 359 287 L 396 287" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 666 260 L 740 260" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
