<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">VM 콘솔 · URL 발급과 화면 중계는 다른 경로입니다</title><desc id="desc">첫 번째 경로는 브라우저, CloudLens 앱 서버의 OpenStack SDK, Nova API 사이의 콘솔 URL 발급이다. 두 번째 경로는 브라우저 noVNC, nova-novncproxy, 컴퓨트 호스트의 VNC 서버를 잇는 실제 화면과 입력 중계다. CloudLens 앱 서버는 두 번째 경로에 포함되지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="798" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">VM 콘솔 · URL 발급과 화면 중계는 다른 경로입니다</text>
<text x="32" y="78" font-size="17" fill="#536c60">CloudLens는 콘솔 URL을 요청하고, 브라우저의 noVNC가 OpenStack 콘솔 프록시에 연결합니다.</text>
<text x="32" y="126" class="heading" text-anchor="start">1. 콘솔 URL 발급</text>
<rect x="32" y="158" width="280" height="138" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="189" class="heading" style="fill:#29473b">브라우저 · 콘솔 탭</text>
<text x="50" y="216" class="body" text-anchor="start">선택한 VM ID 전달</text>
<text x="50" y="240" class="body" text-anchor="start">반환된 URL을 iframe에 설정</text>
<rect x="380" y="158" width="280" height="138" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="189" class="heading" style="fill:#19674e">CloudLens 앱 서버</text>
<text x="398" y="216" class="body" text-anchor="start">openstacksdk로 Nova 호출</text>
<text x="398" y="240" class="body" text-anchor="start">protocol: vnc / type: novnc</text>
<text x="398" y="264" class="body" text-anchor="start">URL 형식 검사 후 반환</text>
<rect x="728" y="158" width="280" height="138" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="746" y="189" class="heading" style="fill:#365f94">Nova API</text>
<text x="746" y="216" class="body" text-anchor="start">대상 VM의 콘솔 접근 요청</text>
<text x="746" y="240" class="body" text-anchor="start">토큰이 포함된 URL 발급</text>
<text x="346" y="323" class="caption" text-anchor="middle">HTTP 응답</text>
<text x="694" y="323" class="caption" text-anchor="middle">콘솔 URL</text>
<text x="32" y="388" class="heading" text-anchor="start">2. noVNC 화면과 키보드·마우스 중계</text>
<rect x="32" y="422" width="280" height="150" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="453" class="heading" style="fill:#29473b">브라우저 · noVNC</text>
<text x="50" y="480" class="body" text-anchor="start">OpenStack 콘솔 화면 로드</text>
<text x="50" y="504" class="body" text-anchor="start">VM 화면 표시</text>
<text x="50" y="528" class="body" text-anchor="start">키보드·마우스 입력 전달</text>
<rect x="380" y="422" width="280" height="150" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="398" y="453" class="heading" style="fill:#365f94">nova-novncproxy</text>
<text x="398" y="480" class="body" text-anchor="start">콘솔 토큰 확인</text>
<text x="398" y="504" class="body" text-anchor="start">대상 VM의 VNC 서버 선택</text>
<text x="398" y="528" class="body" text-anchor="start">화면·입력 중계</text>
<rect x="728" y="422" width="280" height="150" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="746" y="453" class="heading" style="fill:#6b4b9e">컴퓨트 호스트 · VNC</text>
<text x="746" y="480" class="body" text-anchor="start">하이퍼바이저의 VM 콘솔</text>
<text x="746" y="504" class="body" text-anchor="start">VM 화면·입력 장치에 연결</text>
<text x="346" y="602" class="caption" text-anchor="middle">WebSocket</text>
<text x="694" y="602" class="caption" text-anchor="middle">VNC</text>
<rect x="32" y="654" width="616" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="685" class="heading" style="fill:#19674e">화면 중계는 OpenStack이 담당</text>
<text x="50" y="712" class="body" text-anchor="start">브라우저가 콘솔 프록시에 직접 연결합니다.</text>
<text x="50" y="736" class="body" text-anchor="start">CloudLens 앱 서버는 콘솔 URL 발급에만 관여합니다.</text>
<rect x="728" y="654" width="280" height="112" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="746" y="685" class="heading" style="fill:#6b4b9e">VM 화면</text>
<text x="746" y="712" class="body" text-anchor="start">부팅 화면·OS 로그인</text>
<text x="746" y="736" class="body" text-anchor="start">게스트 SSH 서비스 불필요</text>
<path d="M 312 202 L 380 202" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 202 L 728 202" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 728 258 L 660 258" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<path d="M 380 258 L 312 258" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<path d="M 312 494 L 380 494" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 660 494 L 728 494" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 868 572 L 868 654" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
