<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="824" viewBox="0 0 1040 824" role="img" aria-labelledby="title desc">
<title id="title">Pod 터미널 · Kubernetes exec로 셸을 실행합니다</title><desc id="desc">브라우저가 컨테이너와 셸을 선택하면 앱 서버가 Pod UID와 상태를 검증하고 일회성 티켓을 발급한다. 브라우저 xterm.js는 앱 서버와 WebSocket으로 통신한다. 앱 서버는 Kubernetes Python SDK로 API server에 exec 스트림을 열고, 노드의 kubelet과 런타임을 통해 컨테이너 셸을 실행한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="822" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">Pod 터미널 · Kubernetes exec로 셸을 실행합니다</text>
<text x="32" y="78" font-size="17" fill="#536c60">컨테이너에 SSH로 로그인하는 대신, Kubernetes API에 터미널 세션을 요청합니다.</text>
<text x="32" y="126" class="heading" text-anchor="start">1. 대상과 셸 확인</text>
<rect x="56" y="158" width="390" height="142" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="74" y="189" class="heading" style="fill:#29473b">브라우저 · Pod 상세</text>
<text x="74" y="216" class="body" text-anchor="start">실행 중인 컨테이너 선택</text>
<text x="74" y="240" class="body" text-anchor="start">/bin/sh 또는 /bin/bash 선택</text>
<text x="74" y="264" class="body" text-anchor="start">선택한 Pod의 이름·Namespace·UID 전달</text>
<rect x="594" y="158" width="390" height="142" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="612" y="189" class="heading" style="fill:#19674e">CloudLens 앱 서버</text>
<text x="612" y="216" class="body" text-anchor="start">Kubernetes API로 Pod·컨테이너 상태 확인</text>
<text x="612" y="240" class="body" text-anchor="start">Pod UID 대조·선택 가능한 셸 확인</text>
<text x="612" y="264" class="body" text-anchor="start">사용자와 접속 대상에 묶인 티켓 발급</text>
<text x="32" y="362" class="heading" text-anchor="start">2. exec 스트림과 터미널 입출력</text>
<rect x="56" y="396" width="250" height="138" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="74" y="427" class="heading" style="fill:#29473b">브라우저 · xterm.js</text>
<text x="74" y="454" class="body" text-anchor="start">첫 메시지로 티켓 전달</text>
<text x="74" y="478" class="body" text-anchor="start">키 입력·화면 출력</text>
<text x="74" y="502" class="body" text-anchor="start">열·행 수 변경</text>
<rect x="394" y="396" width="250" height="138" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="412" y="427" class="heading" style="fill:#19674e">CloudLens 앱 서버</text>
<text x="412" y="454" class="body" text-anchor="start">Kubernetes Python SDK</text>
<text x="412" y="478" class="body" text-anchor="start">exec 요청·입출력 중계</text>
<text x="412" y="502" class="body" text-anchor="start">kubeconfig로 인증</text>
<rect x="732" y="396" width="250" height="138" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="750" y="427" class="heading" style="fill:#365f94">Kubernetes API server</text>
<text x="750" y="454" class="body" text-anchor="start">pods/exec 요청</text>
<text x="750" y="478" class="body" text-anchor="start">인증·RBAC 권한 확인</text>
<text x="750" y="502" class="body" text-anchor="start">대상 노드로 연결</text>
<text x="350" y="566" class="caption" text-anchor="middle">WebSocket</text>
<text x="688" y="566" class="caption" text-anchor="middle">exec / WebSocket</text>
<rect x="732" y="634" width="250" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="750" y="665" class="heading" style="fill:#365f94">대상 노드</text>
<text x="750" y="692" class="body" text-anchor="start">kubelet</text>
<text x="750" y="716" class="body" text-anchor="start">컨테이너 런타임</text>
<rect x="394" y="634" width="250" height="110" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="412" y="665" class="heading" style="fill:#6b4b9e">선택한 컨테이너</text>
<text x="412" y="692" class="body" text-anchor="start">셸 실행·TTY 세션</text>
<text x="412" y="716" class="body" text-anchor="start">표준 입력·출력</text>
<text x="56" y="672" class="heading" text-anchor="start">SSH 키·Pod의 22번 포트</text>
<text x="56" y="704" class="body" text-anchor="start">대신 Kubernetes exec 사용</text>
<text x="32" y="792" class="body" text-anchor="start">브라우저의 WebSocket과 SDK의 exec 스트림을 앱 서버가 연결합니다.</text>
