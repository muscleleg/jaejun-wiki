<path d="M 857 534 L 857 634" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 732 688 L 644 688" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="477.0" y="170" width="86" height="24" rx="5" fill="#f7faf8"/>
<text x="520" y="187" class="caption" text-anchor="middle">HTTP 요청</text>
<rect x="470.5" y="271" width="99" height="24" rx="5" fill="#f7faf8"/>
<text x="520" y="288" class="caption" text-anchor="middle">일회성 티켓</text>
