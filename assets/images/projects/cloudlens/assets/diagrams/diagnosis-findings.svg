<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">한 원인에 증상·근거·다음 행동 연결</title><desc id="desc">관측한 증상과 근거 ID를 원인 ID에 연결한다. 원인에는 판단 수준과 다음 행동이 붙는다. 다음 행동은 확인 대상과 기대 결과, 조건에 따른 조치를 담는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="568" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">한 원인에 증상·근거·다음 행동 연결</text>
<text x="32" y="78" font-size="17" fill="#536c60">화면은 같은 원인을 설명하는 내용을 한 카드 안에서 보여줍니다.</text>
<rect x="32" y="132" width="280" height="132" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="163" class="heading" style="fill:#365f94">관측한 증상</text>
<text x="50" y="190" class="body" text-anchor="start">설정·상태에서 읽은 내용</text>
<text x="50" y="214" class="body" text-anchor="start">이벤트·로그의 현상</text>
<rect x="380" y="132" width="280" height="132" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="398" y="163" class="heading" style="fill:#6b4b9e">원인 항목</text>
<text x="398" y="190" class="body" text-anchor="start">원인 ID·설명·판단 수준</text>
<text x="398" y="214" class="body" text-anchor="start">연결된 증상과 근거 ID</text>
<rect x="728" y="132" width="280" height="132" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="746" y="163" class="heading" style="fill:#19674e">추천하는 다음 행동</text>
<text x="746" y="190" class="body" text-anchor="start">먼저 확인할 대상</text>
<text x="746" y="214" class="body" text-anchor="start">기대 결과 → 조건에 따른 조치</text>
<rect x="32" y="369" width="280" height="132" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="400" class="heading" style="fill:#365f94">수집한 근거</text>
<text x="50" y="427" class="body" text-anchor="start">대상 자원·시각·근거 ID</text>
<text x="50" y="451" class="body" text-anchor="start">설정 / 이벤트 / 로그 원문</text>
<rect x="728" y="369" width="280" height="132" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="746" y="400" class="heading" style="fill:#19674e">화면 표시</text>
<text x="746" y="427" class="body" text-anchor="start">원인과 행동을 먼저 표시</text>
<text x="746" y="451" class="body" text-anchor="start">근거는 펼쳐 원문 확인</text>
<path d="M 312 199 L 380 199" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 199 L 728 199" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 172 369 L 172 264" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 312 435 L 520 435 L 520 264" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 868 264 L 868 369" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="485.0" y="322" width="70" height="24" rx="5" fill="#f7faf8"/>
<text x="520" y="339" class="caption" text-anchor="middle">인용 ID</text>
</svg>
