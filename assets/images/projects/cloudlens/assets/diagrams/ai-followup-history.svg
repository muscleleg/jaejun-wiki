<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">“그중에서”는 이전 작업의 대상과 조건을 이어받음</title><desc id="desc">이전 요청에서 default 네임스페이스의 이름에 api를 포함하는 Pod를 조회해 두 개를 표시했다. 실행 기록을 코드로 문장화한다. 그중 Running인 것만이라는 새 요청과 함께 모델에 제공하면 namespace와 이름 조건은 유지하고 Running 조건을 추가한 담당 요청을 만든다. 이후 도구와 필터 단계에는 이 요청만 전달한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="668" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">“그중에서”는 이전 작업의 대상과 조건을 이어받음</text>
<text x="32" y="78" font-size="17" fill="#536c60">저장된 실행 기록을 코드가 짧은 문장으로 만들고, 첫 요청 분류에만 사용합니다.</text>
<rect x="32" y="126" width="456" height="134" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="157" class="heading" style="fill:#365f94">H2 · 이전 실행 기록</text>
<text x="50" y="184" class="body" text-anchor="start">요청: default의 Pod 중 이름에 api 포함</text>
<text x="50" y="208" class="body" text-anchor="start">조회: Pod · namespace=default</text>
<text x="50" y="232" class="body" text-anchor="start">필터: name_contains=api · 완료 · 2개 표시</text>
<rect x="576" y="126" width="432" height="134" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="594" y="157" class="heading" style="fill:#29473b">사용자의 후속 질문</text>
<text x="594" y="184" class="body" text-anchor="start">“그중 Running인 것만 보여줘”</text>
<rect x="32" y="330" width="456" height="134" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="361" class="heading" style="fill:#19674e">코드 · 작업 이력을 문장으로 정리</text>
<text x="50" y="388" class="body" text-anchor="start">“default에서 Pod를 조회했고,</text>
<text x="50" y="412" class="body" text-anchor="start">이름에 api가 포함된 2개를 보여줬다.”</text>
<text x="50" y="436" class="body" text-anchor="start">같은 연결의 최근 최대 3개 작업 · 4,500자</text>
<rect x="576" y="330" width="432" height="134" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="594" y="361" class="heading" style="fill:#6b4b9e">모델 · 이번에 처리할 요청 정리</text>
<text x="594" y="388" class="body" text-anchor="start">이어받음: default · Pod · 이름에 api</text>
<text x="594" y="412" class="body" text-anchor="start">추가 조건: Running</text>
<text x="594" y="436" class="body" text-anchor="start">새로운 조회 요청이면 이전 조건을 물려주지 않음</text>
<rect x="32" y="536" width="976" height="102" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="567" class="heading" style="fill:#19674e">도구·필터 단계에 전달하는 요청</text>
<text x="50" y="594" class="body" text-anchor="start">“default에서 이름에 api가 포함되고 Running인 Pod를 보여줘.”</text>
<path d="M 260 260 L 260 330" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 792 260 L 792 330" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 488 397 L 576 397" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 792 464 L 792 536" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
