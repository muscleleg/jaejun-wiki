<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="702" viewBox="0 0 1040 702" role="img" aria-labelledby="title desc">
<title id="title">질문의 목적에 따라 처리 경로가 달라짐</title><desc id="desc">목록 요청은 함수와 필터 선택 후 서버가 조회와 필터를 실행한다. 관계 요청은 참조를 연결한다. 앱 구성 요청은 앱 범위를 찾고 그래프를 만든다. 장애 진단은 앱 자료를 수집한 뒤 모델이 원인과 다음 행동을 해석한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="700" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">질문의 목적에 따라 처리 경로가 달라짐</text>
<text x="32" y="78" font-size="17" fill="#536c60">모델이 조회 그룹이나 조사 도구를 선택하면, 해당 경로에서 결과를 만듭니다.</text>
<text x="32" y="126" class="caption" text-anchor="start">사용자 질문</text>
<text x="356" y="126" class="caption" text-anchor="start">선택된 경로에서 처리하는 일</text>
<text x="784" y="126" class="caption" text-anchor="start">화면에 표시</text>
<rect x="32" y="150" width="280" height="110" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="181" class="heading" style="fill:#29473b">목록 조회</text>
<text x="50" y="208" class="body" text-anchor="start">“Running인 Pod 보여줘”</text>
<rect x="356" y="150" width="384" height="110" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="374" y="181" class="heading" style="fill:#19674e">조회 함수·필터 선택</text>
<text x="374" y="208" class="body" text-anchor="start">서버가 SDK 조회 후 조건에 맞는 행 추출</text>
<rect x="784" y="150" width="224" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="802" y="181" class="heading" style="fill:#365f94">목록 카드</text>
<text x="802" y="208" class="body" text-anchor="start">API 값 · 자원 상세 이동</text>
<rect x="32" y="284" width="280" height="110" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="315" class="heading" style="fill:#29473b">자원 간 관계</text>
<text x="50" y="342" class="body" text-anchor="start">“이 PVC를 쓰는 자원은?”</text>
<rect x="356" y="284" width="384" height="110" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="374" y="315" class="heading" style="fill:#19674e">관계 조사 도구</text>
<text x="374" y="342" class="body" text-anchor="start">서버가 볼륨 참조·소유 관계를 연결</text>
<rect x="784" y="284" width="224" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="802" y="315" class="heading" style="fill:#365f94">연결된 자원</text>
<text x="802" y="342" class="body" text-anchor="start">사용처 · 연결 근거</text>
<rect x="32" y="418" width="280" height="110" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="449" class="heading" style="fill:#29473b">앱 구성</text>
<text x="50" y="476" class="body" text-anchor="start">“Open WebUI 구성 보여줘”</text>
<rect x="356" y="418" width="384" height="110" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="374" y="449" class="heading" style="fill:#19674e">앱 조사 도구</text>
<text x="374" y="476" class="body" text-anchor="start">서버가 앱 범위·연결·실행 위치를 계산</text>
<rect x="784" y="418" width="224" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="802" y="449" class="heading" style="fill:#365f94">컴포넌트 그래프</text>
<text x="802" y="476" class="body" text-anchor="start">워크로드 · 네트워크 · 저장소</text>
<rect x="32" y="552" width="280" height="110" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="583" class="heading" style="fill:#29473b">장애 진단</text>
<text x="50" y="610" class="body" text-anchor="start">“Open WebUI가 왜 안 돼?”</text>
<rect x="356" y="552" width="384" height="110" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="374" y="583" class="heading" style="fill:#6b4b9e">자료 수집 → 모델 해석</text>
<text x="374" y="610" class="body" text-anchor="start">설정·상태·이벤트·로그로 원인을 조사</text>
<rect x="784" y="552" width="224" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="802" y="583" class="heading" style="fill:#365f94">진단 보고서</text>
<text x="802" y="610" class="body" text-anchor="start">증상 · 원인 · 다음 행동</text>
<path d="M 312 205 L 356 205" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 205 L 784 205" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 312 339 L 356 339" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 339 L 784 339" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 312 473 L 356 473" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 473 L 784 473" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 312 607 L 356 607" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 607 L 784 607" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
