<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-labelledby="title desc">
<title id="title">모델은 조건을 고르고, 서버는 데이터를 처리</title><desc id="desc">모델은 그룹과 담당 요청을 선택하고 그룹 내 함수와 인자를 선택한다. 서버가 검증 후 SDK로 조회한 원본 목록을 보관한다. 모델에는 요청과 자원 스키마에 맞는 필터 정의만 주며 반환한 조건을 서버가 원본에 적용해 카드를 만든다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="1048" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">모델은 조건을 고르고, 서버는 데이터를 처리</text>
<text x="32" y="78" font-size="17" fill="#536c60">조회된 행은 필터 선택 모델을 거치지 않고 결과 카드로 전달됩니다.</text>
<rect x="32" y="120" width="458" height="890" rx="14" fill="#f4f0fc" fill-opacity="0.5" stroke="#d4c8ec"/>
<text x="52" y="150" class="heading" text-anchor="start">모델이 결정하는 값</text>
<rect x="550" y="120" width="458" height="890" rx="14" fill="#ecf7f1" fill-opacity="0.5" stroke="#b9dacc"/>
<text x="570" y="150" class="heading" text-anchor="start">서버가 실행하는 처리</text>
<rect x="56" y="182" width="410" height="115" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="74" y="213" class="heading" style="fill:#6b4b9e">1. 그룹과 담당 요청</text>
<text x="74" y="240" class="body" text-anchor="start">현재 질문 + 짧은 작업 이력</text>
<text x="74" y="264" class="body" text-anchor="start">그룹 설명으로 조회 분야 선택</text>
<rect x="56" y="364" width="410" height="115" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="74" y="395" class="heading" style="fill:#6b4b9e">2. 조회 함수와 인자</text>
<text x="74" y="422" class="body" text-anchor="start">선택한 그룹의 도구 정의</text>
<text x="74" y="446" class="body" text-anchor="start">Namespace 등 조회 조건 결정</text>
<rect x="574" y="364" width="410" height="115" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="592" y="395" class="heading" style="fill:#19674e">인자 검증 → SDK 조회</text>
<text x="592" y="422" class="body" text-anchor="start">허용 함수·JSON Schema 검사</text>
<text x="592" y="446" class="body" text-anchor="start">Kubernetes / OpenStack 호출</text>
<rect x="574" y="547" width="410" height="114" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="592" y="578" class="heading" style="fill:#19674e">원본 목록 보관</text>
<text x="592" y="605" class="body" text-anchor="start">SDK 객체와 화면 표시 행</text>
<text x="592" y="629" class="body" text-anchor="start">실행 기록에도 저장</text>
<rect x="56" y="718" width="410" height="115" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="74" y="749" class="heading" style="fill:#6b4b9e">3. 필터와 값</text>
<text x="74" y="776" class="body" text-anchor="start">담당 요청 + 종류·조회 범위</text>
<text x="74" y="800" class="body" text-anchor="start">자원 스키마에 맞는 필터 정의</text>
<rect x="574" y="718" width="410" height="115" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="592" y="749" class="heading" style="fill:#19674e">원본에 조건 적용</text>
<text x="592" y="776" class="body" text-anchor="start">선택 조건 검증</text>
<text x="592" y="800" class="body" text-anchor="start">일치하는 객체·표시 행 추출</text>
<rect x="574" y="898" width="410" height="82" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="592" y="929" class="heading" style="fill:#365f94">결과 카드·상세 이동 링크</text>
<text x="56" y="929" class="body" text-anchor="start">모델 호출은 단계별로 필요한</text>
<text x="56" y="955" class="body" text-anchor="start">요청·도구 정의만 사용합니다.</text>
<path d="M 261 297 L 261 364" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 466 421 L 574 421" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 779 479 L 779 547" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 261 479 L 261 718" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<path d="M 466 775 L 574 775" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 779 661 L 779 718" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 779 833 L 779 898" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="139.5" y="587" width="243" height="24" rx="5" fill="#f7faf8"/>
<text x="261" y="604" class="caption" text-anchor="middle">원본 행을 입력에 추가하지 않음</text>
<rect x="497.0" y="742" width="46" height="24" rx="5" fill="#f7faf8"/>
<text x="520" y="759" class="caption" text-anchor="middle">조건</text>
<rect x="729.5" y="682" width="99" height="24" rx="5" fill="#f7faf8"/>
<text x="779" y="699" class="caption" text-anchor="middle">원본 데이터</text>
</svg>
