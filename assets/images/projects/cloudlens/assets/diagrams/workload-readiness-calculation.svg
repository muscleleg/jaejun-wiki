<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="894" viewBox="0 0 1120 894" role="img" aria-labelledby="title desc">
<title id="title">앱의 준비 상태는 컨트롤러별로 계산</title><desc id="desc">현재 실행을 담당하는 워크로드를 기준으로 준비 수와 목표 수를 함께 표시합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="892" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">앱의 준비 상태는 컨트롤러별로 계산</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">현재 실행을 담당하는 워크로드를 기준으로 준비 수와 목표 수를 함께 표시합니다.</text>
<polyline points="288,223 288,300" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,223 832,300" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,467 288,511 560,511 560,756" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,467 832,511 560,511" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,689 832,756" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="125" width="1048" height="98" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="158" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">상위 애플리케이션 · LLMInferenceService 예시</text><text x="56" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">소유 관계로 연결된 서로 다른 역할의 컨트롤러를 각각 구분</text><rect x="36" y="300" width="504" height="167" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="333" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">추론 Deployment</text><text x="56" y="364" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">spec.replicas = 0</text><text x="56" y="391" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">활성 Pod 없음</text><text x="56" y="418" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">표시: 0 / 0 · 0개로 축소됨</text><rect x="580" y="300" width="504" height="167" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="600" y="333" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">라우터 Deployment</text><text x="600" y="364" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">spec.replicas = 1</text><text x="600" y="391" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">소유한 활성 Pod 1개 준비됨</text><text x="600" y="418" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">표시: 1 / 1 · 준비됨</text><rect x="36" y="551" width="504" height="138" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="584" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">과거 ReplicaSet</text><text x="56" y="615" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Deployment의 배포 이력</text><text x="56" y="642" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">이전 복제 수를 목표에 중복 합산하지 않음</text><rect x="580" y="551" width="504" height="138" rx="12" fill="#fff7ec" stroke="#edd9bb" stroke-width="1.5"/><text x="600" y="584" font-size="21" font-weight="700" fill="#926025" text-anchor="start">별도로 유지하는 앱 상태</text><text x="600" y="615" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">상위 CR의 Ready 조건 · 연결 자원 이슈</text><text x="600" y="642" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Pod 준비 수가 맞아도 확인 필요할 수 있음</text><rect x="36" y="756" width="1048" height="98" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="789" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">통합 현황 · 워크로드별 준비 / 목표 + 앱 이슈</text><text x="56" y="820" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">0 / 0인 역할과 1 / 1인 역할을 한 개의 Pod 준비 숫자로 뭉치지 않음</text></svg>
