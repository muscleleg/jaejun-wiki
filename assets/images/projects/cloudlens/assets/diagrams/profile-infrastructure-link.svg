<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">클러스터 연결과 VM 식별은 두 단계</title><desc id="desc">Kubernetes 프로필의 인프라 연결은 OpenStack 프로필을 선택한다. Node providerID에서 UUID를 추출하고 선택된 클라우드에서 같은 ID의 VM을 조회해 Node VM 관계를 만든다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="638" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">클러스터 연결과 VM 식별은 두 단계</text>
<text x="32" y="78" font-size="17" fill="#536c60">프로필은 조회할 클라우드를 정하고, providerID는 그 안의 VM을 정합니다.</text>
<rect x="32" y="126" width="420" height="116" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="157" class="heading" style="fill:#19674e">Kubernetes 연결 프로필</text>
<text x="50" y="184" class="body" text-anchor="start">인프라 종류: OpenStack</text>
<text x="50" y="208" class="body" text-anchor="start">연결할 OpenStack 프로필 ID</text>
<rect x="588" y="126" width="420" height="116" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="606" y="157" class="heading" style="fill:#365f94">OpenStack 연결 프로필</text>
<text x="606" y="184" class="body" text-anchor="start">조회할 클라우드·인증 설정</text>
<rect x="32" y="333" width="420" height="116" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="364" class="heading" style="fill:#19674e">Node의 providerID</text>
<text x="50" y="391" class="body" text-anchor="start">openstack:///UUID</text>
<text x="50" y="415" class="body" text-anchor="start">개별 VM의 UUID 추출</text>
<rect x="588" y="333" width="420" height="116" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="606" y="364" class="heading" style="fill:#365f94">해당 클라우드에서 VM 조회</text>
<text x="606" y="391" class="body" text-anchor="start">VM ID = providerID의 UUID</text>
<rect x="300" y="533" width="440" height="76" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="318" y="564" class="heading" style="fill:#19674e">앱 구성의 Node ↔ VM 연결</text>
<path d="M 452 184 L 588 184" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 242 242 L 242 333" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 798 242 L 798 333" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 452 391 L 588 391" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 798 449 L 798 492 L 520 492 L 520 533" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
