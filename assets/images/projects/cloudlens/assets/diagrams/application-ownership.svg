<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
<title id="title">Pod에서 앱의 관리 주체 찾기</title><desc id="desc">Pod의 ownerReferences가 ReplicaSet을 가리키고 ReplicaSet은 Deployment를 가리킨다. Deployment에 상위 소유자가 있다면 사용자 정의 자원까지 올라간다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="328" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">Pod에서 앱의 관리 주체 찾기</text>
<text x="32" y="78" font-size="17" fill="#536c60">ownerReferences의 UID를 역으로 따라가 최상위 소유자를 찾습니다.</text>
<rect x="32" y="141" width="208" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="172" class="heading" style="fill:#19674e">Pod</text>
<text x="50" y="199" class="body" text-anchor="start">실행된 컨테이너</text>
<rect x="288" y="141" width="208" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="306" y="172" class="heading" style="fill:#19674e">ReplicaSet</text>
<text x="306" y="199" class="body" text-anchor="start">Pod 복제 관리</text>
<rect x="544" y="141" width="208" height="112" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="562" y="172" class="heading" style="fill:#19674e">Deployment</text>
<text x="562" y="199" class="body" text-anchor="start">배포 관리</text>
<rect x="800" y="141" width="208" height="112" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="818" y="172" class="heading" style="fill:#6b4b9e">사용자 정의 자원</text>
<text x="818" y="199" class="body" text-anchor="start">상위 소유자가 있을 때</text>
<text x="32" y="294" class="body" text-anchor="start">최상위 소유자가 정해지면, 같은 소유 관계 아래의 워크로드를 하나의 앱으로 묶습니다.</text>
<path d="M 240 197 L 288 197" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 496 197 L 544 197" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 752 197 L 800 197" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
