<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">선택한 앱의 Pod로 사용량 범위를 결정</title><desc id="desc">선택한 자원과 UID로 앱의 Pod PVC 노드 GPU 참조를 계산한다. Namespace와 Pod 이름을 정확히 지정한 Prometheus query_range를 CPU 메모리 저장소 GPU별로 병렬 실행해 그래프로 표시한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="648" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">선택한 앱의 Pod로 사용량 범위를 결정</text>
<text x="32" y="78" font-size="17" fill="#536c60">같은 범위에서 지표별 쿼리를 병렬 실행하고 단위에 맞춰 표시합니다.</text>
<rect x="32" y="123" width="280" height="125" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="154" class="heading" style="fill:#19674e">앱·Pod·컨트롤러 선택</text>
<text x="50" y="181" class="body" text-anchor="start">프로필·자원·UID</text>
<text x="50" y="205" class="body" text-anchor="start">조회 기간</text>
<rect x="380" y="123" width="280" height="125" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="154" class="heading" style="fill:#19674e">대상 범위 계산</text>
<text x="398" y="181" class="body" text-anchor="start">소유 관계로 Pod·PVC 수집</text>
<text x="398" y="205" class="body" text-anchor="start">Namespace와 이름으로 구분</text>
<rect x="728" y="123" width="280" height="125" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="746" y="154" class="heading" style="fill:#365f94">Prometheus 쿼리</text>
<text x="746" y="181" class="body" text-anchor="start">정확한 대상 selector</text>
<text x="746" y="205" class="body" text-anchor="start">기간과 시간 간격 설정</text>
<rect x="32" y="356" width="312" height="104" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="387" class="heading" style="fill:#365f94">CPU · 메모리</text>
<text x="50" y="414" class="body" text-anchor="start">Pod별 rate / working set</text>
<rect x="364" y="356" width="312" height="104" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="382" y="387" class="heading" style="fill:#365f94">저장소</text>
<text x="382" y="414" class="body" text-anchor="start">컨테이너 파일시스템 / PVC</text>
<rect x="696" y="356" width="312" height="104" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="714" y="387" class="heading" style="fill:#365f94">GPU</text>
<text x="714" y="414" class="body" text-anchor="start">장치 UUID로 중복 제거</text>
<rect x="280" y="539" width="480" height="77" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="298" y="570" class="heading" style="fill:#19674e">단위·라벨·시각을 가진 사용량 그래프</text>
