<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
<title id="title">사용자 요청에서 모델 호출별 토큰 기록까지</title><desc id="desc">사용량은 제공자가 응답한 수치를 호출 단위로 연결하고, 사용자·모델·기간별로 합산합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="1118" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">사용자 요청에서 모델 호출별 토큰 기록까지</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">사용량은 제공자가 응답한 수치를 호출 단위로 연결하고, 사용자·모델·기간별로 합산합니다.</text>
<polyline points="288,234 288,311" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,234 832,311" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,482 288,564" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,482 832,564" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,736 288,813" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,736 832,813" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="126" width="1048" height="108" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="159" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">사용자 ID → 기능 실행 run_id → 모델 호출 span_id</text><text x="56" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">채팅 · 장애 진단 · 로그 분석 · YAML 작성의 어느 요청에서 호출됐는지 연결</text><rect x="36" y="311" width="504" height="171" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="344" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">OpenAI 호환 API</text><text x="56" y="375" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">응답의 usage</text><text x="56" y="402" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">prompt_tokens / completion_tokens</text><text x="56" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">제공되는 cache · reasoning 상세</text><rect x="580" y="311" width="504" height="171" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="344" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Codex exec</text><text x="600" y="375" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">turn.completed 이벤트의 usage</text><text x="600" y="402" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">input_tokens / output_tokens</text><text x="600" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">cached_input_tokens</text><rect x="36" y="564" width="1048" height="172" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="597" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">공통 사용량 기록 · ai_usage</text><text x="56" y="628" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">usage_id를 모델 호출 span에 연결</text><text x="56" y="655" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">사용자 · 실행 · 제공자 · 요청 모델 / 응답 모델 · 호출 시각</text><text x="56" y="682" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">입력 / 출력 / 전체 토큰 · 캐시 상세 · 성공·실패 상태</text><rect x="36" y="813" width="504" height="177" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="846" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">집계에 사용하는 값</text><text x="56" y="877" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">입력 + 출력 → 전체 토큰</text><text x="56" y="904" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">캐시 입력은 입력 토큰의 일부</text><text x="56" y="931" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">추론 토큰은 출력 토큰의 일부</text><rect x="580" y="813" width="504" height="177" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="600" y="846" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">관리자에서 역추적</text><text x="600" y="877" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">사용자 / 모델 / 기간별 합계</text><text x="600" y="904" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">개별 호출 → 입력 · 응답 · 실행 단계</text><text x="600" y="931" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">사용량 미제공은 미확인으로 보관</text><text x="36" y="1044" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">캐시·추론 토큰을 전체에 다시 더하지 않습니다. 사용량이 없는 호출을 0토큰으로 간주하지 않습니다.</text><text x="36" y="1080" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">측정은 네트워크 패킷 크기가 아니라, 모델 제공자가 보고한 토큰 사용량을 기준으로 합니다.</text></svg>
