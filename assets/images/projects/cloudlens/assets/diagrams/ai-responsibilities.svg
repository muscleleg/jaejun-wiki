<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">AI와 코드가 나누어 맡는 일</title><desc id="desc">자원 검색은 모델이 함수와 조건을 선택하고 코드가 API 조회와 필터를 실행한다. 앱 구성은 모델이 대상을 정하고 코드가 실제 참조로 그래프를 만든다. 장애 진단은 코드가 자료를 수집한 뒤 모델이 원인과 다음 행동을 해석한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="638" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">AI와 코드가 나누어 맡는 일</text>
<text x="32" y="78" font-size="17" fill="#536c60">같은 채팅에서 요청하더라도, 기능마다 모델이 처리하는 범위는 다릅니다.</text>
<text x="32" y="181" class="heading" text-anchor="start">자원 검색</text>
<text x="32" y="210" class="caption" text-anchor="start">gpu가 포함된 VM</text>
<rect x="216" y="142" width="244" height="126" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="234" y="173" class="heading" style="fill:#6b4b9e">모델 · 요청 해석</text>
<text x="234" y="200" class="body" text-anchor="start">조회 함수와</text>
<text x="234" y="224" class="body" text-anchor="start">이름 조건 선택</text>
<rect x="490" y="142" width="244" height="126" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="508" y="173" class="heading" style="fill:#19674e">코드 · 조회와 필터</text>
<text x="508" y="200" class="body" text-anchor="start">SDK로 VM 목록 조회</text>
<text x="508" y="224" class="body" text-anchor="start">조건에 맞는 행만 선택</text>
<rect x="764" y="142" width="244" height="126" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="782" y="173" class="heading" style="fill:#29473b">목록 카드</text>
<text x="782" y="200" class="body" text-anchor="start">API 값으로 렌더링</text>
<text x="782" y="224" class="body" text-anchor="start">자원 상세로 이동</text>
<text x="32" y="348" class="heading" text-anchor="start">앱 구성</text>
<text x="32" y="377" class="caption" text-anchor="start">Open WebUI 구성</text>
<rect x="216" y="309" width="244" height="126" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="234" y="340" class="heading" style="fill:#6b4b9e">모델 · 대상 선택</text>
<text x="234" y="367" class="body" text-anchor="start">앱 이름·Namespace와</text>
<text x="234" y="391" class="body" text-anchor="start">구성 조회 도구 선택</text>
<rect x="490" y="309" width="244" height="126" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="508" y="340" class="heading" style="fill:#19674e">코드 · 관계 계산</text>
<text x="508" y="367" class="body" text-anchor="start">소유 관계·selector·참조</text>
<text x="508" y="391" class="body" text-anchor="start">Node와 VM 식별자 연결</text>
<rect x="764" y="309" width="244" height="126" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="782" y="340" class="heading" style="fill:#29473b">컴포넌트 그래프</text>
<text x="782" y="367" class="body" text-anchor="start">연결된 자원과</text>
<text x="782" y="391" class="body" text-anchor="start">각 자원의 준비 상태</text>
<text x="32" y="515" class="heading" text-anchor="start">장애 진단</text>
<text x="32" y="544" class="caption" text-anchor="start">앱이 안 되는 이유</text>
<rect x="216" y="476" width="244" height="126" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="234" y="507" class="heading" style="fill:#19674e">코드 · 자료 수집</text>
<text x="234" y="534" class="body" text-anchor="start">설정·상태·이벤트·로그</text>
<text x="234" y="558" class="body" text-anchor="start">각 자료에 근거 ID 부여</text>
<rect x="490" y="476" width="244" height="126" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="508" y="507" class="heading" style="fill:#6b4b9e">모델 · 원인 해석</text>
<text x="508" y="534" class="body" text-anchor="start">증상과 원인을 연결</text>
<text x="508" y="558" class="body" text-anchor="start">다음 확인·행동 제안</text>
<rect x="764" y="476" width="244" height="126" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="782" y="507" class="heading" style="fill:#29473b">원인과 다음 행동</text>
<text x="782" y="534" class="body" text-anchor="start">인용 ID를 검증해 표시</text>
<text x="782" y="558" class="body" text-anchor="start">근거 원문 펼쳐 보기</text>
