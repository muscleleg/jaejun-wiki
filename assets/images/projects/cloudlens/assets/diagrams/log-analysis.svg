<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="645" viewBox="0 0 1040 645" role="img" aria-labelledby="title desc">
<title id="title">실시간 로그와 분석 시점의 로그를 분리</title><desc id="desc">Kubernetes 로그 API를 NDJSON으로 중계해 브라우저 버퍼에 쌓는다. 분석 버튼을 누르면 로그 스냅샷을 만들어 민감정보를 가리고 원래 줄 번호를 보존해 모델에 보낸다. 모델은 사실 원인 후보 다음 확인을 반환하고 입력 출력은 실행 기록에 저장된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="643" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">실시간 로그와 분석 시점의 로그를 분리</text>
<text x="32" y="78" font-size="17" fill="#536c60">분석하는 동안에도 로그 수신은 이어지고, 분석에는 고정된 줄 범위를 사용합니다.</text>
<rect x="32" y="128" width="280" height="110" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="159" class="heading" style="fill:#365f94">Kubernetes 로그 API</text>
<text x="50" y="186" class="body" text-anchor="start">컨테이너·줄 수·시간 옵션</text>
<rect x="380" y="128" width="280" height="110" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="159" class="heading" style="fill:#19674e">서버 스트림 중계</text>
<text x="398" y="186" class="body" text-anchor="start">NDJSON으로 텍스트 전달</text>
<rect x="728" y="128" width="280" height="110" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="746" y="159" class="heading" style="fill:#29473b">브라우저 로그 버퍼</text>
<text x="746" y="186" class="body" text-anchor="start">실시간 수신·검색·스크롤</text>
<rect x="728" y="329" width="280" height="135" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="746" y="360" class="heading" style="fill:#365f94">분석 스냅샷</text>
<text x="746" y="387" class="body" text-anchor="start">클릭한 시점의 로그 복사</text>
<text x="746" y="411" class="body" text-anchor="start">컨테이너·시각·원래 줄 범위</text>
<text x="746" y="435" class="body" text-anchor="start">민감정보 가림·입력 한도 적용</text>
<rect x="380" y="329" width="280" height="135" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="398" y="360" class="heading" style="fill:#6b4b9e">모델 분석</text>
<text x="398" y="387" class="body" text-anchor="start">사실·원인 후보·다음 확인</text>
<text x="398" y="411" class="body" text-anchor="start">원래 로그 줄 번호 인용</text>
<rect x="32" y="329" width="280" height="135" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="360" class="heading" style="fill:#19674e">분석 결과</text>
<text x="50" y="387" class="body" text-anchor="start">로그 원문과 함께 표시</text>
<text x="50" y="411" class="body" text-anchor="start">참조한 줄 범위 확인</text>
<rect x="380" y="544" width="628" height="72" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="398" y="575" class="heading" style="fill:#29473b">H2 실행 기록: 분석 입력·모델 응답·대상·시각</text>
<path d="M 312 183 L 380 183" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 183 L 728 183" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 868 238 L 868 329" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 728 397 L 660 397" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 380 397 L 312 397" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 520 464 L 520 544" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 868 464 L 868 544" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="826.0" y="268" width="84" height="24" rx="5" fill="#f7faf8"/>
<text x="868" y="285" class="caption" text-anchor="middle">분석 요청</text>
</svg>
