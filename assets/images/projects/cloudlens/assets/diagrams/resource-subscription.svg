<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">플랫폼별 변경 감지를 하나의 목록 갱신으로</title><desc id="desc">Kubernetes list watch와 OpenStack 주기 조회의 차이 계산은 사용자와 조회 조건별 구독 허브로 모인다. 허브는 초기 snapshot 변경 patch 연결 state를 SSE로 브라우저에 전달한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="548" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">플랫폼별 변경 감지를 하나의 목록 갱신으로</text>
<text x="32" y="78" font-size="17" fill="#536c60">브라우저는 snapshot과 patch를 받아 기존 테이블 상태에 반영합니다.</text>
<rect x="32" y="133" width="300" height="119" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="164" class="heading" style="fill:#365f94">Kubernetes</text>
<text x="50" y="191" class="body" text-anchor="start">list → resourceVersion → watch</text>
<text x="50" y="215" class="body" text-anchor="start">버전 만료 시 목록 재조회</text>
<rect x="32" y="328" width="300" height="119" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="359" class="heading" style="fill:#365f94">OpenStack</text>
<text x="50" y="386" class="body" text-anchor="start">주기 조회 → 이전 목록과 비교</text>
<text x="50" y="410" class="body" text-anchor="start">변화에 따라 조회 간격 조정</text>
<rect x="412" y="231" width="252" height="148" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="430" y="262" class="heading" style="fill:#19674e">조건별 구독 허브</text>
<text x="430" y="289" class="body" text-anchor="start">사용자·연결·종류·범위</text>
<text x="430" y="313" class="body" text-anchor="start">같은 조건의 수집 공유</text>
<text x="430" y="337" class="body" text-anchor="start">현재 목록과 변경분 관리</text>
<rect x="750" y="231" width="258" height="148" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="768" y="262" class="heading" style="fill:#19674e">브라우저 테이블</text>
<text x="768" y="289" class="body" text-anchor="start">snapshot: 목록 동기화</text>
<text x="768" y="313" class="body" text-anchor="start">patch: 행 추가·수정·삭제</text>
<text x="768" y="337" class="body" text-anchor="start">state: 구독 연결 상태</text>
<text x="32" y="508" class="body" text-anchor="start">이벤트 처리가 밀리면 최신 snapshot으로 다시 동기화합니다.</text>
<path d="M 332 193 L 371 193 L 371 268 L 412 268" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 332 388 L 371 388 L 371 341 L 412 341" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 664 304 L 750 304" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="687.0" y="268" width="40" height="24" rx="5" fill="#f7faf8"/>
<text x="707" y="285" class="caption" text-anchor="middle">SSE</text>
</svg>
