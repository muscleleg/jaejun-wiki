<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630" role="img" aria-labelledby="title desc">
<title id="title">용량의 출처에 맞춰 잔여량 계산</title><desc id="desc">선택한 클러스터의 인프라 연결로 OpenStack과 Kubernetes를 조회한다. 컴퓨트는 Placement inventory와 usage, 저장소는 Cinder 풀 보고값, 노드는 allocatable에서 Pod requests를 뺀 값으로 잔여량을 계산한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="628" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">용량의 출처에 맞춰 잔여량 계산</text>
<text x="32" y="78" font-size="17" fill="#536c60">클라우드·스토리지 풀·클러스터·노드의 값을 각각 계산해 묶습니다.</text>
<rect x="270" y="122" width="500" height="100" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="288" y="153" class="heading" style="fill:#19674e">선택한 클러스터·인프라 연결</text>
<text x="288" y="180" class="body" text-anchor="start">프로필로 Kubernetes와 연결된 클라우드 결정</text>
<rect x="32" y="312" width="312" height="111" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="343" class="heading" style="fill:#365f94">OpenStack 컴퓨트</text>
<text x="50" y="370" class="body" text-anchor="start">Nova 호스트 → Placement</text>
<text x="50" y="394" class="body" text-anchor="start">inventory / usage</text>
<rect x="32" y="471" width="312" height="124" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="502" class="heading" style="fill:#19674e">잔여량</text>
<text x="50" y="529" class="body" text-anchor="start">(물리 − 예약) × 배율</text>
<text x="50" y="553" class="body" text-anchor="start">− 할당량</text>
<text x="50" y="621" class="caption" text-anchor="start">호스트별 → 클라우드별</text>
<rect x="364" y="312" width="312" height="111" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="382" y="343" class="heading" style="fill:#365f94">Cinder 저장소</text>
<text x="382" y="370" class="body" text-anchor="start">풀 용량·여유·논리 할당</text>
<text x="382" y="394" class="body" text-anchor="start">프로젝트 볼륨 목록</text>
<rect x="364" y="471" width="312" height="124" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="382" y="502" class="heading" style="fill:#19674e">잔여량</text>
<text x="382" y="529" class="body" text-anchor="start">백엔드가 보고한 여유 공간</text>
<text x="382" y="553" class="body" text-anchor="start">논리 할당량은 별도 표시</text>
<text x="382" y="621" class="caption" text-anchor="start">스토리지 풀별</text>
<rect x="696" y="312" width="312" height="111" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="714" y="343" class="heading" style="fill:#365f94">Kubernetes 노드</text>
<text x="714" y="370" class="body" text-anchor="start">Node allocatable</text>
<text x="714" y="394" class="body" text-anchor="start">배치된 Pod의 requests</text>
<rect x="696" y="471" width="312" height="124" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="714" y="502" class="heading" style="fill:#19674e">잔여량</text>
<text x="714" y="529" class="body" text-anchor="start">Node allocatable</text>
<text x="714" y="553" class="body" text-anchor="start">− Pod 유효 요청량 합계</text>
<text x="714" y="621" class="caption" text-anchor="start">노드별 → 클러스터별</text>
