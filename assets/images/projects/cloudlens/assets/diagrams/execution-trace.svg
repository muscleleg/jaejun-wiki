<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="745" viewBox="0 0 1040 745" role="img" aria-labelledby="title desc">
<title id="title">답변에서 모델 입력까지 거슬러 추적</title><desc id="desc">Chat과 메시지에 Run이 연결되며 같은 Run 아래 모델 도구 필터 결과 단계가 저장된다. source_model_id는 도구를 선택한 모델을, source_tool_span_id는 필터의 원본 조회를 가리킨다. 실행에는 평가와 호출별 토큰 사용량도 연결된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="743" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">답변에서 모델 입력까지 거슬러 추적</text>
<text x="32" y="78" font-size="17" fill="#536c60">단계 순서와 함께, 어떤 선택이 어떤 실행을 만들었는지 ID로 연결합니다.</text>
<rect x="32" y="121" width="280" height="106" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="152" class="heading" style="fill:#29473b">대화방·사용자 메시지</text>
<text x="50" y="179" class="body" text-anchor="start">chat_id / message_id</text>
<rect x="380" y="121" width="280" height="106" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="152" class="heading" style="fill:#19674e">한 번의 실행 · Run</text>
<text x="398" y="179" class="body" text-anchor="start">사용자·요청·상태·시간</text>
<rect x="728" y="121" width="280" height="106" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="746" y="152" class="heading" style="fill:#29473b">평가·사용량</text>
<text x="746" y="179" class="body" text-anchor="start">답변 평가 / 호출별 토큰 수</text>
<rect x="32" y="303" width="976" height="333" rx="14" fill="#ecf7f1" fill-opacity="0.5" stroke="#b9dacc"/>
<text x="52" y="333" class="heading" text-anchor="start">같은 run_id에 속한 단계 · Span</text>
<rect x="56" y="376" width="202" height="158" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="74" y="407" class="heading" style="fill:#6b4b9e">모델 호출</text>
<text x="74" y="434" class="body" text-anchor="start">실제 입력·도구 정의</text>
<text x="74" y="458" class="body" text-anchor="start">응답·선택한 인자</text>
<rect x="298" y="376" width="202" height="158" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="316" y="407" class="heading" style="fill:#365f94">도구 실행</text>
<text x="316" y="434" class="body" text-anchor="start">프로필·실행 인자</text>
<text x="316" y="458" class="body" text-anchor="start">SDK 결과·오류</text>
<rect x="540" y="376" width="202" height="158" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="558" y="407" class="heading" style="fill:#365f94">필터 적용</text>
<text x="558" y="434" class="body" text-anchor="start">원본 조회 단계 ID</text>
<text x="558" y="458" class="body" text-anchor="start">조건·처리 전후 개수</text>
<rect x="782" y="376" width="202" height="158" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="800" y="407" class="heading" style="fill:#19674e">결과 생성</text>
<text x="800" y="434" class="body" text-anchor="start">최종 카드·텍스트</text>
<text x="800" y="458" class="body" text-anchor="start">표시한 대상과 값</text>
<text x="56" y="579" class="caption" text-anchor="start">도구 → 선택한 모델 호출: source_model_id</text>
<text x="56" y="606" class="caption" text-anchor="start">필터 → 원본 조회 단계: source_tool_span_id</text>
<text x="32" y="690" class="body" text-anchor="start">단계 시작 시 입력을 저장하고, 종료 시 출력·상태·소요 시간을 갱신합니다.</text>
<path d="M 312 174 L 380 174" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 174 L 728 174" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 520 227 L 520 303" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 258 455 L 298 455" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 455 L 540 455" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 455 L 782 455" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
