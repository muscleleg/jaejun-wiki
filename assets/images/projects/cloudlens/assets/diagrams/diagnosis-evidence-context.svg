<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1070" viewBox="0 0 1120 1070" role="img" aria-labelledby="title desc">
<title id="title">추가 근거를 읽어도 이전 응답을 계속 쌓지 않는 진단</title><desc id="desc">모델에 보내는 현재 자료와, DB에 보존하는 전체 실행 기록을 분리합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="1068" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">추가 근거를 읽어도 이전 응답을 계속 쌓지 않는 진단</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">모델에 보내는 현재 자료와, DB에 보존하는 전체 실행 기록을 분리합니다.</text>
<rect x="36" y="120" width="626" height="790" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="152" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">다음 판단에 사용할 현재 입력</text><rect x="698" y="120" width="386" height="790" rx="16" fill="#eef5fd" fill-opacity=".55" stroke="#c2d7f3"/><text x="718" y="152" font-size="20" font-weight="700" fill="#325f99" text-anchor="start">H2의 전체 실행 기록</text><polyline points="349,322 349,398" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="349,509 349,585" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="349,724 349,800" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="638,453 722,453" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="638,839 722,839" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="183" width="578" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">초기 자료</text><text x="80" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">종류별 주요 필드 + 근거 ID 목록</text><text x="80" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">예: d1 Pod · d2 Event · d3 EndpointSlice</text><rect x="60" y="398" width="578" height="111" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="80" y="431" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">모델이 d3 원본 읽기를 선택</text><text x="80" y="462" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">read_diagnostic_evidence</text><rect x="60" y="585" width="578" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="618" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">d3 추출본 → d3 원본으로 교체</text><text x="80" y="649" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">다른 근거는 유지 · 최근 읽기 결과 반영</text><text x="80" y="676" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">과거 읽기 응답을 매번 중복 첨부하지 않음</text><rect x="60" y="800" width="578" height="78" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="80" y="833" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">갱신한 자료로 판단 → finish_diagnosis</text><rect x="722" y="183" width="338" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="742" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">수집 원본</text><text x="742" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">민감정보 처리</text><text x="742" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">자원별 ID · 선택 필드 내역</text><rect x="722" y="398" width="338" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="742" y="431" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">각 호출의 입력·응답</text><text x="742" y="462" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">읽기 도구와 인자</text><text x="742" y="489" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모델이 실제 받은 정보</text><rect x="722" y="717" width="338" height="161" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="742" y="750" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">제출·검증 결과</text><text x="742" y="781" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">보고서 구조 · 인용 확인</text><text x="742" y="808" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">실제 전달한 ID인지 검사</text><text x="742" y="835" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">정상 판단은 원인 목록 비움</text><rect x="36" y="950" width="1048" height="80" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="983" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">최대 3회 판단 · 마지막 호출은 진단 제출 · 각 호출은 같은 run_id로 추적</text></svg>
