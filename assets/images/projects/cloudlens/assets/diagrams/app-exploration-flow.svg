<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="326" viewBox="0 0 1040 326" role="img" aria-labelledby="title desc">
<title id="title">앱 하나에서 시작하는 탐색</title><desc id="desc">통합 현황에서 Open WebUI를 고른다. 구성 탭에서 네트워크와 저장소를 확인하고 사용량 탭에서 앱의 CPU와 메모리를 확인한다. 구성도의 Node를 선택하면 대응하는 OpenStack VM 상세로 이동할 수 있다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="324" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">앱 하나에서 시작하는 탐색</text>
<text x="32" y="78" font-size="17" fill="#536c60">Open WebUI를 선택하고, 필요한 구성·사용량·실행 머신을 같은 화면에서 따라갑니다.</text>
<rect x="32" y="133" width="220" height="132" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="164" class="heading" style="fill:#19674e">1. 앱 선택</text>
<text x="50" y="191" class="body" text-anchor="start">통합 현황에서</text>
<text x="50" y="215" class="body" text-anchor="start">open-webui 선택</text>
<rect x="284" y="133" width="220" height="132" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="302" y="164" class="heading" style="fill:#365f94">2. 구성 탐색</text>
<text x="302" y="191" class="body" text-anchor="start">요청 경로 · Service</text>
<text x="302" y="215" class="body" text-anchor="start">Deployment · PVC</text>
<rect x="536" y="133" width="220" height="132" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="554" y="164" class="heading" style="fill:#365f94">3. 사용량 확인</text>
<text x="554" y="191" class="body" text-anchor="start">앱에 속한 Pod의</text>
<text x="554" y="215" class="body" text-anchor="start">CPU · 메모리 그래프</text>
<rect x="788" y="133" width="220" height="132" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="806" y="164" class="heading" style="fill:#6b4b9e">4. 실행 머신 확인</text>
<text x="806" y="191" class="body" text-anchor="start">Node worker-01에서</text>
<text x="806" y="215" class="body" text-anchor="start">OpenStack VM 상세로</text>
<text x="32" y="303" class="body" text-anchor="start">앱을 기준으로 대상을 유지하므로, 플랫폼마다 이름을 다시 검색할 필요가 없습니다.</text>
<path d="M 252 199 L 284 199" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 504 199 L 536 199" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 756 199 L 788 199" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
