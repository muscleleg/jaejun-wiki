<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="750" viewBox="0 0 1040 750" role="img" aria-labelledby="title desc">
<title id="title">작업 접수와 자원 상태 갱신을 분리</title><desc id="desc">사용자가 실행을 누르면 화면이 서버 검증과 제출을 이어 처리한다. 검토 기록을 applying으로 한번만 전환하고 원격 API에 요청한다. API 접수 결과는 작업 이력에 기록하며 실제 자원 상태 변화는 별도의 목록 구독으로 화면에 전달된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="748" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">작업 접수와 자원 상태 갱신을 분리</text>
<text x="32" y="78" font-size="17" fill="#536c60">실행 버튼은 검증과 제출을 이어 처리하고, 이후 상태는 목록에서 갱신합니다.</text>
<rect x="32" y="124" width="280" height="126" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="50" y="155" class="heading" style="fill:#29473b">화면에서 실행</text>
<text x="50" y="182" class="body" text-anchor="start">대상·작업·입력 전달</text>
<text x="50" y="206" class="body" text-anchor="start">변경 미리보기는 선택 사항</text>
<rect x="380" y="124" width="280" height="126" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="398" y="155" class="heading" style="fill:#19674e">서버 검증</text>
<text x="398" y="182" class="body" text-anchor="start">권한·입력·현재 대상 확인</text>
<text x="398" y="206" class="body" text-anchor="start">입력 해시·대상 조건 보관</text>
<rect x="728" y="124" width="280" height="126" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="746" y="155" class="heading" style="fill:#19674e">변경 제출</text>
<text x="746" y="182" class="body" text-anchor="start">검토 ID를 applying으로 전환</text>
<text x="746" y="206" class="body" text-anchor="start">대상 재확인 후 원격 API 호출</text>
<rect x="32" y="331" width="472" height="341" rx="14" fill="#eef5fd" fill-opacity="0.5" stroke="#c1d6ef"/>
<text x="52" y="361" class="heading" text-anchor="start">요청을 접수했는가</text>
<rect x="536" y="331" width="472" height="341" rx="14" fill="#ecf7f1" fill-opacity="0.5" stroke="#b9dacc"/>
<text x="556" y="361" class="heading" text-anchor="start">자원의 상태가 바뀌었는가</text>
<rect x="56" y="395" width="424" height="108" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="74" y="426" class="heading" style="fill:#365f94">원격 API의 응답</text>
<text x="74" y="453" class="body" text-anchor="start">accepted / failed / unknown</text>
<rect x="560" y="395" width="424" height="108" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="578" y="426" class="heading" style="fill:#19674e">Kubernetes watch · OpenStack 조회</text>
<text x="578" y="453" class="body" text-anchor="start">BUILD·ACTIVE·삭제 등 실제 상태</text>
<rect x="56" y="565" width="424" height="76" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="74" y="596" class="heading" style="fill:#365f94">작업 이력 저장·접수 결과 표시</text>
<rect x="560" y="565" width="424" height="76" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="578" y="596" class="heading" style="fill:#19674e">목록의 해당 행 갱신</text>
<text x="32" y="714" class="body" text-anchor="start">일괄 작업도 대상별 API 접수 응답을 받은 뒤 다음 요청을 보내며, 상태 변화는 목록 구독이 처리합니다.</text>
<path d="M 312 187 L 380 187" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 187 L 728 187" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 868 250 L 868 290 L 268 290 L 268 395" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 868 250 L 868 290 L 772 290 L 772 395" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 268 503 L 268 565" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 772 503 L 772 565" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
