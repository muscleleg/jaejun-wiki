<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="738" viewBox="0 0 1040 738" role="img" aria-labelledby="title desc">
<title id="title">같은 장애 자료로 모델을 비교</title><desc id="desc">상태 이벤트 로그 원본을 고정하고 입력 필드 선택 규칙으로 메시지와 도구 정의를 만든다. 같은 입력을 Qwen과 Sol에 전달하고 해시로 입력 동일성을 검사한다. 두 모델의 근거 인용, 원인 해석, 다음 행동을 실행 기록과 대조한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="736" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">같은 장애 자료로 모델을 비교</text>
<text x="32" y="78" font-size="17" fill="#536c60">상태가 계속 변하는 클러스터 대신, 저장한 한 시점의 자료로 진단을 재생합니다.</text>
<rect x="32" y="127" width="300" height="129" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="158" class="heading" style="fill:#19674e">수집 원본 고정</text>
<text x="50" y="185" class="body" text-anchor="start">자원 설정·상태·이벤트·로그</text>
<text x="50" y="209" class="body" text-anchor="start">원본 자료의 해시 보존</text>
<rect x="407" y="127" width="601" height="129" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="425" y="158" class="heading" style="fill:#29473b">공통 모델 입력</text>
<text x="425" y="185" class="body" text-anchor="start">질문 + 전달할 자료 + 근거 목록 + 도구 정의</text>
<text x="425" y="209" class="body" text-anchor="start">원본 YAML / 주요 필드 추출을 각각 비교</text>
<rect x="56" y="365" width="424" height="126" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="74" y="396" class="heading" style="fill:#6b4b9e">Qwen3.5-9B Q4</text>
<text x="74" y="423" class="body" text-anchor="start">OpenAI 호환 API로 실행</text>
<text x="74" y="447" class="body" text-anchor="start">선택 도구·인자·진단 결과 기록</text>
<rect x="560" y="365" width="424" height="126" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="578" y="396" class="heading" style="fill:#365f94">GPT-6.1 Sol</text>
<text x="578" y="423" class="body" text-anchor="start">Codex exec로 실행</text>
<text x="578" y="447" class="body" text-anchor="start">선택 도구·인자·진단 결과 기록</text>
<text x="32" y="292" class="caption" text-anchor="start">초기 메시지·도구 정의의 SHA-256 일치 확인</text>
<rect x="200" y="582" width="640" height="120" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="218" y="613" class="heading" style="fill:#19674e">결과와 근거 대조</text>
<text x="218" y="640" class="body" text-anchor="start">원인을 뒷받침하는 자료 / 증상과의 연결 / 다음 행동</text>
<text x="218" y="664" class="body" text-anchor="start">실행 완료 여부와 진단 내용의 평가는 따로 기록</text>
