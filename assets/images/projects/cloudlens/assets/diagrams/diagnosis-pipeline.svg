<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
<title id="title">수집한 근거에서 진단 결과까지</title><desc id="desc">앱 범위에서 상태 이벤트 로그를 모으고 근거 ID를 붙여 원본을 저장한다. 자원 종류별 필드 추출본을 모델에 제공한다. 모델은 추가 근거의 원본을 읽거나 진단을 제출한다. 서버는 구조와 인용 연결을 검사해 카드로 표시한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="818" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">수집한 근거에서 진단 결과까지</text>
<text x="32" y="78" font-size="17" fill="#536c60">서버는 자료를 수집·보관하고, 모델은 근거를 읽어 원인을 해석합니다.</text>
<rect x="32" y="125" width="300" height="115" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="50" y="156" class="heading" style="fill:#19674e">앱 범위 계산</text>
<text x="50" y="183" class="body" text-anchor="start">대상 UID 확인</text>
<text x="50" y="207" class="body" text-anchor="start">워크로드·연결 자원 수집</text>
<rect x="384" y="125" width="300" height="115" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="402" y="156" class="heading" style="fill:#365f94">진단 자료 수집</text>
<text x="402" y="183" class="body" text-anchor="start">자원 설정·상태·이벤트</text>
<text x="402" y="207" class="body" text-anchor="start">현재·재시작 전 컨테이너 로그</text>
<rect x="736" y="125" width="272" height="115" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="754" y="156" class="heading" style="fill:#29473b">원본 보존</text>
<text x="754" y="183" class="body" text-anchor="start">근거 ID와 대상 부여</text>
<text x="754" y="207" class="body" text-anchor="start">전체 자료를 H2에 기록</text>
<rect x="736" y="320" width="272" height="115" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="754" y="351" class="heading" style="fill:#365f94">자원별 필드 추출</text>
<text x="754" y="378" class="body" text-anchor="start">원본 경로·값 유지</text>
<text x="754" y="402" class="body" text-anchor="start">자료 목록과 함께 전달</text>
<rect x="384" y="320" width="300" height="115" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="402" y="351" class="heading" style="fill:#6b4b9e">모델의 진단</text>
<text x="402" y="378" class="body" text-anchor="start">증상·원인·다음 행동</text>
<text x="402" y="402" class="body" text-anchor="start">근거 ID로 인용</text>
<rect x="32" y="320" width="300" height="115" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="50" y="351" class="heading" style="fill:#365f94">추가 원본 읽기</text>
<text x="50" y="378" class="body" text-anchor="start">모델이 근거 ID 선택</text>
<text x="50" y="402" class="body" text-anchor="start">해당 추출본을 원본으로 교체</text>
<rect x="384" y="554" width="300" height="108" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="402" y="585" class="heading" style="fill:#19674e">진단 제출·검증</text>
<text x="402" y="612" class="body" text-anchor="start">응답 구조와 인용 ID 검사</text>
<text x="402" y="636" class="body" text-anchor="start">원인·증상·행동 연결 확인</text>
<rect x="384" y="715" width="300" height="72" rx="11" fill="#ecf7f1" stroke="#b9dacc" stroke-width="1.4"/>
<text x="402" y="746" class="heading" style="fill:#19674e">원인과 다음 행동 카드</text>
<text x="32" y="635" class="body" text-anchor="start">각 모델 호출의 입력·응답과</text>
<text x="32" y="660" class="body" text-anchor="start">검증 결과도 H2에 기록합니다.</text>
<path d="M 332 183 L 384 183" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 684 183 L 736 183" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 872 240 L 872 320" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 736 377 L 684 377" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 384 377 L 332 377" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 182 435 L 182 487 L 534 487 L 534 435" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 658 435 L 658 554" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 534 662 L 534 715" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="255.5" y="470" width="205" height="24" rx="5" fill="#f7faf8"/>
<text x="358" y="487" class="caption" text-anchor="middle">갱신된 입력으로 다시 판단</text>
</svg>
