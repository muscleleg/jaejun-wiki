<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="806" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc">
<title id="title">모델 호출 방식은 달라도 기능의 입출력은 공통</title><desc id="desc">채팅·진단·로그 분석·YAML 작성이 같은 모델 호출 인터페이스를 사용합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="804" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">모델 호출 방식은 달라도 기능의 입출력은 공통</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">채팅·진단·로그 분석·YAML 작성이 같은 모델 호출 인터페이스를 사용합니다.</text>
<polyline points="288,234 288,311" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,234 832,311" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,482 288,561" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,482 832,561" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="126" width="1048" height="108" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="159" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">기능이 준비한 요청</text><text x="56" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">messages · tools · 모델 설정 · 출력 토큰 한도</text><rect x="36" y="311" width="504" height="171" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="344" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">HTTP API 어댑터</text><text x="56" y="375" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">OpenAI 호환 엔드포인트 호출</text><text x="56" y="402" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Qwen 모델 API 등</text><text x="56" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">응답 메시지 · tool_calls · usage 읽기</text><rect x="580" y="311" width="504" height="171" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="344" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Codex exec 어댑터</text><text x="600" y="375" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">포털 서버에서 프로세스 실행</text><text x="600" y="402" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모델 선택 · JSON 이벤트 수신</text><text x="600" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">완료 응답 · usage 읽기</text><rect x="36" y="561" width="1048" height="171" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="594" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">공통 결과 + 실행 추적</text><text x="56" y="625" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">응답 메시지 · 선택 도구와 인자 · 종료 이유 · 사용량</text><text x="56" y="652" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">요청 모델과 실제 응답 모델, 요청·응답·오류를 같은 실행에 기록</text><text x="56" y="679" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">각 기능이 결과 카드 / 진단 보고서 / 로그 해석 / YAML 초안으로 처리</text><text x="36" y="776" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">제공자 선택은 호출 경로를 바꿉니다. 자원 조회·필터링·구성 계산 규칙은 공통 서비스를 사용합니다.</text></svg>
