<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
<title id="title">AI YAML 작성에서 실제 변경까지</title><desc id="desc">모델은 초안을 작성하고, 서버는 자원 종류와 API 유효성을 확인한 뒤 편집기로 돌려줍니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="1118" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">AI YAML 작성에서 실제 변경까지</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">모델은 초안을 작성하고, 서버는 자원 종류와 API 유효성을 확인한 뒤 편집기로 돌려줍니다.</text>
<polyline points="288,237 288,309" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,237 832,309" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,444 288,527" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,444 832,527" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560,668 560,747" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="952,584 1100,584 1100,273 560,273 560,234" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="560,859 560,941" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="126" width="1048" height="111" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="159" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">요구사항 + 편집 내용 + 선택한 자원의 스키마</text><text x="56" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">apiVersion · Kind · Namespace · OpenAPI / CRD 필드 설명</text><rect x="36" y="309" width="504" height="135" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="342" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">새 자원 생성</text><text x="56" y="373" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모델 출력: 단일 YAML</text><text x="56" y="400" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서버: 객체 파싱</text><rect x="580" y="309" width="504" height="135" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="342" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">기존 자원 수정</text><text x="600" y="373" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모델 출력: JSON Merge Patch</text><text x="600" y="400" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서버: 기존 문서에 병합</text><rect x="168" y="527" width="784" height="141" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="188" y="560" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">대상 확인 + Kubernetes dry-run</text><text x="188" y="591" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">선택한 종류 · 버전 · Namespace 대조</text><text x="188" y="618" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">실제로 저장하지 않고 API 검증</text><rect x="168" y="747" width="784" height="112" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="188" y="780" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">YAML과 검증 결과 → Monaco 편집기</text><text x="188" y="811" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">오류가 있으면 그 내용을 전달해 초안을 한 번 보완</text><rect x="168" y="941" width="784" height="112" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="188" y="974" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">사용자가 편집 후 생성 / 수정 실행</text><text x="188" y="1005" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">그때 별도의 변경 API로 제출 · 요청과 결과를 작업 이력에 저장</text><text x="36" y="1090" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">초안 작성과 dry-run은 실제 자원 변경과 분리되어 있습니다.</text><rect x="746.0" y="251" width="218.0" height="36" rx="6" fill="#f6faf8"/><text x="855" y="274" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">오류를 반영해 한 번 보완</text><rect x="511.75" y="883" width="96.5" height="36" rx="6" fill="#f6faf8"/><text x="560" y="906" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">실행 버튼</text></svg>
