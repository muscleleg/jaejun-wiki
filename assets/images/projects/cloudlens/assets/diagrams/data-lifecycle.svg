<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">현재 상태와 과거 실행을 따로 보관</title><desc id="desc">현재 자원과 사용량은 외부 API에서 조회한다. 과거 채팅 답변과 실행의 입력 출력은 H2에서 조회한다. 조회 캐시와 구독 상태는 서버 메모리에서 관리한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7b9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #203c31; } .heading {font-weight:700;font-size:19px} .body {font-size:16px;fill:#536c60} .caption {font-size:15px;fill:#536c60} .mono {font-size:14px;font-family:ui-monospace,monospace;fill:#536c60}</style>
<rect x="1" y="1" width="1038" height="568" rx="18" fill="#f7faf8" stroke="#dbe6df"/>
<text x="32" y="46" font-size="27" font-weight="700">현재 상태와 과거 실행을 따로 보관</text>
<text x="32" y="78" font-size="17" fill="#536c60">현재 화면은 인프라를 조회하고, 과거 답변은 당시 기록을 읽습니다.</text>
<rect x="32" y="119" width="472" height="361" rx="14" fill="#eef5fd" fill-opacity="0.5" stroke="#c1d6ef"/>
<text x="52" y="149" class="heading" text-anchor="start">현재 목록·대시보드</text>
<rect x="536" y="119" width="472" height="361" rx="14" fill="#f4f0fc" fill-opacity="0.5" stroke="#d4c8ec"/>
<text x="556" y="149" class="heading" text-anchor="start">과거 답변·관리자 디버깅</text>
<rect x="56" y="178" width="424" height="106" rx="11" fill="#eef5fd" stroke="#c1d6ef" stroke-width="1.4"/>
<text x="74" y="209" class="heading" style="fill:#365f94">인프라 API · Prometheus</text>
<text x="74" y="236" class="body" text-anchor="start">현재 자원 상태 / 기간별 사용량</text>
<rect x="560" y="178" width="424" height="106" rx="11" fill="#f4f0fc" stroke="#d4c8ec" stroke-width="1.4"/>
<text x="578" y="209" class="heading" style="fill:#6b4b9e">H2 실행 기록</text>
<text x="578" y="236" class="body" text-anchor="start">당시 입력·응답·도구 결과·조회 시각</text>
<rect x="56" y="354" width="424" height="94" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="74" y="385" class="heading" style="fill:#29473b">현재 화면</text>
<text x="74" y="412" class="body" text-anchor="start">같은 대상의 캐시·구독 재사용</text>
<rect x="560" y="354" width="424" height="94" rx="11" fill="#ffffff" stroke="#d7e1dc" stroke-width="1.4"/>
<text x="578" y="385" class="heading" style="fill:#29473b">저장된 채팅·단계별 기록</text>
<text x="578" y="412" class="body" text-anchor="start">실행 ID·단계 ID로 조회</text>
<text x="32" y="526" class="body" text-anchor="start">계정·연결 설정은 H2에 저장하며, 인증자료의 암호화 키는 서버의 별도 파일로 관리합니다.</text>
<path d="M 268 284 L 268 354" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 772 284 L 772 354" fill="none" stroke="#7b9488" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="226.0" y="306" width="84" height="24" rx="5" fill="#f7faf8"/>
<text x="268" y="323" class="caption" text-anchor="middle">조회·갱신</text>
<rect x="730.0" y="306" width="84" height="24" rx="5" fill="#f7faf8"/>
<text x="772" y="323" class="caption" text-anchor="middle">기록 읽기</text>
</svg>
