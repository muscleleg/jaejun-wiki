<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">데스크탑 한 대에 구성한 OpenStack 인프라</title>
  <desc id="desc">Ubuntu 물리 호스트에 Kolla-Ansible로 OpenStack 서비스를 컨테이너 배포했다. Wi-Fi와 호스트 라우팅 및 NAT를 통해 VM 네트워크를 연결하고, 추가 SSD 두 개를 Cinder 백엔드로 사용한다. RTX 2060 SUPER는 VFIO와 PCI 패스스루로 GPU 워커 VM에 직접 연결한다. 같은 호스트에 로드밸런서 두 대, 컨트롤 플레인 세 대, 일반 워커 두 대, GPU 워커 한 대를 구성했다.</desc>
  <defs>
    <marker id="network-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#4e7daa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="storage-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#328773" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gpu-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8c6ac0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol>
    <symbol id="network" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></symbol>
    <symbol id="disk" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="gpu" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><rect x="8" y="9" width="8" height="6" rx="1"/><path d="M8 2v3M12 2v3M16 2v3M8 19v3M12 19v3M16 19v3M1 9h3M1 15h3M20 9h3M20 15h3"/></symbol>
  </defs>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #203e34; }
    .title { font-size: 28px; font-weight: 700; }
    .heading { font-size: 21px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; fill: #61766d; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .network { fill: #35648e; }
    .storage { fill: #23745f; }
    .gpu { fill: #7751aa; }
    .path { fill: none; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="880" rx="20" fill="#f6f9f7"/>
  <text x="32" y="47" class="title">데스크탑 한 대에 구성한 OpenStack 인프라</text>
  <text x="32" y="78" class="body" fill="#61766d">Wi-Fi는 유지하고, 프로젝트용 SSD와 GPU를 VM에 연결했습니다.</text>

  <!-- All services, storage and VMs below belong to the same physical host. -->
  <rect x="24" y="112" width="1152" height="736" rx="18" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <use href="#server" x="48" y="136" width="26" height="26" class="icon" color="#267960"/>
  <text x="86" y="157" class="heading">Ubuntu 24.04 · 물리 호스트 1대</text>
  <text x="1148" y="155" text-anchor="end" class="small">Ryzen 9 5900X · 12코어 / 24스레드 · RAM 48 GB</text>

  <rect x="48" y="184" width="1104" height="106" rx="12" fill="#edf6f1" stroke="#c9e1d4"/>
  <text x="68" y="217" class="heading">OpenStack 서비스</text>
  <text x="1132" y="215" text-anchor="end" class="small">Kolla-Ansible · 컨테이너 배포 · all-in-one</text>
  <text x="68" y="257" class="body">Nova · VM</text>
  <text x="235" y="257" class="body">Neutron · 네트워크</text>
  <text x="468" y="257" class="body">Cinder · 볼륨</text>
  <text x="665" y="257" class="body">Glance · 이미지</text>
  <text x="891" y="257" class="body">Keystone · Placement</text>

  <!-- Three distinct connections: network, block storage, and PCI device. -->
  <rect x="48" y="326" width="352" height="224" rx="12" fill="#f1f6fc" stroke="#ccdef0"/>
  <use href="#network" x="68" y="346" width="24" height="24" class="icon" color="#35648e"/>
  <text x="103" y="367" class="heading network">Wi-Fi와 VM 네트워크</text>
  <text x="224" y="408" text-anchor="middle" class="body">인터넷 · 집 공유기</text>
  <path d="M224 421V435" class="path" stroke="#4e7daa" marker-end="url(#network-arrow)"/>
  <text x="224" y="463" text-anchor="middle" class="body network">Wi-Fi → 호스트 라우팅·NAT</text>
  <path d="M224 476V490" class="path" stroke="#4e7daa" marker-end="url(#network-arrow)"/>
  <text x="224" y="521" text-anchor="middle" class="body">veth ↔ br-ex ↔ Neutron Router</text>

  <rect x="424" y="326" width="352" height="224" rx="12" fill="#f0f8f4" stroke="#c9e3d6"/>
  <use href="#disk" x="444" y="346" width="24" height="24" class="icon" color="#23745f"/>
  <text x="479" y="367" class="heading storage">프로젝트 전용 SSD</text>
  <text x="600" y="408" text-anchor="middle" class="body">Micron 512 GB + Samsung 256 GB</text>
  <path d="M600 421V435" class="path" stroke="#328773" marker-end="url(#storage-arrow)"/>
  <text x="600" y="463" text-anchor="middle" class="body storage">LVM · Cinder SSD 백엔드</text>
  <path d="M600 476V490" class="path" stroke="#328773" marker-end="url(#storage-arrow)"/>
  <text x="600" y="521" text-anchor="middle" class="body">VM 부팅 볼륨 · 데이터 볼륨</text>

  <rect x="800" y="326" width="352" height="224" rx="12" fill="#f7f3fc" stroke="#ddcfef"/>
  <use href="#gpu" x="820" y="346" width="24" height="24" class="icon" color="#7751aa"/>
  <text x="855" y="367" class="heading gpu">GPU 한 장 직접 연결</text>
  <text x="976" y="408" text-anchor="middle" class="body">RTX 2060 SUPER · 8 GiB</text>
  <path d="M976 421V435" class="path" stroke="#8c6ac0" marker-end="url(#gpu-arrow)"/>
  <text x="976" y="463" text-anchor="middle" class="body gpu">VFIO · PCI passthrough</text>
  <path d="M976 476V490" class="path" stroke="#8c6ac0" marker-end="url(#gpu-arrow)"/>
  <text x="976" y="521" text-anchor="middle" class="body">gpu-worker-01에 할당</text>

  <path d="M224 550V622" class="path" stroke="#4e7daa" marker-end="url(#network-arrow)"/>
  <text x="240" y="590" class="small network">VM 사설망</text>
  <path d="M600 550V622" class="path" stroke="#328773" marker-end="url(#storage-arrow)"/>
  <text x="616" y="590" class="small storage">볼륨 연결</text>

  <rect x="48" y="622" width="1104" height="198" rx="12" fill="#fafcfb" stroke="#d5e2dc"/>
  <text x="68" y="655" class="heading">Kubernetes용 VM 6대 + 로드밸런서 VM 2대</text>
  <text x="68" y="680" class="small">동일한 물리 호스트에서 libvirt + QEMU/KVM으로 실행</text>
  <path d="M976 550V602H1000V701" class="path" stroke="#8c6ac0" marker-end="url(#gpu-arrow)"/>
  <text x="992" y="584" class="small gpu">GPU 직접 연결</text>

  <rect x="68" y="701" width="249" height="98" rx="10" fill="#ffffff" stroke="#d5e2dc"/>
  <text x="86" y="730" class="heading">로드밸런서 × 2</text>
  <text x="86" y="758" class="small">lb-01 · lb-02</text>
  <text x="86" y="782" class="small">HAProxy · Keepalived</text>

  <rect x="337" y="701" width="249" height="98" rx="10" fill="#ffffff" stroke="#d5e2dc"/>
  <text x="355" y="730" class="heading">컨트롤 플레인 × 3</text>
  <text x="355" y="758" class="small">cp-01 · cp-02 · cp-03</text>
  <text x="355" y="782" class="small">Kubernetes API · etcd</text>

  <rect x="606" y="701" width="249" height="98" rx="10" fill="#ffffff" stroke="#d5e2dc"/>
  <text x="624" y="730" class="heading">일반 워커 × 2</text>
  <text x="624" y="758" class="small">worker-01 · worker-02</text>
  <text x="624" y="782" class="small">운영 구성요소 · 일반 앱</text>

  <rect x="875" y="701" width="249" height="98" rx="10" fill="#f7f3fc" stroke="#cdb8e6"/>
  <text x="893" y="730" class="heading gpu">GPU 워커 × 1</text>
  <text x="893" y="758" class="small">gpu-worker-01</text>
  <text x="893" y="782" class="small">GPU 모델 추론</text>
</svg>
