<rect x="370" y="1190" width="230" height="85" rx="10" fill="#edf4fc" stroke="#cfded6" stroke-width="1.4"/>
<text x="485.0" y="1217" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">집 공유기 · AP</text>
<text x="485.0" y="1242" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">192.168.50.1</text>
<rect x="950" y="1190" width="250" height="85" rx="10" fill="#edf4fc" stroke="#cfded6" stroke-width="1.4"/>
<text x="1075.0" y="1217" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">인터넷 서버</text>
<text x="1075.0" y="1242" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">다운로드 · API 요청</text>
<path d="M485 1100 V1190" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500" y="1151" width="300" height="25" rx="3" fill="#f7faf8" stroke="#f7faf8" stroke-width="0"/>
<text x="507" y="1171" font-size="16" font-weight="400" fill="#386ba3" text-anchor="start">드라이버·무선 송신 → AP 수신</text>
<path d="M600 1232 H950" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="775" y="1215" font-size="17" font-weight="400" fill="#587368" text-anchor="middle">공유기 라우팅·NAT → 회선</text>
<rect x="640" y="1020" width="265" height="90" rx="10" fill="none" stroke="#bb3d35" stroke-width="3"/>
<rect x="940" y="1020" width="270" height="90" rx="10" fill="none" stroke="#bb3d35" stroke-width="3"/>
<text x="30" y="1320" font-size="18" font-weight="700" fill="#bb3d35" text-anchor="start">ip saddr 172.24.4.0/24 oifname &quot;wlo1&quot; masquerade</text>
<text x="30" y="1350" font-size="17" font-weight="400" fill="#587368" text-anchor="start">nftables의 FORWARD 규칙과 POSTROUTING NAT를 적용한다. conntrack이 역방향 변환도 추적한다.</text>
<text x="30" y="1393" font-size="16" font-weight="400" fill="#587368" text-anchor="start">인터넷 요청의 전달 경로를 표시했다. DHCP·메타데이터는 별도 요청의 경로다.</text>
<text x="30" y="1421" font-size="16" font-weight="400" fill="#587368" text-anchor="start">같은 호스트의 VM → qrouter 통신은 br-int에서 전달되므로 다른 호스트로 가는 br-tun 경로를 타지 않는다.</text>
