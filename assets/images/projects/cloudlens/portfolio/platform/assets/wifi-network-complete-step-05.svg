<text x="772.5" y="1057" font-size="20" font-weight="700" fill="#213e35" text-anchor="middle">호스트 NAT</text>
<text x="772.5" y="1082" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">POSTROUTING · conntrack</text>
<rect x="370" y="1030" width="230" height="70" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="485.0" y="1057" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">wlo1 · Wi-Fi NIC</text>
<text x="485.0" y="1082" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">192.168.50.217</text>
