<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1450" viewBox="0 0 1280 1450" role="img" aria-labelledby="title desc">
<title id="title">5. 호스트 NAT · wlo1의 IP로 출발지 주소 변환</title>
<desc id="desc">VM의 가상 NIC, QEMU 또는 vhost-net, TAP, qbr, qvb와 qvo veth 쌍, br-int의 private망, qr internal 포트, qrouter 라우팅과 SNAT, qg internal 포트, br-int의 public망, int-br-ex와 phy-br-ex patch 쌍, br-ex, veth-ex와 veth-host 쌍, 호스트 라우팅, NAT, wlo1, 집 공유기와 인터넷으로 이어진다. VM은 별도 커널이다. 호스트 기본 네임스페이스는 초록 영역, qrouter는 보라 영역이다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="1278" height="1448" rx="18" fill="#f7faf8" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="30" y="44" font-size="25" font-weight="700" fill="#213e35" text-anchor="start">5. 호스트 NAT · wlo1의 IP로 출발지 주소 변환</text>
<text x="30" y="78" font-size="17" font-weight="400" fill="#587368" text-anchor="start">파랑: VM 게스트  ·  초록: 호스트 기본 네임스페이스  ·  보라: 라우터 네임스페이스  ·  빨강: 현재 설정</text>
<rect x="20" y="105" width="1240" height="1055" rx="14" fill="#fff" stroke="#c5d6cc" stroke-width="1.4"/>
<text x="42" y="137" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">Ubuntu 데스크탑 · VM과 OpenStack 네트워크가 같은 물리 서버에서 실행</text>
<rect x="40" y="160" width="260" height="185" rx="10" fill="#edf4fc" stroke="#aec5e3" stroke-width="1.4"/>
<text x="58" y="190" font-size="19" font-weight="700" fill="#386ba3" text-anchor="start">VM · 별도 게스트 커널</text>
<text x="58" y="216" font-size="16" font-weight="400" fill="#587368" text-anchor="start">게스트 IP 스택 · 기본 경로</text>
<rect x="60" y="240" width="220" height="80" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="170.0" y="267" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">가상 NIC</text>
<text x="170.0" y="292" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">10.0.0.23 · private</text>
<rect x="320" y="160" width="920" height="980" rx="10" fill="#fafbf9" stroke="#bfcec4" stroke-width="1.4"/>
<text x="340" y="190" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">호스트 OS · 가상 머신 실행과 Linux 네트워크 처리</text>
<rect x="350" y="220" width="500" height="105" rx="10" fill="#fff" stroke="#c5d6cc" stroke-width="1.4"/>
<text x="370" y="248" font-size="20" font-weight="700" fill="#213e35" text-anchor="start">가상 NIC 백엔드</text>
<text x="370" y="277" font-size="17" font-weight="400" fill="#587368" text-anchor="start">QEMU가 가상 NIC와 TAP의 연결을 설정</text>
<text x="370" y="303" font-size="17" font-weight="400" fill="#587368" text-anchor="start">데이터 전달: QEMU 또는 호스트 커널의 vhost-net</text>
<path d="M280 280 H350" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="885" y="246" font-size="16" font-weight="700" fill="#386ba3" text-anchor="start">VM ↔ 호스트는 별도 커널 경계</text>
<text x="885" y="274" font-size="16" font-weight="400" fill="#587368" text-anchor="start">TAP은 호스트 쪽 Ethernet 접점</text>
<text x="885" y="302" font-size="16" font-weight="400" fill="#587368" text-anchor="start">이 경계에 veth를 놓지 않는다</text>
<path d="M340 350 H1220 V480 H920 V845 H1220 V1120 H340 Z" fill="#edf7f2" stroke="#9fcab6" stroke-width="1.5"/>
<text x="630" y="376" font-size="18" font-weight="700" fill="#167858" text-anchor="start">호스트 기본 네임스페이스 · root / default</text>
<path d="M600 325 V338 H455 V400" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
