<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="873" viewBox="0 0 1120 873" role="img" aria-labelledby="title desc">
<title id="title">컨트롤러를 설치하고 자원을 적용하는 순서</title><desc id="desc">먼저 API 종류와 실행 주체를 준비한 뒤, 그들이 처리할 Gateway와 모델 자원을 만듭니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="871" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">컨트롤러를 설치하고 자원을 적용하는 순서</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">먼저 API 종류와 실행 주체를 준비한 뒤, 그들이 처리할 Gateway와 모델 자원을 만듭니다.</text>
<polyline points="197,271 197,363" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560,271 560,317 340,317 340,363" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="923,271 923,363" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,509 288,601" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,509 832,601" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="125" width="322" height="146" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">cert-manager</text><text x="56" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">웹훅 인증서</text><text x="56" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">HTTPS 인증서 발급</text><rect x="399" y="125" width="322" height="146" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="419" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Gateway 관련 CRD</text><text x="419" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Gateway API</text><text x="419" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Inference Extension</text><text x="419" y="243" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Envoy AI Gateway</text><rect x="762" y="125" width="322" height="146" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="782" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">LWS · KServe CRD</text><text x="782" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">워크로드 API 종류 등록</text><text x="782" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서빙 자원 스키마 등록</text><rect x="36" y="363" width="504" height="146" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="396" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Envoy Gateway · AI Gateway</text><text x="56" y="427" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">선언된 경로와 모델 풀을 감시</text><text x="56" y="454" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Envoy 실행 설정으로 변환</text><rect x="580" y="363" width="504" height="146" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="600" y="396" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">KServe controller · runtime config</text><text x="600" y="427" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">LLMInferenceService를 감시</text><text x="600" y="454" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">추론 워크로드 구성</text><rect x="36" y="601" width="504" height="146" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="634" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">GatewayClass · Gateway · Route</text><text x="56" y="665" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">외부 / 내부 Host와 모델명 경로</text><text x="56" y="692" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">InferencePool에 연결</text><rect x="580" y="601" width="504" height="146" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="634" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">PVC · ResourceClaim · 모델 자원</text><text x="600" y="665" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">가중치 저장소 · GPU 요청</text><text x="600" y="692" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">LLMInferenceService 배포</text><text x="36" y="801" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">CRD는 사용할 API와 형식을 정의하고, 컨트롤러는 그 자원을 읽어 실제 실행 상태를 맞춥니다.</text><text x="36" y="832" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">화살표는 주요 적용 순서입니다. 설치 명령과 버전은 아래 각 단계에 이어집니다.</text></svg>
