<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="934" viewBox="0 0 1200 934" role="img" aria-labelledby="title desc">
  <title id="title">직접 구축한 인프라와 모델을 연결하는 CloudLens</title>
  <desc id="desc">CloudLens는 Mac에서 실행한다. React 화면의 요청을 FastAPI가 받아 Kubernetes와 OpenStack SDK로 자원을 조회하고 변경한다. 사용량은 Kubernetes Service proxy를 통해 Prometheus에서 조회하고, AI 기능은 Envoy Gateway를 거쳐 GPU 워커의 Qwen3.5-9B 모델 API를 사용한다. 계정, 연결 설정, 채팅, 모델 입출력과 사용자별 토큰 사용량은 Mac의 H2에 저장한다. OpenStack API와 VM 위의 Kubernetes, Prometheus, 모델 서버는 집의 데스크탑에 구축한 환경에 속한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#739184" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#5682b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#9272bc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #203e34; }
    .title { font-size: 28px; font-weight: 700; }
    .heading { font-size: 21px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; fill: #61766d; }
    .blue { fill: #35648e; }
    .purple { fill: #7751aa; }
    .line { fill: none; stroke: #739184; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .metric { stroke: #5682b0; marker-start: url(#blue-arrow); marker-end: url(#blue-arrow); }
    .model { stroke: #9272bc; marker-start: url(#purple-arrow); marker-end: url(#purple-arrow); }
  </style>
  <rect width="1200" height="934" rx="20" fill="#f6f9f7"/>
  <text x="32" y="45" class="title">직접 구축한 인프라와 모델을 연결하는 CloudLens</text>
  <text x="32" y="76" class="body">인프라를 관리하는 포털이면서, 그 안에서 실행하는 Qwen을 사용하는 AI 애플리케이션</text>

  <!-- Execution locations: the portal is on the Mac, the managed environment is on the desktop. -->
  <rect x="32" y="126" width="382" height="690" rx="16" fill="#ffffff" stroke="#c9dfd3" stroke-width="1.5"/>
  <text x="56" y="163" class="heading">Mac · CloudLens</text>
  <rect x="580" y="126" width="588" height="690" rx="16" fill="#eef5fc" stroke="#ccdef0" stroke-width="1.5"/>
  <text x="604" y="163" class="heading blue">집의 데스크탑 · OpenStack 환경</text>

  <!-- User-facing application. -->
  <rect x="56" y="195" width="334" height="116" rx="10" fill="#f6faf8" stroke="#d5e2dc"/>
  <text x="76" y="228" class="heading">브라우저 · React</text>
  <text x="76" y="261" class="body">앱 구성 · 사용량 · 자원 관리</text>
  <text x="76" y="289" class="body">AI 채팅 · 장애 진단</text>
  <path d="M223 314V364" class="line both"/>
  <text x="242" y="344" class="small">API · 실시간 응답</text>

  <rect x="56" y="367" width="334" height="268" rx="10" fill="#edf6f1" stroke="#b9dacc"/>
  <text x="76" y="400" class="heading">FastAPI · 요청 처리</text>
  <text x="76" y="439" class="body">자원 조회·변경 · 관계 계산</text>
  <text x="76" y="463" class="small">Kubernetes · OpenStack SDK</text>
  <path d="M76 480H370" stroke="#d0e1d7"/>
  <text x="76" y="511" class="body blue">앱·인프라 사용량 조회</text>
  <text x="76" y="535" class="small">앱에 속한 Pod·PVC로 지표 조회</text>
  <path d="M76 552H370" stroke="#d0e1d7"/>
  <text x="76" y="583" class="body purple">AI 기능 · 모델 API 호출</text>
  <text x="76" y="607" class="small">도구·조건 선택 / 진단·로그 분석</text>

  <path d="M223 638V683" class="line both"/>
  <rect x="56" y="686" width="334" height="106" rx="10" fill="#f6faf8" stroke="#d5e2dc"/>
  <text x="76" y="718" class="heading">H2 · 포털 데이터와 실행 기록</text>
  <text x="76" y="748" class="small">계정 · 연결 설정 · 채팅 · 작업 이력</text>
  <text x="76" y="775" class="small">모델 입출력 · 사용자별 토큰 사용량</text>

  <!-- Infrastructure and the services deployed in its Kubernetes VMs. -->
  <rect x="604" y="195" width="540" height="116" rx="10" fill="#ffffff" stroke="#ccdef0"/>
  <text x="624" y="228" class="heading blue">OpenStack API</text>
  <text x="624" y="261" class="body">VM · 네트워크 · Cinder 볼륨</text>
  <text x="624" y="289" class="small">Nova · Neutron · Cinder · Placement</text>

  <rect x="604" y="340" width="540" height="452" rx="12" fill="#ffffff" stroke="#c9dfd3"/>
  <text x="628" y="376" class="heading">VM 위의 Kubernetes 클러스터</text>
  <rect x="628" y="398" width="492" height="92" rx="10" fill="#f0f8f4" stroke="#c9e3d6"/>
  <text x="648" y="430" class="heading">Kubernetes API</text>
  <text x="648" y="465" class="body">앱 구성 · Pod · Service · PVC · 상태·이벤트·로그</text>

  <rect x="628" y="518" width="492" height="94" rx="10" fill="#eef5fc" stroke="#ccdef0"/>
  <text x="648" y="550" class="heading blue">Prometheus · 사용량 데이터</text>
  <text x="648" y="579" class="body">CPU · 메모리 · 디스크 · DCGM의 GPU 지표</text>
  <text x="648" y="601" class="small">Kubernetes Service proxy를 통해 조회</text>

  <rect x="628" y="640" width="492" height="128" rx="10" fill="#f7f3fc" stroke="#ddcfef"/>
  <text x="648" y="673" class="heading purple">모델 API · 직접 배포한 Qwen</text>
  <text x="648" y="704" class="body">Envoy Gateway → Qwen3.5-9B / llama.cpp</text>
  <text x="648" y="733" class="small">GPU 워커에서 실행 · OpenAI 호환 API</text>
  <text x="648" y="756" class="small">요청 해석 · 진단 결과를 CloudLens에 반환</text>

  <!-- Connectors use the gap between location panels; they never cross node labels. -->
  <path d="M393 444H476V252H601" class="line both"/>
  <path d="M476 444H625" class="line"/>
  <circle cx="476" cy="444" r="4" fill="#739184"/>
  <path d="M393 516H518V564H625" class="line metric"/>
  <path d="M393 588H552V704H625" class="line model"/>

  <rect x="32" y="842" width="1136" height="68" rx="12" fill="#edf6f1"/>
  <text x="54" y="870" class="body" font-weight="700">CloudLens에서 이어 보는 운영 흐름</text>
  <text x="54" y="895" class="body">앱 → Pod → Node → OpenStack VM을 따라가며 구성·사용량을 확인하고, 같은 앱의 자료로 AI 진단</text>
</svg>
