<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes가 OpenStack의 VM과 볼륨을 사용하는 방법</title><desc id="desc">CCM은 노드의 기반 VM을 식별하고, CSI는 Pod에 필요한 볼륨을 준비합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="998" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">Kubernetes가 OpenStack의 VM과 볼륨을 사용하는 방법</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">CCM은 노드의 기반 VM을 식별하고, CSI는 Pod에 필요한 볼륨을 준비합니다.</text>
<rect x="36" y="120" width="504" height="800" rx="16" fill="#eef5fd" fill-opacity=".55" stroke="#c2d7f3"/><text x="56" y="152" font-size="20" font-weight="700" fill="#325f99" text-anchor="start">Node ↔ VM · CCM</text><rect x="564" y="120" width="520" height="800" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="584" y="152" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">PVC ↔ Volume · Cinder CSI</text><polyline points="288,312 288,365" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,493 288,546" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,674 288,727" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="824,312 824,365" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="824,493 824,546" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="824,674 824,727" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="184" width="456" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="217" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">노드 VM에서 kubelet 실행</text><text x="80" y="248" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Kubernetes에 Node 등록</text><rect x="60" y="365" width="456" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="398" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">OpenStack CCM</text><text x="80" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Nova API에서 대응하는 VM 확인</text><rect x="60" y="546" width="456" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="579" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Node.spec.providerID 기록</text><text x="80" y="610" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">openstack:///VM-UUID</text><text x="80" y="637" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">초기화 taint 제거</text><rect x="60" y="727" width="456" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="760" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">CloudLens의 인프라 연결</text><text x="80" y="791" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">지정한 클라우드 + VM UUID</text><text x="80" y="818" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Node에서 해당 VM으로 이동</text><rect x="588" y="184" width="472" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="608" y="217" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Pod → PVC → cinder-ssd</text><text x="608" y="248" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">StorageClass에서 Cinder 타입 ssd 선택</text><text x="608" y="275" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">WaitForFirstConsumer: 배치와 함께 결정</text><rect x="588" y="365" width="472" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="608" y="398" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">CSI Controller + OpenStack API</text><text x="608" y="429" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Cinder 볼륨 생성</text><text x="608" y="456" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">노드 VM에 연결</text><rect x="588" y="546" width="472" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="608" y="579" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">CSI Node plugin</text><text x="608" y="610" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">노드 장치 준비 · 파일시스템 마운트</text><text x="608" y="637" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Pod의 volumeMounts에 연결</text><rect x="588" y="727" width="472" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="608" y="760" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">앱이 파일로 사용</text><text x="608" y="791" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">PVC ↔ PV ↔ Cinder Volume</text><text x="608" y="818" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">원격 저장소를 컨테이너 경로로 사용</text><text x="36" y="957" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">Namespace는 Kubernetes의 구분입니다. Cinder 볼륨 한도는 인증한 OpenStack 프로젝트에 적용됩니다.</text></svg>
