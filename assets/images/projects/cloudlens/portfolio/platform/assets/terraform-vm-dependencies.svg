"36" y="324" width="322" height="125" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="357" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">새 Cinder 부팅 볼륨</text><text x="56" y="388" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">이미지에서 디스크 생성</text><text x="56" y="415" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">볼륨 ID</text><rect x="399" y="324" width="322" height="125" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="419" y="357" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">새 Neutron 포트</text><text x="419" y="388" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">고정 IP · 보안 그룹 연결</text><text x="419" y="415" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">포트 ID</text><rect x="211" y="542" width="698" height="134" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="231" y="575" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Nova Instance</text><text x="231" y="606" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">boot_index=0인 볼륨 + 포트 + Flavor + 키 페어 참조</text><text x="231" y="633" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">컨트롤 플레인 · 일반 워커 · GPU 워커 · LB VM</text><rect x="36" y="718" width="1048" height="66" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="751" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">for_each의 노드 키와 Terraform state가 각 선언을 실제 OpenStack 자원 ID에 연결</text></svg>
