<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="812" viewBox="0 0 1120 812" role="img" aria-labelledby="title desc">
<title id="title">Terraform의 참조로 VM 생성 순서를 연결</title><desc id="desc">미리 등록한 항목을 읽고, 포트와 부팅 볼륨의 ID를 VM 선언에 전달합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="810" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">Terraform의 참조로 VM 생성 순서를 연결</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">미리 등록한 항목을 읽고, 포트와 부팅 볼륨의 ID를 VM 선언에 전달합니다.</text>
