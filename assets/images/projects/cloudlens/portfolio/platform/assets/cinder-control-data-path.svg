<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">볼륨을 연결하는 API와 데이터를 읽는 경로</title><desc id="desc">Cinder API는 볼륨을 관리하고, 연결 이후의 블록 I/O는 데이터 경로를 사용합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="788" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">볼륨을 연결하는 API와 데이터를 읽는 경로</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">Cinder API는 볼륨을 관리하고, 연결 이후의 블록 I/O는 데이터 경로를 사용합니다.</text>
<rect x="36" y="120" width="1048" height="244" rx="16" fill="#f4f0fc" fill-opacity=".55" stroke="#d8c9ef"/><text x="56" y="152" font-size="20" font-weight="700" fill="#7350a6" text-anchor="start">① 생성·연결 요청</text><rect x="36" y="408" width="1048" height="320" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="440" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">② VM에서 파일을 읽고 쓰는 실제 데이터 경로</text><polyline points="344,245 418,245" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="702,245 776,245" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="344,566 418,566" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="702,566 776,566" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="183" width="284" height="124" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">사용자 · CSI</text><text x="80" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">볼륨 생성 / 연결 요청</text><rect x="418" y="183" width="284" height="124" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="438" y="216" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Cinder · Nova</text><text x="438" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">볼륨 준비</text><text x="438" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">VM 장치 연결 조율</text><rect x="776" y="183" width="284" height="124" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="796" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">libvirt · QEMU</text><text x="796" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">VM에 블록 장치 연결</text><rect x="60" y="478" width="284" height="176" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="511" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">VM의 앱 · 게스트 커널</text><text x="80" y="542" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">파일 → 블록 I/O</text><text x="80" y="569" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">가상 디스크로 요청</text><rect x="418" y="478" width="284" height="176" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="438" y="511" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">QEMU · 호스트</text><text x="438" y="542" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">연결된 iSCSI 장치</text><text x="438" y="569" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">블록 읽기 / 쓰기</text><rect x="776" y="478" width="284" height="176" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="796" y="511" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">iSCSI target · LVM</text><text x="796" y="542" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">볼륨 LV → Thin pool</text><text x="796" y="569" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">→ 프로젝트 SSD</text><text x="36" y="763" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">이 환경은 VM과 저장소가 같은 물리 호스트에 있습니다. 디스크 I/O가 Wi-Fi를 왕복하지 않습니다.</text></svg>
