<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-label="물리 GPU 한 장이 모델 Pod에 도달하기까지"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#718c81" stroke-width="1.4"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#203e34}.title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px;fill:#4c6c60}.small{font-size:14px;fill:#617a70}.line{fill:none;stroke:#718c81;stroke-width:2;marker-end:url(#arrow)}</style><rect x="1" y="1" width="1118" height="998" rx="18" fill="#f6faf8" stroke="#d7e3dd"/><text x="32" y="46" class="title">물리 GPU 한 장이 모델 Pod에 도달하기까지</text><text x="32" y="76" class="body">OpenStack은 VM에 장치를 연결하고, Kubernetes는 컨테이너에 할당합니다.</text><rect x="48" y="120" width="630" height="130" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="151" class="heading">1  호스트 · VFIO</text><text x="66" y="180" class="body">RTX 2060 SUPER / PCI 0000:2b:00.0</text><text x="66" y="205" class="body">IOMMU 격리 · vfio-pci 바인딩</text><text x="716" y="187" class="body">장치를 VM에 넘길 수 있는 상태로 준비</text><path d="M363 250 V289" class="line"/><rect x="48" y="289" width="630" height="130" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="320" class="heading">2  Nova · GPU 워커 VM</text><text x="66" y="349" class="body">Flavor: pci_passthrough:alias</text><text x="66" y="374" class="body">gpu-worker-01에 GPU 1장 연결</text><text x="716" y="356" class="body">VM의 PCI 장치로 전달</text><path d="M363 419 V458" class="line"/><rect x="48" y="458" width="630" height="130" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="489" class="heading">3  GPU Operator · 드라이버</text><text x="66" y="518" class="body">NVIDIA 드라이버 · DRA driver</text><text x="66" y="543" class="body">GPU를 ResourceSlice에 게시</text><text x="716" y="525" class="body">장치 발견과 노드의 실행 환경 준비</text><path d="M363 588 V627" class="line"/><rect x="48" y="627" width="630" height="130" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="658" class="heading">4  DeviceClass · ResourceClaim</text><text x="66" y="687" class="body">rtx2060-super 조건으로 선택</text><text x="66" y="712" class="body">Pod와 컨테이너가 Claim 참조</text><text x="716" y="694" class="body">스케줄러가 장치를 할당</text><path d="M363 757 V796" class="line"/><rect x="48" y="796" width="630" height="130" rx="12" fill="#f5f0fd" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="827" class="heading">5  kubelet · containerd · 모델</text><text x="66" y="856" class="body">DRA 장치 준비 → CDI 주입</text><text x="66" y="881" class="body">모델 프로세스가 CUDA로 GPU 사용</text><text x="716" y="863" class="body">컨테이너 안에서 GPU 연산</text><text x="48" y="975" class="body">가중치는 별도 PVC에서 읽습니다. GPU 할당과 모델 파일 저장은 서로 독립된 연결입니다.</text></svg>