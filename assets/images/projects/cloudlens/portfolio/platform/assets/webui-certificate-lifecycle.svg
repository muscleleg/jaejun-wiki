<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="952" viewBox="0 0 1120 952" role="img" aria-labelledby="title desc">
<title id="title">HTTPS 인증서를 발급하는 과정과 사용하는 과정</title><desc id="desc">cert-manager가 만든 Secret을 Envoy가 읽고, 브라우저는 공개 루트 인증서로 검증합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="950" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">HTTPS 인증서를 발급하는 과정과 사용하는 과정</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">cert-manager가 만든 Secret을 Envoy가 읽고, 브라우저는 공개 루트 인증서로 검증합니다.</text>
<rect x="36" y="120" width="1048" height="422" rx="16" fill="#f4f0fc" fill-opacity=".55" stroke="#d8c9ef"/><text x="56" y="152" font-size="20" font-weight="700" fill="#7350a6" text-anchor="start">인증서 준비 · Kubernetes 자원</text><rect x="36" y="588" width="1048" height="310" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="620" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">실제 접속 · https://chat.k8s.test</text><polyline points="370,245 405,245" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="715,245 750,245" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="905,308 905,377" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560,308 560,345 387,345 387,377" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="370,736 405,736" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="715,736 750,736" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="905,498 1100,498 1100,562 560,562 560,654" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="60" y="183" width="310" height="125" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">SelfSigned Issuer</text><text x="80" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">webui-ca-bootstrap</text><text x="80" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">루트 CA 생성용</text><rect x="405" y="183" width="310" height="125" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="425" y="216" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">루트 CA Secret</text><text x="425" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">공개 인증서 + 개인키</text><text x="425" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">CA Issuer: webui-ca</text><rect x="750" y="183" width="310" height="125" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="770" y="216" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Certificate webui-tls</text><text x="770" y="247" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">DNS: chat.k8s.test</text><text x="770" y="274" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">CA Issuer에 서명 요청</text><rect x="750" y="377" width="310" height="121" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="770" y="410" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">TLS Secret</text><text x="770" y="441" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서버 인증서 + 개인키</text><text x="770" y="468" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Envoy listener가 참조</text><rect x="60" y="377" width="655" height="121" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="80" y="410" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Mac의 신뢰 저장소</text><text x="80" y="441" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">루트 CA의 공개 인증서만 설치</text><text x="80" y="468" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">서버 인증서가 신뢰한 CA로 서명됐는지 확인</text><rect x="60" y="654" width="310" height="163" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="687" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">브라우저</text><text x="80" y="718" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">인증서 체인 · 호스트명 검증</text><text x="80" y="745" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">신뢰한 CA와 대조</text><rect x="405" y="654" width="310" height="163" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="425" y="687" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Envoy HTTPS listener</text><text x="425" y="718" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">TLS Secret 사용</text><text x="425" y="745" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">암호화 연결 종료</text><rect x="750" y="654" width="310" height="163" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="770" y="687" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Open WebUI Service</text><text x="770" y="718" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">HTTPRoute가 전달</text><text x="770" y="745" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">애플리케이션 포트 8080</text><text x="36" y="930" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">LB는 TCP를 전달합니다. 인증서 발급과 브라우저 요청 처리는 서로 다른 시점의 작업입니다.</text><rect x="503.75" y="552" width="112.5" height="36" rx="6" fill="#f6faf8"/><text x="560" y="575" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">인증서 참조</text></svg>
