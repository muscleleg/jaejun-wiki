<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc">
<title id="title">컨테이너가 공유하는 커널은 실행 위치에 따라 다름</title><desc id="desc">물리 호스트의 커널과 VM이 부팅한 게스트 커널을 구분합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="728" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">컨테이너가 공유하는 커널은 실행 위치에 따라 다름</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">물리 호스트의 커널과 VM이 부팅한 게스트 커널을 구분합니다.</text>
<rect x="36" y="120" width="1048" height="562" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="152" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">Ubuntu 물리 호스트</text><rect x="556" y="184" width="504" height="360" rx="16" fill="#f4f0fc" fill-opacity=".55" stroke="#d8c9ef"/><text x="576" y="216" font-size="20" font-weight="700" fill="#7350a6" text-anchor="start">Kubernetes 노드 VM</text><polyline points="808,360 808,411" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="556,462 510,462" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="285,299 285,411" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="285,510 285,582" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="184" width="450" height="115" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="80" y="217" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Kolla의 OpenStack 컨테이너</text><text x="80" y="248" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Nova · Neutron · Cinder · libvirt</text><rect x="580" y="245" width="456" height="115" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="600" y="278" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Pod의 컨테이너</text><text x="600" y="309" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">앱 프로세스 · 모델 프로세스</text><rect x="580" y="411" width="456" height="99" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="444" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">VM의 Ubuntu 게스트 커널</text><text x="600" y="475" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Pod 프로세스와 가상 자원을 관리</text><rect x="60" y="411" width="450" height="99" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="80" y="444" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">QEMU 프로세스</text><text x="80" y="475" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">VM의 가상 CPU · 메모리 · 장치</text><rect x="60" y="582" width="976" height="75" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="80" y="615" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">물리 호스트의 Linux 커널 · KVM · 실제 CPU / 메모리</text><text x="36" y="711" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">GPU 패스스루: 물리 호스트는 VFIO, GPU 워커 VM은 NVIDIA 드라이버를 사용합니다.</text><rect x="224.0" y="332" width="122.0" height="36" rx="6" fill="#f6faf8"/><text x="285" y="355" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">VM 실행 관리</text><rect x="178.75" y="532" width="212.5" height="36" rx="6" fill="#f6faf8"/><text x="285" y="555" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">KVM으로 게스트 CPU 실행</text></svg>
