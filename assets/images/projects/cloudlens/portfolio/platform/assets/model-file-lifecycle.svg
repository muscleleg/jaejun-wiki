<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">모델 파일을 한 번 저장하고 추론 Pod에서 재사용</title><desc id="desc">가중치의 수명은 다운로드 Pod나 추론 엔진 컨테이너의 수명과 분리했습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="848" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">모델 파일을 한 번 저장하고 추론 Pod에서 재사용</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">가중치의 수명은 다운로드 Pod나 추론 엔진 컨테이너의 수명과 분리했습니다.</text>
<polyline points="264,237 264,308" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="492,382 580,382" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,456 832,557" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="492,630 580,630" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="126" width="1048" height="111" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="159" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">선택한 GGUF 파일</text><text x="56" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">고정 Hugging Face revision · Qwen3.5-9B-Q4_K_M.gguf · SHA-256 검증</text><rect x="36" y="308" width="456" height="148" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="341" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">다운로드 Pod</text><text x="56" y="372" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">/models에 파일 저장</text><text x="56" y="399" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">GPU 연산 없이 다운로드</text><text x="56" y="426" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">성공 후 이 Pod만 삭제</text><rect x="580" y="308" width="504" height="148" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="600" y="341" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">PVC gguf-comparison-models</text><text x="600" y="372" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Cinder SSD · 15 GiB</text><text x="600" y="399" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">다운로드 Pod 삭제 뒤에도 파일 유지</text><rect x="36" y="557" width="456" height="148" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="590" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">llama.cpp 실행 이미지</text><text x="56" y="621" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">컨테이너 이미지 digest로 관리</text><text x="56" y="648" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">실행 바이너리 · CUDA 라이브러리</text><rect x="580" y="557" width="504" height="148" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="600" y="590" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">추론 Pod</text><text x="600" y="621" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">PVC를 /mnt/models에 마운트</text><text x="600" y="648" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">GGUF를 읽고 할당된 GPU로 실행</text><rect x="36" y="751" width="1048" height="66" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="784" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">엔진 이미지를 바꾸거나 추론 Pod를 재생성해도, 같은 PVC의 모델 파일을 재사용</text><rect x="508.0" y="332" width="56" height="36" rx="6" fill="#f6faf8"/><text x="536" y="355" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">쓰기</text><rect x="755.5" y="490" width="153.0" height="36" rx="6" fill="#f6faf8"/><text x="832" y="513" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">같은 볼륨을 읽음</text><rect x="508.0" y="581" width="56" height="36" rx="6" fill="#f6faf8"/><text x="536" y="604" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">실행</text></svg>
