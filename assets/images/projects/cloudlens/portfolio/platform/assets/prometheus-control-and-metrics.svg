<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060" role="img" aria-labelledby="title desc">
<title id="title">수집 설정과 실제 지표가 움직이는 경로</title><desc id="desc">Operator가 설정을 만들면 Prometheus가 직접 exporter를 조회해 시계열을 저장합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="1058" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">수집 설정과 실제 지표가 움직이는 경로</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">Operator가 설정을 만들면 Prometheus가 직접 exporter를 조회해 시계열을 저장합니다.</text>
<rect x="36" y="120" width="1048" height="233" rx="16" fill="#eef5fd" fill-opacity=".55" stroke="#c2d7f3"/><text x="56" y="152" font-size="20" font-weight="700" fill="#325f99" text-anchor="start">① 무엇을 수집할지 설정</text><rect x="36" y="399" width="1048" height="379" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="431" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">② 지표 수집과 저장</text><polyline points="370,244 405,244" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="715,244 750,244" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="516,530 656,550" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="516,689 590,689 590,592 656,592" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="858,622 858,661" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="858,778 858,837" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="182" width="310" height="125" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="215" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">ServiceMonitor</text><text x="80" y="246" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">대상 Service · 포트</text><text x="80" y="273" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">조회 주기 · selector</text><rect x="405" y="182" width="310" height="125" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="425" y="215" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Prometheus Operator</text><text x="425" y="246" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모니터링 자원 감시</text><text x="425" y="273" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">scrape 설정 생성</text><rect x="750" y="182" width="310" height="125" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="770" y="215" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Prometheus</text><text x="770" y="246" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">선택된 설정 적용</text><rect x="60" y="463" width="456" height="145" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="496" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">CPU · 메모리 · 스토리지</text><text x="80" y="527" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">node-exporter: 노드 OS</text><text x="80" y="554" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">kubelet / cAdvisor: 컨테이너 · PVC</text><text x="80" y="581" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">kube-state-metrics: 자원의 설정·상태</text><rect x="60" y="640" width="456" height="98" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="80" y="673" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">DCGM exporter</text><text x="80" y="704" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">GPU UUID · 사용률 · 메모리</text><rect x="656" y="509" width="404" height="113" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="676" y="542" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Prometheus 시계열</text><text x="676" y="573" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">exporter의 /metrics 응답 수집</text><rect x="656" y="661" width="404" height="77" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="676" y="694" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Cinder CSI PVC · 시계열 보관</text><rect x="36" y="837" width="1048" height="163" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="870" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">③ CloudLens에서 앱 단위 그래프로 표시</text><text x="56" y="901" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">앱의 Pod · PVC · GPU 범위 → PromQL 조건</text><text x="56" y="928" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">FastAPI → Kubernetes Service proxy → Prometheus query / query_range</text><text x="56" y="955" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">반환된 시계열 → CPU · 메모리 · 디스크 · GPU 그래프</text><text x="36" y="1033" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">Operator는 설정을 조정합니다. 지표 수집과 시계열 보관은 Prometheus가 담당합니다.</text></svg>
