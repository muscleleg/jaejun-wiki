<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
  <title id="title">Nova, libvirt, QEMU, KVM의 역할과 계층</title>
  <desc id="desc">Nova와 libvirt는 VM을 관리한다. QEMU는 사용자 공간에서 VM을 구성하고, Linux 커널의 KVM과 하드웨어 가상화 기능을 이용해 게스트 CPU 코드를 실행한다. 관리 요청 흐름과 VM 실행 경로는 다르다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="1010" rx="20" fill="#f8fafc"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#0f172a">
    <text x="50" y="55" font-size="30" font-weight="700">VM 생성 요청에서 실제 CPU 실행까지</text>
    <text x="50" y="88" font-size="18" fill="#475569">OpenStack의 libvirt + QEMU/KVM 구성 · 핵심 역할을 단순화한 구조</text>
    <rect x="35" y="115" width="930" height="305" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="58" y="149" font-size="20" font-weight="700" fill="#1d4ed8">관리 계층 — VM 생성·종료·상태 제어</text>
    <rect x="235" y="170" width="690" height="83" rx="12" fill="white" stroke="#93c5fd"/>
    <text x="260" y="202" font-size="24" font-weight="700">Nova</text>
    <text x="260" y="231" font-size="18">생성 요청 처리 · 실행 호스트 선정 · nova-compute가 실행 요청</text>
    <path d="M580 253V304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="286" font-size="16" fill="#475569">libvirt API 호출</text>
    <rect x="235" y="312" width="690" height="83" rx="12" fill="white" stroke="#93c5fd"/>
    <text x="260" y="344" font-size="24" font-weight="700">libvirt</text>
    <text x="260" y="373" font-size="18">VM 구성 정의 · QEMU 실행과 제어 · 상태 조회</text>
    <path d="M580 395V482" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="600" y="456" font-size="16" fill="#475569">프로세스 실행·관리</text>
    <rect x="35" y="490" width="930" height="440" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="58" y="525" font-size="20" font-weight="700" fill="#0f766e">VM 실행 계층</text>
    <text x="58" y="581" font-size="17" fill="#475569">호스트 사용자 공간</text>
    <rect x="235" y="548" width="690" height="85" rx="12" fill="white" stroke="#5eead4"/>
    <text x="260" y="580" font-size="24" font-weight="700">QEMU</text>
    <text x="260" y="610" font-size="18">VM 메모리·가상 장치 구성 및 유지 · 게스트 CPU 실행 요청</text>
    <path d="M580 642V693" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="600" y="674" font-size="16" fill="#475569">/dev/kvm · 실행 요청과 필요한 처리 반환</text>
    <text x="58" y="735" font-size="17" fill="#475569">호스트 Linux 커널</text>
    <rect x="235" y="702" width="690" height="85" rx="12" fill="white" stroke="#5eead4"/>
    <text x="260" y="734" font-size="24" font-weight="700">KVM</text>
    <text x="260" y="764" font-size="18">게스트 CPU 실행 · 메모리 가상화 · 하드웨어 가상화 기능 제어</text>
    <path d="M580 793V835" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="58" y="881" font-size="17" fill="#475569">물리 하드웨어</text>
    <rect x="235" y="844" width="690" height="62" rx="12" fill="#0f766e"/>
    <text x="260" y="884" font-size="22" font-weight="700" fill="white">실제 CPU — AMD-V / Intel VT-x</text>
    <text x="50" y="965" font-size="18" fill="#475569">VM의 모든 명령·데이터가 Nova와 libvirt를 통과하는 것은 아니다.</text>
    <text x="50" y="991" font-size="16" fill="#64748b">디스크·네트워크의 세부 I/O 경로와 다른 OpenStack 서비스는 생략했다.</text>
  </g>
</svg>
