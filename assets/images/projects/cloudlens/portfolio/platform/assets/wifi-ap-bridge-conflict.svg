<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="697" viewBox="0 0 1120 697" role="img" aria-labelledby="title desc">
<title id="title">막히는 지점 · AP가 연결한 단말과 원래 출발지가 다르다</title><desc id="desc">일반 Wi-Fi 3-address 클라이언트 모드에서 원래 출발지 BB와 실제 무선 단말 AA를 함께 보존할 수 없는 이유를 그린 개념도. 실제 패킷 캡처가 아니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.code{font-family:Menlo,monospace}</style>
<rect x="1" y="1" width="1118" height="695" rx="18" fill="#f7faf8" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="30" y="43" font-size="25" font-weight="700" fill="#213e35" text-anchor="start">막히는 지점 · AP가 연결한 단말과 원래 출발지가 다르다</text>
<text x="30" y="78" font-size="16" font-weight="400" fill="#5c756b" text-anchor="start">AA = wlo1의 MAC   ·   BB = OpenStack 외부 포트의 MAC   ·   AP = 집 공유기의 무선 접속 지점</text>
<rect x="25" y="103" width="1070" height="117" rx="12" fill="#edf7f2" stroke="#b6d9ca" stroke-width="1.4"/>
<text x="44" y="134" font-size="19" font-weight="700" fill="#157a5b" text-anchor="start">유선 Ethernet · 출발지 BB를 보존할 수 있다</text>
<text x="149.0" y="164" font-size="18" font-weight="700" fill="#213e35" text-anchor="middle">OpenStack</text>
<text x="149.0" y="193" font-size="15" font-weight="400" fill="#5c756b" text-anchor="middle">출발지 MAC BB</text>
<text x="412.0" y="164" font-size="18" font-weight="700" fill="#213e35" text-anchor="middle">br-ex</text>
<text x="660.0" y="164" font-size="18" font-weight="700" fill="#213e35" text-anchor="middle">eth0</text>
<text x="948.0" y="164" font-size="18" font-weight="700" fill="#213e35" text-anchor="middle">스위치·공유기</text>
<text x="948.0" y="193" font-size="15" font-weight="400" fill="#5c756b" text-anchor="middle">같은 포트 뒤 여러 MAC 학습</text>
<path d="M258 159 H323" fill="none" stroke="#157a5b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M501 159 H566" fill="none" stroke="#157a5b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M754 159 H819" fill="none" stroke="#157a5b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="259" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">Wi-Fi 3-address · Address 2 하나가 무선 송신자와 원래 출발지를 겸한다</text>
<rect x="35" y="285" width="245" height="83" rx="12" fill="#eef5fd" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="157.5" y="312" font-size="19" font-weight="700" fill="#213e35" text-anchor="middle">OpenStack → br-ex</text>
<text x="157.5" y="337" font-size="15" font-weight="400" fill="#5c756b" text-anchor="middle">원래 출발지 MAC BB</text>
<rect x="340" y="285" width="230" height="83" rx="12" fill="#eef5fd" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="455.0" y="312" font-size="19" font-weight="700" fill="#213e35" text-anchor="middle">wlo1</text>
<text x="455.0" y="337" font-size="15" font-weight="400" fill="#5c756b" text-anchor="middle">AP에 연결된 단말 AA</text>
<rect x="780" y="285" width="305" height="83" rx="12" fill="#eef5fd" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="932.5" y="312" font-size="19" font-weight="700" fill="#213e35" text-anchor="middle">집 공유기의 AP</text>
<text x="932.5" y="337" font-size="15" font-weight="400" fill="#5c756b" text-anchor="middle">연결 상태: AA</text>
<path d="M280 326 H340" fill="none" stroke="#157a5b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570 326 H780" fill="none" stroke="#34669e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="675" y="306" font-size="16" font-weight="400" fill="#34669e" text-anchor="middle">AA로 연결됨</text>
<rect x="25" y="398" width="1070" height="115" rx="12" fill="#fff5f3" stroke="#e6b8b2" stroke-width="1.4"/>
<text x="45" y="429" font-size="19" font-weight="700" fill="#bf4138" text-anchor="start">BB를 보존해 보내면</text>
<text x="310" y="429" font-size="19" font-weight="700" fill="#bf4138" text-anchor="start">Address 2 = BB</text>
<path d="M540 447 H756" fill="none" stroke="#bf4138" stroke-width="2" marker-end="url(#arrow)"/>
<text x="788" y="433" font-size="19" font-weight="700" fill="#bf4138" text-anchor="start">×  연결된 송신자 AA와 불일치</text>
<text x="788" y="466" font-size="16" font-weight="400" fill="#5c756b" text-anchor="start">BB를 AA의 트래픽으로 받을 수 없다</text>
<text x="45" y="487" font-size="16" font-weight="400" fill="#5c756b" text-anchor="start">송신자도 BB로 표시된다</text>
<rect x="25" y="528" width="1070" height="94" rx="12" fill="#fff" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="45" y="560" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">AA로 바꿔 보내면</text>
<text x="310" y="560" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">Address 2 = AA</text>
<text x="620" y="560" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">원래 출발지 BB를 적을 별도 자리가 없다</text>
<text x="45" y="594" font-size="17" font-weight="400" fill="#5c756b" text-anchor="start">연결된 단말로 보낼 수 있어도, 원래 MAC을 유지하는 투명한 브리지는 되지 않는다.</text>
<text x="30" y="654" font-size="18" font-weight="700" fill="#157a5b" text-anchor="start">→ 해결: 프레임을 그대로 넘기지 않고, 호스트가 IP 라우팅 후 자신의 Wi-Fi 프레임으로 보낸다.</text>
<text x="30" y="680" font-size="15" font-weight="400" fill="#5c756b" text-anchor="start">일반 3-address 모드의 개념도 · 4-address 브리지는 AP와 단말 양쪽의 별도 지원·설정이 필요하다.</text>
</svg>
