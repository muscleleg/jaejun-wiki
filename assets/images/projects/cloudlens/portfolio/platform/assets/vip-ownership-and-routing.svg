<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
<title id="title">공통 VIP를 유지하는 기능과 요청을 분배하는 기능</title><desc id="desc">Neutron은 주소 사용을 허용하고, Keepalived는 주소를 유지하며, HAProxy는 연결을 분배합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="978" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">공통 VIP를 유지하는 기능과 요청을 분배하는 기능</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">Neutron은 주소 사용을 허용하고, Keepalived는 주소를 유지하며, HAProxy는 연결을 분배합니다.</text>
<rect x="36" y="318" width="1048" height="246" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="350" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">LB VM 두 대 · Kubernetes 외부 진입점</text><polyline points="923,265 923,318" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560,564 560,631" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="288,720 288,798" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,720 832,798" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="125" width="322" height="140" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Neutron 예약 포트</text><text x="56" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">10.0.0.30을 선점</text><text x="56" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">다른 자원에 중복 할당 방지</text><rect x="399" y="125" width="322" height="140" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="419" y="158" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">allowed_address_pairs</text><text x="419" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">LB 포트에 VIP 사용 허용</text><text x="419" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">주소를 인터페이스에 붙이지 않음</text><rect x="762" y="125" width="322" height="140" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="782" y="158" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Keepalived · VRRP</text><text x="782" y="189" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">활성 LB의 ens3에 VIP 추가</text><text x="782" y="216" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">장애 시 다른 LB가 VIP 인계</text><rect x="60" y="383" width="456" height="139" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="80" y="416" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">lb-01 · 10.0.0.31</text><text x="80" y="447" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Keepalived + HAProxy</text><text x="80" y="474" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">기본 우선순위 150</text><rect x="604" y="383" width="456" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="624" y="416" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">lb-02 · 10.0.0.32</text><text x="624" y="447" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Keepalived + HAProxy</text><text x="624" y="474" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">기본 우선순위 100</text><rect x="36" y="631" width="1048" height="89" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="664" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">VIP 10.0.0.30의 HAProxy · TCP 전달</text><text x="56" y="695" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">백엔드 health check · 연결 분배</text><rect x="36" y="798" width="504" height="138" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="831" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">6443 → 컨트롤 플레인 3대</text><text x="56" y="862" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">cp-01 / cp-02 / cp-03 : 6443</text><text x="56" y="889" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">TLS 종료: Kubernetes API</text><rect x="580" y="798" width="504" height="138" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="600" y="831" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">80 / 443 → 일반 워커 2대</text><text x="600" y="862" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">worker-01 / 02 : 30080 / 30443</text><text x="600" y="889" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">웹 HTTPS의 TLS 종료: Envoy</text></svg>
