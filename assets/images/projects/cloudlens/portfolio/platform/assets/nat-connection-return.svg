<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="776" viewBox="0 0 1180 776" role="img" aria-labelledby="title desc">
<title id="title">응답은 각 NAT 지점의 연결 기록을 거슬러 돌아온다</title><desc id="desc">같은 TCP 연결에 대해 왼쪽은 요청의 출발지, 오른쪽은 응답의 목적지를 표시한다. Neutron, 호스트, 집 공유기가 각자의 변환 관계를 기억한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.code{font-family:Menlo,monospace}</style>
<rect x="1" y="1" width="1178" height="774" rx="18" fill="#f7faf8" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="32" y="47" font-size="27" font-weight="700" fill="#213e35" text-anchor="start">응답은 각 NAT 지점의 연결 기록을 거슬러 돌아온다</text>
<text x="32" y="80" font-size="18" font-weight="400" fill="#5c756b" text-anchor="start">같은 TCP 연결 · 인터넷 목적지는 서버의 443 포트 · 포트와 공인 IP는 설명용 예시</text>
<text x="264" y="128" font-size="21" font-weight="700" fill="#157a5b" text-anchor="middle">요청의 출발지 ↓</text>
<text x="916" y="128" font-size="21" font-weight="700" fill="#34669e" text-anchor="middle">응답의 목적지 ↑</text>
