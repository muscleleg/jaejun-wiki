<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1450" viewBox="0 0 1280 1450" role="img" aria-labelledby="title desc">
<title id="title">유선 환경 · VM부터 물리 NIC와 인터넷까지</title>
<desc id="desc">VM의 가상 NIC, QEMU 또는 vhost-net, TAP, qbr, qvb와 qvo veth 쌍, br-int의 private망, qr internal 포트, qrouter 라우팅과 SNAT, qg internal 포트, br-int의 public망, int-br-ex와 phy-br-ex patch 쌍, br-ex, 물리 NIC eth0, 드라이버와 랜선, 집 공유기의 유선 스위치와 라우터, 인터넷으로 이어진다. 유선 NIC를 사용할 경우의 비교 구성이다. VM은 별도 커널이다. 호스트 기본 네임스페이스는 초록 영역, qrouter는 보라 영역이다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="1278" height="1448" rx="18" fill="#f7faf8" stroke="#d5e2dc" stroke-width="1.4"/>
<text x="30" y="44" font-size="25" font-weight="700" fill="#213e35" text-anchor="start">유선 환경 · VM부터 물리 NIC와 인터넷까지</text>
<text x="30" y="78" font-size="17" font-weight="400" fill="#587368" text-anchor="start">파랑: VM 게스트  ·  초록: 호스트 기본 네임스페이스  ·  보라: 라우터 네임스페이스</text>
<rect x="20" y="105" width="1240" height="980" rx="14" fill="#fff" stroke="#c5d6cc" stroke-width="1.4"/>
<text x="42" y="137" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">Ubuntu 데스크탑 · VM과 OpenStack 네트워크가 같은 물리 서버에서 실행</text>
<rect x="40" y="160" width="260" height="185" rx="10" fill="#edf4fc" stroke="#aec5e3" stroke-width="1.4"/>
<text x="58" y="190" font-size="19" font-weight="700" fill="#386ba3" text-anchor="start">VM · 별도 게스트 커널</text>
<text x="58" y="216" font-size="16" font-weight="400" fill="#587368" text-anchor="start">게스트 IP 스택 · 기본 경로</text>
<rect x="60" y="240" width="220" height="80" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="170.0" y="267" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">가상 NIC</text>
<text x="170.0" y="292" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">10.0.0.23 · private</text>
<rect x="320" y="160" width="920" height="905" rx="10" fill="#fafbf9" stroke="#bfcec4" stroke-width="1.4"/>
<text x="340" y="190" font-size="19" font-weight="700" fill="#213e35" text-anchor="start">호스트 OS · 가상 머신 실행과 Linux 네트워크 처리</text>
<rect x="350" y="220" width="500" height="105" rx="10" fill="#fff" stroke="#c5d6cc" stroke-width="1.4"/>
<text x="370" y="248" font-size="20" font-weight="700" fill="#213e35" text-anchor="start">가상 NIC 백엔드</text>
<text x="370" y="277" font-size="17" font-weight="400" fill="#587368" text-anchor="start">QEMU가 가상 NIC와 TAP의 연결을 설정</text>
<text x="370" y="303" font-size="17" font-weight="400" fill="#587368" text-anchor="start">데이터 전달: QEMU 또는 호스트 커널의 vhost-net</text>
<path d="M280 280 H350" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="885" y="246" font-size="16" font-weight="700" fill="#386ba3" text-anchor="start">VM ↔ 호스트는 별도 커널 경계</text>
<text x="885" y="274" font-size="16" font-weight="400" fill="#587368" text-anchor="start">TAP은 호스트 쪽 Ethernet 접점</text>
<text x="885" y="302" font-size="16" font-weight="400" fill="#587368" text-anchor="start">이 경계에 veth를 놓지 않는다</text>
<path d="M340 350 H1220 V480 H920 V845 H1220 V1045 H340 Z" fill="#edf7f2" stroke="#9fcab6" stroke-width="1.5"/>
<text x="630" y="376" font-size="18" font-weight="700" fill="#167858" text-anchor="start">호스트 기본 네임스페이스 · root / default</text>
<path d="M600 325 V338 H455 V400" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="375" y="400" width="160" height="64" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="455.0" y="427" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">TAP</text>
<text x="455.0" y="452" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">tap…</text>
<rect x="605" y="400" width="180" height="64" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="695.0" y="427" font-size="20" font-weight="700" fill="#213e35" text-anchor="middle">qbr…</text>
<text x="695.0" y="452" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">Linux 브리지</text>
<text x="695" y="486" font-size="15" font-weight="400" fill="#587368" text-anchor="middle">보안 그룹 · hybrid</text>
<rect x="845" y="400" width="160" height="64" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="925.0" y="427" font-size="20" font-weight="700" fill="#213e35" text-anchor="middle">qvb…</text>
<text x="925.0" y="452" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">qbr 쪽 veth</text>
<rect x="1060" y="400" width="140" height="64" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="1130.0" y="427" font-size="20" font-weight="700" fill="#213e35" text-anchor="middle">qvo…</text>
<text x="1130.0" y="452" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">OVS 쪽 veth</text>
<path d="M535 432 H605" fill="none" stroke="#167858" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M785 432 H845" fill="none" stroke="#167858" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1005 432 H1060" fill="none" stroke="#167858" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1032" y="395" font-size="14" font-weight="700" fill="#167858" text-anchor="middle">veth</text>
<rect x="360" y="500" width="540" height="320" rx="10" fill="#f8fbfe" stroke="#afc7e3" stroke-width="1.4"/>
<text x="380" y="531" font-size="20" font-weight="700" fill="#386ba3" text-anchor="start">br-int · 하나의 OVS 통합 브리지</text>
<path d="M1130 464 V473 H790 V550" fill="none" stroke="#167858" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="680" y="550" width="200" height="70" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="780.0" y="577" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">private망</text>
<text x="780.0" y="602" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">10.0.0.0/24</text>
<text x="380" y="578" font-size="17" font-weight="700" fill="#386ba3" text-anchor="start">qvo → private망 → qr</text>
<text x="380" y="605" font-size="16" font-weight="400" fill="#587368" text-anchor="start">VM 포트와 라우터 내부 포트가</text>
<text x="380" y="631" font-size="16" font-weight="400" fill="#587368" text-anchor="start">같은 private망에 연결된다.</text>
<text x="380" y="675" font-size="17" font-weight="400" fill="#587368" text-anchor="start">private와 public은 같은 브리지에 있지만</text>
<text x="380" y="702" font-size="17" font-weight="400" fill="#587368" text-anchor="start">OVS의 네트워크 구분·전달 규칙으로 분리된다.</text>
<rect x="680" y="735" width="200" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="780.0" y="762" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">public망</text>
<text x="780.0" y="787" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">192.168.50.0/24</text>
<rect x="390" y="735" width="215" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="497.5" y="762" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">int-br-ex</text>
<text x="497.5" y="787" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">br-int의 patch 포트</text>
<path d="M680 767 H605" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="940" y="500" width="280" height="320" rx="10" fill="#f5f0fb" stroke="#c8b7e1" stroke-width="1.4"/>
<text x="955" y="529" font-size="17" font-weight="700" fill="#7553a1" text-anchor="start">별도 네임스페이스 · qrouter</text>
<rect x="960" y="550" width="240" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="1080.0" y="577" font-size="20" font-weight="700" fill="#7553a1" text-anchor="middle">qr… · internal</text>
<text x="1080.0" y="602" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">10.0.0.1/24</text>
<rect x="960" y="645" width="240" height="60" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="1080.0" y="672" font-size="20" font-weight="700" fill="#7553a1" text-anchor="middle">라우팅 · SNAT</text>
<text x="1080.0" y="697" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">private → public</text>
<rect x="960" y="735" width="240" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="1080.0" y="762" font-size="20" font-weight="700" fill="#7553a1" text-anchor="middle">qg… · internal</text>
<text x="1080.0" y="787" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">192.168.50.167/24</text>
<path d="M880 585 H960" fill="none" stroke="#7553a1" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1080 615 V645" fill="none" stroke="#7553a1" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1080 705 V735" fill="none" stroke="#7553a1" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M960 767 H880" fill="none" stroke="#7553a1" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="919" y="570" font-size="13" font-weight="700" fill="#7553a1" text-anchor="middle">OVS</text>
<text x="919" y="752" font-size="13" font-weight="700" fill="#7553a1" text-anchor="middle">OVS</text>
<rect x="360" y="860" width="520" height="130" rx="10" fill="#f8fbfe" stroke="#afc7e3" stroke-width="1.4"/>
<text x="620" y="887" font-size="19" font-weight="700" fill="#386ba3" text-anchor="start">br-ex · OVS 외부 브리지</text>
<rect x="390" y="910" width="215" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="497.5" y="937" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">phy-br-ex</text>
<text x="497.5" y="962" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">br-ex의 patch 포트</text>
<rect x="660" y="910" width="200" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="760.0" y="937" font-size="20" font-weight="700" fill="#213e35" text-anchor="middle">eth0 · 유선 NIC</text>
<text x="760.0" y="962" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">br-ex의 물리 포트</text>
<path d="M497 800 V910" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="510" y="827" width="120" height="24" rx="3" fill="#edf7f2" stroke="#edf7f2" stroke-width="0"/>
<text x="517" y="845" font-size="15" font-weight="700" fill="#386ba3" text-anchor="start">OVS patch 쌍</text>
<path d="M605 942 H660" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="940" y="900" font-size="17" font-weight="700" fill="#386ba3" text-anchor="start">외부망용 NIC를 포트로 등록</text>
<text x="940" y="928" font-size="17" font-weight="400" fill="#587368" text-anchor="start">br-ex → eth0 → 랜선</text>
<text x="940" y="956" font-size="17" font-weight="400" fill="#587368" text-anchor="start">qg의 출발지 MAC을 보존</text>
<text x="380" y="1025" font-size="17" font-weight="700" fill="#167858" text-anchor="start">br-ex 이후에는 추가 veth·호스트 NAT 없음</text>
<rect x="350" y="1120" width="570" height="230" rx="12" fill="#edf4fc" stroke="#afc7e3" stroke-width="1.4"/>
<text x="370" y="1146" font-size="19" font-weight="700" fill="#386ba3" text-anchor="start">집 공유기 · 유선 LAN과 IP 라우터</text>
<text x="370" y="1182" font-size="17" font-weight="400" fill="#587368" text-anchor="start">외부망 예시: 192.168.50.0/24</text>
<rect x="660" y="1160" width="200" height="65" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="760.0" y="1187" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">유선 LAN 스위치</text>
<text x="760.0" y="1212" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">출발지 MAC 학습</text>
<rect x="400" y="1260" width="280" height="70" rx="10" fill="#fff" stroke="#cfded6" stroke-width="1.4"/>
<text x="540.0" y="1287" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">공유기 IP 라우터</text>
<text x="540.0" y="1312" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">192.168.50.1 · 게이트웨이</text>
<path d="M760 975 V1160" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="785" y="1112" font-size="17" font-weight="400" fill="#386ba3" text-anchor="start">물리 NIC 드라이버 · 랜선</text>
<path d="M660 1192 H540 V1260" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="560" y="1234" font-size="16" font-weight="400" fill="#587368" text-anchor="start">Ethernet 프레임 전달</text>
<rect x="950" y="1260" width="250" height="70" rx="10" fill="#edf4fc" stroke="#cfded6" stroke-width="1.4"/>
<text x="1075.0" y="1287" font-size="20" font-weight="700" fill="#386ba3" text-anchor="middle">인터넷 서버</text>
<text x="1075.0" y="1312" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">다운로드 · API 요청</text>
<path d="M680 1295 H950" fill="none" stroke="#386ba3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="810" y="1279" font-size="16" font-weight="400" fill="#587368" text-anchor="middle">라우팅·NAT → 회선</text>
<text x="30" y="1383" font-size="18" font-weight="700" fill="#167858" text-anchor="start">같은 OVS·hybrid 구성의 유선 비교도. VM과 qrouter가 같은 호스트에 있는 경로를 표시했다.</text>
<text x="30" y="1416" font-size="17" font-weight="400" fill="#587368" text-anchor="start">파랑·초록·보라의 커널/네임스페이스 구분과 내부 연결은 아래 Wi-Fi 구성도와 같다. IP는 비교용 예시다.</text>
</svg>
