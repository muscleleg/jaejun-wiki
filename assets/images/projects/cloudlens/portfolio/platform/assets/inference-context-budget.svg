<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="776" viewBox="0 0 1120 776" role="img" aria-labelledby="title desc">
<title id="title">동시 요청 수와 요청당 컨텍스트의 관계</title><desc id="desc">현재 llama.cpp 설정의 토큰 예산과 GPU 메모리 사용처를 따로 읽습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="774" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">동시 요청 수와 요청당 컨텍스트의 관계</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">현재 llama.cpp 설정의 토큰 예산과 GPU 메모리 사용처를 따로 읽습니다.</text>
<rect x="36" y="459" width="1048" height="241" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="491" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">RTX 2060 SUPER · VRAM 8 GiB 안에 함께 들어가는 것</text><polyline points="560,223 560,259 560,280" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="123" width="1048" height="100" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="56" y="156" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">전체 컨텍스트 98,304 토큰 ÷ 동시 슬롯 6개</text><text x="56" y="187" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">요청당 입력 + 출력 합계 최대 16,384 토큰</text><rect x="36" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 1</text><text x="56" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="56" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="214" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="234" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 2</text><text x="234" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="234" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="392" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="412" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 3</text><text x="412" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="412" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="570" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="590" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 4</text><text x="590" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="590" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="748" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="768" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 5</text><text x="768" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="768" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="926" y="280" width="158" height="128" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="946" y="313" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">슬롯 6</text><text x="946" y="344" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">16,384</text><text x="946" y="371" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰</text><rect x="60" y="524" width="310" height="139" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="80" y="557" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">모델 가중치</text><text x="80" y="588" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">Q4_K_M GGUF</text><text x="80" y="615" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">학습된 매개변수</text><rect x="405" y="524" width="310" height="139" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="425" y="557" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">KV 캐시</text><text x="425" y="588" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">K · V: q8_0</text><text x="425" y="615" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">요청 문맥의 계산 결과</text><rect x="750" y="524" width="310" height="139" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="770" y="557" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">연산용 메모리</text><text x="770" y="588" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">배치 처리 · 중간 버퍼</text><text x="770" y="615" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">CUDA 실행 공간</text><text x="36" y="743" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">토큰 슬롯은 컨텍스트 배분입니다. 아래 세 영역의 상자 크기는 실제 VRAM 점유 비율을 뜻하지 않습니다.</text></svg>
