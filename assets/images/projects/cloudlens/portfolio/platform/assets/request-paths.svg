<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1070" viewBox="0 0 1120 1070" role="img" aria-label="화면을 여는 요청과 답변을 만드는 요청"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#718c81" stroke-width="1.4"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#203e34}.title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px;fill:#4c6c60}.small{font-size:14px;fill:#617a70}.line{fill:none;stroke:#718c81;stroke-width:2;marker-end:url(#arrow)}</style><rect x="1" y="1" width="1118" height="1068" rx="18" fill="#f6faf8" stroke="#d7e3dd"/><text x="32" y="46" class="title">화면을 여는 요청과 답변을 만드는 요청</text><text x="32" y="76" class="body">브라우저는 WebUI에 접속하고, WebUI 서버가 모델 API를 호출합니다.</text><text x="48" y="126" class="heading">① 브라우저 → 채팅 화면</text><text x="600" y="126" class="heading">② WebUI 서버 → 모델 응답</text><rect x="48" y="160" width="472" height="135" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="191" class="heading">브라우저</text><text x="66" y="220" class="body">https://chat.k8s.test</text><path d="M284 295 V350" class="line"/><rect x="48" y="350" width="472" height="135" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="381" class="heading">LB VIP · HAProxy</text><text x="66" y="410" class="body">10.0.0.30:443 → NodePort 30443</text><path d="M284 485 V540" class="line"/><rect x="48" y="540" width="472" height="135" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="571" class="heading">Envoy Gateway · HTTPS</text><text x="66" y="600" class="body">cert-manager 인증서로 TLS 종료</text><text x="66" y="625" class="body">HTTPRoute → open-webui:8080</text><path d="M284 675 V730" class="line"/><rect x="48" y="730" width="472" height="135" rx="12" fill="#ffffff" stroke="#d2e0d9" stroke-width="1.4"/><text x="66" y="761" class="heading">Open WebUI</text><text x="66" y="790" class="body">채팅 화면과 대화 저장</text><text x="66" y="815" class="body">선택한 모델로 API 요청 작성</text><rect x="600" y="160" width="472" height="135" rx="12" fill="#edf4ff" stroke="#d2e0d9" stroke-width="1.4"/><text x="618" y="191" class="heading">내부 Envoy Service</text><text x="618" y="220" class="body">클러스터 DNS /v1/chat/completions</text><text x="618" y="245" class="body">model: qwen3.5-9b-q4</text><path d="M836 295 V350" class="line"/><rect x="600" y="350" width="472" height="135" rx="12" fill="#edf4ff" stroke="#d2e0d9" stroke-width="1.4"/><text x="618" y="381" class="heading">Envoy AI Gateway</text><text x="618" y="410" class="body">모델명으로 AIGatewayRoute 선택</text><text x="618" y="435" class="body">qwen35-9b-inference-pool</text><path d="M836 485 V540" class="line"/><rect x="600" y="540" width="472" height="135" rx="12" fill="#edf4ff" stroke="#d2e0d9" stroke-width="1.4"/><text x="618" y="571" class="heading">Endpoint picker → 모델 Pod</text><text x="618" y="600" class="body">풀 안의 추론 Pod를 선택</text><text x="618" y="625" class="body">GPU에서 Qwen3.5-9B 실행</text><path d="M836 675 V730" class="line"/><rect x="600" y="730" width="472" height="135" rx="12" fill="#edf4ff" stroke="#d2e0d9" stroke-width="1.4"/><text x="618" y="761" class="heading">응답 스트림</text><text x="618" y="790" class="body">토큰 생성 결과 → WebUI → 브라우저</text><text x="618" y="815" class="body">CloudLens도 같은 모델 API 사용</text><path d="M520 798 H560 V227 H600" class="line"/><text x="48" y="965" class="body">외부 모델 API: http://llm.k8s.test/v1 → LB의 80 → NodePort 30080 → 같은 AI Gateway</text><text x="48" y="1000" class="body">WebUI 데이터와 모델 가중치는 각각 다른 Cinder PVC에 저장합니다.</text></svg>