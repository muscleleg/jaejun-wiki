<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc">
<title id="title">서빙 자원을 관리하는 흐름과 추론 요청의 흐름</title><desc id="desc">CRD와 컨트롤러는 실행 구성을 만들고, 실제 HTTP 요청은 Envoy와 모델 서버가 처리합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="1028" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">서빙 자원을 관리하는 흐름과 추론 요청의 흐름</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">CRD와 컨트롤러는 실행 구성을 만들고, 실제 HTTP 요청은 Envoy와 모델 서버가 처리합니다.</text>
<rect x="36" y="120" width="1048" height="341" rx="16" fill="#eef5fd" fill-opacity=".55" stroke="#c2d7f3"/><text x="56" y="152" font-size="20" font-weight="700" fill="#325f99" text-anchor="start">배포·설정 관리</text><rect x="36" y="505" width="1048" height="449" rx="16" fill="#edf7f2" fill-opacity=".55" stroke="#b9ddcc"/><text x="56" y="537" font-size="20" font-weight="700" fill="#176c51" text-anchor="start">사용자가 모델에 질문한 순간</text><polyline points="288,297 288,350" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,297 832,350" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="344,641 418,641" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="702,641 776,641" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="490,715 490,805" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="650,805 650,715" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="182" width="456" height="115" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="215" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">LLMInferenceService · KServe</text><text x="80" y="246" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">추론 워크로드 · 모델 풀 구성을 관리</text><rect x="604" y="182" width="456" height="115" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="624" y="215" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Gateway · AIGatewayRoute · InferencePool</text><text x="624" y="246" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">호스트 · 모델명 · 대상 풀 선언</text><rect x="60" y="350" width="456" height="85" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="80" y="383" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">추론 Pod · PVC · GPU Claim</text><rect x="604" y="350" width="456" height="85" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="624" y="383" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Gateway 컨트롤러 → Envoy 설정</text><rect x="60" y="568" width="284" height="147" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="80" y="601" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">CloudLens / WebUI</text><text x="80" y="632" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">OpenAI 호환 API</text><text x="80" y="659" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">model: qwen3.5-9b-q4</text><rect x="418" y="568" width="284" height="147" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="438" y="601" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">Envoy · AI Gateway</text><text x="438" y="632" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">모델명에 맞는 경로</text><text x="438" y="659" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">InferencePool 선택</text><rect x="776" y="568" width="284" height="147" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="796" y="601" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">llama.cpp · Qwen</text><text x="796" y="632" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">선택된 Pod에서 추론</text><text x="796" y="659" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">GPU로 토큰 생성</text><rect x="418" y="805" width="642" height="112" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="438" y="838" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Endpoint picker · EPP</text><text x="438" y="869" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">풀의 endpoint 중 전달할 Pod를 선택 · 선택 결과를 Envoy에 반환</text><text x="36" y="995" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">모델 파일은 PVC에서 읽고 GPU는 DRA로 할당합니다. 둘 다 매 HTTP 요청마다 새로 준비하지 않습니다.</text><rect x="710.0" y="597" width="58.0" height="36" rx="6" fill="#f6faf8"/><text x="739" y="620" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">HTTP</text><rect x="441.75" y="743" width="96.5" height="36" rx="6" fill="#f6faf8"/><text x="490" y="766" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">선택 요청</text><rect x="601.75" y="743" width="96.5" height="36" rx="6" fill="#f6faf8"/><text x="650" y="766" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">선택 결과</text></svg>
