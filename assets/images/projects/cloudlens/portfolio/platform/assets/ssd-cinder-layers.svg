<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc">
<title id="title">추가 SSD가 Cinder 볼륨이 되는 과정</title><desc id="desc">호스트 저장소 계층과 OpenStack의 볼륨 선택 설정을 연결합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c968a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style>
<rect x="1" y="1" width="1118" height="888" rx="18" fill="#f6faf8" stroke="#d9e5de"/>
<text x="36" y="47" font-family="'Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#243e34">추가 SSD가 Cinder 볼륨이 되는 과정</text>
<text x="36" y="81" font-family="'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4c6b5e">호스트 저장소 계층과 OpenStack의 볼륨 선택 설정을 연결합니다.</text>
<polyline points="288,238 288,299" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,238 832,299" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="342,407 342,468" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="898,609 898,677" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="712,748 678,748 678,539 648,539" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="342,609 342,677" fill="none" stroke="#7c968a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="126" width="504" height="112" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="56" y="159" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Micron 512 GB SSD</text><text x="56" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">프로젝트 전용으로 추가한 물리 디스크</text><rect x="580" y="126" width="504" height="112" rx="12" fill="#eef5fd" stroke="#c2d7f3" stroke-width="1.5"/><text x="600" y="159" font-size="21" font-weight="700" fill="#325f99" text-anchor="start">Samsung 256 GB SSD</text><text x="600" y="190" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">프로젝트 전용으로 추가한 물리 디스크</text><rect x="36" y="299" width="1048" height="108" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="332" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">LVM Physical Volume 2개 → Volume Group cinder-ssd</text><text x="56" y="363" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">두 디스크를 한 저장소 풀의 재료로 등록 · 호스트 파일시스템으로 마운트하지 않음</text><rect x="36" y="468" width="612" height="141" rx="12" fill="#edf7f2" stroke="#b9ddcc" stroke-width="1.5"/><text x="56" y="501" font-size="21" font-weight="700" fill="#176c51" text-anchor="start">LVM Thin pool</text><text x="56" y="532" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">여기에서 볼륨별 Logical Volume을 생성</text><text x="56" y="559" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">논리 크기를 예약하고, 쓰인 블록만 물리 공간 점유</text><rect x="712" y="468" width="372" height="141" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="732" y="501" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Cinder 볼륨 타입 ssd</text><text x="732" y="532" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">volume_backend_name</text><text x="732" y="559" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">= ssd-storage</text><rect x="712" y="677" width="372" height="141" rx="12" fill="#f4f0fc" stroke="#d8c9ef" stroke-width="1.5"/><text x="732" y="710" font-size="21" font-weight="700" fill="#7350a6" text-anchor="start">Cinder backend lvm-ssd</text><text x="732" y="741" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">volume_group = cinder-ssd</text><text x="732" y="768" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">lvm_type = thin</text><rect x="36" y="677" width="612" height="141" rx="12" fill="#ffffff" stroke="#d8e3dd" stroke-width="1.5"/><text x="56" y="710" font-size="21" font-weight="700" fill="#243e34" text-anchor="start">Cinder Volume = 풀 안의 개별 LV</text><text x="56" y="741" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">VM 부팅 디스크 또는 Kubernetes PVC의 저장소</text><text x="56" y="768" font-size="18" font-weight="400" fill="#4c6b5e" text-anchor="start">LVM PV는 Kubernetes PersistentVolume과 다른 개념</text><text x="36" y="859" font-size="17" font-weight="400" fill="#4c6b5e" text-anchor="start">볼륨 타입은 백엔드를 고르는 설정이고, 실제 데이터는 그 백엔드의 SSD에 기록됩니다.</text><rect x="650.0" y="624" width="56" height="36" rx="6" fill="#f6faf8"/><text x="678" y="647" font-size="16" font-weight="400" fill="#4c6b5e" text-anchor="middle">선택</text></svg>
