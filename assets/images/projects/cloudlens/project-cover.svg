<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">CloudLens — AI 인프라 관리</title>
  <desc id="desc">자연어로 자원을 찾고 장애를 진단하는 AI와 애플리케이션 구성 추적. OpenStack, Kubernetes, GPU 모델 서빙 환경 위에 구축한 CloudLens.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d2b"/><stop offset="1" stop-color="#152339"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf6f4"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#b8d7d0" opacity=".13"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#76ad9f" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <g transform="translate(60 56)" fill="none" stroke="#85e4c3" stroke-width="5" stroke-linejoin="round">
      <path d="m0 23 27-15 27 15-27 15Z"/><path d="m0 37 27 15 27-15M0 51l27 15 27-15"/>
    </g>
    <text x="136" y="125" fill="#fff" font-size="88" font-weight="750" letter-spacing="-3">CloudLens</text>
    <text x="62" y="195" fill="#c9eee3" font-size="43" font-weight="600" letter-spacing="-1">자연어로 찾고, 진단하고, 연결하다</text>

    <g transform="translate(60 246)">
      <rect width="555" height="374" rx="23" fill="#edf5f3"/>
      <text x="26" y="48" fill="#284a43" font-size="27" font-weight="700">애플리케이션 구성 추적</text>
      <circle cx="506" cy="39" r="7" fill="#239b7b"/>
      <path d="M277 124v26m0 72v28m-115 0v-14h230v14" stroke="#79a498" stroke-width="3" fill="none"/>
      <rect x="176" y="74" width="202" height="56" rx="13" fill="#e0eeff" stroke="#a6c6ee"/>
      <text x="277" y="111" text-anchor="middle" fill="#355b8e" font-size="27" font-weight="650">Service</text>
      <rect x="129" y="150" width="296" height="74" rx="15" fill="#ede7fb" stroke="#c5b7e7" stroke-width="2"/>
      <path d="m152 177 12-7 12 7v15l-12 7-12-7Zm0 0 12 7 12-7m-12 7v15" fill="none" stroke="#8062bf" stroke-width="2"/>
      <text x="290" y="195" text-anchor="middle" fill="#493768" font-size="30" font-weight="750">Application</text>
      <rect x="56" y="250" width="210" height="60" rx="13" fill="#fff" stroke="#b6d3ca"/>
      <text x="161" y="290" text-anchor="middle" fill="#31594c" font-size="29" font-weight="650">Pod → VM</text>
      <rect x="290" y="250" width="210" height="60" rx="13" fill="#fff" stroke="#b6d3ca"/>
      <text x="395" y="290" text-anchor="middle" fill="#31594c" font-size="29" font-weight="650">PVC · GPU</text>
      <text x="277" y="350" text-anchor="middle" fill="#607e73" font-size="24">앱에서 실행 인프라까지</text>
    </g>

    <g transform="translate(651 246)">
      <rect width="489" height="374" rx="23" fill="#203e3b" stroke="#42645d"/>
      <text x="26" y="48" fill="#d8f3eb" font-size="27" font-weight="700">AI 검색 · 장애 진단</text>
      <rect x="26" y="77" width="437" height="73" rx="16" fill="#c9f3e5"/>
      <text x="244" y="123" text-anchor="middle" fill="#173f32" font-size="30" font-weight="650">“이 앱이 왜 안 뜨지?”</text>
      <path d="M244 163v21" stroke="#76ad9f" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="26" y="200" width="437" height="148" rx="16" fill="url(#card)"/>
      <path d="m52 238 6 6 12-14" stroke="#20886c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="82" y="246" fill="#204e3e" font-size="31" font-weight="750">원인과 다음 행동</text>
      <line x1="51" y1="268" x2="438" y2="268" stroke="#cfdfda"/>
      <text x="51" y="311" fill="#5d776e" font-size="25">상태 · 이벤트 · 로그를 바탕으로</text>
    </g>

    <line x1="60" y1="661" x2="1140" y2="661" stroke="#44605c"/>
    <text x="60" y="714" fill="#94b9ad" font-size="24" font-weight="600">직접 구축한 인프라와 모델을 연결</text>
    <g font-size="29" font-weight="650" fill="#e1efe9">
      <text x="60" y="761">OpenStack</text><text x="249" y="761" fill="#7bbba6">→</text>
      <text x="302" y="761">Kubernetes</text><text x="506" y="761" fill="#7bbba6">→</text>
      <text x="559" y="761">GPU 모델 서빙</text><text x="810" y="761" fill="#7bbba6">→</text>
      <text x="863" y="761" fill="#85e4c3">CloudLens</text>
    </g>
  </g>
</svg>
