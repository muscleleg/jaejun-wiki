<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="365" viewBox="0 0 1120 365" role="img" aria-labelledby="title desc"><title id="title">켜기 한 번으로 네트워크부터 SSH 응답까지</title><desc id="desc">설정한 장치를 순서대로 제어하고, 앞 단계가 실패하면 다음 단계로 진행하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#49856d" stroke-width="1.5"/></marker><marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ac7638" stroke-width="1.5"/></marker></defs><rect width="1120" height="365" rx="20" fill="#f5f9f7"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#25463d"><text x="28" y="43" font-size="25" font-weight="700">켜기 한 번으로 네트워크부터 SSH 응답까지</text><text x="28" y="77" font-size="16">설정한 장치를 순서대로 제어하고, 앞 단계가 실패하면 다음 단계로 진행하지 않습니다.</text><rect x="28" y="125" width="240" height="132" rx="14" fill="#fff" stroke="#cbded6"/><text x="46" y="158" font-size="20" font-weight="700">1. 집 네트워크</text><text x="46" y="188" font-size="16">응답함 → 현재 경로</text><text x="46" y="213" font-size="16">응답 없음 → VPN 연결</text><path d="M268 191 H303" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="303" y="125" width="240" height="132" rx="14" fill="#fff7ec" stroke="#cbded6"/><text x="321" y="158" font-size="20" font-weight="700">2. Tapo 전원</text><text x="321" y="188" font-size="16">켜짐 → 전원 유지</text><text x="321" y="213" font-size="16">꺼짐 → ON 요청</text><path d="M543 191 H578" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="578" y="125" width="240" height="132" rx="14" fill="#fff" stroke="#cbded6"/><text x="596" y="158" font-size="20" font-weight="700">3. ipTIME WOL</text><text x="596" y="188" font-size="16">전원 복원 시 NIC 준비</text><text x="596" y="213" font-size="16">등록한 MAC으로 요청</text><path d="M818 191 H853" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="853" y="125" width="240" height="132" rx="14" fill="#fff" stroke="#cbded6"/><text x="871" y="158" font-size="20" font-weight="700">4. SSH 응답</text><text x="871" y="188" font-size="16">PC 부팅 후 응답 대기</text><text x="871" y="213" font-size="16">접속 가능 여부 표시</text><text x="28" y="300" font-size="16">VPN·Tapo 설정이 비어 있으면 해당 단계는 생략합니다. Tapo를 새로 켜면 유선랜 준비에 2초를 둡니다.</text><text x="28" y="334" font-size="16">끄기는 SSH 정상 종료만 실행합니다. Tapo 차단과 VPN 해제는 수동 동작입니다.</text></g></svg>