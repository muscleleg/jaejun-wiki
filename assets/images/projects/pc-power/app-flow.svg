<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#49856d" stroke-width="1.5"/></marker></defs><rect width="1000" height="595" rx="20" fill="#f5f9f7"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="32" y="45" font-size="27" fill="#25463d" font-weight="700">PC Power 앱 구조</text><text x="32" y="77" font-size="17" fill="#25463d" font-weight="400">별도 웹 서버 없이 Tauri IPC로 네이티브 기능을 호출합니다.</text><rect x="30" y="115" width="260" height="235" rx="14" fill="#fff" stroke="#cbded6"/><text x="50" y="150" font-size="22" fill="#25463d" font-weight="700">React · TypeScript</text><text x="50" y="190" font-size="18" fill="#25463d" font-weight="400">연결 상태 · 켜기 · 종료</text><text x="50" y="225" font-size="18" fill="#25463d" font-weight="400">설정 · 인증 입력</text><text x="50" y="260" font-size="18" fill="#25463d" font-weight="400">xterm.js 터미널</text><text x="50" y="310" font-size="17" fill="#25463d" font-weight="400">Android / macOS</text><path d="M290 226 H380" stroke="#49856d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="302" y="197" font-size="15" fill="#25463d" font-weight="400">Tauri IPC</text><rect x="380" y="115" width="230" height="235" rx="14" fill="#edf7f1" stroke="#cbded6"/><text x="400" y="151" font-size="24" fill="#25463d" font-weight="700">Rust</text><text x="400" y="191" font-size="18" fill="#25463d" font-weight="400">HTTP 로그인 · 세션</text><text x="400" y="225" font-size="18" fill="#25463d" font-weight="400">UDP 매직 패킷</text><text x="400" y="259" font-size="18" fill="#25463d" font-weight="400">SSH 인증 · PTY</text><text x="400" y="311" font-size="15" fill="#25463d" font-weight="400">출력은 Channel로 전달</text><rect x="710" y="110" width="260" height="105" rx="14" fill="#fff" stroke="#cbded6"/><text x="730" y="146" font-size="22" fill="#25463d" font-weight="700">ipTIME</text><text x="730" y="180" font-size="15" fill="#25463d" font-weight="400">로그인 → WOL → 로컬 송신</text><rect x="710" y="260" width="260" height="105" rx="14" fill="#fff" stroke="#cbded6"/><text x="730" y="297" font-size="22" fill="#25463d" font-weight="700">Ubuntu PC · SSH</text><text x="730" y="331" font-size="16" fill="#25463d" font-weight="400">sudo 종료 / 대화형 셸</text><path d="M610 181 H710" stroke="#49856d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="633" y="160" font-size="15" fill="#25463d" font-weight="400">HTTP</text><path d="M610 294 H710" stroke="#49856d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="633" y="274" font-size="15" fill="#25463d" font-weight="400">SSH</text><rect x="380" y="411" width="590" height="104" rx="14" fill="#eef4fd" stroke="#c7d7ed"/><text x="400" y="449" font-size="21" fill="#25463d" font-weight="700">운영체제의 보안 저장소</text><text x="400" y="484" font-size="16" fill="#25463d" font-weight="400">Android Keystore · macOS Keychain | 개인키·비밀번호</text><path d="M495 350 V411" stroke="#49856d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="32" y="562" font-size="16" fill="#25463d" font-weight="400">VPN 연결은 외부 WireGuard 앱이 담당합니다. PC Power는 전원 제어와 SSH 세션을 관리합니다.</text></g></svg>