<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description">
  <title id="title">PC Power 원격 전원 제어와 SSH</title>
  <desc id="description">집 밖의 휴대폰에서 거실 ASUS 공유기와 Wi-Fi 브리지로 연결된 방의 ipTIME 공유기에 요청하고, PC를 WOL로 켜 SSH로 접속하는 구성</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf7"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#6b8f82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="430" rx="22" fill="url(#bg)"/>
  <circle cx="682" cy="47" r="82" fill="#dff0e8" opacity=".72"/>
  <circle cx="38" cy="409" r="88" fill="#e2eafa" opacity=".7"/>

  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="40" y="50" fill="#14805f" font-size="14" font-weight="700" letter-spacing="2">PC POWER</text>
    <text x="40" y="91" fill="#1f382f" font-size="30" font-weight="700">밖에서 깨우고, 바로 접속</text>
    <text x="40" y="119" fill="#637a70" font-size="15">집에 있던 ipTIME을 활용한 원격 PC 전원 제어</text>

    <rect x="34" y="146" width="692" height="207" rx="18" fill="#ffffff" fill-opacity=".78" stroke="#d5e5dd"/>
    <path d="M263 165v168M506 165v168" stroke="#e4ece8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="55" y="174" fill="#8a9c94" font-size="11" font-weight="700" letter-spacing="1.2">집 밖</text>
    <text x="291" y="174" fill="#8a9c94" font-size="11" font-weight="700" letter-spacing="1.2">거실</text>
    <text x="531" y="174" fill="#8a9c94" font-size="11" font-weight="700" letter-spacing="1.2">내 방 · 유선랜 없음</text>

    <!-- Phone / app -->
    <rect x="62" y="196" width="67" height="112" rx="14" fill="#f5f8fc" stroke="#b9cadf" stroke-width="2"/>
    <rect x="70" y="207" width="51" height="85" rx="7" fill="#e7effa"/>
    <circle cx="95.5" cy="300" r="3" fill="#8da3b7"/>
    <path d="M86 237v-4a9 9 0 0 1 18 0v4" fill="none" stroke="#268363" stroke-width="3" stroke-linecap="round"/>
    <rect x="82" y="237" width="26" height="20" rx="5" fill="#d9eee4" stroke="#268363" stroke-width="2"/>
    <path d="M95 243v8" stroke="#268363" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="330" fill="#30483f" font-size="13" font-weight="700">PC Power 앱</text>
    <text x="66" y="346" fill="#72867d" font-size="10">VPN 연결</text>

    <!-- WAN / ASUS router -->
    <path d="M139 251h73" fill="none" stroke="#6b8f82" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="150" y="239" fill="#758a81" font-size="10">요청</text>
    <rect x="179" y="271" width="57" height="28" rx="8" fill="#eef4ff" stroke="#b8ccec"/>
    <path d="M194 282h27m-23-5v-4m19 4v-4m-17 12h19" stroke="#527aa9" stroke-width="2" stroke-linecap="round"/>
    <text x="175" y="319" fill="#30483f" font-size="11" font-weight="700">인터넷</text>

    <path d="M287 253c12-19 24-19 36 0m-27 0c6-9 12-9 18 0m-9 0v11" fill="none" stroke="#45a487" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="294" y="270" width="74" height="37" rx="9" fill="#e6f4ed" stroke="#a9d4c1" stroke-width="1.5"/>
    <path d="M307 286h48m-39-6v-6m30 6v-6m-29 19h28" stroke="#268363" stroke-width="2" stroke-linecap="round"/>
    <text x="300" y="325" fill="#30483f" font-size="11" font-weight="700">ASUS XT9</text>
    <text x="297" y="340" fill="#72867d" font-size="10">메인 공유기</text>

    <!-- wireless bridge -->
    <path d="M375 287h112" fill="none" stroke="#6b8f82" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <path d="M414 268c9-13 18-13 27 0m-20 0c4-6 9-6 13 0" fill="none" stroke="#45a487" stroke-width="2" stroke-linecap="round"/>
    <text x="390" y="310" fill="#758a81" font-size="10">Wi-Fi 브리지</text>

    <!-- ipTIME bridge and PC -->
    <rect x="497" y="270" width="77" height="37" rx="9" fill="#eef4ff" stroke="#b8ccec" stroke-width="1.5"/>
    <path d="M511 286h49m-38-6v-6m28 6v-6m-28 19h26" stroke="#527aa9" stroke-width="2" stroke-linecap="round"/>
    <text x="506" y="325" fill="#30483f" font-size="11" font-weight="700">ipTIME</text>
    <text x="493" y="340" fill="#72867d" font-size="10">무선 브리지</text>

    <path d="M580 287h38" fill="none" stroke="#6b8f82" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="627" y="218" width="69" height="69" rx="12" fill="#f5f8fc" stroke="#b9cadf" stroke-width="2"/>
    <rect x="639" y="230" width="45" height="31" rx="4" fill="#e7effa" stroke="#8da3b7"/>
    <path d="M653 267h17m-8-6v7m-13 5h27" stroke="#71899c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="684" cy="277" r="12" fill="#e6f4ed" stroke="#69b896" stroke-width="1.5"/>
    <path d="M684 270v8m-5-4a5 5 0 1 0 10 0" fill="none" stroke="#21815f" stroke-width="1.8" stroke-linecap="round"/>
    <text x="635" y="307" fill="#30483f" font-size="12" font-weight="700">내 PC</text>

    <!-- packet labels -->
    <rect x="553" y="190" width="125" height="23" rx="11.5" fill="#fff2df"/>
    <text x="567" y="206" fill="#a56a18" font-size="10" font-weight="700">WOL 매직 패킷</text>
    <path d="M621 213v16" fill="none" stroke="#c48a3c" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="40" y="374" width="153" height="34" rx="17" fill="#e4f3eb"/>
    <circle cx="59" cy="391" r="8" fill="#18855f"/>
    <path d="M59 386v6m-4-3a4 4 0 1 0 8 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="75" y="396" fill="#286b53" font-size="13" font-weight="700">WOL 전원 제어</text>
    <rect x="205" y="374" width="157" height="34" rx="17" fill="#e8eef9"/>
    <path d="M224 386l-5 5 5 5m-4-5h13" fill="none" stroke="#527aa9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="245" y="396" fill="#45678e" font-size="13" font-weight="700">SSH 터미널</text>
    <text x="710" y="396" fill="#84968e" font-size="11" text-anchor="end">Android · macOS</text>
  </g>
</svg>
