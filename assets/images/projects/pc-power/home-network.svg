<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">거실의 ASUS와 방의 ipTIME을 무선으로 연결한 구성</title>
<desc id="desc">외부 인터넷 회선은 거실 ASUS의 WAN 포트에 연결됩니다. 방까지 유선 LAN을 연결하기 어려워 ASUS와 방의 ipTIME을 Wi-Fi로 연결하고, 방 안에서는 ipTIME과 PC를 LAN 케이블로 연결했습니다. 외부 앱은 WireGuard VPN을 통해 접속합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#49856d" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="670" rx="20" fill="#f5f9f7"/>
<g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#25463d">
<text x="28" y="45" font-size="27" font-weight="700">원격 전원 제어를 위한 네트워크 구성</text>
<text x="28" y="78" font-size="17">거실까지 들어오는 인터넷 회선을 Wi-Fi로 방까지 연결했습니다.</text>
<!-- 공간 -->
<rect x="20" y="112" width="240" height="490" rx="16" fill="#eef4fd" stroke="#c7d7ed"/>
<text x="40" y="148" font-size="21" font-weight="700">집 밖</text>
<rect x="330" y="112" width="300" height="490" rx="16" fill="#fff" stroke="#cbded6"/>
<text x="350" y="148" font-size="21" font-weight="700">거실</text>
<rect x="750" y="112" width="350" height="490" rx="16" fill="#edf7f1" stroke="#b9d9ca"/>
<text x="770" y="148" font-size="21" font-weight="700">내 방</text>
<!-- 외부 기기 -->
<rect x="40" y="185" width="200" height="85" rx="12" fill="#fff" stroke="#cbded6"/>
<text x="58" y="218" font-size="22" font-weight="700">PC Power</text>
<text x="58" y="247" font-size="16">전원 제어 · SSH 터미널</text>
<path d="M140 270 V306" stroke="#49856d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="307" width="200" height="86" rx="12" fill="#fff" stroke="#cbded6"/>
<text x="58" y="341" font-size="21" font-weight="700">WireGuard</text>
<text x="58" y="369" font-size="16">모바일 데이터 + VPN</text>
<path d="M240 350 H350" stroke="#49856d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="285" y="332" text-anchor="middle" font-size="14">VPN 접속</text>
<!-- 거실 WAN / ASUS -->
<rect x="350" y="185" width="260" height="70" rx="12" fill="#f5f8fa" stroke="#cbded6"/>
<text x="480" y="215" text-anchor="middle" font-size="19" font-weight="700">외부 인터넷 회선</text>
<text x="480" y="240" text-anchor="middle" font-size="15">거실에 들어오는 유선 회선</text>
<path d="M480 255 V306" stroke="#49856d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="492" y="285" font-size="15">WAN 포트</text>
<rect x="350" y="307" width="260" height="106" rx="12" fill="#fff" stroke="#9ebfaf"/>
<text x="368" y="341" font-size="20" font-weight="700">ASUS ZenWiFi XT9</text>
<text x="368" y="370" font-size="16">메인 공유기</text>
<text x="368" y="395" font-size="16">WireGuard 서버</text>
<!-- 거실과 방 사이 -->
<path d="M690 185 V300 M690 399 V580" stroke="#c8d3ce" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M610 350 H770" stroke="#49856d" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="690" y="329" text-anchor="middle" font-size="17" font-weight="700">Wi-Fi</text>
<rect x="641" y="434" width="98" height="64" rx="9" fill="#fff5e8" stroke="#ecd5b5"/>
<text x="690" y="461" text-anchor="middle" font-size="14" fill="#865b2c">방까지 유선</text>
<text x="690" y="483" text-anchor="middle" font-size="14" fill="#865b2c">연결 어려움</text>
<!-- 내 방 -->
<text x="770" y="211" font-size="17">기존 ipTIME으로 무선 연결</text>
<text x="770" y="239" font-size="15" fill="#58766b">방 안의 PC에는 LAN 케이블 사용</text>
<rect x="770" y="307" width="310" height="106" rx="12" fill="#fff" stroke="#9ebfaf"/>
<text x="790" y="341" font-size="21" font-weight="700">ipTIME A3004NS-M</text>
<text x="790" y="370" font-size="16">무선 확장 · 브리지</text>
<text x="790" y="395" font-size="16">앱의 WOL 요청으로 매직 패킷 송신</text>
<path d="M925 413 V490" stroke="#49856d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="940" y="452" font-size="16">LAN 케이블</text>
<rect x="770" y="491" width="310" height="87" rx="12" fill="#fff" stroke="#9ebfaf"/>
<text x="790" y="525" font-size="21" font-weight="700">Ubuntu PC · 유선 NIC</text>
<text x="790" y="554" font-size="16">BIOS · Linux에서 WOL 활성화</text>
<text x="350" y="492" font-size="16">ASUS ↔ ipTIME: 무선</text>
<text x="350" y="522" font-size="16">ipTIME ↔ PC: 유선</text>
<text x="28" y="640" font-size="16">켜기는 ipTIME의 WOL 기능으로 실행하고, 종료와 터미널은 PC의 SSH에 접속해 실행합니다.</text>
</g></svg>