<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" role="img" aria-labelledby="title desc"><title id="title">거실·내 방·외부에서 연결하는 PC 전원과 네트워크</title><desc id="desc">거실까지는 유선 회선, 방까지는 Wi-Fi, PC의 WOL 수신은 유선 LAN으로 연결합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#49856d" stroke-width="1.5"/></marker><marker id="power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ac7638" stroke-width="1.5"/></marker></defs><rect width="1160" height="800" rx="20" fill="#f5f9f7"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#25463d"><text x="28" y="43" font-size="25" font-weight="700">거실·내 방·외부에서 연결하는 PC 전원과 네트워크</text><text x="28" y="77" font-size="16">거실까지는 유선 회선, 방까지는 Wi-Fi, PC의 WOL 수신은 유선 LAN으로 연결합니다.</text><rect x="24" y="112" width="235" height="635" rx="14" fill="#eef4fd" stroke="#cbded6"/><text x="42" y="146" font-size="21" font-weight="700">집 밖</text><rect x="334" y="112" width="300" height="635" rx="14" fill="#fff" stroke="#cbded6"/><text x="352" y="146" font-size="21" font-weight="700">거실</text><rect x="744" y="112" width="390" height="635" rx="14" fill="#edf7f1" stroke="#cbded6"/><text x="762" y="146" font-size="21" font-weight="700">내 방</text><rect x="44" y="175" width="195" height="100" rx="14" fill="#fff" stroke="#cbded6"/><text x="62" y="208" font-size="20" font-weight="700">PC Power</text><text x="62" y="238" font-size="16">켜기 · 끄기 · SSH</text><rect x="44" y="330" width="195" height="105" rx="14" fill="#fff" stroke="#cbded6"/><text x="62" y="363" font-size="20" font-weight="700">WireGuard 앱</text><text x="62" y="393" font-size="16">VPN 터널 관리</text><path d="M140 275 V330" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><text x="55" y="308" font-size="14">연결·해제 요청</text><rect x="354" y="175" width="260" height="88" rx="14" fill="#fff" stroke="#cbded6"/><text x="372" y="208" font-size="20" font-weight="700">외부 인터넷 회선</text><text x="372" y="238" font-size="16">ASUS WAN에 연결</text><path d="M484 263 V330" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><text x="499" y="302" font-size="14">유선</text><rect x="354" y="330" width="260" height="105" rx="14" fill="#fff" stroke="#cbded6"/><text x="372" y="363" font-size="20" font-weight="700">ASUS ZenWiFi XT9</text><text x="372" y="393" font-size="16">집 게이트웨이 · VPN 서버</text><path d="M239 383 H354" fill="none" stroke="#49856d" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="262" y="362" font-size="14">VPN</text><rect x="764" y="330" width="350" height="105" rx="14" fill="#fff" stroke="#cbded6"/><text x="782" y="363" font-size="20" font-weight="700">ipTIME A3004NS-M</text><text x="782" y="393" font-size="16">무선 브리지 · WOL 송신</text><path d="M614 383 H764" fill="none" stroke="#49856d" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="663" y="361" font-size="16" font-weight="700">Wi-Fi</text><rect x="764" y="500" width="350" height="98" rx="14" fill="#fff" stroke="#cbded6"/><text x="782" y="533" font-size="20" font-weight="700">Ubuntu PC · 유선 NIC</text><text x="782" y="563" font-size="16">BIOS · NetworkManager WOL</text><path d="M939 435 V500" fill="none" stroke="#49856d" stroke-width="2.3" marker-end="url(#arrow)"/><text x="954" y="472" font-size="15">LAN · 매직 패킷</text><rect x="764" y="650" width="350" height="82" rx="14" fill="#fff7ec" stroke="#cbded6"/><text x="782" y="683" font-size="20" font-weight="700">Tapo P110</text><text x="782" y="713" font-size="16">전원 공급 · 소비전력 측정</text><path d="M939 650 V598" fill="none" stroke="#ac7638" stroke-width="2.3" marker-end="url(#power)"/><text x="954" y="628" font-size="15">PC 전원선</text><path d="M484 435 V691 H764" fill="none" stroke="#49856d" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="503" y="673" font-size="16">Wi-Fi · Tapo 로컬 API</text><text x="28" y="778" font-size="16">PC 끄기는 SSH 정상 종료입니다. Tapo 전원 차단은 앱의 플러그 아이콘에서 직접 실행합니다.</text></g></svg>