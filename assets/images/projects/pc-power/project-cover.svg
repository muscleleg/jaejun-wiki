<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">PC Power — 집 밖에서 PC 켜기</title><desc id="desc">Tauri, React, Rust 기반 앱. 집 밖에서 VPN에 연결하고 Tapo 전원을 켠 뒤 ipTIME으로 WOL을 전송한다. PC가 부팅되면 SSH로 접속한다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#3c3025"/><stop offset="1" stop-color="#1c303c"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#e7bd7c" opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#e7bd7c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><g transform="translate(62 67)" fill="none" stroke="#f0d9b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M30 0v26M13 10a27 27 0 1 0 34 0"/></g><text x="145" y="134" font-size="88" font-weight="750" fill="#fff">PC Power</text><text x="62" y="204" font-size="41" font-weight="600" fill="#f0d9b5">집 밖에서 전원을 켜고 SSH 접속</text><rect x="60" y="252" width="258" height="386" rx="20" fill="#f7eee0"/><text x="189" y="296" font-size="27" font-weight="700" fill="#80633b" text-anchor="middle">집 밖에서</text><rect x="100" y="321" width="178" height="265" rx="27" fill="#25303b"/><rect x="114" y="343" width="150" height="211" rx="16" fill="#e5eaf0"/><rect x="156" y="329" width="66" height="6" rx="3" fill="#65717a"/><path d="M189 370v27M175 380a22 22 0 1 0 28 0" fill="none" stroke="#b38342" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="430" width="126" height="44" rx="11" fill="#e4cb9e"/><text x="189" y="460" font-size="23" font-weight="700" fill="#644b2b" text-anchor="middle">전원 켜기</text><rect x="126" y="484" width="126" height="44" rx="11" fill="#c4dadd"/><text x="189" y="514" font-size="23" font-weight="700" fill="#365963" text-anchor="middle">SSH 접속</text><text x="189" y="614" font-size="24" font-weight="600" fill="#80633b" text-anchor="middle">원격 제어 앱</text><path d="M334 355h34" fill="none" stroke="#e7bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="390" y="276" width="226" height="159" rx="20" fill="#e7f0fa"/><text x="414" y="319" font-size="24" font-weight="650" fill="#3d6384">외부 연결</text><text x="414" y="378" font-size="37" font-weight="750" fill="#3d6384">VPN</text><rect x="652" y="276" width="226" height="159" rx="20" fill="#f5ead5"/><text x="676" y="319" font-size="24" font-weight="650" fill="#8b6934">전원 공급</text><text x="676" y="378" font-size="37" font-weight="750" fill="#8b6934">Tapo</text><rect x="914" y="276" width="226" height="159" rx="20" fill="#e8eee3"/><text x="938" y="319" font-size="24" font-weight="650" fill="#52724b">WOL 전송</text><text x="938" y="378" font-size="37" font-weight="750" fill="#52724b">ipTIME</text><path d="M626 355h14" fill="none" stroke="#e7bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M888 355h14" fill="none" stroke="#e7bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1027 448v30H650v24" fill="none" stroke="#e7bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="500" y="519" width="300" height="119" rx="20" fill="#eef3f8"/><path d="M523 549h38v27h-38Zm19 27v8m-13 0h26" fill="none" stroke="#52738b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="562" font-size="32" font-weight="750" fill="#365974">PC 부팅</text><text x="586" y="607" font-size="23" font-weight="600" fill="#607b91">운영체제 시작</text><path d="M816 578h36" fill="none" stroke="#e7bd7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="876" y="519" width="264" height="119" rx="20" fill="#e0f0ed"/><text x="902" y="565" font-size="34" font-weight="750" fill="#2a655b">&gt;_ SSH</text><text x="902" y="607" font-size="23" font-weight="600" fill="#568477">원격 작업</text><path d="M60 682H1140" fill="none" stroke="#6b624e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="735" font-size="30" font-weight="650" fill="#f0dfc6">Tauri · React · Rust</text><text x="1140" y="735" font-size="30" font-weight="600" fill="#b9d9d4" text-anchor="end">전원 제어부터 원격 접속까지</text></g></svg>