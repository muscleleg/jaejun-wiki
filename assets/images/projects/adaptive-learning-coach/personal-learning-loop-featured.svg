<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
  <title id="title">행동에서 다음 학습으로 이어지는 개인화 학습 코치 위키</title>
  <desc id="desc">질문과 실습을 증거로 판단해 학습 기억에 축적하고 개인화된 설명과 다음 행동으로 되돌리는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbf8"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#287a63"/></marker>
  </defs>
  <rect width="1120" height="369" rx="26" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">학습 행동이 기억이 되고, 기억이 다음 행동을 이끈다</text>
  <text x="560" y="84" text-anchor="middle" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">개인화 학습 코치 위키 · 학습 기억 기반 다음 행동 안내</text>
  <g fill="none" stroke="#287a63" stroke-width="4" marker-end="url(#arrow)">
    <path d="M230 208H286"/><path d="M444 208H500"/><path d="M658 208H714"/><path d="M872 208H928"/>
  </g>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <g><rect x="60" y="130" width="170" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="93" cy="163" r="18" fill="#e5f4ef"/><text x="93" y="170" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">1</text><text x="119" y="169" fill="#153247" font-size="18" font-weight="800">학습 행동</text><text x="84" y="209" fill="#607486" font-size="14">질문 · 실습 · 설명</text><text x="84" y="235" fill="#607486" font-size="14">막힘 · 관심 · 보류</text><text x="84" y="261" fill="#607486" font-size="14">새로운 인사이트</text></g>
    <g><rect x="286" y="130" width="158" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="319" cy="163" r="18" fill="#e5f4ef"/><text x="319" y="170" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">2</text><text x="345" y="169" fill="#153247" font-size="18" font-weight="800">증거 판단</text><text x="310" y="209" fill="#607486" font-size="14">코드 · 출력 · Shape</text><text x="310" y="235" fill="#607486" font-size="14">이해와 미해결 구분</text><text x="310" y="261" fill="#607486" font-size="14">완료 조건 확인</text></g>
    <g><rect x="500" y="130" width="158" height="154" rx="22" fill="#153247"/><circle cx="533" cy="163" r="18" fill="#d9eee7"/><text x="533" y="170" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">3</text><text x="559" y="169" fill="#fff" font-size="18" font-weight="800">학습 기억</text><text x="524" y="209" fill="#d9e9e3" font-size="14">현재 관문 · 내 언어</text><text x="524" y="235" fill="#d9e9e3" font-size="14">완료 증거 · 학습 기록</text><text x="524" y="261" fill="#d9e9e3" font-size="14">보류·다음 학습 제안</text></g>
    <g><rect x="714" y="130" width="158" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="747" cy="163" r="18" fill="#e5f4ef"/><text x="747" y="170" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">4</text><text x="773" y="169" fill="#153247" font-size="18" font-weight="800">개인화</text><text x="738" y="209" fill="#607486" font-size="14">내 표현으로 설명</text><text x="738" y="235" fill="#607486" font-size="14">가장 작은 다음 행동</text><text x="738" y="261" fill="#607486" font-size="14">중단 지점에서 재개</text></g>
    <g><rect x="928" y="130" width="132" height="154" rx="22" fill="#fff" stroke="#c9d9e5"/><circle cx="961" cy="163" r="18" fill="#e5f4ef"/><text x="961" y="170" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">5</text><text x="987" y="169" fill="#153247" font-size="18" font-weight="800">재실행</text><text x="952" y="209" fill="#607486" font-size="14">직접 입력</text><text x="952" y="235" fill="#607486" font-size="14">결과 검증</text><text x="952" y="261" fill="#607486" font-size="14">새 증거 생성</text></g>
  </g>
  <path d="M994 303C930 326 216 326 126 303" fill="none" stroke="#6d91a6" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="560" y="355" text-anchor="middle" fill="#345a50" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">기록된 백로그가 잊지 않을 확신을 만들고, 우선순위가 “지금 무엇을 하지?”라는 고민을 줄인다.</text>
</svg>
