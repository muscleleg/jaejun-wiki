<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
  <title id="title">학습과 지식 축적이 함께 이어지는 개인화 학습 코치 위키</title>
  <desc id="desc">질문과 실습의 근거로 다음 학습을 정하고, 검증된 설명은 원문 대기열과 일괄 반영을 거쳐 문서 색인과 지식 지도로 연결하는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6fbf8"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#287a63"/>
    </marker>
  </defs>
  <rect width="1120" height="369" rx="26" fill="url(#bg)"/>
  <text x="560" y="52" text-anchor="middle" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="800">학습은 바로 이어가고, 문서는 안전하게 모아 정리한다</text>
  <text x="560" y="82" text-anchor="middle" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">학습 문서 자동 저장 · 심화 백로그 · 안전한 일괄 반영</text>
  <g fill="none" stroke="#287a63" stroke-width="4" marker-end="url(#arrow)">
    <path d="M228 206H274"/>
    <path d="M432 206H478"/>
    <path d="M642 206H688"/>
    <path d="M846 206H892"/>
  </g>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <g>
      <rect x="48" y="126" width="180" height="158" rx="22" fill="#fff" stroke="#c9d9e5"/>
      <circle cx="81" cy="159" r="18" fill="#e5f4ef"/>
      <text x="81" y="166" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">1</text>
      <text x="107" y="165" fill="#153247" font-size="18" font-weight="800">학습·검증</text>
      <text x="72" y="207" fill="#607486" font-size="14">질문 · 실습 · 설명</text>
      <text x="72" y="233" fill="#607486" font-size="14">출력 · 예측 · 이해</text>
      <text x="72" y="259" fill="#607486" font-size="14">새 의문과 근거</text>
    </g>
    <g>
      <rect x="274" y="126" width="158" height="158" rx="22" fill="#fff" stroke="#c9d9e5"/>
      <circle cx="307" cy="159" r="18" fill="#e5f4ef"/>
      <text x="307" y="166" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">2</text>
      <text x="333" y="165" fill="#153247" font-size="18" font-weight="800">자동 분류</text>
      <text x="298" y="207" fill="#607486" font-size="14">문서 원문 → 대기열</text>
      <text x="298" y="233" fill="#607486" font-size="14">심화 의문 → 백로그</text>
      <text x="298" y="259" fill="#607486" font-size="14">지금 공부는 계속</text>
    </g>
    <g>
      <rect x="478" y="126" width="164" height="158" rx="22" fill="#153247"/>
      <circle cx="511" cy="159" r="18" fill="#d9eee7"/>
      <text x="511" y="166" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">3</text>
      <text x="537" y="165" fill="#fff" font-size="18" font-weight="800">문서 대기열</text>
      <text x="502" y="207" fill="#d9e9e3" font-size="14">Markdown 자동 적재</text>
      <text x="502" y="233" fill="#d9e9e3" font-size="14">날짜별 원문 보존</text>
      <text x="502" y="259" fill="#d9e9e3" font-size="14">반영 요청까지 대기</text>
    </g>
    <g>
      <rect x="688" y="126" width="158" height="158" rx="22" fill="#fff" stroke="#c9d9e5"/>
      <circle cx="721" cy="159" r="18" fill="#e5f4ef"/>
      <text x="721" y="166" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">4</text>
      <text x="747" y="165" fill="#153247" font-size="18" font-weight="800">일괄 반영</text>
      <text x="712" y="207" fill="#607486" font-size="14">신규 · 보강 · 보류</text>
      <text x="712" y="233" fill="#607486" font-size="14">HTML · 원천 메타데이터</text>
      <text x="712" y="259" fill="#607486" font-size="14">코드 검증 · 실패 복구</text>
    </g>
    <g>
      <rect x="892" y="126" width="180" height="158" rx="22" fill="#fff" stroke="#c9d9e5"/>
      <circle cx="925" cy="159" r="18" fill="#e5f4ef"/>
      <text x="925" y="166" text-anchor="middle" fill="#287a63" font-size="18" font-weight="800">5</text>
      <text x="951" y="165" fill="#153247" font-size="18" font-weight="800">통합 탐색</text>
      <text x="916" y="207" fill="#607486" font-size="14">다음 학습 · 기억 강화</text>
      <text x="916" y="233" fill="#607486" font-size="14">검색 · 블로그 · 프로젝트</text>
      <text x="916" y="259" fill="#607486" font-size="14">지식 지도 연결</text>
    </g>
  </g>
  <path d="M982 303C918 327 221 327 138 303" fill="none" stroke="#6d91a6" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="560" y="354" text-anchor="middle" fill="#345a50" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">확인된 학습은 다음 행동으로, 정리된 문서는 다음 학습의 근거로 다시 돌아온다.</text>
</svg>
