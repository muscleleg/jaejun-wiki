    <circle cx="20" cy="22" r="10" fill="#EDF2EF"/>
    <path d="M20 16v7l5 3" fill="none" stroke="#5B746A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="34" y="25">보류 목록</text>
    <rect x="15" y="43" width="61" height="5" rx="2.5" fill="#DCE9E3"/>
    <rect x="15" y="54" width="49" height="5" rx="2.5" fill="#E7EFEB"/>
