<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">자동 학습 기록과 보류 목록</title>
  <desc id="desc">사용자가 학습에 집중하는 동안 코딩 에이전트가 대화와 실습 내용을 현재 학습 기록과 보류 목록으로 분류하는 모습</desc>
  <defs>
    <linearGradient id="background" x1="28" y1="18" x2="408" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FAF8"/>
      <stop offset="1" stop-color="#E8F3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173D30" flood-opacity=".10"/>
    </filter>
    <style>
      .label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#146B4B}
      .small{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#536B63}
      .line{fill:none;stroke:#69A58E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="258" rx="26" fill="url(#background)" stroke="#C8DDD3"/>
  <circle cx="66" cy="48" r="26" fill="#DDEDE6"/>
  <circle cx="392" cy="42" r="17" fill="#D7EAE1"/>
  <path d="M25 214c52-26 100-22 143 9 47 34 100 32 159 1 33-17 61-18 88-4" fill="none" stroke="#D5E8DF" stroke-width="16" stroke-linecap="round"/>

  <g transform="translate(30 69)">
    <text class="label" x="57" y="0" text-anchor="middle">학습에 집중</text>
    <circle cx="53" cy="39" r="18" fill="#F0C6A6"/>
    <path d="M36 36c2-18 29-25 38-5 2 5 1 11-1 16-7-4-11-13-12-20-6 8-14 12-25 12Z" fill="#26384A"/>
    <path d="M27 96c2-28 13-42 28-42 17 0 31 15 34 42" fill="#2C7B61"/>
    <rect x="4" y="89" width="105" height="10" rx="5" fill="#C7D7D1"/>
    <path d="M18 58h58l15 40H31Z" fill="#FFFFFF" stroke="#B9CEC5"/>
    <circle cx="53" cy="79" r="4" fill="#2C7B61"/>
    <path d="M76 51c10-8 19-9 27-4" class="line"/>
    <circle cx="108" cy="44" r="4" fill="#69A58E"/>
    <text class="small" x="57" y="119" text-anchor="middle">질문 · 설명 · 실습</text>
  </g>

  <path d="M145 126h42" class="line"/>
  <path d="m181 118 9 8-9 8" class="line"/>

  <g transform="translate(188 76)" filter="url(#shadow)">
    <rect width="82" height="99" rx="22" fill="#FFFFFF" stroke="#B9D4C7"/>
    <circle cx="41" cy="36" r="23" fill="#146B4B"/>
    <text x="41" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">AI</text>
    <text class="label" x="41" y="78" text-anchor="middle">자동 정리</text>
    <text class="small" x="41" y="92" text-anchor="middle">구분 · 갱신</text>
  </g>

  <path d="M270 126h31m0 0 18-37m-18 37 18 38" class="line"/>
  <path d="m313 86 8 2-4 7M313 157l8 6-8 4" class="line"/>

  <g transform="translate(320 50)" filter="url(#shadow)">
    <rect width="91" height="72" rx="16" fill="#FFFFFF" stroke="#A9CCBC"/>
    <circle cx="20" cy="22" r="10" fill="#DDF1E8"/>
    <path d="m15 22 4 4 7-9" fill="none" stroke="#146B4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="34" y="25">현재 학습</text>
    <rect x="15" y="43" width="61" height="5" rx="2.5" fill="#DCE9E3"/>
    <rect x="15" y="54" width="44" height="5" rx="2.5" fill="#E7EFEB"/>
  </g>

  <g transform="translate(320 139)" filter="url(#shadow)">
