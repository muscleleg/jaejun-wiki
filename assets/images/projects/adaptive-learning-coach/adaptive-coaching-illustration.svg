    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173D30" flood-opacity=".10"/></filter>
    <style>.label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#146B4B}.small{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#536B63}.line{fill:none;stroke:#69A58E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect x="1" y="1" width="438" height="258" rx="26" fill="url(#background)" stroke="#C8DDD3"/>
  <circle cx="54" cy="45" r="22" fill="#DDEDE6"/><circle cx="390" cy="44" r="18" fill="#D7EAE1"/>
  <path d="M24 220c58-30 109-22 151 8 48 34 104 31 164-1 28-15 53-16 76-5" fill="none" stroke="#D5E8DF" stroke-width="16" stroke-linecap="round"/>
