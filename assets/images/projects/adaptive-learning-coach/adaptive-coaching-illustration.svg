    <text class="label" x="16" y="27">마지막 학습 지점</text>
    <circle cx="23" cy="51" r="8" fill="#DDF1E8"/><path d="m19 51 3 3 6-7" fill="none" stroke="#146B4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="47" width="60" height="6" rx="3" fill="#DCE9E3"/>
    <text class="small" x="16" y="81">사용자의 표현</text>
    <rect x="16" y="91" width="84" height="31" rx="10" fill="#F2F7F5"/>
    <path d="M27 101h58M27 112h43" stroke="#BFD3CA" stroke-width="5" stroke-linecap="round"/>
    <text class="small" x="16" y="131">확인된 이해</text><text class="small" x="16" y="143">남은 막힘</text>
  </g>
  <path d="M144 129h42" class="line"/><path d="m180 121 9 8-9 8" class="line"/>
  <g transform="translate(188 76)" filter="url(#shadow)">
    <rect width="82" height="99" rx="22" fill="#FFFFFF" stroke="#B9D4C7"/>
    <circle cx="41" cy="36" r="23" fill="#146B4B"/><text x="41" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">AI</text>
    <text class="label" x="41" y="78" text-anchor="middle">기억 읽기</text><text class="small" x="41" y="92" text-anchor="middle">비교 · 조정</text>
  </g>
  <path d="M270 126h31m0 0 18-37m-18 37 18 38" class="line"/><path d="m313 86 8 2-4 7M313 157l8 6-8 4" class="line"/>
  <g transform="translate(320 49)" filter="url(#shadow)"><rect width="94" height="73" rx="16" fill="#FFFFFF" stroke="#A9CCBC"/><circle cx="20" cy="22" r="10" fill="#DDF1E8"/><path d="M16 18h8M16 22h12M16 26h9" stroke="#146B4B" stroke-width="2" stroke-linecap="round"/><text class="label" x="36" y="25">다음 설명</text><text class="small" x="15" y="50">익숙한 말과</text><text class="small" x="15" y="64">예제로 시작</text></g>
