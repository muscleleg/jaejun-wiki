<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">개인화 설명과 학습 재개</title>
  <desc id="desc">코딩 에이전트가 마지막 학습 지점과 사용자의 표현을 읽어 다음 설명과 작은 실습을 정하는 모습</desc>
  <defs>
