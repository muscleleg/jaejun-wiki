<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">개인화 학습 코치 위키의 학습 순환</title>
  <desc id="desc">사용자의 질문과 실습에서 증거를 판별하고, 학습 상태와 자신의 언어로 축적한 뒤, 개인화된 설명과 다음 행동으로 되돌려 다시 학습을 이어가는 순환 구조</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287a63"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183a4b" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#background)"/>
  <text x="600" y="62" text-anchor="middle" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="800">행동이 기억이 되고, 기억이 다음 학습을 이끈다</text>
  <text x="600" y="96" text-anchor="middle" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">대화형 AI 협업 계층과 공개 정적 위키가 함께 만드는 개인화 학습 순환</text>

  <path d="M 328 225 C 414 158, 500 143, 590 162" fill="none" stroke="#287a63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 780 194 C 866 220, 918 279, 924 352" fill="none" stroke="#287a63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 890 482 C 842 552, 762 588, 676 595" fill="none" stroke="#287a63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 493 592 C 395 575, 322 527, 289 461" fill="none" stroke="#287a63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 258 335 C 254 292, 270 257, 302 231" fill="none" stroke="#287a63" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="154" width="258" height="164" rx="24" fill="#ffffff" stroke="#c9d9e5"/>
    <circle cx="137" cy="199" r="22" fill="#e5f4ef"/>
    <text x="137" y="207" text-anchor="middle" fill="#287a63" font-family="sans-serif" font-size="22" font-weight="800">1</text>
    <text x="173" y="205" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">학습 행동</text>
    <text x="124" y="244" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">질문 · 직접 설명 · 코드 실행</text>
    <text x="124" y="271" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">막힌 지점 · 관심사 · “나중에”</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="474" y="122" width="282" height="164" rx="24" fill="#ffffff" stroke="#c9d9e5"/>
    <circle cx="519" cy="167" r="22" fill="#e5f4ef"/>
    <text x="519" y="175" text-anchor="middle" fill="#287a63" font-family="sans-serif" font-size="22" font-weight="800">2</text>
    <text x="555" y="173" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">증거 판단</text>
    <text x="506" y="212" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">실행 결과 · Shape · 예측 · 재구현</text>
    <text x="506" y="239" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">이해 · 미해결 · 반복 약점을 구분</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="838" y="308" width="282" height="180" rx="24" fill="#ffffff" stroke="#c9d9e5"/>
    <circle cx="883" cy="353" r="22" fill="#e5f4ef"/>
    <text x="883" y="361" text-anchor="middle" fill="#287a63" font-family="sans-serif" font-size="22" font-weight="800">3</text>
    <text x="919" y="359" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">학습 상태 축적</text>
    <text x="870" y="398" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">현재 관문 · 완료 증거 · 학습 기록</text>
    <text x="870" y="425" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">내 표현의 문서 · 보류·관심 항목</text>
    <text x="870" y="452" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">공개 범위와 미해결 질문 보존</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="514" width="310" height="164" rx="24" fill="#ffffff" stroke="#c9d9e5"/>
    <circle cx="539" cy="559" r="22" fill="#e5f4ef"/>
    <text x="539" y="567" text-anchor="middle" fill="#287a63" font-family="sans-serif" font-size="22" font-weight="800">4</text>
    <text x="575" y="565" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">개인화된 안내</text>
    <text x="526" y="604" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">이전 표현과 실제 숫자로 다시 설명</text>
    <text x="526" y="631" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">지금 필요한 가장 작은 다음 행동 제시</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="354" width="292" height="176" rx="24" fill="#ffffff" stroke="#c9d9e5"/>
    <circle cx="125" cy="399" r="22" fill="#e5f4ef"/>
    <text x="125" y="407" text-anchor="middle" fill="#287a63" font-family="sans-serif" font-size="22" font-weight="800">5</text>
    <text x="161" y="405" fill="#153247" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">다시 실행·확인</text>
    <text x="112" y="444" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">직접 입력하고 결과를 설명</text>
    <text x="112" y="471" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">새 행동이 다음 순환의 입력이 됨</text>
    <text x="112" y="498" fill="#607486" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">중단해도 마지막 상태에서 재개</text>
  </g>

  <g>
    <rect x="405" y="326" width="390" height="126" rx="26" fill="#153247"/>
    <text x="600" y="369" text-anchor="middle" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="800">개인화 학습 코치 위키의 핵심 가치</text>
    <text x="600" y="405" text-anchor="middle" fill="#d9e9e3" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">백로그가 의문을 잊지 않기 때문에</text>
    <text x="600" y="431" text-anchor="middle" fill="#d9e9e3" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">사용자는 지금 중요한 한 가지에 집중한다</text>
  </g>

  <rect x="90" y="704" width="1020" height="34" rx="17" fill="#dceae6"/>
  <text x="600" y="727" text-anchor="middle" fill="#345a50" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="700">가드레일: 사용자가 핵심 방향을 정하고, 검증된 증거만 완료·지식으로 반영하며, 공개 안전 검사를 통과한 내용만 사이트에 남긴다.</text>
</svg>
