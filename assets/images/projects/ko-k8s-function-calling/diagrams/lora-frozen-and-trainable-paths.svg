<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">원본 계산은 유지하고 보정 경로만 학습</title><desc id="desc">한 Linear 계층의 LoRA 연산 구조이다. 같은 입력 x가 동결된 원본 W와 학습 대상 A, B의 두 경로를 지난다. 원본 Wx에 alpha/r=2배 한 B(Ax)를 더한다. rank는 16이며 W는 동결하고 A와 B만 업데이트한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718697" stroke-width="1.4"/></marker></defs><rect width="1040" height="530" rx="20" fill="#F6F9FC"/>
<text x="32" y="44" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#172C3B">원본 계산은 유지하고 보정 경로만 학습</text>
<text x="32" y="81" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#536879">한 Linear 계층의 연산 · 두 경로에 같은 입력 x를 전달</text>
<rect x="32" y="226" width="120" height="68" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="51" y="268" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="600" fill="#172C3B">입력 x</text>
<rect x="250" y="113" width="418" height="98" rx="12" fill="#EAF0F6" stroke="#D8E2E9"/>
<text x="272" y="152" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#172C3B">원본 가중치 W · 동결</text>
<text x="272" y="189" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#536879">원본 출력 Wx</text>
<rect x="231" y="310" width="565" height="128" rx="12" fill="#E0F3EC" stroke="#C5E4DA"/>
<rect x="250" y="328" width="144" height="91" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="268" y="364" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#087C72">A · 학습</text>
<text x="268" y="402" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172C3B">16차원으로</text>
<rect x="445" y="328" width="144" height="91" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="463" y="364" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#087C72">B · 학습</text>
<text x="463" y="402" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172C3B">출력 차원으로</text>
<rect x="640" y="328" width="136" height="91" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="660" y="364" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#087C72">× 2</text>
<text x="652" y="401" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#172C3B">alpha / r</text>
<circle cx="842" cy="260" r="29" fill="#FFFFFF" stroke="#718697" stroke-width="2"/>
<text x="830" y="270" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" font-weight="400" fill="#172C3B">+</text>
<rect x="920" y="226" width="88" height="68" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="938" y="268" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="600" fill="#172C3B">출력</text>
<path d="M152 260 L202 260 L202 162 L250 162" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M202 260 L202 373 L250 373" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M668 162 L842 162 L842 231" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M394 373 L445 373" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M589 373 L640 373" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M776 373 L842 373 L842 289" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M871 260 L920 260" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="480" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="600" fill="#172C3B">출력 = Wx + 2 × B(Ax)</text>
<text x="32" y="513" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#536879">이 실험의 설정: rank 16 · alpha 32 · 학습 대상은 A와 B</text>
</svg>
