<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="528" viewBox="0 0 1040 528" role="img" aria-labelledby="title desc"><title id="title">함수명과 형식이 맞아도 인자가 다르면 실패</title><desc id="desc">저장된 list-pods-004의 학습 전 응답이다. 파드 목록 좀 보여줘라는 요청에 namespace=default를 추가했다. 함수명, JSON, Schema는 모두 통과하지만 기대 인자는 빈 객체이므로 인자 정확 일치와 전체 성공은 실패한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718697" stroke-width="1.4"/></marker></defs><rect width="1040" height="528" rx="20" fill="#F6F9FC"/>
<text x="32" y="44" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#172C3B">함수명과 형식이 맞아도 인자가 다르면 실패</text>
<rect x="32" y="70" width="976" height="116" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="52" y="106" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#172C3B">요청: “파드 목록 좀 보여줘.”</text>
<text x="52" y="153" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="400" fill="#172C3B">응답: list_pods({&quot;namespace&quot;:&quot;default&quot;})</text>
<path d="M520 186 L520 211 L264 211 L264 235" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520 211 L776 211 L776 235" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="245" width="466" height="162" rx="12" fill="#E0F3EC" stroke="#C5E4DA"/>
<text x="52" y="282" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#087C72">도구·형식 검사: 통과</text>
<text x="52" y="319" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#172C3B">함수명 list_pods 일치</text>
<text x="52" y="352" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#172C3B">인자 JSON 파싱 성공</text>
<text x="52" y="385" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#172C3B">namespace의 자료형도 Schema와 일치</text>
<rect x="542" y="245" width="466" height="162" rx="12" fill="#FFF0DE" stroke="#ECD5B5"/>
<text x="562" y="282" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#995318">요청과 인자 비교: 불일치</text>
<text x="562" y="319" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#172C3B">정답: {}</text>
<text x="562" y="352" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#172C3B">실제: {&quot;namespace&quot;:&quot;default&quot;}</text>
<text x="562" y="385" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#995318">사용자가 말하지 않은 인자 추가</text>
<rect x="32" y="430" width="976" height="54" rx="12" fill="#EAF0F6" stroke="#EAF0F6"/>
<text x="52" y="465" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="600" fill="#172C3B">전체 성공: 실패  ·  호출 여부·도구명·형식·인자가 모두 맞아야 성공</text>
<text x="32" y="512" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536879">실제 저장 응답 · list-pods-004 · 학습 전 모델</text>
</svg>
