<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="526" viewBox="0 0 1040 526" role="img" aria-labelledby="title desc"><title id="title">같은 로그 요청, 달라진 함수 인자</title><desc id="desc">logs-001에서 학습 전 모델은 container=default와 previous=false를 추가했다. 학습 후에는 요청에 있는 namespace, pod_name, tail_lines만 생성했다. 두 모델의 함수명은 get_pod_logs로 같다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718697" stroke-width="1.4"/></marker></defs><rect width="1040" height="526" rx="20" fill="#F6F9FC"/>
<text x="32" y="45" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#172C3B">같은 로그 요청, 달라진 함수 인자</text>
<rect x="32" y="67" width="976" height="64" rx="12" fill="#EAF0F6" stroke="#EAF0F6"/>
<text x="50" y="107" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#172C3B">“production의 payment-api 파드 로그를 최근 100줄 보여줘.”</text>
<rect x="32" y="155" width="460" height="304" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="52" y="192" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#995318">학습 전 · 요청하지 않은 인자 추가</text>
<text x="52" y="228" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#176B89">get_pod_logs</text>
<rect x="548" y="155" width="460" height="304" rx="12" fill="#FFFFFF" stroke="#D8E2E9"/>
<text x="568" y="192" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#087C72">학습 후 · 요청한 인자만 생성</text>
<text x="568" y="228" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#176B89">get_pod_logs</text>
<text x="52" y="268" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">namespace: &quot;production&quot;</text>
<text x="52" y="304" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">pod_name: &quot;payment-api&quot;</text>
<text x="52" y="340" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">tail_lines: 100</text>
<text x="568" y="268" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">namespace: &quot;production&quot;</text>
<text x="568" y="304" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">pod_name: &quot;payment-api&quot;</text>
<text x="568" y="340" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#172C3B">tail_lines: 100</text>
<rect x="44" y="355" width="436" height="87" rx="8" fill="#FFF0DE" stroke="#FFF0DE"/>
<text x="52" y="387" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#995318">container: &quot;default&quot;</text>
<text x="52" y="421" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#995318">previous: false</text>
<text x="568" y="393" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="600" fill="#087C72">불필요한 두 필드 생략</text>
<path d="M503 307 L536 307" fill="none" stroke="#718697" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="496" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#536879">실제 저장 응답 · logs-001 · 함수명은 같고, 인자 구성이 달라졌습니다.</text>
</svg>
