<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes Function Calling — 한국어 요청을 함수 호출로</title><desc id="desc">Qwen3-1.7B를 LoRA로 파인튜닝해 한국어 Kubernetes 조회 요청을 함수명과 인자로 변환한다. 고정 평가 33건에서 성공 15/33에서 31/33, 인자 정확 일치 36%에서 92%, 오호출 2건에서 0건. 그림의 함수 호출은 형식 예시다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173553"/><stop offset="1" stop-color="#233244"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#99c8ed" opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#99c8ed" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#dots)"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><g transform="translate(62 63)" fill="none" stroke="#9bd5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m30 0 26 15v30L30 60 4 45V15Zm-26 15 26 15 26-15M30 30v30"/></g><text x="145" y="120" font-size="67" font-weight="750" fill="#fff">Kubernetes</text><text x="60" y="204" font-size="75" font-weight="750" fill="#fff">Function Calling</text><text x="62" y="257" font-size="34" font-weight="600" fill="#c7e4f6">한국어 조회 요청을 함수명과 인자로</text><rect x="60" y="296" width="454" height="281" rx="20" fill="#eef5fd"/><text x="87" y="340" font-size="27" font-weight="700" fill="#486d8d">한국어 조회 요청</text><rect x="86" y="366" width="402" height="112" rx="15" fill="#dcecf9"/><text x="111" y="411" font-size="34" font-weight="750" fill="#294d6e">“Pod 목록을</text><text x="111" y="454" font-size="34" font-weight="750" fill="#294d6e">보여줘”</text><text x="87" y="541" font-size="29" font-weight="650" fill="#4c6e88">Qwen3-1.7B · LoRA</text><path d="M531 437h52" fill="none" stroke="#99c8ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="612" y="296" width="528" height="281" rx="20" fill="#e8f4f2"/><text x="639" y="340" font-size="27" font-weight="700" fill="#3f7068">JSON 함수 호출</text><rect x="638" y="366" width="476" height="183" rx="15" fill="#20353f"/><text x="660" y="402" font-size="25" font-weight="600" fill="#cbdce6" font-family="Menlo, monospace">{</text><text x="660" y="440" font-size="25" font-weight="600" fill="#c4e6da" font-family="Menlo, monospace">  &quot;name&quot;: &quot;list_pods&quot;,</text><text x="660" y="478" font-size="25" font-weight="600" fill="#b5d1ed" font-family="Menlo, monospace">  &quot;arguments&quot;: {}</text><text x="660" y="516" font-size="25" font-weight="600" fill="#cbdce6" font-family="Menlo, monospace">}</text><text x="60" y="624" font-size="26" font-weight="650" fill="#bfd9eb">동일한 33건으로 평가</text><rect x="60" y="647" width="333" height="93" rx="15" fill="#e3eef7"/><text x="80" y="677" font-size="22" font-weight="650" fill="#4c718a">호출 성공</text><text x="80" y="719" font-size="32" font-weight="750" fill="#234a68">15/33 → 31/33</text><rect x="413" y="647" width="374" height="93" rx="15" fill="#e3eef7"/><text x="433" y="677" font-size="22" font-weight="650" fill="#4c718a">인자 정확 일치</text><text x="433" y="719" font-size="32" font-weight="750" fill="#234a68">36% → 92%</text><rect x="807" y="647" width="333" height="93" rx="15" fill="#d7ede6"/><text x="827" y="677" font-size="22" font-weight="650" fill="#4c718a">오호출</text><text x="827" y="719" font-size="32" font-weight="750" fill="#2d6656">2 → 0</text></g></svg>