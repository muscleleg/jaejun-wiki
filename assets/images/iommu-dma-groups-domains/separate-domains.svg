<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 그룹을 별도의 IOMMU 도메인에 연결한 예시</title>
<desc id="desc">그룹 A의 GPU와 오디오는 도메인 1에 연결되고 그룹 B의 NVMe는 도메인 2에 연결된다. 같은 IOVA 0x1000도 도메인에 따라 다른 RAM에 매핑된다. 그룹은 장치 묶음이고 도메인은 주소 매핑을 관리한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
<rect width="1120" height="670" rx="20" fill="#f8fafc"/>
<g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">그룹은 장치의 격리 경계 · 도메인은 주소 매핑의 영역</text>
<text x="40" y="82" font-size="17" fill="#475569">일반적인 VFIO 모델의 관리 관계 예시 — DMA가 그룹이라는 부품을 통과하는 그림이 아니다.</text>
<text x="40" y="127" font-size="19" font-weight="700">어떤 장치들을 함께 다루는가?</text>
<text x="460" y="127" font-size="19" font-weight="700">어떤 매핑을 적용하는가?</text>
<text x="875" y="127" font-size="19" font-weight="700">매핑 대상 RAM</text>
<rect x="40" y="148" width="320" height="190" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="62" y="182" font-size="22" font-weight="700">그룹 A</text>
<rect x="62" y="201" width="276" height="48" rx="8" fill="#fff" stroke="#93c5fd"/>
<text x="200" y="232" text-anchor="middle" font-size="19">GPU 본체</text>
<rect x="62" y="263" width="276" height="48" rx="8" fill="#fff" stroke="#93c5fd"/>
<text x="200" y="294" text-anchor="middle" font-size="19">GPU 오디오</text>
<path d="M360 244H450" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="405" y="225" text-anchor="middle" font-size="16">연결</text>
<rect x="460" y="164" width="330" height="158" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="485" y="203" font-size="22" font-weight="700">도메인 1</text>
<text x="485" y="245" font-size="19">0x1000 → 0x9000</text>
<text x="485" y="282" font-size="17" fill="#475569">주소 매핑 + 읽기·쓰기 권한</text>
<path d="M790 244H865" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="875" y="189" width="205" height="108" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<text x="978" y="232" text-anchor="middle" font-size="21" font-weight="700">RAM 0x9000</text>
<text x="978" y="265" text-anchor="middle" font-size="17">VM A의 메모리</text>
<rect x="40" y="370" width="320" height="190" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="62" y="406" font-size="22" font-weight="700">그룹 B</text>
<rect x="62" y="434" width="276" height="74" rx="8" fill="#fff" stroke="#fdba74"/>
<text x="200" y="478" text-anchor="middle" font-size="19">NVMe 컨트롤러</text>
<path d="M360 466H450" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="405" y="447" text-anchor="middle" font-size="16">연결</text>
<rect x="460" y="386" width="330" height="158" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="485" y="425" font-size="22" font-weight="700">도메인 2</text>
<text x="485" y="467" font-size="19">0x1000 → 0xD000</text>
<text x="485" y="504" font-size="17" fill="#475569">별도의 주소 매핑 + 접근 권한</text>
<path d="M790 466H865" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="875" y="411" width="205" height="108" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="978" y="454" text-anchor="middle" font-size="21" font-weight="700">RAM 0xD000</text>
<text x="978" y="487" text-anchor="middle" font-size="17">VM B의 메모리</text>
<text x="40" y="606" font-size="20" font-weight="700">같은 IOVA 0x1000을 사용해도, 적용할 도메인이 다르면 다른 RAM에 접근한다.</text>
<text x="40" y="639" font-size="17" fill="#475569">A가 B의 주소 숫자를 사용해도 B의 도메인을 선택할 수는 없다. 그룹 번호 자체에는 매핑 정보가 없다.</text>
</g></svg>
