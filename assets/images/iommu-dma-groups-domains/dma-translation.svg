<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">IOMMU가 DMA 주소를 변환하고 접근을 검사하는 과정</title>
<desc id="desc">드라이버와 커널이 매핑을 준비한다. GPU 요청의 식별 정보로 도메인을 찾고 IOVA와 권한을 검사한다. 허용된 요청은 RAM으로 전달되고 매핑이 없거나 권한이 없으면 차단된다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#334155"/></marker></defs>
<rect width="1120" height="650" rx="20" fill="#f8fafc"/>
<g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">DMA 요청: 주소 변환과 접근 보호</text>
<text x="40" y="80" font-size="17" fill="#475569">IOMMU 주소 변환을 사용하는 구성 · 주소는 설명용 예시</text>
<rect x="330" y="108" width="440" height="82" rx="12" fill="#eef2ff" stroke="#818cf8"/>
<text x="550" y="141" text-anchor="middle" font-size="21" font-weight="700">드라이버 + Linux 커널</text>
<text x="550" y="171" text-anchor="middle" font-size="17">버퍼 준비 · 도메인 연결 · 매핑과 권한 설정</text>
<path d="M550 190V251" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="565" y="223" font-size="16" fill="#475569">미리 설정</text>
<rect x="40" y="279" width="230" height="140" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="155" y="316" text-anchor="middle" font-size="23" font-weight="700">GPU</text>
<text x="155" y="350" text-anchor="middle" font-size="18">DMA 읽기 요청</text>
<text x="155" y="380" text-anchor="middle" font-size="18">IOVA 0x1000</text>
<path d="M270 349H322" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="330" y="260" width="440" height="210" rx="14" fill="#fff" stroke="#6366f1" stroke-width="2"/>
<text x="550" y="294" text-anchor="middle" font-size="23" font-weight="700">IOMMU 하드웨어</text>
<text x="355" y="331" font-size="18">① 요청자 식별 → 적용할 도메인</text>
<text x="355" y="365" font-size="18">② 해당 도메인의 매핑·읽기 권한 확인</text>
<rect x="355" y="387" width="390" height="57" rx="8" fill="#eef2ff"/>
<text x="550" y="422" text-anchor="middle" font-size="20" font-weight="700">IOVA 0x1000 → RAM 0x9000</text>
<path d="M770 349H832" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="800" y="329" text-anchor="middle" font-size="16">허용</text>
<rect x="840" y="279" width="240" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="960" y="316" text-anchor="middle" font-size="23" font-weight="700">호스트 RAM</text>
<text x="960" y="352" text-anchor="middle" font-size="19">물리 주소 0x9000</text>
<text x="960" y="384" text-anchor="middle" font-size="17">매핑된 버퍼에 접근</text>
<path d="M550 470V510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="520" width="440" height="60" rx="12" fill="#fff1f2" stroke="#e11d48"/>
<text x="550" y="557" text-anchor="middle" font-size="19" fill="#9f1239">매핑 없음 / 권한 없음 → 접근 차단</text>
<text x="40" y="619" font-size="17" fill="#475569">실선: 요청 처리 흐름   점선: 소프트웨어의 설정   ※ 데이터 복사·GPU 연산은 IOMMU의 역할이 아니다.</text>
</g></svg>
