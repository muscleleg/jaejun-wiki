<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 IOMMU 그룹이 하나의 도메인을 공유하는 예시</title>
<desc id="desc">그룹 A와 그룹 B가 같은 도메인 1에 연결되어 동일한 IOVA 0x1000은 같은 RAM 주소 0x9000으로 변환된다. 그룹이 다르면 독립 격리가 가능하지만 반드시 다른 도메인을 써야 하는 것은 아니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
<rect width="1120" height="480" rx="20" fill="#f8fafc"/>
<g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">서로 다른 그룹도 같은 도메인에 연결할 수 있다</text>
<text x="40" y="82" font-size="17" fill="#475569">그룹의 경계와 주소 공간의 공유 여부는 서로 다른 개념이다.</text>
<rect x="40" y="126" width="270" height="95" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="175" y="164" text-anchor="middle" font-size="22" font-weight="700">그룹 A의 장치</text>
<text x="175" y="197" text-anchor="middle" font-size="18">DMA 주소 0x1000</text>
<rect x="40" y="269" width="270" height="95" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="175" y="307" text-anchor="middle" font-size="22" font-weight="700">그룹 B의 장치</text>
<text x="175" y="340" text-anchor="middle" font-size="18">DMA 주소 0x1000</text>
<path d="M310 174H365V225H432 M310 317H365V265H432" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="440" y="157" width="350" height="176" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="615" y="199" text-anchor="middle" font-size="23" font-weight="700">공통 도메인 1</text>
<text x="615" y="244" text-anchor="middle" font-size="20">0x1000 → 0x9000</text>
<text x="615" y="287" text-anchor="middle" font-size="17">동일한 주소 매핑·접근 권한 적용</text>
<path d="M790 245H860" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="870" y="185" width="210" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="975" y="233" text-anchor="middle" font-size="21" font-weight="700">RAM 0x9000</text>
<text x="975" y="270" text-anchor="middle" font-size="17">같은 물리 메모리</text>
<text x="40" y="414" font-size="20" font-weight="700">주소를 서로 이해하는 것이 아니라, IOMMU가 같은 매핑을 적용한다.</text>
<text x="40" y="450" font-size="17" fill="#475569">점선은 그룹과 도메인의 관리 관계다. 그룹은 DMA를 중계하는 하드웨어가 아니다.</text>
</g></svg>
