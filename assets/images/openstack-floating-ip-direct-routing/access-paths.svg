<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc"><title id="title">Floating IP와 내부 IP 직접 라우팅</title><desc id="desc">왼쪽은 SSH 점프 호스트와 Floating IP를 통한 검증된 접속, 오른쪽은 내부 IP 직접 라우팅의 설정 예정 경로다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="1120" height="1040" fill="#f5f7fb"/>
<text x="38" y="48" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="30" font-weight="750" fill="#172b4d" text-anchor="start">VM에 도달하는 두 가지 접속 경로</text>
