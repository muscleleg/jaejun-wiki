<text x="616" y="786" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">추가 SNAT 없을 때 출발지: 192.168.50.13</text>
