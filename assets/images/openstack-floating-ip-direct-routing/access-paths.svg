<text x="38" y="1010" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#53657b" text-anchor="start">public(172.24.4.0/24)은 외부 연결용 사설망이며, 공인 인터넷을 뜻하지 않는다.</text>
