<text x="58" y="525" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172b4d" text-anchor="start">Linux 네트워크 네임스페이스: qrouter-…</text>
<rect x="58" y="545" width="610" height="80" rx="14" fill="#fff" stroke="#dbe3ed"/>
<text x="78" y="579" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">qg: 172.24.4.167</text>
<text x="78" y="609" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">OVS internal 포트 · 외부망 쪽 인터페이스</text>
