<text x="58" y="399" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">OVS: br-ex → patch 포트 → br-int</text>
<text x="58" y="429" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">public 네트워크의 스위칭 영역</text>
