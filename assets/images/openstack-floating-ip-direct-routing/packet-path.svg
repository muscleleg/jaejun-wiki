<rect x="38" y="838" width="650" height="90" rx="14" fill="#eaf2ff" stroke="#dbe3ed"/>
<text x="58" y="872" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">OVS: br-int</text>
<text x="58" y="902" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">private 네트워크의 스위칭 영역 → VM의 qvo 포트</text>
<path d="M363 932 L363 957" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="965" width="650" height="90" rx="14" fill="#f0f2f7" stroke="#dbe3ed"/>
<text x="58" y="999" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">qvo ↔ qvb → Linux 브리지 qbr</text>
<text x="58" y="1029" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">현재의 hybrid 구성에서 보안 그룹 필터 적용</text>
<path d="M363 1059 L363 1084" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="1092" width="650" height="90" rx="14" fill="#f0f2f7" stroke="#dbe3ed"/>
<text x="58" y="1126" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">TAP → VM의 가상 NIC</text>
<text x="58" y="1156" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">QEMU 또는 vhost-net 경로로 게스트와 연결</text>
<path d="M363 1186 L363 1211" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="1219" width="650" height="90" rx="14" fill="#eaf8f2" stroke="#dbe3ed"/>
<text x="58" y="1253" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">cp-02: 10.0.0.12</text>
<text x="58" y="1283" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">보안 그룹이 허용하면 SSH 서버까지 전달</text>
<rect x="714" y="112" width="368" height="1197" rx="14" fill="#fff" stroke="#dbe3ed"/>
<text x="738" y="150" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start">책임 경계</text>
<text x="738" y="199" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">Neutron — 설정 관리</text>
<text x="738" y="231" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">네트워크·포트·라우터를 관리한다.</text>
<text x="738" y="259" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">API 프로그램이 패킷을 직접</text>
<text x="738" y="287" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">받아 전달하는 구조는 아니다.</text>
<text x="738" y="341" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">OVS — 스위칭</text>
<text x="738" y="373" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">MAC·네트워크 구분 정보·</text>
<text x="738" y="401" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">전달 규칙으로 포트를 선택한다.</text>
<text x="738" y="482" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">Linux — 라우팅</text>
<text x="738" y="514" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">qrouter 안의 라우팅 테이블로</text>
<text x="738" y="542" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">다른 네트워크로 전달한다.</text>
<text x="738" y="570" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">Floating IP 사용 시 NAT도 수행.</text>
<text x="738" y="654" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">qg / qr — 접점</text>
<text x="738" y="686" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">가상 인터페이스는 네임스페이스</text>
<text x="738" y="714" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">안에 배치되어 OVS와 연결된다.</text>
<text x="738" y="742" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">모든 연결이 veth 쌍인 것은 아니다.</text>
<text x="738" y="827" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">같은 br-int를 두 번 표시</text>
<text x="738" y="859" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">외부망과 내부망의 전달 단계를</text>
<text x="738" y="887" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">설명하기 위해 나눠 그렸다.</text>
<text x="738" y="915" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">OVS 두 개를 새로 만든 뜻이 아니다.</text>
<text x="738" y="1000" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">보안 그룹 — 통과 여부</text>
<text x="738" y="1032" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">경로가 있어도 허용 규칙이 필요.</text>
<text x="738" y="1060" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">직접 접속은 맥의 출발지 IP를</text>
<text x="738" y="1088" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">기준으로 TCP 22를 허용한다.</text>
<text x="738" y="1170" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#172b4d" text-anchor="start">검증 범위</text>
<text x="738" y="1202" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">이 그림은 연결 구조와 예정 경로다.</text>
<text x="738" y="1230" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">직접 SSH 성공은 아직 미확인.</text>
<text x="38" y="1360" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">응답: VM → qr → qg → 호스트 → 맥</text>
<text x="38" y="1397" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#53657b" text-anchor="start">반환 경로·연결 추적·필터 규칙까지 맞아야 왕복 통신이 성립한다.</text>
<text x="38" y="1430" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="400" fill="#53657b" text-anchor="start">현재 관찰된 OVS + L3 에이전트 + hybrid 보안 그룹 구성 기준</text>
</svg>