<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">호스트에서 VM까지의 실제 패킷 경로</title><desc id="desc">veth로 OVS에 들어간 패킷이 qg와 Linux 라우팅을 거쳐 qr로 나와 같은 br-int의 private 영역에서 VM으로 전달되는 구조다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="1120" height="1460" fill="#f5f7fb"/>
<text x="38" y="48" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="29" font-weight="750" fill="#172b4d" text-anchor="start">호스트 → OVS → Linux 라우터 → OVS → VM</text>
<text x="38" y="81" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#53657b" text-anchor="start">내부 IP 직접 접속의 전달 방향 · 목적지 10.0.0.12 유지</text>
