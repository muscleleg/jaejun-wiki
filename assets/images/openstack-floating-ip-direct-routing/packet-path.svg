<text x="58" y="176" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">공유기의 다음 홉: 192.168.50.217</text>
<path d="M363 205 L363 230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="238" width="650" height="90" rx="14" fill="#f0f2f7" stroke="#dbe3ed"/>
<text x="58" y="272" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">호스트 네트워크: veth-host ↔ veth-ex</text>
<text x="58" y="302" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">다음 홉 172.24.4.167 · veth-host IP 172.24.4.1</text>
