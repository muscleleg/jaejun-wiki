<rect x="58" y="678" width="610" height="80" rx="14" fill="#fff" stroke="#dbe3ed"/>
<text x="78" y="712" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#172b4d" text-anchor="start">qr: 10.0.0.1</text>
<text x="78" y="742" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#44566c" text-anchor="start">OVS internal 포트 · 내부망 쪽 인터페이스</text>
<text x="58" y="783" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#875a17" text-anchor="start">경로: 10.0.0.0/24 → qr 인터페이스</text>
