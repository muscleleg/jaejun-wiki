<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">두 NUMA 영역에 각각 연결된 CPU, DRAM, PCIe와 GPU</title>
  <desc id="desc">NUMA 영역 0에는 CPU A와 DRAM A, PCIe와 GPU 0이 있다. NUMA 영역 1에는 CPU B와 DRAM B, PCIe와 GPU 1이 있다. 각 CPU는 자기 DRAM 및 PCIe와 연결되고, PCIe는 GPU와 연결된다. 두 CPU 쪽 하드웨어는 NUMA 영역 간 연결로 이어진다.</desc>
  <rect width="1000" height="510" rx="22" fill="#f8fafc"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" text-anchor="middle">
    <rect x="30" y="30" width="410" height="435" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="560" y="30" width="410" height="435" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="235" y="76" font-size="25" font-weight="700" fill="#1e40af">NUMA 영역 0</text>
    <text x="765" y="76" font-size="25" font-weight="700" fill="#5b21b6">NUMA 영역 1</text>

    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M215 155 H275" stroke="#64748b"/>
      <path d="M745 155 H805" stroke="#64748b"/>
      <path d="M150 188 V252 M150 300 V350" stroke="#2563eb"/>
      <path d="M680 188 V252 M680 300 V350" stroke="#7c3aed"/>
      <path d="M215 172 H240 V210 H590 V172 H615" stroke="#0f766e"/>
    </g>
    <rect x="85" y="122" width="130" height="66" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="275" y="122" width="130" height="66" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="615" y="122" width="130" height="66" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="805" y="122" width="130" height="66" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="150" y="162" font-size="23" font-weight="600" fill="#0f172a">CPU A</text>
    <text x="340" y="162" font-size="23" font-weight="600" fill="#0f172a">DRAM A</text>
    <text x="680" y="162" font-size="23" font-weight="600" fill="#0f172a">CPU B</text>
    <text x="870" y="162" font-size="23" font-weight="600" fill="#0f172a">DRAM B</text>

    <rect x="395" y="230" width="210" height="43" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="500" y="258" font-size="18" font-weight="600" fill="#115e59">NUMA 영역 간 연결</text>
    <path d="M500 210 V230" fill="none" stroke="#0f766e" stroke-width="2"/>

    <rect x="85" y="252" width="130" height="48" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="615" y="252" width="130" height="48" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="150" y="283" font-size="22" fill="#1e40af">PCIe</text>
    <text x="680" y="283" font-size="22" fill="#5b21b6">PCIe</text>

    <rect x="65" y="350" width="170" height="77" rx="13" fill="#2563eb"/>
    <rect x="595" y="350" width="170" height="77" rx="13" fill="#7c3aed"/>
    <text x="150" y="381" font-size="24" font-weight="700" fill="#ffffff">GPU 0</text>
    <text x="150" y="407" font-size="16" fill="#dbeafe">자체 VRAM</text>
    <text x="680" y="381" font-size="24" font-weight="700" fill="#ffffff">GPU 1</text>
    <text x="680" y="407" font-size="16" fill="#ede9fe">자체 VRAM</text>
    <text x="500" y="493" font-size="16" fill="#475569">CPU 칩 두 개가 각자 DRAM과 GPU를 연결한 설명용 구성</text>
  </g>
</svg>
