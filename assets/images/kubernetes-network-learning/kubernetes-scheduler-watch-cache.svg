<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-scheduler-watch-cache.svg -->
<title id="title">API 변경을 구독해 배치에 사용하는 Scheduler</title><desc id="desc">kubelet의 보고가 API에 반영되면 Scheduler가 List와 Watch를 통해 정보를 받아 캐시를 갱신한다. 캐시의 Node 정보와 기존 Pod 요청, 새 Pod 명세를 함께 사용해 Node를 선택한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.node{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.api{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.state{fill:#ecfdf5;stroke:#34b494;stroke-width:1.5}text{font-family:system-ui,-apple-system,sans-serif;fill:#172a40}.title{font-size:25px;font-weight:600}.name{font-size:19px;font-weight:600;text-anchor:middle}.sub{font-size:16px;fill:#475569;text-anchor:middle}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect class="bg" width="1000" height="520" rx="16"/>
<text class="title" x="30" y="43">Scheduler는 API의 변화를 받아 배치 판단에 사용한다</text>
<rect class="node" x="35" y="90" width="230" height="90" rx="12"/>
<text class="name" x="150" y="125">kubelet</text><text class="sub" x="150" y="155">Node 상태 보고</text>
<rect class="api" x="385" y="90" width="230" height="90" rx="12"/>
<text class="name" x="500" y="125">API Server</text><text class="sub" x="500" y="155">Node・Pod Object</text>
<rect class="node" x="735" y="90" width="230" height="90" rx="12"/>
<text class="name" x="850" y="125">새 Pod 명세</text><text class="sub" x="850" y="155">자원 요청·배치 조건</text>
<path class="edge" d="M265 135H385"/><text class="sub" x="325" y="121">상태 반영</text>
<path class="edge" d="M735 135H615"/><text class="sub" x="675" y="121">API에 제출</text>
<rect class="panel" x="35" y="270" width="930" height="180" rx="16"/>
<text class="note" x="55" y="298">kube-scheduler 내부</text>
<rect class="api" x="65" y="325" width="230" height="90" rx="12"/>
<text class="name" x="180" y="360">변경 수신 · Informer</text><text class="sub" x="180" y="389">Node·Pod 변경 반영</text>
<rect class="state" x="385" y="325" width="230" height="90" rx="12"/>
<text class="name" x="500" y="360">내부 정보 · 캐시</text><text class="sub" x="500" y="389">Node 자원·기존 Pod 요청</text>
<rect class="state" x="705" y="325" width="230" height="90" rx="12"/>
<text class="name" x="820" y="360">배치 판단</text><text class="sub" x="820" y="389">조건 필터링 → 점수 → 선택</text>
<path class="edge" d="M460 180V225H180V325"/><text class="sub" x="270" y="211">처음 조회 + 변경 구독 (List / Watch)</text>
<path class="edge" d="M550 180V225H820V325"/><text class="sub" x="765" y="211">배치할 새 Pod 정보</text>
<path class="edge" d="M295 370H385"/><text class="sub" x="340" y="356">갱신</text>
<path class="edge" d="M615 370H705"/><text class="sub" x="660" y="356">참조</text>
<text class="note" x="35" y="485">변경은 비동기로 전달된다. 배치할 때마다 Scheduler가 각 Node에 직접 접속해 조사하지 않는다.</text></svg>
