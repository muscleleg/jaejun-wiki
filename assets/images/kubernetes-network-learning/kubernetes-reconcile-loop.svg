<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-reconcile-loop.svg -->
  <title id="title">ReplicaSet의 개수 조정과 독립적인 Pod 배치·실행</title>
  <desc id="desc">ReplicaSet Controller가 원하는 수 3과 관리 대상의 활성 Pod 1개를 비교해 부족한 2개의 생성을 요청한다. API에 생성된 Pod는 다시 관찰된다. 별도로 Scheduler와 kubelet이 새 Pod의 배치와 실행을 처리한다. Running 1개와 Pending 2개도 개수 계산에서는 3개이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .background{fill:#fff}.desired{fill:#eef2ff;stroke:#6366f1}.actual{fill:#eff6ff;stroke:#3b82f6}.compare{fill:#ecfdf5;stroke:#10b981}.action{fill:#fff7ed;stroke:#f97316}.execution{fill:#fdf4ff;stroke:#c026d3}.box{stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.repeat{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.arrow-head{fill:#64748b}.title{font:600 25px system-ui,-apple-system,sans-serif;fill:#0f172a}.heading{font:600 18px system-ui,-apple-system,sans-serif;fill:#0f172a;text-anchor:middle}.body{font:400 14px system-ui,-apple-system,sans-serif;fill:#475569;text-anchor:middle}.edge-label{font:500 13px system-ui,-apple-system,sans-serif;fill:#475569;text-anchor:middle}
    .box{stroke-width:1.5}.desired{stroke:#818cf8}.actual,.execution{fill:#eff6ff;stroke:#60a5fa}.compare{stroke:#34b494}.action{stroke:#fb923c}.edge,.repeat{stroke-width:2}.title,.heading{fill:#172a40}
  </style>

  <rect class="background" width="1000" height="600" rx="18"/>
  <text class="title" x="34" y="44">ReplicaSet은 Pod 개수를 맞추고, 배치·실행은 별도로 진행된다</text>
  <rect class="box desired" x="35" y="90" width="250" height="85" rx="14"/>
  <text class="heading" x="160" y="121">원하는 수</text>
  <text class="body" x="160" y="150">ReplicaSet spec.replicas: 3</text>
  <rect class="box actual" x="35" y="255" width="250" height="110" rx="14"/>
  <text class="heading" x="160" y="288">관찰한 Pod Object</text>
  <text class="body" x="160" y="317">관리 대상 활성 Pod: 1개</text>
  <text class="body" x="160" y="343">생성 후 관찰되면: 3개</text>
  <rect class="box compare" x="365" y="165" width="265" height="135" rx="14"/>
  <text class="heading" x="497" y="200">ReplicaSet Controller</text>
  <text class="body" x="497" y="231">부족분 계산: 3 − 1 = 2</text>
  <text class="body" x="497" y="260">부족한 Pod 2개 생성 요청</text>
  <rect class="box action" x="720" y="165" width="245" height="135" rx="14"/>
  <text class="heading" x="842" y="200">API에 Pod 생성</text>
  <text class="body" x="842" y="231">성공 시 기존 1개 + 새 2개</text>
  <text class="body" x="842" y="260">아직 Pending이어도 존재함</text>
  <path class="edge" d="M285 132H325V195H365"/>
  <path class="edge" d="M285 310H325V270H365"/>
  <path class="edge" d="M630 232H720"/>
  <text class="edge-label" x="675" y="218">생성 요청</text>
  <path class="repeat" d="M755 300V395H160V365"/>
  <text class="edge-label" x="440" y="384">Pod Object 변화를 다시 관찰 → 개수 재비교</text>
  <rect class="box execution" x="365" y="465" width="600" height="95" rx="14"/>
  <text class="heading" x="665" y="497">독립적인 배치·실행 과정</text>
  <text class="body" x="665" y="528">Scheduler: Node 선택 → kubelet·Runtime: 실행 조정</text>
  <path class="edge" d="M900 300V465"/>
  <text class="edge-label" x="840" y="437">새 Pod에 반응</text>
  <text class="body" x="192" y="493">Running 1 + Pending 2 = 3</text>
  <text class="body" x="192" y="521">Ready 완료를 기다려야만</text>
  <text class="body" x="192" y="544">개수에 포함되는 것은 아님</text>

</svg>
