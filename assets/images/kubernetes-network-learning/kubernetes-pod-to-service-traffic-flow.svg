<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-to-service-traffic-flow.svg -->
  <title id="title">Pod에서 Service 이름으로 보낸 요청이 실제 Pod에 도착하는 흐름</title>
  <desc id="desc">먼저 Pod A가 CoreDNS에 Service 이름을 조회해 ClusterIP를 받고, 이후 ClusterIP로 보낸 패킷은 kube-proxy가 미리 구성한 커널 규칙에 의해 실제 Pod IP로 변경된 뒤 CNI 기반 Pod Network를 따라 Pod B로 전달된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .pod { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .dns { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .svc { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .net { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; }
      .note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172a45; }
      .lane-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .name { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172a45; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="650" rx="16"/>
  <text class="title" x="34" y="45">Service 이름으로 시작한 요청은 두 단계를 거쳐 실제 Pod에 도착한다</text>

  <rect class="lane" x="34" y="78" width="1032" height="190" rx="16"/>
  <text class="lane-title" x="56" y="110">1. 이름 조회: 요청을 보내기 전에 Service의 주소를 알아낸다</text>

  <rect class="pod" x="75" y="140" width="245" height="92" rx="14"/>
  <text class="name" x="197" y="176" text-anchor="middle">Pod A · Application</text>
  <text class="body" x="197" y="205" text-anchor="middle">model-api의 IP는?</text>

  <rect class="dns" x="425" y="140" width="250" height="92" rx="14"/>
  <text class="name" x="550" y="176" text-anchor="middle">CoreDNS</text>
  <text class="body" x="550" y="205" text-anchor="middle">Service DNS Record 조회</text>

  <rect class="svc" x="780" y="140" width="245" height="92" rx="14"/>
  <text class="name" x="902" y="176" text-anchor="middle">Service ClusterIP</text>
  <text class="body" x="902" y="205" text-anchor="middle">10.96.10.20</text>

  <path class="arrow" d="M320 168 H425"/>
  <text class="small" x="372" y="153" text-anchor="middle">DNS 질문</text>
  <path class="arrow" d="M425 211 H320"/>
  <text class="small" x="372" y="235" text-anchor="middle">IP 응답</text>
  <path class="dash" d="M675 186 H780"/>
  <text class="small" x="727" y="171" text-anchor="middle">이름이 가리킴</text>

  <rect class="lane" x="34" y="290" width="1032" height="278" rx="16"/>
  <text class="lane-title" x="56" y="322">2. 패킷 전달: Service IP를 실제 Pod IP로 바꾸고 그곳까지 이동한다</text>

  <rect class="pod" x="60" y="365" width="205" height="92" rx="14"/>
  <text class="name" x="162" y="401" text-anchor="middle">Pod A</text>
  <text class="body" x="162" y="430" text-anchor="middle">목적지 10.96.10.20</text>

  <rect class="svc" x="330" y="365" width="270" height="92" rx="14"/>
  <text class="name" x="465" y="396" text-anchor="middle">Node의 Service 규칙</text>
  <text class="body" x="465" y="425" text-anchor="middle">목적지를 10.244.2.7로 변경</text>

  <rect class="net" x="665" y="365" width="190" height="92" rx="14"/>
  <text class="name" x="760" y="401" text-anchor="middle">Pod Network</text>
  <text class="body" x="760" y="430" text-anchor="middle">CNI가 준비한 경로</text>

  <rect class="pod" x="920" y="365" width="110" height="92" rx="14"/>
  <text class="name" x="975" y="401" text-anchor="middle">Pod B</text>
  <text class="body" x="975" y="430" text-anchor="middle">10.244.2.7</text>

  <path class="arrow" d="M265 411 H330"/>
  <path class="arrow" d="M600 411 H665"/>
  <path class="arrow" d="M855 411 H920"/>

  <rect class="note" x="330" y="485" width="270" height="55" rx="12"/>
  <text class="body" x="465" y="508" text-anchor="middle">kube-proxy 또는 대체 구현이</text>
  <text class="body" x="465" y="530" text-anchor="middle">이 규칙을 미리 구성한다</text>
  <path class="dash" d="M465 485 V457"/>

  <text class="small" x="55" y="608">핵심: kube-proxy Process가 매 패킷을 직접 중계하는 것이 아니라, 미리 구성된 규칙이 실제 Endpoint를 선택한다.</text>
</svg>
