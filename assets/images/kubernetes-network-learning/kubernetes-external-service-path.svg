<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
  <title id="title">외부 클라이언트에서 Service를 통해 Pod에 도착하는 경로</title>
  <desc id="desc">외부 클라이언트가 NodePort 또는 LoadBalancer 주소로 요청한다. Node에 준비된 Service 전달 상태가 Endpoint Pod를 선택하며, Pod가 같은 Node 또는 다른 Node에 있을 수 있다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#5F7089"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203047; }
    .title { font-size: 26px; font-weight: 700; }
    .node-title { font-size: 17px; font-weight: 650; text-anchor: middle; }
    .node-detail { font-size: 14px; fill: #50627D; text-anchor: middle; }
    .note { font-size: 14px; fill: #5F7089; }
    .node { fill: #EFF6FF; stroke: #8CB8F5; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #5F7089; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="245" rx="18" fill="#FFFFFF"/>
  <text x="36" y="45" class="title">Service를 통한 전달</text>
  <rect x="36" y="78" width="166" height="94" rx="13" class="node"/>
  <text x="119" y="132" class="node-title">외부 클라이언트</text>
  <path d="M205 125 H245" class="arrow"/>
  <rect x="254" y="78" width="190" height="94" rx="13" class="node"/>
  <text x="349" y="115" class="node-title">Service 진입점</text>
  <text x="349" y="146" class="node-detail">NodePort / LoadBalancer</text>
  <path d="M447 125 H487" class="arrow"/>
  <rect x="496" y="78" width="215" height="94" rx="13" class="node"/>
  <text x="603.5" y="115" class="node-title">Node의 전달 상태</text>
  <text x="603.5" y="146" class="node-detail">Service → Endpoint 선택</text>
  <path d="M714 125 H754" class="arrow"/>
  <rect x="763" y="78" width="200" height="94" rx="13" class="node"/>
  <text x="863" y="115" class="node-title">Endpoint Pod</text>
  <text x="863" y="146" class="node-detail">같은 / 다른 Node</text>
  <text x="36" y="214" class="note">화살표는 요청 방향을 나타낸다. 응답은 역방향으로 돌아온다.</text>
</svg>
