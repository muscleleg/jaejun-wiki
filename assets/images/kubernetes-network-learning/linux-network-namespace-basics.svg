<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-network-namespace-basics.svg -->
  <title id="title">하나의 Linux Kernel과 여러 Network Namespace의 관계</title>
  <desc id="desc">하나의 Linux Kernel 위에 Host, Application A, Application B를 위한 Network Namespace가 나뉘어 있으며 각 Namespace가 서로 다른 Interface, IP, Routing Table과 Port 공간을 갖는 구조다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52647a; }
      .area-title { font-size: 17px; font-weight: 700; }
      .name { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647a; }
      .machine { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .host { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.5; }
      .ns-a { fill: #f5f8ff; stroke: #60a5fa; stroke-width: 1.5; }
      .ns-b { fill: #ecfdf5; stroke: #34b899; stroke-width: 1.5; }
      .item { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .kernel { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1240" height="570" rx="16" fill="#ffffff"/>
  <text class="title" x="30" y="43">Network Namespace는 하나의 Kernel 안에 여러 Network 관점을 만든다</text>
  <text class="subtitle" x="30" y="72">각 Namespace는 Interface·IP·Route·Port 공간을 따로 보지만 Packet 처리는 같은 Linux Kernel이 수행한다</text>

  <rect class="machine" x="28" y="98" width="1184" height="430" rx="18"/>
  <text class="area-title" x="50" y="130">하나의 Linux Machine</text>

  <rect class="host" x="50" y="155" width="345" height="270" rx="15"/>
  <text class="area-title" x="70" y="187">Host Network Namespace</text>
  <rect class="item" x="70" y="215" width="140" height="72" rx="10"/>
  <text class="name" x="140" y="242" text-anchor="middle">Host Process</text>
  <text class="body" x="140" y="267" text-anchor="middle">Server :8080</text>
  <rect class="item" x="235" y="215" width="140" height="72" rx="10"/>
  <text class="name" x="305" y="242" text-anchor="middle">Interface</text>
  <text class="body" x="305" y="267" text-anchor="middle">eth0 · Node IP</text>
  <rect class="item" x="70" y="310" width="305" height="82" rx="10"/>
  <text class="name" x="222" y="339" text-anchor="middle">Host의 Network 상태</text>
  <text class="body" x="222" y="365" text-anchor="middle">Routing Table · Port 공간 · Packet 규칙</text>

  <rect class="ns-a" x="425" y="155" width="365" height="270" rx="15"/>
  <text class="area-title" x="445" y="187">Application A의 Network Namespace</text>
  <rect class="item" x="445" y="215" width="145" height="72" rx="10"/>
  <text class="name" x="517" y="242" text-anchor="middle">Process A</text>
  <text class="body" x="517" y="267" text-anchor="middle">Server :8080</text>
  <rect class="item" x="615" y="215" width="155" height="72" rx="10"/>
  <text class="name" x="692" y="242" text-anchor="middle">Interface</text>
  <text class="body" x="692" y="267" text-anchor="middle">eth0 · 10.0.1.2</text>
  <rect class="item" x="445" y="310" width="325" height="82" rx="10"/>
  <text class="name" x="607" y="339" text-anchor="middle">Namespace A의 Network 상태</text>
  <text class="body" x="607" y="365" text-anchor="middle">Routing Table · Port 공간 · Packet 규칙</text>

  <rect class="ns-b" x="820" y="155" width="365" height="270" rx="15"/>
  <text class="area-title" x="840" y="187">Application B의 Network Namespace</text>
  <rect class="item" x="840" y="215" width="145" height="72" rx="10"/>
  <text class="name" x="912" y="242" text-anchor="middle">Process B</text>
  <text class="body" x="912" y="267" text-anchor="middle">Server :8080</text>
  <rect class="item" x="1010" y="215" width="155" height="72" rx="10"/>
  <text class="name" x="1087" y="242" text-anchor="middle">Interface</text>
  <text class="body" x="1087" y="267" text-anchor="middle">eth0 · 10.0.2.2</text>
  <rect class="item" x="840" y="310" width="325" height="82" rx="10"/>
  <text class="name" x="1002" y="339" text-anchor="middle">Namespace B의 Network 상태</text>
  <text class="body" x="1002" y="365" text-anchor="middle">Routing Table · Port 공간 · Packet 규칙</text>

  <rect class="kernel" x="205" y="455" width="830" height="50" rx="12"/>
  <text class="area-title" x="620" y="486" text-anchor="middle">공유하는 하나의 Linux Kernel · Process 실행과 Packet 처리 담당</text>

  <text class="body" x="620" y="550" text-anchor="middle">Namespace는 서로를 격리할 뿐 자동으로 연결하지 않는다. 통신 경로는 veth pair·Bridge·Route 같은 별도 구성이 만든다.</text>
</svg>
