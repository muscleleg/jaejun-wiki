<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-route-and-eth0.svg -->
  <title id="title">Routing Table이 eth0과 다음 경유지를 선택하는 과정</title>
  <desc id="desc">Application이 Service ClusterIP를 목적지로 지정하면 Linux Kernel이 Pod Network Namespace의 Routing Table을 조회해 Default Route를 선택하고, Pod 쪽 veth 끝점의 이름인 eth0에서 송신하여 Peer인 Host 쪽 veth 끝점에서 수신되는 과정이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52647a; }
      .area-title { font-size: 17px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647a; }
      .area { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .app { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .table { fill: #ecfdf5; stroke: #34b899; stroke-width: 1.5; }
      .decision { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .iface { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1280" height="500" rx="16" fill="#ffffff"/>
  <text class="title" x="28" y="42">Route는 eth0을 선택하고, eth0은 Packet을 실제로 송신한다</text>
  <text class="subtitle" x="28" y="70">설명용 Pod Route에서 Service ClusterIP 10.96.10.20을 조회하는 예시</text>

  <rect class="area" x="28" y="96" width="1224" height="350" rx="18"/>
  <text class="area-title" x="48" y="128">Pod Network Namespace</text>

  <rect class="app" x="55" y="175" width="175" height="105" rx="12"/>
  <text class="name" x="142" y="207" text-anchor="middle">Application</text>
  <text class="body" x="142" y="235" text-anchor="middle">목적지 IP 지정</text>
  <text class="body" x="142" y="260" text-anchor="middle">10.96.10.20:8000</text>

  <rect class="table" x="300" y="150" width="330" height="155" rx="12"/>
  <text class="name" x="465" y="180" text-anchor="middle">Routing Table 조회</text>
  <text class="body" x="325" y="213">10.244.1.0/24  dev eth0</text>
  <text class="body" x="325" y="241">default  via 10.244.1.1  dev eth0</text>
  <path class="dashed" d="M320 254H610"/>
  <text class="body" x="465" y="282" text-anchor="middle">10.96.10.20은 Default Route와 일치</text>

  <rect class="decision" x="700" y="165" width="230" height="130" rx="12"/>
  <text class="name" x="815" y="196" text-anchor="middle">Kernel의 선택 결과</text>
  <text class="body" x="815" y="226" text-anchor="middle">최종 목적지 10.96.10.20</text>
  <text class="body" x="815" y="252" text-anchor="middle">다음 경유지 10.244.1.1</text>
  <text class="body" x="815" y="278" text-anchor="middle">출력 Interface eth0</text>

  <rect class="iface" x="1000" y="175" width="105" height="105" rx="12"/>
  <text class="name" x="1052" y="211" text-anchor="middle">eth0</text>
  <text class="body" x="1052" y="239" text-anchor="middle">Packet TX</text>
  <text class="body" x="1052" y="263" text-anchor="middle">Pod 쪽 veth</text>

  <rect class="iface" x="1155" y="175" width="70" height="105" rx="12"/>
  <text class="name" x="1190" y="211" text-anchor="middle">Host</text>
  <text class="body" x="1190" y="239" text-anchor="middle">RX</text>
  <text class="body" x="1190" y="263" text-anchor="middle">veth</text>

  <path class="arrow" d="M230 227H298"/>
  <path class="arrow" d="M630 227H698"/>
  <path class="arrow" d="M930 227H998"/>
  <path class="arrow" d="M1105 227H1153"/>

  <text class="body" x="264" y="210" text-anchor="middle">목적지 전달</text>
  <text class="body" x="664" y="210" text-anchor="middle">규칙 선택</text>
  <text class="body" x="964" y="210" text-anchor="middle">송신</text>
  <text class="body" x="1129" y="210" text-anchor="middle">Peer 전달</text>

  <rect x="290" y="345" width="700" height="62" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="name" x="640" y="371" text-anchor="middle">Route는 별도 장치가 아니라 Kernel의 조회와 결정이다</text>
  <text class="body" x="640" y="394" text-anchor="middle">결정된 다음 경유지와 출력 Interface를 사용해 eth0이 Packet을 내보낸다.</text>

  <text class="body" x="640" y="475" text-anchor="middle">Gateway를 선택해도 IP Packet의 최종 목적지는 유지되며, NAT가 적용될 때 목적지 IP가 실제로 바뀔 수 있다.</text>
</svg>
