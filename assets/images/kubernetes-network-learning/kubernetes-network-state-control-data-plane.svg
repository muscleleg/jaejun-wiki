<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-network-state-control-data-plane.svg -->
<title id="title">2. 같은 변경을 각 Node가 관찰하고, 두 종류의 로컬 상태를 맞춘다</title><desc id="desc">kube-proxy는 Service 연결 규칙을, CNI 기반 Network 구현은 실제 Pod IP까지의 경로를 유지한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:13px;fill:#52647d}</style></defs>
<rect width="1200" height="910" rx="18" fill="white"/><text x="30" y="42" class="title">2. 같은 변경을 각 Node가 관찰하고, 두 종류의 로컬 상태를 맞춘다</text><text x="30" y="73" class="body">kube-proxy는 Service 연결 규칙을, CNI 기반 Network 구현은 실제 Pod IP까지의 경로를 유지한다.</text><rect x="30" y="110" width="1140" height="150" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="48" y="139" class="head">API Server · 함께 공유하는 객체 상태</text><text x="48" y="167" class="body">Service·EndpointSlice: 10.96.10.20:8000 → 후보에 10.244.2.7:8000 추가</text><text x="48" y="192" class="body">Node·Network 정보: Node B 192.168.1.11 · Pod 대역 10.244.2.0/24</text><text x="48" y="217" class="body">각 구성요소가 필요한 객체를 각각 Watch한다.</text><path d="M290 260V343" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M900 260V343" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="30" y="345" width="540" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="52" y="380" class="head">Node A · 192.168.1.10</text><rect x="52" y="410" width="240" height="115" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="70" y="439" class="head">kube-proxy</text><text x="70" y="467" class="body">Service·EndpointSlice 관찰</text><text x="70" y="492" class="body">Endpoint 후보 변경 반영</text><rect x="310" y="410" width="238" height="115" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="328" y="439" class="head">Network Agent 등</text><text x="328" y="467" class="body">Node·Network 상태 관찰</text><text x="328" y="492" class="body">구현별 경로 유지</text><path d="M172 525V570" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M429 525V570" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="52" y="572" width="240" height="157" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="70" y="601" class="head">Host의 Service 규칙</text><text x="70" y="629" class="body">10.96.10.20:8000</text><text x="70" y="654" class="body">→ 후보 10.244.2.7:8000</text><text x="70" y="679" class="body">새 연결에 Endpoint 선택·DNAT</text><rect x="310" y="572" width="238" height="157" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="328" y="601" class="head">Host의 Pod 경로</text><text x="328" y="629" class="body">10.244.2.0/24 목적지</text><text x="328" y="654" class="body">→ Node B 방향 Route / Tunnel</text><text x="328" y="679" class="body">대역 경로는 이미 있을 수도 있음</text><rect x="630" y="345" width="540" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="652" y="380" class="head">Node B · 192.168.1.11</text><rect x="652" y="410" width="240" height="115" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="670" y="439" class="head">kube-proxy</text><text x="670" y="467" class="body">Service·EndpointSlice 관찰</text><text x="670" y="492" class="body">Endpoint 후보 변경 반영</text><rect x="910" y="410" width="238" height="115" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="928" y="439" class="head">Network Agent 등</text><text x="928" y="467" class="body">Node·Network 상태 관찰</text><text x="928" y="492" class="body">구현별 경로 유지</text><path d="M772 525V570" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M1029 525V570" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="652" y="572" width="240" height="157" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="670" y="601" class="head">Host의 Service 규칙</text><text x="670" y="629" class="body">10.96.10.20:8000</text><text x="670" y="654" class="body">→ 후보 10.244.2.7:8000</text><text x="670" y="679" class="body">새 연결에 Endpoint 선택·DNAT</text><rect x="910" y="572" width="238" height="157" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="928" y="601" class="head">Host의 Pod 경로</text><text x="928" y="629" class="body">10.244.2.7 목적지</text><text x="928" y="654" class="body">→ 새 Pod의 Host veth</text><text x="928" y="679" class="body">Node 안의 Pod 연결 준비</text><text x="35" y="817" class="head">두 Node가 각각 로컬 상태를 갱신한다. 주황색과 초록색 경로는 서로의 완료를 기다리는 순서가 아니다.</text><text x="35" y="853" class="body">초록색은 API 기반으로 경로 정보를 얻는 Network 구현의 예시다. BGP·Cloud 경로 등은 정보 교환 방식이 다르다.</text><text x="35" y="881" class="small">점선: 객체 변화 관찰  ·  실선: 로컬 설정 반영  ·  Traffic 정책과 Node 조건에 따라 최종 규칙은 다를 수 있다.</text></svg>
