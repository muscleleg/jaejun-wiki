<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="500" viewBox="0 0 1260 500" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-veth-pair-network-namespace-connection.svg -->
  <title id="title">veth pair가 Pod Network Namespace와 Host Network Namespace를 연결하는 흐름</title>
  <desc id="desc">Pod Network Namespace의 Application이 Route를 따라 Pod 쪽 veth 끝점의 이름인 eth0에서 Packet을 송신하면 Peer인 Host 쪽 veth 끝점에서 수신되고, 이후 Host의 Network 처리가 이어지는 구조다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52647a; }
      .area-title { font-size: 17px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647a; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .pod-area { fill: #f5f8ff; stroke: #60a5fa; stroke-width: 1.5; }
      .host-area { fill: #ecfdf5; stroke: #34b899; stroke-width: 1.5; }
      .process { fill: #ffffff; stroke: #93b7ef; stroke-width: 1.5; }
      .iface { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .next { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .cable { fill: none; stroke: #8b5cf6; stroke-width: 6; }
    </style>
  </defs>

  <rect width="1260" height="500" rx="16" fill="#ffffff"/>
  <text class="title" x="28" y="42">veth pair는 한쪽 Interface의 송신을 반대쪽 Interface의 수신으로 전달한다</text>
  <text class="subtitle" x="28" y="70">두 Interface는 같은 Node의 Linux Kernel 안에서 서로 다른 Network Namespace에 배치된다</text>

  <rect class="node" x="28" y="95" width="1204" height="350" rx="18"/>
  <text class="area-title" x="48" y="126">Node A · 하나의 Linux Kernel</text>

  <rect class="pod-area" x="48" y="150" width="455" height="250" rx="15"/>
  <text class="area-title" x="68" y="181">Pod Network Namespace</text>

  <rect class="process" x="70" y="225" width="135" height="92" rx="11"/>
  <text class="name" x="137" y="256" text-anchor="middle">Application</text>
  <text class="body" x="137" y="282" text-anchor="middle">Socket으로</text>
  <text class="body" x="137" y="304" text-anchor="middle">Packet 생성</text>

  <rect class="process" x="245" y="225" width="115" height="92" rx="11"/>
  <text class="name" x="302" y="256" text-anchor="middle">Route</text>
  <text class="body" x="302" y="282" text-anchor="middle">eth0 선택</text>

  <rect class="iface" x="400" y="213" width="82" height="116" rx="11"/>
  <text class="name" x="441" y="250" text-anchor="middle">eth0</text>
  <text class="body" x="441" y="278" text-anchor="middle">Pod 쪽 veth</text>
  <text class="body" x="441" y="305" text-anchor="middle">TX 송신</text>

  <path class="arrow" d="M205 271H243"/>
  <path class="arrow" d="M360 271H398"/>

  <rect class="host-area" x="665" y="150" width="545" height="250" rx="15"/>
  <text class="area-title" x="685" y="181">Host Network Namespace</text>

  <rect class="iface" x="690" y="213" width="115" height="116" rx="11"/>
  <text class="name" x="747" y="250" text-anchor="middle">vethXXXX</text>
  <text class="body" x="747" y="278" text-anchor="middle">Host 쪽 veth</text>
  <text class="body" x="747" y="305" text-anchor="middle">RX 수신</text>

  <rect class="next" x="870" y="213" width="310" height="116" rx="11"/>
  <text class="name" x="1025" y="247" text-anchor="middle">Host의 다음 Network 처리</text>
  <text class="body" x="1025" y="276" text-anchor="middle">Bridge 또는 Route · Packet 규칙</text>
  <text class="body" x="1025" y="303" text-anchor="middle">다른 Pod·Node·외부 Network 방향 결정</text>

  <path class="cable" d="M482 271H690"/>
  <text class="name" x="586" y="244" text-anchor="middle">두 끝점이 하나의 veth pair</text>
  <text class="body" x="586" y="302" text-anchor="middle">한쪽 TX → 반대쪽 RX</text>
  <path class="arrow" d="M805 271H868"/>

  <text class="body" x="275" y="374" text-anchor="middle">IP와 Route는 Pod 쪽에 별도로 설정한다</text>
  <text class="body" x="937" y="374" text-anchor="middle">veth 뒤의 전달 방식은 Network 구현이 결정한다</text>

  <text class="body" x="630" y="473" text-anchor="middle">veth pair의 책임은 두 Namespace 사이에서 Packet을 건네는 데까지다. 목적지까지의 전체 경로는 추가 설정이 완성한다.</text>
</svg>
