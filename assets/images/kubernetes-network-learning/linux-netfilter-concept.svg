<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-netfilter-concept.svg -->
  <title id="title">Netfilter와 iptables nftables Linux Network Stack의 관계</title>
  <desc id="desc">사용자 공간에서는 관리자나 kube-proxy가 iptables 또는 nft 명령으로 규칙을 구성하고 Kernel 공간에서는 실제 Packet이 Linux Network Stack을 이동하며 Netfilter Hook에서 규칙을 적용받는다</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24364b; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647d; }
      .small { font-size: 13px; fill: #52647d; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#ffffff"/>
  <text x="30" y="43" class="title">Netfilter는 Kernel의 Packet 처리 경로에 규칙 적용 지점을 제공한다</text>
  <text x="30" y="72" class="body">규칙을 준비하는 흐름과 실제 Packet이 처리되는 흐름은 서로 다른 시간에 일어난다</text>

  <rect x="28" y="105" width="1144" height="174" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="52" y="139" class="heading">사용자 공간 · 규칙을 준비한다</text>

  <rect x="58" y="163" width="245" height="82" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="180" y="194" class="heading center">관리자 · kube-proxy</text>
  <text x="180" y="222" class="body center">원하는 처리 규칙 결정</text>

  <line x1="303" y1="204" x2="423" y2="204" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="363" y="189" class="small center">규칙 구성</text>

  <rect x="426" y="163" width="300" height="82" rx="13" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="576" y="194" class="heading center">iptables · nft</text>
  <text x="576" y="222" class="body center">Kernel 규칙을 설정하는 인터페이스</text>

  <line x1="726" y1="204" x2="846" y2="204" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="786" y="189" class="small center">Kernel에 저장</text>

  <rect x="849" y="163" width="282" height="82" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="990" y="194" class="heading center">Rule · Chain</text>
  <text x="990" y="222" class="body center">Packet 조건과 수행할 작업</text>

  <line x1="990" y1="245" x2="990" y2="320" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <text x="1015" y="292" class="small">Hook에 연결</text>

  <rect x="28" y="318" width="1144" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="352" class="heading">Kernel 공간 · 실제 Packet을 처리한다</text>

  <rect x="58" y="392" width="210" height="91" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="163" y="425" class="heading center">Packet 수신</text>
  <text x="163" y="454" class="body center">Interface에서 Kernel로 진입</text>

  <line x1="268" y1="438" x2="384" y2="438" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="387" y="380" width="332" height="116" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="553" y="413" class="heading center">Netfilter Hook</text>
  <text x="553" y="442" class="body center">준비된 규칙을 Kernel이 평가</text>
  <text x="553" y="470" class="body center">허용 · 차단 · 주소 변환 · 기록</text>

  <line x1="719" y1="438" x2="835" y2="438" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="838" y="392" width="293" height="91" rx="13" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="984" y="425" class="heading center">Network Stack 계속 처리</text>
  <text x="984" y="454" class="body center">Route · Local 전달 · Forward</text>

  <rect x="218" y="522" width="764" height="42" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="548" class="small center">iptables·nft 명령이 Packet을 중계하지 않는다. 실제 Packet에는 Linux Kernel이 준비된 규칙을 적용한다.</text>

  <text x="600" y="623" class="body center">Netfilter = Kernel 체계 · Hook = 적용 위치 · Rule = 조건과 작업 · iptables/nft = 규칙 구성 수단</text>
</svg>
