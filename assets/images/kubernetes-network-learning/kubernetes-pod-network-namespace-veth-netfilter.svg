<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="600" viewBox="0 0 1380 600" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-network-namespace-veth-netfilter.svg -->
  <title id="title">Pod의 Network Namespace에서 Node의 Service DNAT 규칙까지 이어지는 패킷 흐름</title>
  <desc id="desc">Node A 안에서 Pod A의 Application이 만든 패킷이 Routing Table 조회 후 Pod 쪽 veth 끝점인 eth0에서 송신되고, Peer인 Host 쪽 veth 끝점에서 수신되어 PREROUTING과 Service DNAT 규칙으로 이어지는 흐름이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 25px; font-weight: 700; }
      .scope { font-size: 14px; fill: #52647a; }
      .area-title { font-size: 17px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .pod-area { fill: #f5f8ff; stroke: #93b7ef; stroke-width: 1.5; }
      .host-area { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .process { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .route { fill: #ecfdf5; stroke: #34b899; stroke-width: 1.5; }
      .iface { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .hook { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .dnat { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .cable { fill: none; stroke: #8b5cf6; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1380" height="600" rx="16" fill="#ffffff"/>
  <text class="title" x="30" y="43">Pod와 Node는 하나의 Linux Kernel을 사용하고, Network Namespace로 관점을 나눈다</text>
  <text class="scope" x="30" y="72">Linux · veth pair를 사용하는 일반 Pod · kube-proxy iptables 방식의 새 연결 예시</text>

  <rect class="node" x="28" y="98" width="1324" height="425" rx="18"/>
  <text class="area-title" x="50" y="130">Node A · 하나의 Linux Kernel</text>

  <rect class="pod-area" x="50" y="151" width="475" height="325" rx="16"/>
  <text class="area-title" x="70" y="182">Pod A의 Network Namespace</text>
  <text class="body" x="70" y="207">Pod에 보이는 Interface · IP · Routing Table</text>

  <rect class="process" x="75" y="245" width="135" height="108" rx="12"/>
  <text class="name" x="142" y="276" text-anchor="middle">Application</text>
  <text class="body" x="142" y="303" text-anchor="middle">connect()</text>
  <text class="body" x="142" y="329" text-anchor="middle">10.96.10.20:8000</text>

  <rect class="route" x="250" y="245" width="130" height="108" rx="12"/>
  <text class="name" x="315" y="276" text-anchor="middle">Route 판단</text>
  <text class="body" x="315" y="305" text-anchor="middle">더 구체적인 경로 없음</text>
  <text class="body" x="315" y="329" text-anchor="middle">Default Route</text>

  <rect class="iface" x="420" y="245" width="80" height="108" rx="12"/>
  <text class="name" x="460" y="287" text-anchor="middle">eth0</text>
  <text class="body" x="460" y="315" text-anchor="middle">Pod 쪽 veth</text>

  <path class="arrow" d="M210 299H248"/>
  <path class="arrow" d="M380 299H418"/>

  <rect class="host-area" x="620" y="151" width="705" height="325" rx="16"/>
  <text class="area-title" x="640" y="182">Host Network Namespace</text>
  <text class="body" x="640" y="207">Node에 보이는 Interface · Routing Table · Netfilter 규칙</text>

  <rect class="iface" x="645" y="245" width="105" height="108" rx="12"/>
  <text class="name" x="697" y="282" text-anchor="middle">vethXXXX</text>
  <text class="body" x="697" y="312" text-anchor="middle">Host 쪽 veth</text>

  <rect class="hook" x="790" y="245" width="150" height="108" rx="12"/>
  <text class="name" x="865" y="276" text-anchor="middle">PREROUTING</text>
  <text class="body" x="865" y="305" text-anchor="middle">Routing 전</text>
  <text class="body" x="865" y="329" text-anchor="middle">Netfilter Hook</text>

  <rect class="dnat" x="980" y="232" width="180" height="134" rx="12"/>
  <text class="name" x="1070" y="262" text-anchor="middle">Service 규칙 · DNAT</text>
  <text class="body" x="1070" y="291" text-anchor="middle">Endpoint Pod B 선택</text>
  <text class="body" x="1070" y="319" text-anchor="middle">10.96.10.20:8000</text>
  <text class="body" x="1070" y="343" text-anchor="middle">→ 10.244.2.7:8000</text>

  <rect class="route" x="1200" y="245" width="100" height="108" rx="12"/>
  <text class="name" x="1250" y="276" text-anchor="middle">Route</text>
  <text class="body" x="1250" y="305" text-anchor="middle">Pod B IP</text>
  <text class="body" x="1250" y="329" text-anchor="middle">기준 판단</text>

  <path class="cable" d="M500 299H645"/>
  <text class="body" x="572" y="279" text-anchor="middle">두 끝점이 하나의 veth pair</text>
  <path class="arrow" d="M750 299H788"/>
  <path class="arrow" d="M940 299H978"/>
  <path class="arrow" d="M1160 299H1198"/>

  <text class="body" x="70" y="404">eth0의 TX는 Host 쪽 Peer의 RX로 이어진다.</text>
  <text class="body" x="70" y="432">Pod Namespace에도 자체 Netfilter 규칙을 둘 수 있다.</text>
  <text class="body" x="640" y="414">Host에 들어온 Packet은 Routing 전에 Service 규칙을 만나 목적지가 바뀐다.</text>

  <rect x="225" y="490" width="930" height="72" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="name" x="690" y="519" text-anchor="middle">경계가 바뀌어도 Packet을 처리하는 Linux Kernel은 하나다</text>
  <text class="body" x="690" y="546" text-anchor="middle">분리되는 것은 Interface와 Route 등을 바라보는 Network Namespace이며, 별도의 Pod Kernel이 생기는 것이 아니다.</text>
</svg>
