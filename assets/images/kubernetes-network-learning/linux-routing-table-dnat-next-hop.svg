<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-routing-table-dnat-next-hop.svg -->
<title id="title">DNAT 이후 출발 Node의 경로 선택과 목적지 Pod까지의 전달</title>
<desc id="desc">직접 라우팅 예시. Node A의 Host veth에서 수신한 패킷은 DNAT로 목적지가 Pod IP가 된다. Kernel은 Routing Table을 조회하여 다음 Hop Node B와 출력 Interface ens5를 선택한다. Node B에서 로컬 경로와 veth pair를 거쳐 대상 Pod에 도착한다. 실선은 패킷 이동, 점선은 경로 정보 조회다.</desc>
<defs>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2873b9"/></marker>
<marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a7a25"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#24364b}
.label{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#536b84}
.flow{fill:none;stroke:#2873b9;stroke-width:3;marker-end:url(#p)}
</style>
</defs>
<rect width="1500" height="940" fill="#fff"/>
<text x="40" y="51" font-size="29" font-weight="700">Pod IP로 바뀐 패킷은 어떤 Interface로 나갈까?</text>
<text x="40" y="86" class="body">출발 Node에서 경로를 고르고, 다음 Hop인 Node B를 거쳐 대상 Pod에 도착한다.</text>
<path d="M1030 76H1070" class="flow"/><text x="1083" y="82" class="small">패킷 이동</text>
<path d="M1230 76H1270" stroke="#9a7a25" stroke-width="2" stroke-dasharray="6 5"/><text x="1283" y="82" class="small">경로 정보 조회</text>
<rect x="40" y="135" width="1000" height="707" rx="24" fill="#f7faff" stroke="#c5d5e7" stroke-width="2"/>
<text x="70" y="179" font-size="24" font-weight="700">출발 Node A</text>
<text x="70" y="210" class="body">Host Network Namespace · 패킷 처리와 Route 조회 모두 이 안에서 일어난다</text>
<rect x="70" y="270" width="160" height="110" rx="15" fill="#f3efff" stroke="#b7a3e3" stroke-width="2"/>
<text x="150" y="312" class="label" text-anchor="middle">Host 쪽 veth</text>
<text x="150" y="345" class="body" text-anchor="middle">출발 Pod에서 RX</text>
<path d="M230 325H275" class="flow"/>
<rect x="285" y="265" width="250" height="120" rx="15" fill="#fff4e8" stroke="#ecb77f" stroke-width="2"/>
<text x="410" y="297" class="label" text-anchor="middle">① Service DNAT</text>
<text x="410" y="326" class="body" text-anchor="middle">10.96.10.20 → 10.244.2.7</text>
<text x="410" y="357" class="small" text-anchor="middle">Netfilter의 Service 규칙 적용</text>
<path d="M535 325H590" class="flow"/>
<rect x="600" y="265" width="235" height="120" rx="15" fill="#fffbe9" stroke="#d8c478" stroke-width="2"/>
<text x="717" y="297" class="label" text-anchor="middle">② Kernel의 경로 선택</text>
<text x="717" y="328" class="body" text-anchor="middle">목적지 10.244.2.7 조회</text>
<text x="717" y="357" class="small" text-anchor="middle">다음 Hop + 출력 Interface</text>
<path d="M835 325H890" class="flow"/>
<rect x="900" y="270" width="105" height="110" rx="15" fill="#edf5ff" stroke="#85b1e2" stroke-width="2"/>
<text x="952" y="307" class="label" text-anchor="middle">③ ens5</text>
<text x="952" y="335" class="body" text-anchor="middle">출력 NIC</text>
<text x="952" y="362" class="small" text-anchor="middle">TX</text>
<path d="M717 385V475" fill="none" stroke="#9a7a25" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#q)"/>
<text x="737" y="431" class="small">목적지에 맞는 규칙 조회</text>
<rect x="80" y="487" width="925" height="305" rx="18" fill="#fff" stroke="#d8c478" stroke-width="2"/>
<text x="105" y="526" font-size="21" font-weight="700">Node A의 Routing Table</text>
<text x="105" y="555" class="small">이 예시에서는 같은 테이블 안에서 가장 구체적으로 일치하는 /24 Route를 선택한다.</text>
<text x="110" y="596" class="small">목적지 대역</text>
<text x="420" y="596" class="small">다음 Hop · via</text>
<text x="740" y="596" class="small">출력 Interface · dev</text>
<path d="M105 610H975" stroke="#e3eaf2"/>
<text x="110" y="641" class="body">default · /0</text>
<text x="420" y="641" class="body">192.168.1.1</text>
<text x="740" y="641" class="body">ens5</text>
<rect x="95" y="657" width="895" height="58" rx="10" fill="#eaf4ff" stroke="#85b1e2"/>
<text x="110" y="693" class="label">10.244.2.0/24 ✓</text>
<text x="420" y="693" class="label">192.168.1.11 · Node B</text>
<text x="740" y="693" class="label">ens5</text>
<text x="105" y="757" class="body">조회 결과: 10.244.2.7로 가려면 ens5를 통해 Node B에 전달한다.</text>
<rect x="1130" y="135" width="330" height="707" rx="24" fill="#f4fbf8" stroke="#b4d9c8" stroke-width="2"/>
<text x="1155" y="179" font-size="24" font-weight="700">목적지 Node B</text>
<text x="1155" y="210" class="body">다음 Hop · 192.168.1.11</text>
<path d="M1005 325H1160" class="flow"/>
<text x="1080" y="290" class="small" text-anchor="middle">Node 간</text>
<text x="1080" y="311" class="small" text-anchor="middle">Network</text>
<rect x="1170" y="270" width="250" height="110" rx="15" fill="#edf5ff" stroke="#85b1e2" stroke-width="2"/>
<text x="1295" y="311" class="label" text-anchor="middle">Node B의 NIC · RX</text>
<text x="1295" y="346" class="body" text-anchor="middle">목적지 IP는 10.244.2.7</text>
<path d="M1295 380V418" class="flow"/>
<rect x="1170" y="428" width="250" height="78" rx="15" fill="#fffbe9" stroke="#d8c478" stroke-width="2"/>
<text x="1295" y="461" class="label" text-anchor="middle">Node B의 경로 선택</text>
<text x="1295" y="488" class="small" text-anchor="middle">대상 Pod로 가는 로컬 Route</text>
<path d="M1295 506V544" class="flow"/>
<rect x="1170" y="554" width="250" height="64" rx="15" fill="#f3efff" stroke="#b7a3e3" stroke-width="2"/>
<text x="1295" y="594" class="label" text-anchor="middle">Host 쪽 veth · TX</text>
<rect x="1155" y="674" width="280" height="143" rx="18" fill="#eaf4ff" stroke="#85b1e2" stroke-width="2"/>
<text x="1174" y="704" class="label">대상 Pod · 별도 Network NS</text>
<path d="M1295 618V664" class="flow"/>
<text x="1310" y="650" class="small">veth pair</text>
<text x="1295" y="752" class="label" text-anchor="middle">Pod 쪽 veth (eth0) · RX</text>
<text x="1295" y="788" class="body" text-anchor="middle">Pod IP 10.244.2.7 → Application</text>
<text x="40" y="883" font-size="19" font-weight="700">DNAT 이후 IP 패킷의 목적지는 계속 10.244.2.7이다. 다음 Hop은 그 목적지까지 가는 중간 전달 지점이다.</text>
<text x="40" y="916" class="small">veth + iptables, Node B를 직접 다음 Hop으로 사용하는 라우팅 예시 · Tunnel·Bridge·eBPF 구성에서는 세부 경로가 달라질 수 있다.</text>
</svg>
