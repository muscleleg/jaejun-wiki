<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-purpose-to-components.svg -->
  <title id="title">운영 문제에서 Kubernetes 컴포넌트가 도출되는 흐름</title>
  <desc id="desc">여러 서버의 컨테이너를 직접 운영할 때 생기는 배치, 복구, 확장, 네트워크 문제를 원하는 상태 유지라는 목표와 선언적 상태, API 중심 공유, 제어 루프, 책임 분리 원리로 해결하고 이에 따라 Control Plane, Worker Node와 Add-on 컴포넌트가 나뉘는 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .background{fill:#fff}.problem{fill:#fff7ed;stroke:#f97316}.goal{fill:#eef2ff;stroke:#6366f1}.principle{fill:#ecfdf5;stroke:#10b981}.control{fill:#eef2ff;stroke:#6366f1}.node{fill:#eff6ff;stroke:#3b82f6}.addon{fill:#ecfdf5;stroke:#10b981}.box{stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.arrow-head{fill:#64748b}.title{font:600 25px system-ui,-apple-system,sans-serif;fill:#0f172a}.heading{font:600 18px system-ui,-apple-system,sans-serif;fill:#0f172a;text-anchor:middle}.body{font:400 14px system-ui,-apple-system,sans-serif;fill:#475569;text-anchor:middle}.small{font:400 13px system-ui,-apple-system,sans-serif;fill:#475569;text-anchor:middle}.arrow-label{font:500 13px system-ui,-apple-system,sans-serif;fill:#475569;text-anchor:middle}
    .box{stroke-width:1.5}.problem{stroke:#fb923c}.goal,.control{stroke:#818cf8}.principle,.addon{stroke:#34b494}.node{stroke:#60a5fa}.edge{stroke-width:2}.title,.heading{fill:#172a40}
  </style>

  <rect class="background" width="1100" height="600" rx="18"/>
  <text class="title" x="34" y="44">문제에서 목표와 원리를 거쳐 컴포넌트로</text>

  <rect class="box problem" x="35" y="90" width="285" height="245" rx="16"/>
  <text class="heading" x="177" y="126">직접 운영에서 생기는 문제</text>
  <text class="body" x="177" y="165">어느 서버에 배치할까?</text>
  <text class="body" x="177" y="198">실패하면 누가 복구할까?</text>
  <text class="body" x="177" y="231">부하에 따라 어떻게 확장할까?</text>
  <text class="body" x="177" y="264">바뀌는 IP에 어떻게 접근할까?</text>
  <text class="body" x="177" y="297">자원을 어떻게 나눌까?</text>

  <rect class="box goal" x="405" y="125" width="260" height="175" rx="16"/>
  <text class="heading" x="535" y="165">Kubernetes의 목표</text>
  <text class="body" x="535" y="205">사용자가 선언한</text>
  <text class="body" x="535" y="231">Application의 원하는 상태를</text>
  <text class="body" x="535" y="257">Cluster가 지속적으로 유지한다</text>

  <rect class="box principle" x="750" y="90" width="315" height="245" rx="16"/>
  <text class="heading" x="907" y="126">목표를 달성하는 원리</text>
  <text class="body" x="907" y="165">선언적 API Object</text>
  <text class="body" x="907" y="198">API Server 중심의 상태 공유</text>
  <text class="body" x="907" y="231">원하는 상태와 실제 상태 비교</text>
  <text class="body" x="907" y="264">반복적인 Reconcile</text>
  <text class="body" x="907" y="297">컴포넌트별 책임 분리</text>

  <path class="edge" d="M320 212H395"/>
  <text class="arrow-label" x="357" y="198">자동화</text>
  <path class="edge" d="M665 212H740"/>
  <text class="arrow-label" x="702" y="198">구현 원리</text>

  <path class="edge" d="M907 335V386"/>
  <text class="arrow-label" x="964" y="366">책임으로 분해</text>

  <rect class="box control" x="35" y="410" width="325" height="145" rx="16"/>
  <text class="heading" x="197" y="445">Control Plane</text>
  <text class="small" x="197" y="478">kube-apiserver · etcd</text>
  <text class="small" x="197" y="505">kube-scheduler</text>
  <text class="small" x="197" y="532">kube-controller-manager</text>

  <rect class="box node" x="387" y="410" width="325" height="145" rx="16"/>
  <text class="heading" x="549" y="445">Worker Node</text>
  <text class="small" x="549" y="478">kubelet · Container Runtime</text>
  <text class="small" x="549" y="505">kube-proxy</text>
  <text class="small" x="549" y="532">Application Pod</text>

  <rect class="box addon" x="739" y="410" width="326" height="145" rx="16"/>
  <text class="heading" x="902" y="445">Add-on과 확장</text>
  <text class="small" x="902" y="478">CNI · CoreDNS · CSI</text>
  <text class="small" x="902" y="505">Device Plugin</text>
  <text class="small" x="902" y="532">Network · DNS · Storage · GPU</text>
</svg>
