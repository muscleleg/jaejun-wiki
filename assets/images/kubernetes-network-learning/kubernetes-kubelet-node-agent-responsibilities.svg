<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-kubelet-node-agent-responsibilities.svg -->
<title id="title">kubelet이 Node에서 담당하는 조율과 상태 보고</title>
<desc id="desc">API Server의 Pod 선언과 배정 정보를 kubelet이 관찰한다. kubelet은 CRI를 통해 Container Runtime을, Volume 관리 기능을 통해 CSI와 Storage를 조율하고 Probe를 실행하며 Node 자원을 관리한다. Runtime은 CNI를 통해 Pod Network를 구성한다. kubelet은 관찰한 Pod와 Node 상태를 API Server에 다시 보고한다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#65768d"/></marker>
  <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2f855a"/></marker>
</defs>
<rect width="1200" height="1010" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <text x="48" y="52" font-size="30" font-weight="700" fill="#1e293b">kubelet은 Node의 Pod 실행을 조율한다</text>
  <text x="48" y="88" font-size="19" fill="#60738c">원하는 상태를 읽고 · 구현체에 요청하고 · 실제 상태를 관찰해 보고한다</text>

  <rect x="280" y="120" width="640" height="126" rx="20" fill="#f5f3ff" stroke="#ac98e8" stroke-width="2"/>
  <text x="600" y="160" font-size="23" font-weight="700" text-anchor="middle" fill="#26384f">API Server</text>
  <text x="600" y="198" font-size="20" text-anchor="middle" fill="#334a65">Pod 명세 · Node 배정 · 원하는 상태</text>
  <text x="600" y="228" font-size="18" text-anchor="middle" fill="#66788f">Pod와 Node의 관찰 상태를 다시 받는 공통 경계</text>

  <path d="M520 246 V300" fill="none" stroke="#65768d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="280" font-size="17" text-anchor="end" fill="#60738c">관찰</text>
  <path d="M680 300 V246" fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="701" y="280" font-size="17" fill="#2f855a">상태 보고</text>

  <rect x="300" y="310" width="600" height="192" rx="22" fill="#eef5ff" stroke="#83ade8" stroke-width="2.5"/>
  <text x="600" y="356" font-size="29" font-weight="700" text-anchor="middle" fill="#20354d">kubelet</text>
  <text x="600" y="397" font-size="21" text-anchor="middle" fill="#334a65">자기 Node의 Pod 명세와 실제 상태 비교</text>
  <text x="600" y="433" font-size="20" text-anchor="middle" fill="#334a65">필요한 작업 요청 · Probe 실행 · 재시작과 정리 조율</text>
  <text x="600" y="472" font-size="18" text-anchor="middle" fill="#60738c">모든 기능을 직접 구현하지 않고 표준 Interface 뒤의 구현체를 사용한다.</text>

  <path d="M400 502 V565" fill="none" stroke="#65768d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 502 V565" fill="none" stroke="#65768d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 502 V565" fill="none" stroke="#65768d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="575" width="330" height="180" rx="19" fill="#fff7ed" stroke="#f0aa61" stroke-width="2"/>
  <text x="220" y="616" font-size="22" font-weight="700" text-anchor="middle" fill="#273a51">Container Runtime</text>
  <text x="220" y="653" font-size="19" text-anchor="middle" fill="#334a65">CRI 요청</text>
  <text x="220" y="687" font-size="18" text-anchor="middle" fill="#536981">Sandbox · Container</text>
  <text x="220" y="720" font-size="18" text-anchor="middle" fill="#536981">Image · 실행 · 중지 · 상태</text>

  <rect x="435" y="575" width="330" height="180" rx="19" fill="#ecfdf5" stroke="#62c59b" stroke-width="2"/>
  <text x="600" y="616" font-size="22" font-weight="700" text-anchor="middle" fill="#273a51">Volume · CSI</text>
  <text x="600" y="653" font-size="19" text-anchor="middle" fill="#334a65">Volume 준비 조율</text>
  <text x="600" y="687" font-size="18" text-anchor="middle" fill="#536981">연결 · Stage · Mount</text>
  <text x="600" y="720" font-size="18" text-anchor="middle" fill="#536981">Pod가 사용할 경로 준비</text>

  <rect x="815" y="575" width="330" height="180" rx="19" fill="#fefce8" stroke="#d9bd54" stroke-width="2"/>
  <text x="980" y="616" font-size="22" font-weight="700" text-anchor="middle" fill="#273a51">Probe · Node 자원</text>
  <text x="980" y="653" font-size="19" text-anchor="middle" fill="#334a65">kubelet이 관찰·관리</text>
  <text x="980" y="687" font-size="18" text-anchor="middle" fill="#536981">Startup · Liveness · Readiness</text>
  <text x="980" y="720" font-size="18" text-anchor="middle" fill="#536981">Capacity · Condition · 확장 자원</text>

  <path d="M220 755 V815" fill="none" stroke="#65768d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="55" y="825" width="330" height="104" rx="18" fill="#f0fdf4" stroke="#64bd82" stroke-width="2"/>
  <text x="220" y="865" font-size="21" font-weight="700" text-anchor="middle" fill="#273a51">Runtime이 CNI 호출</text>
  <text x="220" y="900" font-size="18" text-anchor="middle" fill="#536981">Pod Network Interface · IP · Route</text>

  <rect x="435" y="805" width="710" height="124" rx="18" fill="#f8fafc" stroke="#bdcada" stroke-width="2"/>
  <text x="790" y="847" font-size="22" font-weight="700" text-anchor="middle" fill="#273a51">kubelet이 종합하는 실제 상태</text>
  <text x="790" y="884" font-size="19" text-anchor="middle" fill="#334a65">Pod IP · Container 상태 · Ready · 재시작 횟수 · Node Ready</text>
  <text x="790" y="915" font-size="17" text-anchor="middle" fill="#60738c">이 정보를 Kubernetes 상태로 바꿔 API Server에 보고한다.</text>

  <text x="600" y="976" font-size="21" font-weight="700" text-anchor="middle" fill="#334155">책임진다 ≠ 모두 직접 구현한다</text>
</g>
</svg>
