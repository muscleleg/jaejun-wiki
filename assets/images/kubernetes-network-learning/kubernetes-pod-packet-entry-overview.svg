<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="350" viewBox="0 0 1260 350" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-packet-entry-overview.svg -->
  <title id="title">Pod Application에서 Host Network의 Service DNAT까지 이어지는 개요</title>
  <desc id="desc">Pod A의 Application이 만든 ClusterIP 목적지 패킷이 Route 판단 후 Pod 쪽 veth 끝점인 eth0에서 송신되고, Peer인 Host 쪽 veth 끝점에서 수신되어 PREROUTING과 Service DNAT 규칙으로 이어지는 흐름이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 24px; font-weight: 700; }
      .area { font-size: 16px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647a; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .pod-area { fill: #f5f8ff; stroke: #93b7ef; stroke-width: 1.5; }
      .host-area { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.5; }
      .pod { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .link { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .hook { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .dnat { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1260" height="350" rx="16" fill="#ffffff"/>
  <text class="title" x="28" y="42">패킷은 같은 Node 안에서 Network Namespace의 경계를 건넌다</text>

  <rect class="node" x="28" y="70" width="1204" height="235" rx="18"/>
  <text class="area" x="48" y="100">Node A · 하나의 Linux Kernel</text>

  <rect class="pod-area" x="48" y="120" width="465" height="155" rx="14"/>
  <text class="area" x="66" y="146">Pod A의 Network Namespace</text>

  <rect class="pod" x="66" y="168" width="135" height="78" rx="11"/>
  <text class="name" x="133" y="196" text-anchor="middle">Application</text>
  <text class="body" x="133" y="222" text-anchor="middle">ClusterIP로 연결</text>

  <rect class="pod" x="245" y="168" width="120" height="78" rx="11"/>
  <text class="name" x="305" y="196" text-anchor="middle">Route 판단</text>
  <text class="body" x="305" y="222" text-anchor="middle">기본 경로 선택</text>

  <rect class="link" x="409" y="168" width="84" height="78" rx="11"/>
  <text class="name" x="451" y="196" text-anchor="middle">eth0</text>
  <text class="body" x="451" y="222" text-anchor="middle">Pod 쪽 veth</text>

  <path class="arrow" d="M201 207H243"/>
  <path class="arrow" d="M365 207H407"/>

  <path d="M493 207H708" fill="none" stroke="#8b5cf6" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="name" x="601" y="190" text-anchor="middle">두 끝점이 하나의 veth pair</text>
  <text class="body" x="601" y="231" text-anchor="middle">eth0의 TX → Peer의 RX</text>

  <rect class="host-area" x="692" y="120" width="520" height="155" rx="14"/>
  <text class="area" x="710" y="146">Host Network Namespace</text>

  <rect class="link" x="710" y="168" width="110" height="78" rx="11"/>
  <text class="name" x="765" y="196" text-anchor="middle">Host veth</text>
  <text class="body" x="765" y="222" text-anchor="middle">Host 쪽 veth</text>

  <rect class="hook" x="858" y="168" width="135" height="78" rx="11"/>
  <text class="name" x="925" y="196" text-anchor="middle">PREROUTING</text>
  <text class="body" x="925" y="222" text-anchor="middle">Routing 전 Hook</text>

  <rect class="dnat" x="1031" y="157" width="163" height="100" rx="11"/>
  <text class="name" x="1112" y="184" text-anchor="middle">Service DNAT</text>
  <text class="body" x="1112" y="210" text-anchor="middle">ClusterIP</text>
  <text class="body" x="1112" y="233" text-anchor="middle">→ 실제 Pod IP</text>

  <path class="arrow" d="M820 207H856"/>
  <path class="arrow" d="M993 207H1029"/>

  <text class="body" x="630" y="329" text-anchor="middle">Pod 전용 Kernel이 생기는 것이 아니라, 하나의 Linux Kernel이 두 Namespace의 Network 설정을 사용해 패킷을 처리한다.</text>
</svg>
