<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1545" viewBox="0 0 1200 1545" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-creation-to-netfilter.svg -->
<title id="title">Pod 생성에서 각 Node의 Host Netfilter 규칙 갱신까지</title>
<desc id="desc">Node B의 kubelet이 Runtime에 Pod 실행을 요청하면 Runtime이 CNI Plugin을 호출하여 veth, IP, Route를 구성한다. kubelet이 Pod IP와 준비 상태를 API Server에 보고하고, EndpointSlice Controller가 이를 관찰하여 EndpointSlice를 갱신한다. Node A와 Node B의 kube-proxy는 Service와 EndpointSlice를 Watch하고 각자의 Host Network Namespace에 iptables Service 규칙을 적용한다. 이후 실제 패킷은 Kernel이 처리한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758d"/></marker></defs>
<rect width="1200" height="1545" fill="#fff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<text x="40" y="48" font-size="29" fill="#1e293b" font-weight="700" text-anchor="start">Pod 하나의 변화가 각 Node의 Service 규칙이 되기까지</text>
<text x="40" y="82" font-size="19" fill="#5c6f87" font-weight="400" text-anchor="start">veth + kube-proxy iptables 구성 · Service 10.96.10.20:8000에 새 Backend 추가</text>
<rect x="90" y="110" width="1020" height="128" rx="18" fill="#eff6ff" stroke="#93b7ec" stroke-width="2"/>
<text x="118" y="145" font-size="24" fill="#25354a" font-weight="700" text-anchor="start">① Pod가 Node B에 배정되면, kubelet이 실행을 요청한다</text>
<text x="118" y="181" font-size="21" fill="#25354a" font-weight="400" text-anchor="start">API Server의 Pod 배정 정보 → Node B의 kubelet → Container Runtime</text>
<text x="118" y="216" font-size="19" fill="#5c6f87" font-weight="400" text-anchor="start">Scheduler는 실행할 Node를 선택하고, kubelet은 그 Node에서 실행을 맡는다.</text>
<path d="M600 238 V275" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="90" y="285" width="1020" height="135" rx="18" fill="#ecfdf5" stroke="#70c6a2" stroke-width="2"/>
<text x="118" y="322" font-size="23" fill="#25354a" font-weight="700" text-anchor="start">② Runtime이 Network Namespace를 준비하고 CNI Plugin을 호출한다</text>
<text x="118" y="360" font-size="22" fill="#25354a" font-weight="400" text-anchor="start">Node B에 veth pair · Pod eth0 · Pod IP 10.244.2.7 · Route 구성</text>
<text x="118" y="395" font-size="19" fill="#5c6f87" font-weight="400" text-anchor="start">실제 Interface와 Route는 Node B에 생긴다. 아직 다른 Node의 Service 규칙은 아니다.</text>
<path d="M600 420 V457" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="90" y="467" width="1020" height="136" rx="18" fill="#eff6ff" stroke="#93b7ec" stroke-width="2"/>
<text x="118" y="504" font-size="22" fill="#25354a" font-weight="700" text-anchor="start">③ kubelet이 Runtime에서 확인한 Pod IP와 상태를 API Server에 보고한다</text>
<text x="118" y="542" font-size="22" fill="#25354a" font-weight="400" text-anchor="start">Pod Object: nodeName = node-b  /  podIP = 10.244.2.7</text>
<text x="118" y="578" font-size="19" fill="#5c6f87" font-weight="400" text-anchor="start">Application이 준비되면 Ready 상태도 보고한다. IP 설정과 Ready는 다른 시점일 수 있다.</text>
<path d="M600 603 V640" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="90" y="650" width="1020" height="137" rx="18" fill="#f5f3ff" stroke="#b9a1eb" stroke-width="2"/>
<text x="118" y="687" font-size="21" fill="#25354a" font-weight="700" text-anchor="start">④ EndpointSlice Controller가 Pod·Service를 관찰하고 EndpointSlice를 갱신한다</text>
<text x="118" y="725" font-size="22" fill="#25354a" font-weight="400" text-anchor="start">Service Selector와 Pod Label을 확인 → Backend 주소·준비 상태 반영</text>
<text x="118" y="762" font-size="19" fill="#5c6f87" font-weight="400" text-anchor="start">Controller가 API Server에서 읽고, 처리 결과를 다시 API Server에 기록한다.</text>
<path d="M600 787 V824" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="150" y="834" width="900" height="98" rx="18" fill="#f8fafc" stroke="#b4c3d5" stroke-width="2"/>
<text x="600" y="869" font-size="23" fill="#25354a" font-weight="700" text-anchor="middle">API Server를 통해 공유되는 Service · EndpointSlice</text>
<text x="600" y="905" font-size="21" fill="#25354a" font-weight="400" text-anchor="middle">Service 10.96.10.20:8000 → 새 후보 10.244.2.7:8000 (ready: true)</text>
<path d="M600 932 V960 H305 V1011" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<path d="M600 960 H895 V1011" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="600" y="991" font-size="18" fill="#5c6f87" font-weight="400" text-anchor="middle">객체 변경을 각 kube-proxy가 Watch로 수신</text>
<rect x="40" y="1020" width="530" height="408" rx="18" fill="#f8fafc" stroke="#c8d5e5" stroke-width="2"/><text x="62" y="1055" font-size="21" fill="#465e7c" font-weight="700" text-anchor="start">Node A · 각 Node가 자기 로컬 규칙을 관리</text><rect x="62" y="1075" width="486" height="103" rx="18" fill="#fff7ed" stroke="#f5b476" stroke-width="2"/><text x="84" y="1111" font-size="23" fill="#25354a" font-weight="700" text-anchor="start">⑤ kube-proxy</text><text x="84" y="1147" font-size="20" fill="#25354a" font-weight="400" text-anchor="start">새 Endpoint 반영 → iptables 규칙 구성</text><path d="M305 1178 V1227" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/><text x="322" y="1209" font-size="18" fill="#5c6f87" font-weight="400" text-anchor="start">Kernel에 적용</text><rect x="62" y="1237" width="486" height="166" rx="18" fill="#eef5ff" stroke="#93b7ec" stroke-width="2"/><text x="84" y="1273" font-size="21" fill="#25354a" font-weight="700" text-anchor="start">⑥ Host Network Namespace · Kernel</text><text x="84" y="1309" font-size="19" fill="#25354a" font-weight="400" text-anchor="start">Netfilter의 PREROUTING · OUTPUT 경로</text><text x="84" y="1343" font-size="20" fill="#25354a" font-weight="400" text-anchor="start">Service 규칙 → Endpoint 선택 · DNAT</text><text x="84" y="1377" font-size="20" fill="#245f97" font-weight="600" text-anchor="start">10.244.2.7:8000도 선택 후보로 사용</text><rect x="630" y="1020" width="530" height="408" rx="18" fill="#f8fafc" stroke="#c8d5e5" stroke-width="2"/><text x="652" y="1055" font-size="21" fill="#465e7c" font-weight="700" text-anchor="start">Node B · 각 Node가 자기 로컬 규칙을 관리</text><rect x="652" y="1075" width="486" height="103" rx="18" fill="#fff7ed" stroke="#f5b476" stroke-width="2"/><text x="674" y="1111" font-size="23" fill="#25354a" font-weight="700" text-anchor="start">⑤ kube-proxy</text><text x="674" y="1147" font-size="20" fill="#25354a" font-weight="400" text-anchor="start">새 Endpoint 반영 → iptables 규칙 구성</text><path d="M895 1178 V1227" fill="none" stroke="#63758d" stroke-width="2.8" marker-end="url(#arrow)"/><text x="912" y="1209" font-size="18" fill="#5c6f87" font-weight="400" text-anchor="start">Kernel에 적용</text><rect x="652" y="1237" width="486" height="166" rx="18" fill="#eef5ff" stroke="#93b7ec" stroke-width="2"/><text x="674" y="1273" font-size="21" fill="#25354a" font-weight="700" text-anchor="start">⑥ Host Network Namespace · Kernel</text><text x="674" y="1309" font-size="19" fill="#25354a" font-weight="400" text-anchor="start">Netfilter의 PREROUTING · OUTPUT 경로</text><text x="674" y="1343" font-size="20" fill="#25354a" font-weight="400" text-anchor="start">Service 규칙 → Endpoint 선택 · DNAT</text><text x="674" y="1377" font-size="20" fill="#245f97" font-weight="600" text-anchor="start">10.244.2.7:8000도 선택 후보로 사용</text><text x="600" y="1468" font-size="23" fill="#25354a" font-weight="700" text-anchor="middle">여기까지는 요청을 받을 준비 과정이다.</text><text x="600" y="1506" font-size="20" fill="#5c6f87" font-weight="400" text-anchor="middle">실제 요청이 오면 Kernel이 준비된 규칙을 적용한다. 매번 API Server에 물어보지 않는다.</text></g></svg>
