<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-service-request-across-nodes.svg -->
<title id="title">3. 실제 요청은 Node A의 Service 규칙과 Node B까지의 경로를 사용한다</title><desc id="desc">번호 순서대로 따라간다. Node A에서는 아래로, Node B에서는 위로 이동해 목적지 Pod에 도착한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:13px;fill:#52647d}</style></defs>
<rect width="1200" height="928" rx="18" fill="white"/><text x="30" y="42" class="title">3. 실제 요청은 Node A의 Service 규칙과 Node B까지의 경로를 사용한다</text><text x="30" y="73" class="body">번호 순서대로 따라간다. Node A에서는 아래로, Node B에서는 위로 이동해 목적지 Pod에 도착한다.</text><rect x="30" y="115" width="525" height="710" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="50" y="148" class="head">Node A · 192.168.1.10</text><rect x="645" y="115" width="525" height="710" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="665" y="148" class="head">Node B · 192.168.1.11</text><rect x="55" y="175" width="475" height="140" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><text x="73" y="204" class="head">출발 Pod Network Namespace</text><text x="73" y="232" class="body">① Application → Route 판단 → eth0에서 TX</text><text x="73" y="257" class="body">목적지: Service IP 10.96.10.20:8000</text><text x="73" y="282" class="body">eth0은 Pod 쪽 veth 끝점</text><rect x="670" y="175" width="475" height="140" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><text x="688" y="204" class="head">대상 Pod Network Namespace</text><text x="688" y="232" class="body">⑦ eth0에서 RX → Socket → Application</text><text x="688" y="257" class="body">목적지: Pod IP 10.244.2.7:8000</text><text x="688" y="282" class="body">eth0은 대상 Pod 쪽 veth 끝점</text><rect x="55" y="373" width="475" height="425" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="75" y="403" class="head" style="font-size:16px">Host Network Namespace</text><rect x="670" y="373" width="475" height="425" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="690" y="403" class="head" style="font-size:16px">Host Network Namespace</text><path d="M290 315V435" fill="none" stroke="#8b5cf6" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="309" y="348" class="small">veth Peer 전달</text><rect x="78" y="437" width="429" height="70" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="96" y="466" class="head">② 출발 Pod의 Host 쪽 veth에서 RX</text><path d="M290 507V536" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="78" y="538" width="429" height="108" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="96" y="567" class="head">③ PREROUTING · Service 규칙 적용</text><text x="96" y="595" class="body">10.96.10.20:8000 → 10.244.2.7:8000</text><text x="96" y="620" class="body">kube-proxy가 준비한 규칙으로 Endpoint 선택·DNAT</text><path d="M290 646V674" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="78" y="676" width="429" height="99" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="96" y="705" class="head">④ 변경된 Pod IP로 Route 판단</text><text x="96" y="733" class="body">10.244.2.0/24 → Node B 방향</text><text x="96" y="758" class="body">CNI Network가 준비한 Route / Tunnel</text><rect x="693" y="676" width="429" height="99" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/><text x="711" y="705" class="head">⑤ 목적지 Node에서 수신</text><text x="711" y="733" class="body">필요 시 Tunnel 해제 → Pod IP로 로컬 전달</text><text x="711" y="758" class="body">Pod IP는 여전히 10.244.2.7</text><path d="M507 726H691" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="565" y="680" class="small">Node 사이</text><text x="574" y="701" class="small">Network</text><path d="M908 676V510" fill="none" stroke="#64748b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="693" y="437" width="429" height="70" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="711" y="466" class="head">⑥ 대상 Pod의 Host 쪽 veth에서 TX</text><path d="M908 437V317" fill="none" stroke="#8b5cf6" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="926" y="348" class="small">veth Peer 전달</text><text x="701" y="570" class="body">실제 Pod IP로 도착</text><text x="701" y="597" class="body">Endpoint 재선택 없음</text><text x="35" y="869" class="head">API Server 조회 없이, 각 Node에 준비된 규칙과 경로가 요청을 전달한다.</text><text x="35" y="900" class="small">veth + kube-proxy iptables의 새 연결 예시. FORWARD·POSTROUTING·Neighbor 처리와 응답 경로는 생략했다.</text></svg>
