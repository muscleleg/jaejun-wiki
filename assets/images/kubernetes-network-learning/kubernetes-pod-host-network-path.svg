<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="790" viewBox="0 0 1380 790" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-host-network-path.svg -->
  <title id="title">Pod별 veth pair와 Host Network를 통한 Pod 간 전달</title>
  <desc id="desc">Node A의 Pod A는 자신의 veth pair로 Host Network에 연결되고, Host의 공통 Datapath에서 같은 Node의 Pod B 또는 다른 Node의 Pod C 방향으로 전달된다. Service를 사용할 때는 Host 경로에 Endpoint 선택과 DNAT가 추가된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52647d}.area-title{font-size:17px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:14px;fill:#52647d}.small{font-size:13px;fill:#52647d}.center{text-anchor:middle}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.pair{fill:none;stroke:#8b5cf6;stroke-width:5}
    </style>
  </defs>
  <rect width="1380" height="790" rx="18" fill="#ffffff"/>
  <text x="30" y="42" class="title">각 Pod는 서로가 아니라 Host Network와 자신의 veth pair로 연결된다</text>
  <text x="30" y="70" class="subtitle">일반적인 veth 기반 CNI 구성 · Service 사용 시 Host 경로에 Endpoint 선택과 DNAT가 추가된다</text>

  <rect x="28" y="96" width="1324" height="455" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="128" class="area-title">Node A · 하나의 Linux Kernel</text>

  <rect x="50" y="151" width="300" height="325" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="70" y="182" class="area-title">Pod A Network Namespace</text>
  <rect x="77" y="226" width="125" height="88" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="139" y="260" class="head center">Application</text>
  <text x="139" y="288" class="body center">Packet 생성</text>
  <rect x="235" y="214" width="90" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="280" y="251" class="head center">eth0</text>
  <text x="280" y="278" class="body center">Pod 쪽 veth</text>
  <text x="280" y="303" class="body center">TX</text>
  <path d="M202 270H233" class="arrow"/>
  <text x="200" y="382" class="body center">Pod A는 목적지마다 새 Link를 만들지 않는다</text>

  <rect x="405" y="151" width="570" height="325" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="427" y="182" class="area-title">Host Network Namespace · 공통 Datapath</text>
  <rect x="430" y="214" width="110" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="485" y="250" class="head center">host-veth-A</text>
  <text x="485" y="278" class="body center">Host 쪽 veth</text>
  <text x="485" y="303" class="body center">RX</text>
  <path d="M325 270H430" class="pair"/>
  <text x="377" y="247" class="small center">하나의 veth pair</text>

  <rect x="590" y="202" width="220" height="136" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="700" y="236" class="head center">공통 Network 처리</text>
  <text x="700" y="266" class="body center">Bridge · Route · eBPF</text>
  <text x="700" y="292" class="body center">Service이면 Endpoint 선택·DNAT</text>
  <text x="700" y="318" class="small center">CNI와 Service 구현에 따라 달라짐</text>
  <path d="M540 270H588" class="arrow"/>

  <rect x="860" y="214" width="90" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="905" y="250" class="head center">host-veth-B</text>
  <text x="905" y="278" class="body center">Host 쪽 veth</text>
  <text x="905" y="303" class="body center">TX</text>
  <path d="M810 270H858" class="arrow"/>
  <text x="690" y="393" class="body center">같은 Node면 대상 Pod의 Host 쪽 veth로 전달</text>
  <text x="690" y="423" class="body center">다른 Node면 물리 Network 또는 Tunnel 방향으로 전달</text>

  <rect x="1030" y="151" width="300" height="325" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1050" y="182" class="area-title">Pod B Network Namespace</text>
  <rect x="1055" y="214" width="90" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1100" y="251" class="head center">eth0</text>
  <text x="1100" y="278" class="body center">Pod 쪽 veth</text>
  <text x="1100" y="303" class="body center">RX</text>
  <rect x="1180" y="226" width="125" height="88" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1242" y="260" class="head center">Application</text>
  <text x="1242" y="288" class="body center">Packet 수신</text>
  <path d="M950 270H1055" class="pair"/>
  <text x="1002" y="247" class="small center">별도의 veth pair</text>
  <path d="M1145 270H1178" class="arrow"/>
  <text x="1180" y="382" class="body center">Pod B도 자신의 Host 연결 하나만 가진다</text>

  <path d="M700 338V520H515V640" class="arrow"/>
  <text x="718" y="507" class="small">다른 Node의 Pod</text>

  <rect x="400" y="584" width="580" height="160" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="422" y="616" class="area-title">다른 목적지 Node</text>
  <rect x="430" y="642" width="170" height="70" rx="11" fill="#ffffff" stroke="#86efac"/>
  <text x="515" y="671" class="head center">Node 사이 Network</text>
  <text x="515" y="696" class="body center">직접 Route 또는 Tunnel</text>
  <path d="M600 677H665" class="arrow"/>
  <rect x="667" y="642" width="125" height="70" rx="11" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="729" y="671" class="head center">Host veth</text>
  <text x="729" y="696" class="body center">TX</text>
  <path d="M792 677H837" class="pair"/>
  <rect x="840" y="642" width="110" height="70" rx="11" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="895" y="671" class="head center">Pod C eth0</text>
  <text x="895" y="696" class="body center">RX</text>

  <text x="690" y="774" class="small center">직접 Pod-to-Pod veth pair가 아니라, Pod별 Host 연결과 CNI가 준비한 공통 경로를 사용한다.</text>
</svg>
