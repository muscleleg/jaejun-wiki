<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-eth0-veth-peer-packet-transmission.svg -->
  <title id="title">Pod 쪽 veth 끝점 eth0의 송신 Packet이 Host 쪽 veth 끝점의 수신 경로로 전달되는 과정</title>
  <desc id="desc">Service ClusterIP를 목적지로 한 Packet이 Route와 Neighbor 조회를 거쳐 Ethernet Frame이 된 후, Pod 쪽 veth 끝점의 이름인 eth0에서 송신되어 Peer인 Host 쪽 veth 끝점에 수신된다</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .ns { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; text-anchor: middle; }
      .box-text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52647d; text-anchor: middle; }
      .arrow-text { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .note { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40536d; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="620" rx="18" fill="#ffffff"/>
  <text x="28" y="42" class="title">eth0은 Pod 쪽 veth 끝점의 이름이며, 송신은 Peer의 수신으로 이어진다</text>
  <text x="28" y="70" class="subtitle">같은 Node의 Linux Kernel 안에서 처리된다 · 일반적인 IPv4 / veth 구성 예시</text>

  <rect x="28" y="96" width="790" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="128" class="ns">Pod Network Namespace</text>

  <rect x="54" y="164" width="185" height="112" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="146" y="198" class="box-title">Application</text>
  <text x="146" y="226" class="box-text">목적지 IP</text>
  <text x="146" y="249" class="box-text">10.96.10.20:8000</text>

  <line x1="239" y1="220" x2="291" y2="220" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="265" y="205" class="arrow-text">Socket</text>

  <rect x="294" y="151" width="205" height="138" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="396" y="186" class="box-title">Route 조회</text>
  <text x="396" y="214" class="box-text">다음 경유지</text>
  <text x="396" y="237" class="box-text">10.244.1.1</text>
  <text x="396" y="260" class="box-text">출력 Interface eth0</text>

  <line x1="499" y1="220" x2="551" y2="220" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="525" y="205" class="arrow-text">Next Hop</text>

  <rect x="554" y="151" width="220" height="138" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="664" y="186" class="box-title">Neighbor 조회</text>
  <text x="664" y="214" class="box-text">Gateway MAC 확인</text>
  <text x="664" y="237" class="box-text">ARP 또는 저장된 항목</text>
  <text x="664" y="260" class="box-text">Ethernet Frame 생성</text>

  <rect x="54" y="337" width="400" height="121" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="254" y="371" class="box-title">완성된 Ethernet Frame</text>
  <text x="254" y="400" class="box-text">목적지 MAC: 다음 경유지의 MAC</text>
  <text x="254" y="425" class="box-text">내부 목적지 IP: Service IP 10.96.10.20</text>

  <path d="M664 289 V313 H254 V336" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="454" y1="397" x2="536" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="379" class="arrow-text">송신</text>

  <rect x="538" y="337" width="150" height="121" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="613" y="374" class="box-title">eth0</text>
  <text x="613" y="402" class="box-text">TX (송신)</text>
  <text x="613" y="427" class="box-text">Pod 쪽 veth 끝점</text>

  <rect x="844" y="96" width="408" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="866" y="128" class="ns">Host Network Namespace</text>

  <rect x="866" y="337" width="125" height="121" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="928" y="374" class="box-title">host-veth</text>
  <text x="928" y="402" class="box-text">RX (수신)</text>
  <text x="928" y="427" class="box-text">Host 쪽 끝점</text>

  <line x1="688" y1="397" x2="864" y2="397" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="776" y="371" class="box-title">veth Driver</text>
  <text x="776" y="428" class="arrow-text">미리 연결된 Peer로 전달</text>

  <line x1="991" y1="397" x2="1050" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1053" y="337" width="170" height="121" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1138" y="371" class="box-title">Host의 후속 처리</text>
  <text x="1138" y="400" class="box-text">Bridge · IP Stack 등</text>
  <text x="1138" y="425" class="box-text">CNI 구성에 따라 연결</text>

  <rect x="150" y="553" width="980" height="42" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="640" y="580" class="note">eth0과 host-veth는 별도 장치 종류가 아니라, 이름이 다른 두 veth 끝점이며 함께 하나의 pair를 이룬다.</text>
</svg>
