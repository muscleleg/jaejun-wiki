<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-pod-dns-resolution-before-request.svg -->
  <title id="title">Pod에서 도메인 이름이 실제 요청으로 이어지는 두 단계</title>
  <desc id="desc">첫 번째 단계에서 Application이 Cache와 hosts를 확인한 뒤 CoreDNS Service에 질의하고, 두 번째 단계에서 응답받은 Service ClusterIP로 실제 요청을 보내는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; text-anchor: middle; }
      .box-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52647d; text-anchor: middle; }
      .arrow-text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .note { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40536d; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="650" rx="18" fill="#ffffff"/>
  <text x="28" y="42" class="title">도메인 요청은 이름 해석과 실제 연결이라는 두 번의 통신으로 나뉜다</text>
  <text x="28" y="70" class="subtitle">예시: Pod의 Application이 http://model-server:8000에 연결한다</text>

  <rect x="28" y="98" width="1224" height="225" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="132" class="lane-title">1. 이름 해석: model-server의 IP를 알아낸다</text>

  <rect x="55" y="164" width="190" height="105" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="197" class="box-title">Application</text>
  <text x="150" y="225" class="box-text">model-server 조회</text>
  <text x="150" y="248" class="box-text">IP는 아직 모름</text>

  <line x1="245" y1="217" x2="307" y2="217" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="276" y="203" class="arrow-text">먼저 확인</text>

  <rect x="310" y="164" width="205" height="105" rx="15" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="412" y="197" class="box-title">Cache · hosts</text>
  <text x="412" y="225" class="box-text">답이 있으면 즉시 사용</text>
  <text x="412" y="248" class="box-text">없으면 DNS 질의</text>

  <line x1="515" y1="217" x2="577" y2="217" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="546" y="203" class="arrow-text">Cache miss</text>

  <rect x="580" y="151" width="235" height="132" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="697" y="187" class="box-title">CoreDNS Service</text>
  <text x="697" y="215" class="box-text">10.96.0.10:53</text>
  <text x="697" y="238" class="box-text">DNS 질의도 Route 조회</text>
  <text x="697" y="261" class="box-text">→ eth0(veth 끝점)에서 TX</text>

  <line x1="815" y1="217" x2="877" y2="217" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="846" y="203" class="arrow-text">DNS 응답</text>

  <rect x="880" y="164" width="330" height="105" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="197" class="box-title">이름 해석 결과</text>
  <text x="1045" y="225" class="box-text">model-server</text>
  <text x="1045" y="248" class="box-text">→ Service IP 10.96.10.20</text>

  <rect x="28" y="345" width="1224" height="225" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="379" class="lane-title">2. 실제 연결: 알아낸 IP로 새로운 Packet을 보낸다</text>

  <rect x="55" y="411" width="210" height="105" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="444" class="box-title">Application</text>
  <text x="160" y="472" class="box-text">10.96.10.20:8000</text>
  <text x="160" y="495" class="box-text">새 TCP 연결 시작</text>

  <line x1="265" y1="464" x2="347" y2="464" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="306" y="449" class="arrow-text">다시 Route 조회</text>

  <rect x="350" y="411" width="230" height="105" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="465" y="444" class="box-title">Pod Network</text>
  <text x="465" y="472" class="box-text">Route → eth0(veth 끝점)</text>
  <text x="465" y="495" class="box-text">TX → Host 쪽 Peer의 RX</text>

  <line x1="580" y1="464" x2="662" y2="464" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="621" y="449" class="arrow-text">Service IP Packet</text>

  <rect x="665" y="398" width="245" height="132" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="787" y="434" class="box-title">Node의 Service 규칙</text>
  <text x="787" y="462" class="box-text">10.96.10.20</text>
  <text x="787" y="485" class="box-text">→ 실제 Endpoint Pod IP</text>
  <text x="787" y="508" class="box-text">DNAT 후 경로 선택</text>

  <line x1="910" y1="464" x2="992" y2="464" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="951" y="449" class="arrow-text">실제 요청</text>

  <rect x="995" y="411" width="215" height="105" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1102" y="444" class="box-title">Backend Pod</text>
  <text x="1102" y="472" class="box-text">실제 Pod IP:8000</text>
  <text x="1102" y="495" class="box-text">요청 수신</text>

  <rect x="236" y="594" width="808" height="38" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="640" y="619" class="note">CoreDNS는 실제 요청의 중계자가 아니라, 먼저 이름에 대한 답을 주는 별도 목적지다.</text>
</svg>
