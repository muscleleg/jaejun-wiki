<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-processes-shared-host-network.svg -->
  <title id="title">Network Namespace를 분리하지 않은 Process들이 Host Network를 공유하는 구조</title>
  <desc id="desc">Process A와 Process B가 같은 Host Network Namespace의 Interface, IP, Routing Table과 Port 공간을 함께 사용하며 같은 주소의 8080 Port를 동시에 열면 충돌하는 구조다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20344c; }
      .title { font-size: 23px; font-weight: 700; }
      .area-title { font-size: 17px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647a; }
      .host { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .process { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .network { fill: #ecfdf5; stroke: #34b899; stroke-width: 1.5; }
      .port { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1040" height="330" rx="16" fill="#ffffff"/>
  <text class="title" x="28" y="42">Namespace를 나누지 않으면 모든 Process가 Host Network를 함께 사용한다</text>

  <rect class="host" x="28" y="70" width="984" height="225" rx="18"/>
  <text class="area-title" x="48" y="102">Host Network Namespace</text>

  <rect class="process" x="62" y="130" width="175" height="65" rx="11"/>
  <text class="name" x="149" y="158" text-anchor="middle">Process A</text>
  <text class="body" x="149" y="181" text-anchor="middle">Server :8080 사용</text>

  <rect class="process" x="62" y="215" width="175" height="65" rx="11"/>
  <text class="name" x="149" y="243" text-anchor="middle">Process B</text>
  <text class="body" x="149" y="266" text-anchor="middle">Server :8080 요청</text>

  <rect class="network" x="350" y="123" width="360" height="164" rx="13"/>
  <text class="name" x="530" y="153" text-anchor="middle">공유하는 하나의 Network 상태</text>
  <text class="body" x="530" y="183" text-anchor="middle">Interface · IP 주소</text>
  <text class="body" x="530" y="211" text-anchor="middle">Routing Table · Neighbor 정보</text>
  <text class="body" x="530" y="239" text-anchor="middle">Packet 규칙 · Socket과 Port 공간</text>
  <text class="body" x="530" y="267" text-anchor="middle">두 Process에 동일하게 보임</text>

  <path class="arrow" d="M237 162H348"/>
  <path class="arrow" d="M237 247H300V205H348"/>

  <rect class="port" x="790" y="148" width="182" height="112" rx="12"/>
  <text class="name" x="881" y="178" text-anchor="middle">공유 Port 공간</text>
  <text class="body" x="881" y="205" text-anchor="middle">A가 :8080 사용 중</text>
  <text class="body" x="881" y="232" text-anchor="middle">B의 같은 Bind는 충돌</text>
  <path class="arrow" d="M710 205H788"/>

  <text class="body" x="520" y="319" text-anchor="middle">두 Process가 서로 다른 프로그램이어도 같은 Network Namespace에 속하면 Network 자원을 함께 본다.</text>
</svg>
