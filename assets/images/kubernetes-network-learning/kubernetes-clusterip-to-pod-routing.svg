<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-clusterip-to-pod-routing.svg -->
<title id="title">ClusterIP를 Pod IP로 바꾼 뒤 목적지 Node로 전달한다</title>
<desc id="desc">Linux kube-proxy iptables 방식의 새 연결 예시. Node A의 Pod A에서 Service 규칙과 DNAT, 경로 선택 순서로 진행하고 Node B의 Pod B에 도착한다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20344c}
.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.body{font-size:15px}.small{font-size:14px;fill:#52647a}
.node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.pod{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}
.service{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}.route{fill:#ecfdf5;stroke:#34b899;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs>
<rect width="1280" height="420" rx="16" fill="white"/>
<text class="title" x="30" y="42">ClusterIP를 Pod IP로 바꾼 뒤, 목적지 Node로 향하는 경로를 고른다</text>
<text class="small" x="30" y="71">Linux · kube-proxy iptables 방식 / 일반 Pod의 새 연결 / Node B의 Endpoint를 선택한 예시</text>
<rect class="node" x="30" y="100" width="865" height="242" rx="18"/>
<text class="label" x="50" y="132">Node A · 출발 Node</text>
<rect x="350" y="151" width="525" height="173" rx="12" fill="white" stroke="#dce3eb"/>
<text class="small" x="368" y="174">Node A의 Kernel · 호스트 네트워크 처리</text>
<rect class="pod" x="50" y="193" width="210" height="115" rx="12"/>
<text class="label" x="155" y="220" text-anchor="middle">① Pod A</text>
<text class="small" x="155" y="246" text-anchor="middle">패킷의 목적지</text>
<text class="body" x="155" y="273" text-anchor="middle">10.96.10.20:8000</text>
<text class="small" x="155" y="297" text-anchor="middle">Service의 ClusterIP</text>
<path class="arrow" d="M260 252H368"/>
<text class="small" x="308" y="224" text-anchor="middle">기본 경로</text>
<text class="small" x="308" y="281" text-anchor="middle">가상 인터페이스</text>
<rect class="service" x="370" y="193" width="245" height="115" rx="12"/>
<text class="label" x="492" y="220" text-anchor="middle">② Service 규칙 · DNAT</text>
<text class="small" x="492" y="246" text-anchor="middle">Pod B 선택 → 목적지 변경</text>
<text class="body" x="492" y="273" text-anchor="middle">10.96.10.20:8000</text>
<text class="body" x="492" y="298" text-anchor="middle">→ 10.244.2.7:8000</text>
<path class="arrow" d="M615 252H655"/>
<rect class="route" x="657" y="193" width="200" height="115" rx="12"/>
<text class="label" x="757" y="220" text-anchor="middle">③ 경로 선택</text>
<text class="body" x="757" y="250" text-anchor="middle">10.244.2.7 기준</text>
<text class="body" x="757" y="278" text-anchor="middle">Node B 방향으로</text>
<text class="small" x="757" y="299" text-anchor="middle">구성된 Pod 경로 사용</text>
<rect class="node" x="1050" y="100" width="200" height="242" rx="18"/>
<text class="label" x="1070" y="132">Node B · 도착 Node</text>
<rect class="pod" x="1068" y="193" width="164" height="115" rx="12"/>
<text class="label" x="1150" y="220" text-anchor="middle">④ Pod B</text>
<text class="body" x="1150" y="259" text-anchor="middle">10.244.2.7:8000</text>
<text class="small" x="1150" y="288" text-anchor="middle">요청 수신</text>
<path class="arrow" d="M857 252H1066"/>
<text class="small" x="972" y="217" text-anchor="middle">Node 간 경로</text>
<text class="small" x="972" y="238" text-anchor="middle">Route 또는 Tunnel</text>
<text class="small" x="972" y="282" text-anchor="middle">도착 후 Pod로 전달</text>
<text class="body" x="50" y="379">kube-proxy가 ②의 규칙을 미리 설정하고, CNI 기반 네트워크 구현이 ③ 이후의 전달 경로를 준비한다.</text>
<text class="small" x="50" y="405">실선은 패킷의 진행 방향이다. DNS 조회, 응답 경로와 연결 추적은 생략했다.</text>
</svg>
