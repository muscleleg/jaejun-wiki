<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-coredns-api-watch-and-kube-proxy.svg -->
<title id="title">CoreDNS kubernetes Plugin과 kube-proxy의 독립적인 API Watch 및 DNS 질의 경로</title>
<desc id="desc">API Server의 Service와 EndpointSlice를 CoreDNS의 kubernetes Plugin과 각 Node의 kube-proxy가 독립적으로 관찰한다. CoreDNS는 DNS 응답 상태를 갱신하고 kube-proxy는 Host의 Service 전달 규칙을 갱신한다. 별도의 Data Plane에서 Application Pod가 kube-dns Service IP로 보낸 DNS 질의는 Node의 Service 규칙을 거쳐 CoreDNS Pod에 도착한다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63758d"/></marker>
  <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3578b8"/></marker>
</defs>
<rect width="1200" height="1170" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <text x="45" y="52" font-size="30" font-weight="700" fill="#1e293b">같은 API 상태를 보고 서로 다른 결과를 만든다</text>
  <text x="45" y="88" font-size="19" fill="#60738c">위: 상태 동기화 Control 경로 · 아래: 실제 DNS 질의 Packet 경로</text>

  <rect x="60" y="120" width="1080" height="610" rx="24" fill="#f8fafc" stroke="#cad7e7" stroke-width="2"/>
  <text x="90" y="158" font-size="21" font-weight="700" fill="#506985">Control 경로</text>

  <rect x="310" y="185" width="580" height="126" rx="20" fill="#f5f3ff" stroke="#ab96e8" stroke-width="2"/>
  <text x="600" y="228" font-size="24" font-weight="700" text-anchor="middle" fill="#24364d">API Server</text>
  <text x="600" y="268" font-size="21" text-anchor="middle" fill="#334a65">Service · EndpointSlice · Namespace</text>
  <text x="600" y="298" font-size="18" text-anchor="middle" fill="#65768d">Cluster의 공통 Kubernetes 상태</text>

  <path d="M455 311 V374 H270 V412" fill="none" stroke="#63758d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 311 V374 H930 V412" fill="none" stroke="#63758d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="270" y="397" font-size="17" text-anchor="middle" fill="#60738c">각 CoreDNS가 Watch</text>
  <text x="930" y="397" font-size="17" text-anchor="middle" fill="#60738c">각 kube-proxy가 Watch</text>

  <rect x="95" y="422" width="350" height="184" rx="20" fill="#ecfdf5" stroke="#62c69a" stroke-width="2"/>
  <text x="270" y="463" font-size="23" font-weight="700" text-anchor="middle" fill="#263950">CoreDNS Pod</text>
  <text x="270" y="501" font-size="20" text-anchor="middle" fill="#334a65">kubernetes Plugin</text>
  <text x="270" y="539" font-size="18" text-anchor="middle" fill="#526982">Service·Endpoint 상태 Cache</text>
  <text x="270" y="575" font-size="19" font-weight="700" text-anchor="middle" fill="#277453">DNS 응답 생성</text>

  <rect x="755" y="422" width="350" height="184" rx="20" fill="#fff7ed" stroke="#f0aa61" stroke-width="2"/>
  <text x="930" y="463" font-size="23" font-weight="700" text-anchor="middle" fill="#263950">각 Node의 kube-proxy</text>
  <text x="930" y="501" font-size="20" text-anchor="middle" fill="#334a65">Service·Endpoint 상태 Cache</text>
  <text x="930" y="539" font-size="18" text-anchor="middle" fill="#526982">Proxy Mode에 맞는 규칙 계산</text>
  <text x="930" y="575" font-size="19" font-weight="700" text-anchor="middle" fill="#a05213">Host Service 규칙 갱신</text>

  <path d="M445 514 H755" fill="none" stroke="#b4c0cf" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="600" y="499" font-size="17" text-anchor="middle" fill="#718197">서로를 갱신하지 않음</text>
  <text x="600" y="532" font-size="17" text-anchor="middle" fill="#718197">공통 입력을 독립적으로 사용</text>

  <rect x="175" y="635" width="850" height="66" rx="16" fill="#ffffff" stroke="#bdcada" stroke-width="2"/>
  <text x="600" y="676" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">CoreDNS: 이름에 답한다 · kube-proxy: Service Packet의 전달 규칙을 만든다</text>

  <rect x="60" y="765" width="1080" height="350" rx="24" fill="#f8fafc" stroke="#cad7e7" stroke-width="2"/>
  <text x="90" y="805" font-size="21" font-weight="700" fill="#506985">Data 경로 · 실제 DNS 질의</text>

  <rect x="95" y="850" width="270" height="126" rx="19" fill="#eef5ff" stroke="#87afe7" stroke-width="2"/>
  <text x="230" y="895" font-size="22" font-weight="700" text-anchor="middle" fill="#263950">Application Pod</text>
  <text x="230" y="932" font-size="18" text-anchor="middle" fill="#526982">Service 이름 DNS 질의</text>
  <text x="230" y="962" font-size="17" text-anchor="middle" fill="#60738c">목적지: DNS Service IP:53</text>

  <path d="M365 913 H458" fill="none" stroke="#3578b8" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="468" y="850" width="270" height="126" rx="19" fill="#fff7ed" stroke="#f0aa61" stroke-width="2"/>
  <text x="603" y="895" font-size="22" font-weight="700" text-anchor="middle" fill="#263950">Node Service 규칙</text>
  <text x="603" y="932" font-size="18" text-anchor="middle" fill="#526982">kube-dns ClusterIP</text>
  <text x="603" y="962" font-size="17" text-anchor="middle" fill="#60738c">→ CoreDNS Pod IP</text>

  <path d="M738 913 H831" fill="none" stroke="#3578b8" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="841" y="850" width="264" height="126" rx="19" fill="#ecfdf5" stroke="#62c69a" stroke-width="2"/>
  <text x="973" y="895" font-size="22" font-weight="700" text-anchor="middle" fill="#263950">CoreDNS Pod</text>
  <text x="973" y="932" font-size="18" text-anchor="middle" fill="#526982">동기화된 상태로 응답</text>
  <text x="973" y="962" font-size="17" text-anchor="middle" fill="#60738c">이름 → Service ClusterIP</text>

  <text x="600" y="1038" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">kube-proxy는 DNS Packet 전달에 관여할 수 있지만 CoreDNS의 내용을 동기화하지 않는다.</text>
  <text x="600" y="1075" font-size="18" text-anchor="middle" fill="#60738c">상태 동기화와 실제 Packet 전달을 분리해서 이해한다.</text>
</g>
</svg>
