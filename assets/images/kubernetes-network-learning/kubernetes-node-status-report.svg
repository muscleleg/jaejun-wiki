<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-node-status-report.svg -->
<title id="title">kubelet이 Node별 상태를 API에 보고하는 경로</title><desc id="desc">Node A와 Node B의 kubelet은 API Server를 통해 각자의 Node Object status를 갱신한다. 두 Node의 상태는 별도 Object로 유지된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.node{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.api{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.state{fill:#ecfdf5;stroke:#34b494;stroke-width:1.5}text{font-family:system-ui,-apple-system,sans-serif;fill:#172a40}.title{font-size:25px;font-weight:600}.name{font-size:19px;font-weight:600;text-anchor:middle}.sub{font-size:16px;fill:#475569;text-anchor:middle}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect class="bg" width="1000" height="380" rx="16"/>
<text class="title" x="30" y="43">각 kubelet은 자신의 Node 상태를 API에 보고한다</text>
<rect class="node" x="35" y="95" width="240" height="90" rx="12"/>
<text class="name" x="155" y="130">Node A · kubelet</text><text class="sub" x="155" y="159">Node A의 자원·상태 수집</text>
<rect class="node" x="35" y="225" width="240" height="90" rx="12"/>
<text class="name" x="155" y="260">Node B · kubelet</text><text class="sub" x="155" y="289">Node B의 자원·상태 수집</text>
<rect class="api" x="390" y="160" width="220" height="90" rx="12"/>
<text class="name" x="500" y="195">API Server</text><text class="sub" x="500" y="224">Node 상태 갱신 요청 처리</text>
<rect class="state" x="725" y="95" width="240" height="90" rx="12"/>
<text class="name" x="845" y="130">Node A Object</text><text class="sub" x="845" y="159">status: A의 자원·Condition</text>
<rect class="state" x="725" y="225" width="240" height="90" rx="12"/>
<text class="name" x="845" y="260">Node B Object</text><text class="sub" x="845" y="289">status: B의 자원·Condition</text>
<path class="edge" d="M275 140H325V183H390"/><path class="edge" d="M275 270H325V227H390"/>
<path class="edge" d="M610 183H665V140H725"/><path class="edge" d="M610 227H665V270H725"/>
<text class="sub" x="335" y="111">상태 보고</text><text class="sub" x="665" y="111">각 Object에 반영</text>
<text class="note" x="35" y="355">대표 필드: status.capacity · status.allocatable · status.conditions (Ready 등)</text></svg>
