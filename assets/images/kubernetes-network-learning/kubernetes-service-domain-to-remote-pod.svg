<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-service-domain-to-remote-pod.svg -->
<title id="title">DNS 응답을 받은 Pod에서 원격 Pod까지 이어지는 요청 경로</title>
<desc id="desc">위쪽에서 출발 Pod가 CoreDNS로 DNS 질의를 보내고 Service IP 응답은 같은 Pod로 되돌아온다. 아래쪽은 별도의 실제 요청 경로다. Node A의 출발 Pod eth0에서 Host veth로 전달된 Packet은 Host Namespace 안에서 PREROUTING, Service DNAT, 경로 판단을 순서대로 거친다. Node 사이 CNI 경로를 지나 Node B의 Host에 도착하고 대상 Host veth에서 Pod eth0으로 전달되어 Application에 도착한다. 번호는 요청의 진행 순서를 나타내며 오른쪽 위로 향하는 화살표는 대상 Pod로의 요청 수신이다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3479bd"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#25816b"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="1420" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<text x="40" y="48" font-size="30" fill="#1e293b" font-weight="700" text-anchor="start">Service 이름으로 시작한 요청의 실제 이동 방향</text>
<text x="40" y="82" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">일반 ClusterIP Service · veth + kube-proxy iptables 구성 · 새 연결의 요청 방향</text>
<rect x="40" y="110" width="1200" height="285" rx="22" fill="#faf8ff" stroke="#d1c4ee" stroke-width="2"/>
<text x="64" y="148" font-size="23" fill="#51416d" font-weight="700" text-anchor="start">먼저 DNS 응답이 출발 Pod로 돌아온다</text>
<rect x="70" y="180" width="365" height="165" rx="18" fill="#eff6ff" stroke="#91b7e7" stroke-width="2"/>
<text x="95" y="220" font-size="23" fill="#25354a" font-weight="700" text-anchor="start">출발 Pod의 Application</text>
<text x="95" y="260" font-size="20" fill="#334155" font-weight="400" text-anchor="start">http://model-server:8000</text>
<text x="95" y="300" font-size="20" fill="#25816b" font-weight="700" text-anchor="start">응답받은 IP: 10.96.10.20</text>
<rect x="890" y="180" width="320" height="165" rx="18" fill="#ecfdf5" stroke="#7cc5ac" stroke-width="2"/>
<text x="920" y="220" font-size="24" fill="#25354a" font-weight="700" text-anchor="start">CoreDNS</text>
<text x="920" y="260" font-size="19" fill="#334155" font-weight="400" text-anchor="start">동기화해 둔 Service 정보로</text>
<text x="920" y="292" font-size="19" fill="#334155" font-weight="400" text-anchor="start">DNS 질의에 응답</text>
<path d="M435 235 H880" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="660" y="220" font-size="19" fill="#3479bd" font-weight="400" text-anchor="middle">① model-server의 IP 질의</text>
<path d="M890 305 H445" stroke="#25816b" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="660" y="290" font-size="19" fill="#25816b" font-weight="400" text-anchor="middle">② Service IP 10.96.10.20 응답</text>
<text x="500" y="375" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">DNS 질의·응답의 veth와 kube-dns Service 경로는 생략했다.</text>
<path d="M252 345 V460" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#grey)"/>
<rect x="270" y="405" width="790" height="37" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="283" y="431" font-size="20" fill="#475569" font-weight="700" text-anchor="start">③ 같은 출발 Pod가 알아낸 IP로 별도의 Service 요청을 시작한다</text>

<rect x="40" y="470" width="555" height="850" rx="24" fill="#f8fafc" stroke="#bacbdd" stroke-width="2"/>
<rect x="705" y="470" width="535" height="850" rx="24" fill="#f8fafc" stroke="#bacbdd" stroke-width="2"/>
<text x="66" y="508" font-size="24" fill="#3f5877" font-weight="700" text-anchor="start">Node A · 출발 Node</text>
<text x="731" y="508" font-size="24" fill="#3f5877" font-weight="700" text-anchor="start">Node B · 목적지 Node</text>

<rect x="65" y="530" width="505" height="190" rx="18" fill="#eff6ff" stroke="#91b7e7" stroke-width="2"/>
<text x="86" y="565" font-size="21" fill="#345778" font-weight="700" text-anchor="start">출발 Pod · Network Namespace</text>
<text x="86" y="603" font-size="21" fill="#334155" font-weight="400" text-anchor="start">목적지: 10.96.10.20:8000</text>
<text x="86" y="640" font-size="19" fill="#334155" font-weight="400" text-anchor="start">Pod Routing Table → 출력 Interface 선택</text>
<rect x="135" y="663" width="365" height="42" rx="12" fill="white" stroke="#adc9e9" stroke-width="2"/>
<text x="317" y="692" font-size="19" fill="#25354a" font-weight="700" text-anchor="middle">④ Pod 쪽 veth 끝점 eth0 · TX</text>

<rect x="65" y="785" width="505" height="510" rx="18" fill="#fffdf8" stroke="#dfcda8" stroke-width="2"/>
<text x="86" y="820" font-size="16" fill="#796448" font-weight="700" text-anchor="start">Host Network Namespace</text>
<rect x="90" y="840" width="455" height="65" rx="18" fill="#f5f3ff" stroke="#b6a3de" stroke-width="2"/>
<text x="317" y="880" font-size="21" fill="#25354a" font-weight="700" text-anchor="middle">⑤ Host 쪽 veth 끝점 · RX</text>
<path d="M317 705 V830" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="337" y="758" font-size="19" fill="#3479bd" font-weight="400" text-anchor="start">veth pair</text>
<path d="M317 905 V945" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<rect x="90" y="955" width="455" height="137" rx="18" fill="#fff7ed" stroke="#edb575" stroke-width="2"/>
<text x="111" y="991" font-size="19" fill="#8b501b" font-weight="700" text-anchor="start">⑥ PREROUTING → Service 규칙 → DNAT</text>
<text x="111" y="1030" font-size="19" fill="#334155" font-weight="400" text-anchor="start">10.96.10.20:8000 → 10.244.2.7:8000</text>
<text x="111" y="1066" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">kube-proxy가 미리 구성한 규칙을 Kernel이 적용</text>
<path d="M317 1092 V1132" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<rect x="90" y="1142" width="455" height="127" rx="18" fill="#fefce8" stroke="#dbc46c" stroke-width="2"/>
<text x="111" y="1178" font-size="20" fill="#736322" font-weight="700" text-anchor="start">⑦ Host Route 판단 · CNI Datapath</text>
<text x="111" y="1215" font-size="20" fill="#334155" font-weight="400" text-anchor="start">변경된 Pod IP: 10.244.2.7</text>
<text x="111" y="1248" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Node B 방향의 Route 또는 Tunnel 선택</text>

<rect x="730" y="530" width="485" height="190" rx="18" fill="#ecfdf5" stroke="#7cc5ac" stroke-width="2"/>
<text x="751" y="565" font-size="21" fill="#296952" font-weight="700" text-anchor="start">대상 Pod · Network Namespace</text>
<text x="751" y="606" font-size="21" fill="#25354a" font-weight="700" text-anchor="start">⑪ Application Socket · Port 8000</text>
<rect x="787" y="658" width="370" height="47" rx="12" fill="white" stroke="#9fcfbd" stroke-width="2"/>
<text x="972" y="688" font-size="19" fill="#25354a" font-weight="700" text-anchor="middle">⑩ Pod 쪽 veth 끝점 eth0 · RX</text>
<path d="M972 658 V622" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<rect x="730" y="785" width="485" height="510" rx="18" fill="#fffdf8" stroke="#dfcda8" stroke-width="2"/>
<text x="751" y="820" font-size="16" fill="#796448" font-weight="700" text-anchor="start">Host Network Namespace</text>
<rect x="755" y="840" width="435" height="65" rx="18" fill="#f5f3ff" stroke="#b6a3de" stroke-width="2"/>
<text x="972" y="880" font-size="20" fill="#25354a" font-weight="700" text-anchor="middle">⑨ 대상 Pod의 Host veth · TX</text>
<path d="M972 840 V715" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="992" y="758" font-size="19" fill="#3479bd" font-weight="400" text-anchor="start">veth pair</text>
<rect x="755" y="1142" width="435" height="127" rx="18" fill="#fefce8" stroke="#dbc46c" stroke-width="2"/>
<text x="776" y="1178" font-size="20" fill="#736322" font-weight="700" text-anchor="start">⑧ Node B에 도착 · 로컬 경로 판단</text>
<text x="776" y="1215" font-size="20" fill="#334155" font-weight="400" text-anchor="start">목적지: 10.244.2.7:8000</text>
<text x="776" y="1248" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Overlay라면 먼저 Tunnel Header 제거</text>
<path d="M972 1142 V915" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="952" y="1007" font-size="19" fill="#64748b" font-weight="400" text-anchor="end">대상 Pod 쪽</text>
<text x="952" y="1038" font-size="19" fill="#64748b" font-weight="400" text-anchor="end">Interface로 전달</text>

<path d="M545 1205 H745" stroke="#3479bd" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<rect x="598" y="1115" width="104" height="66" rx="8" fill="white" stroke="white" stroke-width="2"/>
<text x="650" y="1142" font-size="17" fill="#3479bd" font-weight="400" text-anchor="middle">Node 간</text>
<text x="650" y="1167" font-size="17" fill="#3479bd" font-weight="400" text-anchor="middle">Network</text>
<text x="650" y="1240" font-size="17" fill="#3479bd" font-weight="400" text-anchor="middle">→ 요청</text>

<text x="40" y="1356" font-size="18" fill="#475569" font-weight="400" text-anchor="start">파란 실선은 요청의 이동 방향이다. Node B에서 위로 향하는 화살표도 대상 Pod로 들어가는 요청이다.</text>
<text x="40" y="1388" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">DNS 응답은 초록색으로 표시했다. 아래 실제 Service 요청의 응답·역방향 NAT 경로는 생략했다.</text>
</g></svg>
