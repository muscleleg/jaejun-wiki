<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1260" viewBox="0 0 1120 1260" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-host-veth-service-forwarding.svg -->
<title id="title">Host veth 수신 이후 Service DNAT와 Pod 전달</title>
<desc id="desc">출발 Node가 ClusterIP 패킷을 수신하면 일반적인 Linux IP 전달 및 kube-proxy iptables 구성에서 PREROUTING의 Service 규칙이 Endpoint를 선택하고 DNAT한다. 변경된 목적지로 경로를 조회하여 같은 Node의 Pod 또는 다른 Node의 Pod로 전달한다.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}
.title{font-size:25px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;fill:#52647d}.small{font-size:13px;fill:#52647d}.center{text-anchor:middle}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1120" height="1260" rx="18" fill="white"/>
<text x="30" y="42" class="title">Host veth에서 받은 뒤, 실제 목적지 Pod까지 어떻게 보낼까?</text>
<text x="30" y="72" class="body">일반적인 Linux IP 전달 + kube-proxy iptables 구성 · 새 연결의 첫 패킷을 따라가는 예시</text>
<path d="M26 98 H1094 V668 H550 V1198 H26 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<text x="48" y="129" class="head">출발 Node · 같은 Node의 대상 Pod까지 포함</text>
<path d="M40 143 H1080 V652 H524 V915 H40 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 4" stroke-linejoin="round"/>
<text x="752" y="163" class="small">Host Network Namespace</text>

<rect x="62" y="155" width="586" height="74" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="84" y="184" class="head">1. Host veth에서 RX(수신)</text>
<text x="84" y="211" class="body">IP 목적지는 아직 Service ClusterIP 10.96.10.20:8000</text>
<path d="M355 229 V260" class="arrow"/>

<rect x="62" y="262" width="586" height="104" rx="12" fill="#fff7ed" stroke="#fb923c"/>
<text x="84" y="292" class="head">2. PREROUTING에서 Service 규칙 적용 · DNAT</text>
<text x="84" y="321" class="body">ClusterIP와 Port에 일치 → 준비된 Endpoint 중 하나 선택</text>
<text x="84" y="347" class="body">목적지 10.96.10.20:8000 → 선택된 Pod IP:8000</text>

<rect x="723" y="176" width="330" height="155" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="746" y="206" class="head">규칙은 미리 준비되어 있다</text>
<text x="746" y="237" class="body">kube-proxy가 Service와</text>
<text x="746" y="262" class="body">EndpointSlice를 관찰하여</text>
<text x="746" y="287" class="body">Kernel에 Service 규칙을 구성한다.</text>
<text x="746" y="314" class="small">실제 패킷에는 Kernel이 규칙을 적용한다.</text>
<path d="M723 306 H650" class="arrow" stroke-dasharray="5 5"/>

<path d="M355 366 V397" class="arrow"/>
<rect x="62" y="399" width="586" height="87" rx="12" fill="#ecfdf5" stroke="#34d399"/>
<text x="84" y="430" class="head">3. 변경된 Pod IP로 Host Route 판단</text>
<text x="84" y="461" class="body">CNI가 준비한 경로에서 출력 Interface와 다음 경유지 선택</text>
<rect x="723" y="386" width="330" height="100" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="746" y="415" class="head">Endpoint 선택과 Route의 차이</text>
<text x="746" y="444" class="body">Service 규칙: 어느 Pod인가?</text>
<text x="746" y="470" class="body">Route: 그 Pod까지 어떻게 가는가?</text>

<path d="M355 486 V516 H282 V546" class="arrow"/>
<path d="M355 516 H838 V546" class="arrow"/>
<text x="204" y="538" class="small center">같은 Node의 Pod</text>
<text x="923" y="538" class="small center">다른 Node의 Pod</text>
<rect x="62" y="550" width="440" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="282" y="581" class="head center">4A. 로컬 Pod 방향으로 전달</text>
<text x="282" y="610" class="body center">출발 Node 안의 대상 Pod 연결 경로 사용</text>
<rect x="618" y="550" width="440" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="838" y="581" class="head center">4B. 목적지 Node 방향으로 전달</text>
<text x="838" y="610" class="body center">직접 Routing 또는 Tunnel → Node 간 Network</text>

<path d="M282 640 V838" class="arrow"/>
<path d="M838 640 V696" class="arrow"/>
<rect x="582" y="682" width="512" height="516" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="606" y="713" class="head">다른 목적지 Node</text>
<rect x="604" y="721" width="468" height="194" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<rect x="618" y="730" width="440" height="73" rx="12" fill="white" stroke="#86efac"/>
<text x="838" y="758" class="head center">5B. Node에서 수신 후 Pod 경로 선택</text>
<text x="838" y="785" class="body center">필요 시 Tunnel 해제 → 목적지 Pod IP로 전달</text>
<path d="M838 803 V836" class="arrow"/>

<text x="635" y="825" class="small">Host Network Namespace</text>
<rect x="62" y="840" width="440" height="56" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="282" y="875" class="head center">5A. 대상 Pod 쪽 Host veth · TX(송신)</text>
<rect x="618" y="840" width="440" height="56" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="838" y="875" class="head center">6B. 대상 Pod 쪽 Host veth · TX(송신)</text>

<path d="M282 896 V978" class="arrow"/>
<path d="M838 896 V978" class="arrow"/>
<text x="300" y="943" class="body">veth pair로 전달</text>
<text x="856" y="943" class="body">veth pair로 전달</text>

<rect x="40" y="960" width="484" height="228" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<rect x="596" y="960" width="484" height="228" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<rect x="62" y="982" width="440" height="59" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
<rect x="618" y="982" width="440" height="59" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="282" y="1018" class="head center">Pod 쪽 veth 끝점 eth0 · RX(수신)</text>
<text x="838" y="1018" class="head center">Pod 쪽 veth 끝점 eth0 · RX(수신)</text>
<path d="M282 1041 V1070" class="arrow"/>
<path d="M838 1041 V1070" class="arrow"/>
<text x="282" y="1094" class="head center">Pod Network Namespace의 수신 처리</text>
<text x="838" y="1094" class="head center">Pod Network Namespace의 수신 처리</text>
<text x="282" y="1126" class="body center">자신의 IP로 들어온 Packet → TCP/UDP 처리</text>
<text x="838" y="1126" class="body center">자신의 IP로 들어온 Packet → TCP/UDP 처리</text>
<text x="282" y="1156" class="body center">주소·Port·연결 정보에 맞는 Socket → Application</text>
<text x="838" y="1156" class="body center">주소·Port·연결 정보에 맞는 Socket → Application</text>
<text x="560" y="1215" class="small center">일반적인 veth 기반 Pod의 전달 경로. Bridge·Neighbor 처리와 세부 Netfilter Hook은 간략화했다.</text>
<text x="560" y="1238" class="small center">Host 쪽 veth 끝점의 TX는 Peer인 Pod 쪽 끝점 eth0의 RX로 이어진다.</text>
<path d="M838 640 V728" class="arrow"/>
<path d="M282 896 V980" class="arrow"/>
<path d="M838 896 V980" class="arrow"/>
</svg>
