<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: linux-interface-peer-and-link-state.svg -->
  <title id="title">ip link 출력에서 Interface 정보와 상태를 읽는 순서</title>
  <desc id="desc">ip link 출력의 ifindex 이름 관계 단서 관리 상태 Link 상태 MAC 주소를 읽고 물리 NIC는 Carrier를 가상 Interface는 상세 종류와 다른 Interface 관계를 추가로 확인한다</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24364b; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #52647d; }
      .small { font-size: 13px; fill: #52647d; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#ffffff"/>
  <text x="30" y="43" class="title">ip link는 Interface의 식별 정보와 Link 상태를 읽는 출발점이다</text>
  <text x="30" y="72" class="body">먼저 공통 출력을 읽고, Interface 종류에 따라 물리 Link 또는 가상 연결 관계를 추가로 확인한다</text>
  <rect x="28" y="103" width="1144" height="218" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="137" class="heading">1. 현재 Network Namespace에서 ip link 실행</text>
  <rect x="54" y="162" width="1092" height="64" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="202" class="heading center">2: eth0@if12: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 state UP</text>
  <rect x="54" y="244" width="198" height="52" rx="10" fill="#ffffff" stroke="#60a5fa"/>
  <text x="153" y="266" class="small center">식별</text><text x="153" y="286" class="body center">ifindex 2 · 이름 eth0</text>
  <rect x="270" y="244" width="198" height="52" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="369" y="266" class="small center">관계 단서</text><text x="369" y="286" class="body center">@if12</text>
  <rect x="486" y="244" width="198" height="52" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="585" y="266" class="small center">관리 상태</text><text x="585" y="286" class="body center">UP</text>
  <rect x="702" y="244" width="198" height="52" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="801" y="266" class="small center">아래쪽 Link</text><text x="801" y="286" class="body center">LOWER_UP</text>
  <rect x="918" y="244" width="228" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1032" y="266" class="small center">그 밖의 정보</text><text x="1032" y="286" class="body center">MTU · state · MAC</text>
  <line x1="600" y1="321" x2="600" y2="365" stroke="#64748b" stroke-width="2.5"/>
  <line x1="600" y1="365" x2="300" y2="365" stroke="#64748b" stroke-width="2.5"/>
  <line x1="600" y1="365" x2="900" y2="365" stroke="#64748b" stroke-width="2.5"/>
  <line x1="300" y1="365" x2="300" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="365" x2="900" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="28" y="400" width="554" height="246" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="434" class="heading">물리 NIC라면 Carrier 상태 확인</text>
  <rect x="55" y="464" width="500" height="67" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="305" y="490" class="heading center">Link 연결됨</text><text x="305" y="516" class="body center">UP + LOWER_UP · state UP</text>
  <rect x="55" y="550" width="500" height="67" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="305" y="576" class="heading center">Cable 또는 반대편 Link 없음</text><text x="305" y="602" class="body center">UP + NO-CARRIER · state DOWN</text>
  <rect x="618" y="400" width="554" height="246" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="642" y="434" class="heading">가상 Interface라면 종류와 관계 확인</text>
  <rect x="645" y="464" width="500" height="67" rx="13" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="895" y="490" class="heading center">ip -d link로 종류 확인</text><text x="895" y="516" class="body center">veth · VLAN · macvlan · 기타 가상 장치</text>
  <rect x="645" y="550" width="500" height="67" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="895" y="576" class="heading center">@ifN은 연결 관계의 단서</text><text x="895" y="602" class="body center">veth라면 반대편 Peer의 ifindex를 찾는 데 사용</text>
  <text x="600" y="686" class="body center">ip link만으로 IP 주소·Route·목적지 도달 가능성까지 판단할 수는 없다.</text>
</svg>
