<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-components-map.svg -->
<title id="title">Kubernetes: 상태 공유, Node 실행, 요청 전달</title>
<desc id="desc">Control Plane은 API Server와 etcd를 중심으로 상태를 공유한다. Controller와 Scheduler는 API를 관찰하고 변경한다. 각 Node의 kubelet은 Runtime을 통해 Pod를 실행하고 Device Plugin과 CNI가 장치와 네트워크 준비에 참여한다. 별도 데이터 경로에서는 CoreDNS의 이름 해석 뒤 Service IP로 보낸 요청이 kube-proxy 또는 대체 구현이 설정한 규칙을 통해 Pod에 전달된다.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16806a"/></marker>
</defs>
<style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.api{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.run{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.net{fill:#ecfdf5;stroke:#34b494;stroke-width:1.5}.gpu{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}
text{font-family:system-ui,-apple-system,sans-serif;fill:#172a40}.title{font-size:27px;font-weight:600}.section{font-size:20px;font-weight:600}.name{font-size:18px;font-weight:600;text-anchor:middle}.sub{font-size:15px;text-anchor:middle;fill:#475569}.note{font-size:14px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.both{marker-start:url(#a)}.watch{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}.traffic{fill:none;stroke:#16806a;stroke-width:3;marker-end:url(#g)}
</style>
<rect class="bg" width="1100" height="1180" rx="16"/>
<text class="title" x="32" y="42">Kubernetes 컴포넌트: 세 가지 관계로 읽기</text>
<text class="note" x="32" y="70">① API로 상태를 공유한다   ② Node에서 실행한다   ③ 준비된 네트워크로 요청을 전달한다</text>

<rect class="panel" x="280" y="100" width="790" height="300" rx="16"/>
<text class="section" x="302" y="134">① Control Plane · 상태와 결정</text>
<rect class="box" x="30" y="165" width="180" height="80" rx="12"/>
<text class="name" x="120" y="198">사용자 · kubectl</text><text class="sub" x="120" y="225">명세 제출 / 상태 조회</text>
<rect class="api" x="350" y="160" width="360" height="85" rx="12"/>
<text class="name" x="530" y="192">kube-apiserver</text>
<text class="sub" x="530" y="222">인증·검증 · API Object 읽기와 변경</text>
<rect class="box" x="850" y="160" width="180" height="85" rx="12"/>
<text class="name" x="940" y="192">etcd</text><text class="sub" x="940" y="222">클러스터 상태 저장</text>
<path class="edge" d="M210 202H350"/><text class="sub" x="280" y="190">API 요청</text>
<path class="edge both" d="M710 202H850"/><text class="sub" x="780" y="190">읽기·쓰기</text>
<rect class="api" x="310" y="310" width="320" height="70" rx="12"/>
<text class="name" x="470" y="338">kube-controller-manager</text><text class="sub" x="470" y="363">Controller들이 필요한 Object 조정</text>
<rect class="api" x="690" y="310" width="340" height="70" rx="12"/>
<text class="name" x="860" y="338">kube-scheduler</text><text class="sub" x="860" y="363">Pod 관찰 → Node 선택 결과 기록</text>
<path class="edge both" d="M470 310V245"/>
<path class="edge both" d="M860 310V278H670V245"/>
<text class="sub" x="530" y="287">관찰·변경</text>
<text class="note" x="32" y="290">API Object는 기록이다.</text>
<text class="note" x="32" y="315">Deployment · Pod · Node</text>
<text class="note" x="32" y="340">Service · EndpointSlice 등</text>
<text class="note" x="32" y="370">Service 자체는 실행 프로세스가 아니다.</text>

<rect class="panel" x="30" y="435" width="1040" height="350" rx="16"/>
<text class="section" x="52" y="470">② 각 Node · 실행과 환경 준비</text>
<rect class="run" x="65" y="520" width="250" height="90" rx="12"/>
<text class="name" x="190" y="550">kubelet</text><text class="sub" x="190" y="576">배정된 Pod의 실행 조정</text><text class="sub" x="190" y="598">API 관찰 / Node·Pod 상태 보고</text>
<rect class="run" x="420" y="520" width="270" height="90" rx="12"/>
<text class="name" x="555" y="553">Container Runtime</text><text class="sub" x="555" y="582">예: containerd · 컨테이너 실행</text>
<rect class="net" x="790" y="520" width="240" height="90" rx="12"/>
<text class="name" x="910" y="553">CNI 플러그인</text><text class="sub" x="910" y="582">Pod IP·인터페이스·경로 준비</text>
<path class="edge" d="M315 560H420"/><text class="sub" x="367" y="548">CRI</text>
<path class="edge" d="M690 560H790"/><text class="sub" x="740" y="548">CNI 호출</text>
<rect class="gpu" x="65" y="675" width="250" height="80" rx="12"/>
<text class="name" x="190" y="705">Device Plugin</text><text class="sub" x="190" y="733">GPU 등 장치 등록·할당 지원</text>
<path class="edge both" d="M190 675V610"/><text class="sub" x="255" y="648">장치 정보</text>
<rect class="run" x="420" y="675" width="270" height="80" rx="12"/>
<text class="name" x="555" y="706">Application Pod</text><text class="sub" x="555" y="733">컨테이너가 실제로 실행되는 곳</text>
<path class="edge" d="M555 610V675"/><text class="sub" x="615" y="648">생성·실행</text>
<rect class="net" x="790" y="675" width="240" height="80" rx="12"/>
<text class="name" x="910" y="706">kube-proxy</text><text class="sub" x="910" y="733">Service 전달 규칙 구성</text>
<text class="note" x="65" y="503">API Server ↔ kubelet</text>
<text class="note" x="780" y="652">API의 Service·EndpointSlice 관찰</text>

<rect class="panel" x="30" y="815" width="1040" height="280" rx="16"/>
<text class="section" x="52" y="850">③ Service 접근 · 일반적인 ClusterIP의 데이터 경로</text>
<text class="note" x="65" y="884">먼저 CoreDNS에 이름 조회 → Service IP 응답. 이후 애플리케이션 요청은 아래 경로로 흐른다.</text>
<rect class="net" x="65" y="920" width="250" height="90" rx="12"/>
<text class="name" x="190" y="953">호출하는 클라이언트</text><text class="sub" x="190" y="984">목적지: Service IP:Port</text>
<rect class="net" x="420" y="920" width="270" height="90" rx="12"/>
<text class="name" x="555" y="953">Node의 전달 규칙</text><text class="sub" x="555" y="984">대상 Pod IP:Port로 전달</text>
<rect class="net" x="790" y="920" width="240" height="90" rx="12"/>
<text class="name" x="910" y="953">대상 Pod</text><text class="sub" x="910" y="984">같은 Node 또는 다른 Node</text>
<path class="traffic" d="M315 965H420"/><path class="traffic" d="M690 965H790"/>
<path class="watch" d="M1030 715H1055V900H555V920"/>
<text class="note" x="660" y="917">규칙 설정 (요청 중계와 구분)</text>
<text class="note" x="65" y="1044">Pod 간 통신 기반: CNI 네트워크 구현 · Service 규칙: kube-proxy 또는 대체 구현</text>
<text class="note" x="65" y="1070">CoreDNS는 보통 클러스터의 Pod로 실행되며, 모든 Node에 하나씩 있을 필요는 없다.</text>

<text class="note" x="32" y="1127">확장 경계: CSI → 볼륨 연결·마운트 / cloud-controller-manager → 클라우드 Node·Route·LoadBalancer 연동</text>
<text class="note" x="32" y="1154">화살표: 회색 실선 = API·실행 관계 / 점선 = 규칙 구성 / 초록 실선 = 실제 애플리케이션 트래픽</text>
</svg>
