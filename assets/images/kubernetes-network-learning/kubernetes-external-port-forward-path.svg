<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
  <title id="title">외부 클라이언트에서 Port Forward로 Pod 포트에 연결하는 경로</title>
  <desc id="desc">클라이언트 애플리케이션이 localhost의 kubectl 포트에 접속한다. 연결은 API Server와 대상 Node의 kubelet 및 Runtime의 포트포워딩 경로를 거쳐 선택된 Pod의 애플리케이션 포트에 도착한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#5F7089"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203047; }
    .title { font-size: 26px; font-weight: 700; }
    .node-title { font-size: 17px; font-weight: 650; text-anchor: middle; }
    .node-detail { font-size: 14px; fill: #50627D; text-anchor: middle; }
    .note { font-size: 14px; fill: #5F7089; }
    .node { fill: #F0FDF7; stroke: #89D8B1; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #5F7089; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="245" rx="18" fill="#FFFFFF"/>
  <text x="36" y="45" class="title">Port Forward를 통한 전달</text>
  <rect x="36" y="78" width="156" height="94" rx="13" class="node"/>
  <text x="114" y="115" class="node-title">클라이언트 앱</text>
  <text x="114" y="146" class="node-detail">localhost 접속</text>
  <path d="M195 125 H223" class="arrow"/>
  <rect x="232" y="78" width="142" height="94" rx="13" class="node"/>
  <text x="303" y="115" class="node-title">kubectl</text>
  <text x="303" y="146" class="node-detail">로컬 포트</text>
  <path d="M377 125 H405" class="arrow"/>
  <rect x="414" y="78" width="154" height="94" rx="13" class="node"/>
  <text x="491" y="115" class="node-title">API Server</text>
  <text x="491" y="146" class="node-detail">연결 중계</text>
  <path d="M571 125 H599" class="arrow"/>
  <rect x="608" y="78" width="169" height="94" rx="13" class="node"/>
  <text x="692.5" y="115" class="node-title">대상 Node</text>
  <text x="692.5" y="146" class="node-detail">kubelet / Runtime</text>
  <path d="M780 125 H808" class="arrow"/>
  <rect x="817" y="78" width="146" height="94" rx="13" class="node"/>
  <text x="890" y="115" class="node-title">선택된 Pod</text>
  <text x="890" y="146" class="node-detail">애플리케이션 포트</text>
  <text x="36" y="214" class="note">Service의 일반적인 Endpoint 선택·전달 경로를 사용하지 않는다.</text>
</svg>
