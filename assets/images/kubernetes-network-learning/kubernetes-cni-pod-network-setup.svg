<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="700" viewBox="0 0 1380 700" role="img" aria-labelledby="title desc">
<!-- Canonical JWiki asset: kubernetes-cni-pod-network-setup.svg -->
  <title id="title">Container Runtime과 CNI가 Pod Network를 준비하는 과정</title>
  <desc id="desc">kubelet의 실행 요청을 받은 Container Runtime이 Pod Network Namespace를 준비하고, CNI Plugin이 veth pair의 Pod 쪽 끝점, Pod IP와 Route, Host 쪽 끝점과 공통 Datapath를 구성하여 같은 Node와 다른 Node의 Pod Network로 연결한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52647d}.head{font-size:17px;font-weight:700}.body{font-size:14px;fill:#52647d}.small{font-size:13px;fill:#52647d}.center{text-anchor:middle}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1380" height="700" rx="18" fill="#ffffff"/>
  <text x="30" y="42" class="title">CNI는 빈 Network Namespace를 통신 가능한 Pod Network로 연결한다</text>
  <text x="30" y="70" class="subtitle">일반적인 veth 기반 구성 · 실제 작업 분담과 Datapath는 Runtime과 CNI 구현에 따라 달라질 수 있다</text>

  <rect x="30" y="105" width="220" height="112" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="140" y="143" class="head center">kubelet</text>
  <text x="140" y="174" class="body center">Pod 실행 요청</text>
  <text x="140" y="199" class="small center">선택된 Node에서 실행</text>

  <path d="M250 161H298" class="arrow"/>
  <rect x="300" y="105" width="250" height="112" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="143" class="head center">Container Runtime</text>
  <text x="425" y="174" class="body center">Pod Network Namespace 준비</text>
  <text x="425" y="199" class="small center">CNI Network 구성 호출</text>

  <path d="M550 161H598" class="arrow"/>
  <rect x="600" y="92" width="340" height="138" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="770" y="130" class="head center">CNI Plugin</text>
  <text x="770" y="161" class="body center">veth pair · Pod IP · Route 구성</text>
  <text x="770" y="187" class="body center">Host 쪽 끝점을 Datapath에 연결</text>
  <text x="770" y="212" class="small center">필요하면 IP 주소 관리 기능과 협력</text>

  <path d="M940 161H988" class="arrow"/>
  <rect x="990" y="105" width="360" height="112" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1170" y="143" class="head center">통신 가능한 Pod Network</text>
  <text x="1170" y="174" class="body center">Pod의 eth0 · IP · Routing Table</text>
  <text x="1170" y="199" class="small center">Host와 Cluster Network로 이어지는 경로</text>

  <rect x="30" y="272" width="1320" height="350" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="306" class="head">구성이 끝난 뒤 Packet이 사용하는 경로</text>

  <rect x="55" y="345" width="265" height="220" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="187" y="379" class="head center">Pod Network Namespace</text>
  <rect x="84" y="423" width="95" height="94" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="131" y="456" class="body center">Application</text>
  <text x="131" y="484" class="small center">Packet 생성</text>
  <rect x="207" y="410" width="88" height="120" rx="11" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="251" y="449" class="head center">eth0</text>
  <text x="251" y="477" class="body center">Pod 쪽 veth</text>
  <text x="251" y="504" class="body center">TX</text>
  <path d="M179 470H205" class="arrow"/>

  <path d="M295 470H400" fill="none" stroke="#8b5cf6" stroke-width="5"/>
  <text x="347" y="448" class="small center">veth pair</text>

  <rect x="400" y="345" width="520" height="220" rx="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="379" class="head center">Host Network Namespace</text>
  <rect x="425" y="410" width="115" height="120" rx="11" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="482" y="449" class="head center">Host veth</text>
  <text x="482" y="477" class="body center">Peer 끝점</text>
  <text x="482" y="504" class="body center">RX</text>
  <rect x="590" y="402" width="300" height="136" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="740" y="439" class="head center">CNI 기반 공통 Datapath</text>
  <text x="740" y="470" class="body center">Bridge · Route · eBPF · 가상 Switch</text>
  <text x="740" y="497" class="body center">같은 Node 또는 Node 사이 경로 선택</text>
  <text x="740" y="522" class="small center">Network Policy 처리도 구현에 따라 결합</text>
  <path d="M540 470H588" class="arrow"/>

  <path d="M890 446H978" class="arrow"/>
  <text x="934" y="428" class="small center">같은 Node</text>
  <rect x="980" y="394" width="330" height="102" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1145" y="430" class="head center">대상 Pod의 Host veth → eth0</text>
  <text x="1145" y="461" class="body center">같은 Kernel 안의 대상 Namespace로 전달</text>

  <path d="M890 505H978" class="arrow"/>
  <text x="934" y="548" class="small center">다른 Node</text>
  <rect x="980" y="512" width="330" height="82" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1145" y="544" class="head center">Node 사이 Route 또는 Tunnel</text>
  <text x="1145" y="572" class="body center">목적지 Node의 Host 경로로 연결</text>

  <rect x="240" y="650" width="900" height="36" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="690" y="674" class="small center">CNI는 Service Endpoint를 선택하는 것이 아니라, 선택된 Pod IP까지 갈 수 있는 Network 기반을 준비한다.</text>
</svg>
