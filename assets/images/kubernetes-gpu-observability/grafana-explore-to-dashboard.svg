<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Grafana Explore와 Dashboard의 역할</title>
  <desc id="desc">Explore에서 Prometheus Data Source를 선택하고 PromQL을 바꿔 가며 조사한다. 반복해서 볼 질문은 쿼리와 시각화 유형을 정해 Dashboard 패널로 저장한다. 두 화면 모두 Prometheus를 조회한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#57718c"/></marker>
    <style>.title{font:700 25px system-ui,sans-serif;fill:#203247}.head{font:700 21px system-ui,sans-serif;fill:#203247}.body{font:16px system-ui,sans-serif;fill:#42566f}.small{font:14px system-ui,sans-serif;fill:#5a7087}.code{font:15px ui-monospace,SFMono-Regular,monospace;fill:#31485f}.line{stroke:#57718c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="998" height="398" rx="22" fill="#f8fbff" stroke="#d5e0ec" stroke-width="2"/>
  <text x="34" y="45" class="title">질문을 탐색하고, 반복할 질문을 저장한다</text>
  <rect x="34" y="83" width="415" height="222" rx="18" fill="#eef5ff" stroke="#8cb6ea" stroke-width="2"/>
  <text x="56" y="121" class="head">Explore · 메트릭을 탐색하는 공간</text>
  <text x="56" y="158" class="body">Prometheus Data Source 선택</text>
  <rect x="56" y="180" width="371" height="53" rx="10" fill="#ffffff" stroke="#b8cee7"/>
  <text x="69" y="212" class="code">phase="Pending" == 1</text>
  <text x="56" y="269" class="small">PromQL 수정 · Instant/Range 전환</text>
  <path d="M449 193 H543" class="line"/>
  <text x="462" y="174" class="small">패널로 옮김</text>
  <rect x="551" y="83" width="415" height="222" rx="18" fill="#f7f3ff" stroke="#af99df" stroke-width="2"/>
  <text x="573" y="121" class="head">Dashboard · 계속 볼 질문</text>
  <rect x="573" y="151" width="174" height="58" rx="10" fill="#ffffff" stroke="#c9bae9"/>
  <text x="588" y="176" class="body">Pending Pod 수</text><text x="588" y="197" class="small">Stat · 현재 개수</text>
  <rect x="767" y="151" width="177" height="58" rx="10" fill="#ffffff" stroke="#c9bae9"/>
  <text x="780" y="176" class="body">스케줄 불가 수</text><text x="780" y="197" class="small">Event로 원인 확인</text>
  <rect x="573" y="224" width="371" height="58" rx="10" fill="#ffffff" stroke="#c9bae9"/>
  <text x="588" y="248" class="body">[Synthetic/Fake] GPU 값</text><text x="588" y="269" class="small">Bar gauge · 실제 GPU 측정치 아님</text>
  <rect x="249" y="333" width="502" height="43" rx="13" fill="#fff8ed" stroke="#edbf78" stroke-width="2"/>
  <text x="369" y="360" class="head">두 화면의 Data Source = Prometheus</text>
</svg>
