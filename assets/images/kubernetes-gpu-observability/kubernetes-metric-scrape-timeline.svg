<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">현재 메트릭과 Prometheus 시계열의 차이</title>
  <desc id="desc">kube-state-metrics는 현재 Pending 값을 내보내고 Prometheus는 여러 시점에서 이 값을 수집해 0, 1, 1의 시계열로 보관한다. Instant는 한 시점을, Range는 변화 과정을 조회한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#57718c"/></marker>
    <style>.title{font:700 25px system-ui,sans-serif;fill:#203247}.head{font:700 19px system-ui,sans-serif;fill:#203247}.body{font:16px system-ui,sans-serif;fill:#42566f}.small{font:14px system-ui,sans-serif;fill:#5a7087}.num{font:700 23px ui-monospace,SFMono-Regular,monospace;fill:#285273}.line{stroke:#57718c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="998" height="388" rx="22" fill="#f8fbff" stroke="#d5e0ec" stroke-width="2"/>
  <text x="33" y="45" class="title">현재 값 하나가 시간에 따라 기록되면</text>
  <rect x="33" y="83" width="266" height="170" rx="18" fill="#effaf8" stroke="#7dc8b7" stroke-width="2"/>
  <text x="54" y="121" class="head">kube-state-metrics</text><text x="54" y="158" class="body">/metrics는 현재 상태</text><text x="54" y="194" class="body">Pending 값:</text><text x="197" y="195" class="num">1</text>
  <path d="M300 167 H376" class="line"/>
  <rect x="383" y="83" width="580" height="170" rx="18" fill="#fff8ed" stroke="#edbf78" stroke-width="2"/>
  <text x="405" y="121" class="head">Prometheus가 주기적으로 Scrape</text>
  <line x1="437" y1="194" x2="909" y2="194" stroke="#a9b8c7" stroke-width="2"/>
  <circle cx="490" cy="194" r="25" fill="#e9f3ff" stroke="#7aace1" stroke-width="2"/><text x="482" y="202" class="num">0</text>
  <circle cx="650" cy="194" r="25" fill="#e9f3ff" stroke="#7aace1" stroke-width="2"/><text x="642" y="202" class="num">1</text>
  <circle cx="810" cy="194" r="25" fill="#e9f3ff" stroke="#7aace1" stroke-width="2"/><text x="802" y="202" class="num">1</text>
  <text x="477" y="238" class="small">t1</text><text x="637" y="238" class="small">t2</text><text x="797" y="238" class="small">t3</text>
  <rect x="34" y="293" width="445" height="65" rx="15" fill="#ffffff" stroke="#b8cadd" stroke-width="2"/>
  <text x="55" y="321" class="head">Instant</text><text x="55" y="345" class="body">선택한 한 시점의 값: t3 → 1</text>
  <rect x="521" y="293" width="445" height="65" rx="15" fill="#ffffff" stroke="#b8cadd" stroke-width="2"/>
  <text x="542" y="321" class="head">Range</text><text x="542" y="345" class="body">기간 안의 변화: 0 → 1 → 1</text>
</svg>
