<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes GPU 배치 상태의 관측 경로</title>
  <desc id="desc">API Server의 객체 상태를 kube-state-metrics가 현재 메트릭으로 표현하고, Prometheus가 시계열로 수집한 뒤 Grafana가 조회한다. Scheduler Event는 원인 확인용 별도 경로이고 Fake GPU Exporter의 값은 합성 메트릭이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#54708e"/></marker>
    <style>
      .title{font:700 27px system-ui,sans-serif;fill:#203247}.head{font:700 21px system-ui,sans-serif;fill:#203247}.body{font:16px system-ui,sans-serif;fill:#42566f}.small{font:14px system-ui,sans-serif;fill:#5b6f87}.line{stroke:#54708e;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{stroke:#8298ae;stroke-width:2.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="428" rx="22" fill="#f8fbff" stroke="#d5e0ec" stroke-width="2"/>
  <text x="36" y="48" class="title">객체 상태에서 관측 화면까지</text>
  <rect x="36" y="94" width="220" height="151" rx="18" fill="#eef5ff" stroke="#8cb6ea" stroke-width="2"/>
  <text x="58" y="130" class="head">API Server</text><text x="58" y="163" class="body">Node · Pod</text><text x="58" y="190" class="body">Deployment 상태</text><text x="58" y="221" class="small">객체의 기준점</text>
  <path d="M257 169 H306" class="line"/>
  <rect x="312" y="94" width="220" height="151" rx="18" fill="#effaf8" stroke="#7dc8b7" stroke-width="2"/>
  <text x="334" y="130" class="head">kube-state-metrics</text><text x="334" y="163" class="body">현재 객체 상태를</text><text x="334" y="190" class="body">/metrics로 표현</text><text x="334" y="221" class="small">과거 값은 저장하지 않음</text>
  <path d="M533 169 H582" class="line"/>
  <rect x="588" y="94" width="220" height="151" rx="18" fill="#fff8ed" stroke="#edbf78" stroke-width="2"/>
  <text x="610" y="130" class="head">Prometheus</text><text x="610" y="163" class="body">주기적으로 수집</text><text x="610" y="190" class="body">시계열 저장 · PromQL</text><text x="610" y="221" class="small">값과 시각을 함께 보관</text>
  <path d="M809 169 H858" class="line"/>
  <rect x="864" y="94" width="200" height="151" rx="18" fill="#f7f3ff" stroke="#af99df" stroke-width="2"/>
  <text x="886" y="130" class="head">Grafana</text><text x="886" y="163" class="body">Explore에서 탐색</text><text x="886" y="190" class="body">Dashboard로 관측</text><text x="886" y="221" class="small">Prometheus를 조회</text>
  <path d="M146 245 V292" class="branch"/>
  <rect x="36" y="302" width="438" height="91" rx="16" fill="#ffffff" stroke="#b7c8d9" stroke-width="2"/>
  <text x="57" y="335" class="head">Scheduler Event</text><text x="57" y="366" class="body">Pending의 구체적인 원인을 별도로 읽는다</text>
  <rect x="588" y="302" width="476" height="91" rx="16" fill="#ffffff" stroke="#e8c492" stroke-width="2"/>
  <text x="610" y="335" class="head">Fake GPU Exporter</text><text x="610" y="366" class="body">합성 GPU 값 → 실제 하드웨어 측정치 아님</text>
  <path d="M698 301 V249" class="branch"/>
</svg>
