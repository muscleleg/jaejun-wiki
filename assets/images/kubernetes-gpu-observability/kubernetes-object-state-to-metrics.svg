<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 객체 상태가 메트릭으로 표현되는 과정</title>
  <desc id="desc">API Server의 Pod Pending 상태, GPU 4개 요청, Node GPU 2개 제공량을 kube-state-metrics가 읽고 /metrics에서 이름, Label, 값으로 노출한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#57718c"/></marker>
    <style>.title{font:700 25px system-ui,sans-serif;fill:#203247}.head{font:700 20px system-ui,sans-serif;fill:#203247}.body{font:16px system-ui,sans-serif;fill:#42566f}.code{font:15px ui-monospace,SFMono-Regular,monospace;fill:#31485f}.small{font:14px system-ui,sans-serif;fill:#5a7087}.line{stroke:#57718c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="998" height="388" rx="22" fill="#f8fbff" stroke="#d5e0ec" stroke-width="2"/>
  <text x="33" y="46" class="title">상태는 이름 · Label · 숫자가 된다</text>
  <rect x="32" y="84" width="260" height="226" rx="18" fill="#eef5ff" stroke="#8cb6ea" stroke-width="2"/>
  <text x="54" y="119" class="head">API Server의 객체</text>
  <text x="54" y="159" class="body">Pod: Pending</text><text x="54" y="198" class="body">Pod: GPU 4개 요청</text><text x="54" y="237" class="body">Node: GPU 2개 게시</text>
  <path d="M293 197 H348" class="line"/>
  <rect x="355" y="105" width="207" height="182" rx="18" fill="#effaf8" stroke="#7dc8b7" stroke-width="2"/>
  <text x="375" y="148" class="head">kube-state-metrics</text><text x="375" y="186" class="body">List / Watch</text><text x="375" y="221" class="body">현재 상태 변환</text><text x="375" y="255" class="small">저장소는 아님</text>
  <path d="M563 197 H608" class="line"/>
  <rect x="615" y="84" width="352" height="226" rx="18" fill="#fff9ee" stroke="#eac387" stroke-width="2"/>
  <text x="637" y="119" class="head">/metrics의 한 줄씩</text>
  <text x="637" y="159" class="code">kube_pod_status_phase</text><text x="637" y="181" class="small">phase="Pending" → 1</text>
  <text x="637" y="221" class="code">kube_pod_container_resource_requests</text><text x="637" y="243" class="small">GPU 요청 → 4</text>
  <text x="637" y="278" class="code">kube_node_status_allocatable → 2</text>
  <text x="33" y="350" class="small">숫자 1은 상태가 참이라는 뜻일 수 있지만, Pending의 원인까지 설명하지는 않는다.</text>
</svg>
